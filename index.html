<style>
/* ========== CSS VARIABLES & RESET ========== */
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #111111;
  --bg-card: #161616;
  --bg-glass: rgba(22,22,22,0.85);
  --bg-overlay: rgba(0,0,0,0.7);
  --accent: #8b5cf6;
  --accent-light: #a78bfa;
  --accent-glow: rgba(139,92,246,0.4);
  --text-primary: #ffffff;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(139,92,246,0.3);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 30px var(--accent-glow);
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.5s ease;
  --header-height: 64px;
  --max-width: 1400px;
  --widget-gap: 24px;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { max-width:100%; display:block; }
a { text-decoration:none; color:inherit; }
button { border:none; background:none; cursor:pointer; font-family:inherit; color:inherit; }
ul,ol { list-style:none; }

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-light); }

/* ========== SKELETON LOADING ========== */
.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, #1f1f1f 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ========== HEADER ========== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-height);
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 3vw, 40px);
  transition: var(--transition-normal);
}
.header.scrolled { background: rgba(10,10,10,0.98); box-shadow: var(--shadow-md); }

.header-left { display:flex; align-items:center; gap:16px; }
.menu-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.menu-btn:hover { background: var(--bg-card); }
.menu-btn svg { width:24px; height:24px; stroke:var(--text-primary); stroke-width:2; fill:none; }

.logo {
  font-size: clamp(1.2rem, 2vw, 1.5rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}
.logo span { -webkit-text-fill-color: var(--text-primary); background: none; }

.header-right { display:flex; align-items:center; gap:12px; }
.search-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.search-btn:hover { background: var(--bg-card); }
.search-btn svg { width:22px; height:22px; stroke:var(--text-primary); stroke-width:2; fill:none; }

/* ========== MOBILE SIDEBAR ========== */
.sidebar-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  z-index: 2000;
  opacity: 0; visibility: hidden;
  transition: var(--transition-normal);
}
.sidebar-overlay.active { opacity:1; visibility:visible; }
.sidebar {
  position: fixed; top:0; left:0; bottom:0;
  width: min(280px, 80vw);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  z-index: 2001;
  transform: translateX(-100%);
  transition: transform var(--transition-normal);
  overflow-y: auto;
  padding: 24px 0;
}
.sidebar.active { transform: translateX(0); }
.sidebar-close {
  position: absolute; top:16px; right:16px;
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm);
}
.sidebar-close svg { width:20px; height:20px; stroke:var(--text-secondary); stroke-width:2; fill:none; }
.sidebar-logo { padding: 0 24px 24px; font-size:1.3rem; font-weight:800; }
.sidebar-nav { padding: 0 16px; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 500;
  transition: var(--transition-fast);
  margin-bottom: 4px;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: rgba(139,92,246,0.15);
  color: var(--accent-light);
}
.sidebar-nav a svg { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; flex-shrink:0; }

/* ========== SEARCH OVERLAY ========== */
.search-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(10px);
  z-index: 1500;
  opacity: 0; visibility: hidden;
  transition: var(--transition-normal);
  display: flex; flex-direction: column; align-items: center;
  padding-top: clamp(80px, 15vh, 150px);
}
.search-overlay.active { opacity:1; visibility:visible; }
.search-container {
  width: min(600px, 90vw);
  position: relative;
}
.search-input {
  width: 100%;
  padding: 16px 24px 16px 52px;
  background: var(--bg-glass);
  border: 1px solid var(--border-hover);
  border-radius: var(--radius-xl);
  color: var(--text-primary);
  font-size: 1.1rem;

  transition: var(--transition-fast);
}
.search-input:focus { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute; left:18px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; stroke:var(--text-muted); stroke-width:2; fill:none;
}
.search-close {
  position: absolute; top:-50px; right:0;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
}
.search-close svg { width:20px; height:20px; stroke:var(--text-primary); stroke-width:2; fill:none; }
.search-suggestions {
  margin-top: 12px;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-height: 400px;
  overflow-y: auto;
  display: none;
}
.search-suggestions.active { display: block; }
.suggestion-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: var(--transition-fast);
  cursor: pointer;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: rgba(139,92,246,0.1); }
.suggestion-item img {
  width: 48px; height: 68px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.suggestion-info { flex: 1; min-width: 0; }
.suggestion-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestion-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

/* ========== HERO SLIDER ========== */
.hero-section {
  position: relative;
  width: 100%;
  height: clamp(500px, 70vh, 800px);
  overflow: hidden;
  margin-top: var(--header-height);
}
.hero-slider {
  position: relative;
  width: 100%; height: 100%;
}
.hero-slide {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity 0.8s ease, visibility 0.8s ease;
  display: flex; align-items: flex-end;
}
.hero-slide.active { opacity: 1; visibility: visible; }
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center top;
  transition: transform 8s ease;
}
.hero-slide.active .hero-bg { transform: scale(1.05); }
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg-primary) 0%, rgba(10,10,10,0.8) 30%, rgba(10,10,10,0.3) 60%, rgba(10,10,10,0.1) 100%);
}
.hero-content {

}
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: rgba(139,92,246,0.2);
  border: 1px solid var(--accent);
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--accent-light);
  margin-bottom: 16px;

}
.hero-badge svg { width:14px; height:14px; fill:var(--accent); }
.hero-title {

  margin-bottom: 12px;

  text-shadow: 0 2px 20px rgba(0,0,0,0.5);

  transition: opacity 0.6s 0.2s ease, transform 0.6s 0.2s ease;
}
.hero-slide.active .hero-title { opacity:1; transform:translateY(0); }
.hero-meta {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.6s 0.35s ease, transform 0.6s 0.35s ease;
}
.hero-slide.active .hero-meta { opacity:1; transform:translateY(0); }
.hero-score {

}
.hero-score svg { width:14px; height:14px; fill:#ffc107; }
.hero-genres { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-genre {

}
.hero-synopsis {

}
.hero-slide.active .hero-synopsis { opacity:1; transform:translateY(0); }
.hero-buttons {

  opacity: 0; transform: translateY(20px);
  transition: opacity 0.6s 0.65s ease, transform 0.6s 0.65s ease;
}
.hero-slide.active .hero-buttons { opacity:1; transform:translateY(0); }
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;

}
.btn-primary:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
.btn-primary svg { width:18px; height:18px; fill:currentColor; }
.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;

  color: var(--text-primary);
  border-radius: var(--radius-md);

  font-weight: 600;
  transition: var(--transition-fast);

}
.btn-secondary:hover { background: rgba(255,255,255,0.15); border-color: var(--border-hover); }

.hero-nav {
  position: absolute;
  bottom: clamp(20px, 4vh, 40px);
  right: clamp(24px, 5vw, 60px);

  display: flex; align-items: center; gap: 12px;
}
.hero-arrow {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.1);

  transition: var(--transition-fast);
  border: 1px solid var(--border);
}
.hero-arrow:hover { background: var(--accent); border-color: var(--accent); }
.hero-arrow svg { width:18px; height:18px; stroke:var(--text-primary); stroke-width:2; fill:none; }
.hero-dots {

}
.hero-dot {

}
.hero-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }
.hero-dot:hover { background: var(--accent-light); }

/* ========== WIDGET SECTIONS ========== */
.main-content { padding: clamp(24px, 4vw, 48px) clamp(16px, 3vw, 40px); max-width: var(--max-width); margin: 0 auto; }
.widget-section { margin-bottom: clamp(32px, 5vh, 56px); }
.widget-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.widget-title {
  font-size: clamp(1.1rem, 2vw, 1.4rem);
  font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.widget-title svg { width:22px; height:22px; stroke:var(--accent); stroke-width:2; fill:none; }
.widget-title span { color: var(--accent-light); }
.widget-nav {
  display: flex; gap: 8px;
}
.widget-nav-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.widget-nav-btn:hover { background: var(--accent); border-color: var(--accent); }
.widget-nav-btn svg { width:16px; height:16px; stroke:var(--text-primary); stroke-width:2; fill:none; }
.widget-nav-btn:disabled { opacity:0.3; cursor:not-allowed; }
.widget-nav-btn:disabled:hover { background:var(--bg-card); border-color:var(--border); }

/* ========== UNIVERSAL SLIDER ========== */
.slider-container {
  position: relative;
  overflow: hidden;
  margin: 0 -clamp(16px, 3vw, 40px);
  padding: 0 clamp(16px, 3vw, 40px);
}
.slider-track {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-behavior: smooth;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 8px 0;
  cursor: grab;
}
.slider-track::-webkit-scrollbar { display: none; }
.slider-track.dragging { cursor: grabbing; scroll-behavior: auto; scroll-snap-type: none; }

/* ========== ANIME CARD ========== */
.anime-card {
  flex: 0 0 auto;
  width: clamp(160px, 18vw, 200px);
  scroll-snap-align: start;
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-card);
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
  cursor: pointer;
}
.anime-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-glow);
}
.anime-card:hover .card-img { transform: scale(1.08); }
.anime-card:hover .card-overlay { opacity: 1; }
.card-img-wrap {
  position: relative;
  aspect-ratio: 2/3;
  overflow: hidden;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.card-img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform var(--transition-slow);
}
.card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 40%, transparent 70%);
  opacity: 0.7;
  transition: opacity var(--transition-normal);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 12px;
}
.card-badges {
  position: absolute; top: 8px; left: 8px;
  display: flex; flex-direction: column; gap: 4px;
  z-index: 2;
}
.card-badge {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.card-badge.score { background: rgba(255,193,7,0.9); color: #000; }
.card-badge.ep { background: rgba(139,92,246,0.9); color: #fff; }
.card-badge.hd { background: rgba(34,197,94,0.9); color: #fff; }
.card-badge.type { background: rgba(59,130,246,0.9); color: #fff; }
.card-info { padding: 12px; }
.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}
.card-meta {
  font-size: 0.75rem;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 8px;
}
.card-meta svg { width:12px; height:12px; stroke:var(--text-muted); stroke-width:2; fill:none; }

/* ========== ERROR / EMPTY STATES ========== */
.error-state, .empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
}
.error-state svg, .empty-state svg { width:48px; height:48px; stroke:var(--text-muted); stroke-width:1.5; fill:none; margin-bottom:12px; }
.error-state p, .empty-state p { font-size:0.9rem; }
.retry-btn {

  padding: 8px 20px;
  background: var(--accent);
  color: white;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  transition: var(--transition-fast);
}
.retry-btn:hover { background: var(--accent-light); }

/* ========== FOOTER ========== */
.footer {

  padding: clamp(24px, 4vw, 40px) clamp(16px, 3vw, 40px);
  text-align: center;
  background: var(--bg-secondary);
}
.footer-content {
  max-width: var(--max-width);
  margin: 0 auto;
}
.footer-logo {
  font-size: 1.3rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.footer-text {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.footer-social {
  display: flex; justify-content: center; gap: 16px;
}
.footer-social a {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 50%;
  transition: var(--transition-fast);
}
.footer-social a:hover { background: var(--accent); border-color: var(--accent); }
.footer-social a svg { width:16px; height:16px; stroke:var(--text-secondary); stroke-width:2; fill:none; }
.footer-social a:hover svg { stroke: white; }

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .hero-section { height: clamp(420px, 60vh, 550px); }
  .hero-content { padding-bottom: 80px; }
  .hero-nav { right: 20px; bottom: 20px; }
  .anime-card { width: 150px; }
  .widget-nav { display: none; }
}
@media (max-width: 480px) {
  .anime-card { width: 140px; }
  .btn-primary, .btn-secondary { padding: 10px 20px; font-size: 0.85rem; }
}
@media (min-width: 1920px) {
  .anime-card { width: 220px; }
}

/* ========== LOADING OVERLAY ========== */
.page-loader {
  position: fixed; inset: 0;
  background: var(--bg-primary);
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
.page-loader.hidden { opacity: 0; visibility: hidden; }
.loader-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--bg-card);
  border-top-color: var(--accent);
  border-radius: 50%;

<script>
// ========== CONFIG ==========
const CONFIG = {
  API_BASE: 'https://api.jikan.moe/v4',
  CACHE_TTL: 30 * 60 * 1000, // 30 minutes
  TIMEOUT: 8000,
  RETRIES: 2,
  RETRY_DELAY: 1500,
  HERO_SLIDES: 12,
  WIDGET_CARDS: 16,
  DEBOUNCE_MS: 300
};

// ========== CACHE SYSTEM ==========
const Cache = {
  get(key) {
    try {
      const item = localStorage.getItem('cache_' + key);
      if (!item) return null;
      const { data, timestamp } = JSON.parse(item);
      if (Date.now() - timestamp > CONFIG.CACHE_TTL) {
        localStorage.removeItem('cache_' + key);
        return null;
      }
      return data;
    } catch (e) { return null; }
  },
  set(key, data) {
    try { localStorage.setItem('cache_' + key, JSON.stringify({ data, timestamp: Date.now() })); } catch (e) {}
  },
  clear() {
    try {
      Object.keys(localStorage).forEach(k => { if (k.startsWith('cache_')) localStorage.removeItem(k); });
    } catch (e) {}
  }
};

// ========== API FETCH WITH RETRY & TIMEOUT ==========
async function apiFetch(endpoint, retries = CONFIG.RETRIES) {
  const cacheKey = endpoint.replace(/[^a-zA-Z0-9]/g, '_');
  const cached = Cache.get(cacheKey);
  if (cached) return cached;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT);

  try {
    const response = await fetch(CONFIG.API_BASE + endpoint, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (data && data.data) {
      Cache.set(cacheKey, data);
      return data;
    }
    throw new Error('Invalid API response');
  } catch (error) {
    clearTimeout(timeoutId);
    if (retries > 0) {
      await new Promise(r => setTimeout(r, CONFIG.RETRY_DELAY));
      return apiFetch(endpoint, retries - 1);
    }
    console.error('API Error:', endpoint, error.message);
    return null;
  }
}

// ========== FALLBACK DATA ==========
function getFallbackData(count = 12) {
  return Array.from({ length: count }, (_, i) => ({
    mal_id: 1 + i,
    title: 'Anime Title ' + (i + 1),
    images: { jpg: { large_image_url: '', image_url: '' } },
    score: (8.0 + Math.random() * 1.5).toFixed(2),
    type: 'TV',
    episodes: 12 + i,
    status: 'Finished Airing',
    synopsis: 'An amazing anime series with captivating story and stunning visuals.',
    genres: [{ name: 'Action' }, { name: 'Adventure' }],
    studios: [{ name: 'Studio' }],
    aired: { string: '2024' }
  }));
}

// ========== SAFE DOM RENDERING ==========
function safeRender(container, html) {
  if (!container) return;
  container.innerHTML = html;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== IMAGE LAZY LOADING ==========
function setupLazyImages() {
  if ('IntersectionObserver' in window) {
    const imgObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          if (img.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');
          }
          imgObserver.unobserve(img);
        }
      });
    }, { rootMargin: '100px' });
    document.querySelectorAll('img[data-src]').forEach(img => imgObserver.observe(img));
  } else {
    document.querySelectorAll('img[data-src]').forEach(img => { img.src = img.dataset.src; });
  }
}

// ========== SKELETON CARDS ==========
function skeletonCards(count = 12) {
  return Array.from({ length: count }, () => `
    <div class="anime-card">
      <div class="card-img-wrap">
        <div class="skeleton" style="width:100%;height:100%;"></div>
      </div>
      <div class="card-info">
        <div class="skeleton" style="width:80%;height:16px;margin-bottom:8px;"></div>
        <div class="skeleton" style="width:50%;height:12px;"></div>
      </div>
    </div>
  `).join('');
}

// ========== ANIME CARD HTML ==========
function animeCardHTML(anime, index = 0) {
  if (!anime) return '';
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const title = anime.title_english || anime.title || 'Unknown';
  const score = anime.score ? anime.score.toFixed(1) : 'N/A';
  const type = anime.type || 'TV';
  const episodes = anime.episodes || '?';
  const status = anime.status || 'Unknown';
  const year = anime.year || (anime.aired?.string?.match(/\d{4}/)?.[0]) || '';
  const genres = (anime.genres || []).slice(0, 2).map(g => g.name).join(', ');

  return `
    <a href="anime.html?id=${anime.mal_id}" class="anime-card" data-index="${index}">
      <div class="card-img-wrap">
        <img class="card-img" data-src="${escapeHtml(img)}" alt="${escapeHtml(title)}" loading="lazy">
        <div class="card-badges">
          <span class="card-badge score">${score}</span>
          <span class="card-badge ep">EP ${episodes}</span>
          <span class="card-badge hd">HD</span>
          <span class="card-badge type">${type}</span>
        </div>
        <div class="card-overlay"></div>
      </div>
      <div class="card-info">
        <div class="card-title">${escapeHtml(title)}</div>
        <div class="card-meta">
          <span>${year}</span>
          <span>${escapeHtml(genres)}</span>
        </div>
      </div>
    </a>
  `;
}

// ========== HERO SLIDER SYSTEM ==========
class HeroSlider {
  constructor(container, dotsContainer, prevBtn, nextBtn) {
    this.container = container;
    this.dotsContainer = dotsContainer;
    this.prevBtn = prevBtn;
    this.nextBtn = nextBtn;
    this.slides = [];
    this.current = 0;
    this.autoInterval = null;
    this.touchStartX = 0;
    this.isDragging = false;
    this.initialized = false;
  }

  init(data) {
    if (this.initialized || !data || !data.length) return;
    this.slides = data.slice(0, CONFIG.HERO_SLIDES);
    this.render();
    this.setupEvents();
    this.goTo(0);
    this.startAuto();
    this.initialized = true;
  }

  render() {
    if (!this.container) return;
    this.container.innerHTML = this.slides.map((anime, i) => {
      const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
      const title = anime.title_english || anime.title || 'Unknown';
      const score = anime.score ? anime.score.toFixed(1) : 'N/A';
      const genres = (anime.genres || []).slice(0, 3).map(g => g.name).join(', ');
      const synopsis = anime.synopsis || 'No synopsis available.';
      return `
        <div class="hero-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
          <div class="hero-bg" style="background-image:url('${escapeHtml(img)}')"></div>
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <div class="hero-badge">
              <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Top Trending
            </div>
            <h1 class="hero-title">${escapeHtml(title)}</h1>
            <div class="hero-meta">
              <span class="hero-score">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                ${score}
              </span>
              <div class="hero-genres">${(anime.genres || []).slice(0, 3).map(g => `<span class="hero-genre">${g.name}</span>`).join('')}</div>
            </div>
            <p class="hero-synopsis">${escapeHtml(synopsis.substring(0, 200))}${synopsis.length > 200 ? '...' : ''}</p>
            <div class="hero-buttons">
              <a href="watch.html?id=${anime.mal_id}&ep=1" class="btn-primary">
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Watch Now
              </a>
              <a href="anime.html?id=${anime.mal_id}" class="btn-secondary">Details</a>
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (this.dotsContainer) {
      this.dotsContainer.innerHTML = this.slides.map((_, i) =>
        `<div class="hero-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`
      ).join('');
    }
  }

  setupEvents() {
    this.prevBtn?.addEventListener('click', () => { this.prev(); this.resetAuto(); });
    this.nextBtn?.addEventListener('click', () => { this.next(); this.resetAuto(); });

    this.dotsContainer?.addEventListener('click', (e) => {
      const dot = e.target.closest('.hero-dot');
      if (dot) { this.goTo(parseInt(dot.dataset.index)); this.resetAuto(); }
    });

    // Touch swipe
    this.container?.addEventListener('touchstart', (e) => {
      this.touchStartX = e.touches[0].clientX;
    }, { passive: true });

    this.container?.addEventListener('touchend', (e) => {
      const diff = this.touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        diff > 0 ? this.next() : this.prev();
        this.resetAuto();
      }
    }, { passive: true });

    // Mouse drag
    this.container?.addEventListener('mousedown', (e) => {
      this.isDragging = true;
      this.touchStartX = e.clientX;
    });
    this.container?.addEventListener('mouseup', (e) => {
      if (!this.isDragging) return;
      this.isDragging = false;
      const diff = this.touchStartX - e.clientX;
      if (Math.abs(diff) > 50) {
        diff > 0 ? this.next() : this.prev();
        this.resetAuto();
      }
    });
    this.container?.addEventListener('mouseleave', () => { this.isDragging = false; });
  }

  goTo(index) {
    const slides = this.container?.querySelectorAll('.hero-slide');
    const dots = this.dotsContainer?.querySelectorAll('.hero-dot');
    if (!slides || !slides.length) return;

    slides.forEach((s, i) => s.classList.toggle('active', i === index));
    dots?.forEach((d, i) => d.classList.toggle('active', i === index));
    this.current = index;
  }

  next() { this.goTo((this.current + 1) % this.slides.length); }
  prev() { this.goTo((this.current - 1 + this.slides.length) % this.slides.length); }

  startAuto() {
    this.stopAuto();
    this.autoInterval = setInterval(() => this.next(), 6000);
  }
  stopAuto() { if (this.autoInterval) clearInterval(this.autoInterval); }
  resetAuto() { this.stopAuto(); this.startAuto(); }
}

// ========== UNIVERSAL SLIDER SYSTEM ==========
class UniversalSlider {
  constructor(track, prevBtn, nextBtn) {
    this.track = track;
    this.prevBtn = prevBtn;
    this.nextBtn = nextBtn;
    this.isDragging = false;
    this.startX = 0;
    this.scrollLeft = 0;
    this.initialized = false;
    this.resizeObserver = null;
  }

  init() {
    if (this.initialized || !this.track) return;
    this.setupDrag();
    this.setupWheel();
    this.setupTouch();
    this.setupButtons();
    this.setupResize();
    this.initialized = true;
  }

  setupDrag() {
    this.track.addEventListener('mousedown', (e) => {
      this.isDragging = true;
      this.track.classList.add('dragging');
      this.startX = e.pageX - this.track.offsetLeft;
      this.scrollLeft = this.track.scrollLeft;
    });
    this.track.addEventListener('mouseleave', () => { this.isDragging = false; this.track.classList.remove('dragging'); });
    this.track.addEventListener('mouseup', () => { this.isDragging = false; this.track.classList.remove('dragging'); });
    this.track.addEventListener('mousemove', (e) => {
      if (!this.isDragging) return;
      e.preventDefault();
      const x = e.pageX - this.track.offsetLeft;
      const walk = (x - this.startX) * 2;
      this.track.scrollLeft = this.scrollLeft - walk;
    });
  }

  setupWheel() {
    this.track.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.track.scrollLeft += e.deltaY;
    }, { passive: false });
  }

  setupTouch() {
    let touchStartX = 0;
    let touchScrollLeft = 0;
    this.track.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchScrollLeft = this.track.scrollLeft;
    }, { passive: true });
    this.track.addEventListener('touchmove', (e) => {
      const diff = touchStartX - e.touches[0].clientX;
      this.track.scrollLeft = touchScrollLeft + diff;
    }, { passive: true });
  }

  setupButtons() {
    const scrollAmount = () => {
      const card = this.track.querySelector('.anime-card');
      return card ? card.offsetWidth + 16 : 200;
    };
    this.prevBtn?.addEventListener('click', () => { this.track.scrollBy({ left: -scrollAmount(), behavior: 'smooth' }); });
    this.nextBtn?.addEventListener('click', () => { this.track.scrollBy({ left: scrollAmount(), behavior: 'smooth' }); });
  }

  setupResize() {
    if ('ResizeObserver' in window && this.track.parentElement) {
      this.resizeObserver = new ResizeObserver(() => {
        // Recalculate if needed
      });
      this.resizeObserver.observe(this.track.parentElement);
    }
    window.addEventListener('orientationchange', () => {
      setTimeout(() => { this.track.scrollLeft = 0; }, 300);
    });
  }

  destroy() {
    if (this.resizeObserver) this.resizeObserver.disconnect();
    this.initialized = false;
  }
}

// ========== WIDGET LOADER ==========
class WidgetLoader {
  constructor(trackId, prevId, nextId, fetchFn, sectionId) {
    this.track = document.getElementById(trackId);
    this.prevBtn = document.getElementById(prevId);
    this.nextBtn = document.getElementById(nextId);
    this.fetchFn = fetchFn;
    this.section = document.getElementById(sectionId);
    this.slider = null;
    this.loaded = false;
    this.loading = false;
  }

  async load() {
    if (this.loaded || this.loading || !this.track) return;
    this.loading = true;
    safeRender(this.track, skeletonCards(CONFIG.WIDGET_CARDS));

    try {
      const data = await this.fetchFn();
      const items = data?.data || data || [];
      if (!items.length) {
        safeRender(this.track, this.emptyState());
        return;
      }

      const html = items.slice(0, CONFIG.WIDGET_CARDS).map((a, i) => animeCardHTML(a, i)).join('');
      safeRender(this.track, html);
      setupLazyImages();

      // Initialize slider after DOM update
      requestAnimationFrame(() => {
        if (this.slider) this.slider.destroy();
        this.slider = new UniversalSlider(this.track, this.prevBtn, this.nextBtn);
        this.slider.init();
      });

      this.loaded = true;
    } catch (err) {
      console.error('Widget load error:', err);
      safeRender(this.track, this.errorState());
    } finally {
      this.loading = false;
    }
  }

  emptyState() {
    return `<div class="empty-state"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><p>No anime found</p></div>`;
  }
  errorState() {
    return `<div class="error-state"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><p>Failed to load anime</p><button class="retry-btn" onclick="this.closest('.widget-section').querySelector('.slider-track').dispatchEvent(new CustomEvent('retry'))">Retry</button></div>`;
  }
}

// ========== SEARCH SYSTEM ==========
let searchDebounceTimer = null;
function setupSearch() {
  const searchBtn = document.getElementById('searchBtn');
  const searchOverlay = document.getElementById('searchOverlay');
  const searchClose = document.getElementById('searchClose');
  const searchInput = document.getElementById('searchInput');
  const suggestions = document.getElementById('searchSuggestions');

  searchBtn?.addEventListener('click', () => {
    searchOverlay.classList.add('active');
    setTimeout(() => searchInput?.focus(), 100);
    document.body.style.overflow = 'hidden';
  });

  const closeSearch = () => {
    searchOverlay.classList.remove('active');
    searchInput.value = '';
    suggestions.classList.remove('active');
    document.body.style.overflow = '';
  };

  searchClose?.addEventListener('click', closeSearch);
  searchOverlay?.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearch(); });

  searchInput?.addEventListener('input', (e) => {
    clearTimeout(searchDebounceTimer);
    const query = e.target.value.trim();
    if (!query) { suggestions.classList.remove('active'); return; }

    searchDebounceTimer = setTimeout(async () => {
      const data = await apiFetch(`/anime?q=${encodeURIComponent(query)}&limit=8&sfw`);
      if (!data?.data?.length) { suggestions.classList.remove('active'); return; }

      suggestions.innerHTML = data.data.map(anime => {
        const img = anime.images?.jpg?.image_url || '';
        const title = anime.title_english || anime.title || 'Unknown';
        const type = anime.type || 'TV';
        const score = anime.score ? anime.score.toFixed(1) : 'N/A';
        return `
          <div class="suggestion-item" onclick="window.location.href='anime.html?id=${anime.mal_id}'">
            <img src="${escapeHtml(img)}" alt="${escapeHtml(title)}">
            <div class="suggestion-info">
              <div class="suggestion-title">${escapeHtml(title)}</div>
              <div class="suggestion-meta">${type} · Score: ${score}</div>
            </div>
          </div>
        `;
      }).join('');
      suggestions.classList.add('active');
    }, CONFIG.DEBOUNCE_MS);
  });

  searchInput?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const query = searchInput.value.trim();
      if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`;
    }
    if (e.key === 'Escape') closeSearch();
  });
}

// ========== SIDEBAR ==========
function setupSidebar() {
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebarClose = document.getElementById('sidebarClose');

  const open = () => { sidebar.classList.add('active'); sidebarOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; };
  const close = () => { sidebar.classList.remove('active'); sidebarOverlay.classList.remove('active'); document.body.style.overflow = ''; };

  menuBtn?.addEventListener('click', open);
  sidebarClose?.addEventListener('click', close);
  sidebarOverlay?.addEventListener('click', close);
}

// ========== HEADER SCROLL ==========
function setupHeader() {
  const header = document.getElementById('header');
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        header?.classList.toggle('scrolled', window.scrollY > 50);
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
}

// ========== INTERSECTION OBSERVER FOR LAZY WIDGET LOADING ==========
function setupLazyWidgets(widgets) {
  if (!('IntersectionObserver' in window)) {
    widgets.forEach(w => w.load());
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const widget = widgets.find(w => w.section === entry.target);
        if (widget) widget.load();
      }
    });
  }, { rootMargin: '100px' });

  widgets.forEach(w => { if (w.section) observer.observe(w.section); });
}

// ========== MAIN INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  setupSidebar();
  setupSearch();
  setupHeader();

  // Hero Slider
  const heroSlider = new HeroSlider(
    document.getElementById('heroSlider'),
    document.getElementById('heroDots'),
    document.getElementById('heroPrev'),
    document.getElementById('heroNext')
  );

  // Fetch hero data
  apiFetch('/anime?order_by=popularity&sort=asc&limit=15&sfw').then(data => {
    const items = data?.data || [];
    if (items.length) {
      heroSlider.init(items);
    } else {
      heroSlider.init(getFallbackData(CONFIG.HERO_SLIDES));
    }
  }).catch(() => {
    heroSlider.init(getFallbackData(CONFIG.HERO_SLIDES));
  });

  // Widgets
  const widgets = [
    new WidgetLoader('recentTrack', 'recentPrev', 'recentNext',
      () => apiFetch('/anime?order_by=members&sort=desc&limit=20&sfw'), 'recentlyUpdated'),
    new WidgetLoader('trendTrack', 'trendPrev', 'trendNext',
      () => apiFetch('/anime?order_by=popularity&sort=asc&limit=20&sfw'), 'trendingNow'),
    new WidgetLoader('topTrack', 'topPrev', 'topNext',
      () => apiFetch('/top/anime?limit=20&sfw'), 'topRated'),
    new WidgetLoader('airTrack', 'airPrev', 'airNext',
      () => apiFetch('/anime?status=airing&order_by=score&sort=desc&limit=20&sfw'), 'topAiring'),
    new WidgetLoader('upTrack', 'upPrev', 'upNext',
      () => apiFetch('/anime?status=upcoming&order_by=members&sort=desc&limit=20&sfw'), 'upcoming'),
    new WidgetLoader('compTrack', 'compPrev', 'compNext',
      () => apiFetch('/anime?status=complete&order_by=score&sort=desc&limit=20&sfw'), 'completed'),
  ];

  setupLazyWidgets(widgets);

  // Hide page loader
  setTimeout(() => {
    const loader = document.getElementById('pageLoader');
    if (loader) loader.classList.add('hidden');
  }, 800);
});
</script>
