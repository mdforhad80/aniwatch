<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stream the latest anime in HD. Watch trending, top-rated, and upcoming anime for free.">
    <meta property="og:title" content="AnimeStream - Watch Anime Online">

    <title>AnimeStream - Watch Anime Online | Free HD Streaming</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #111118;
            --bg3: #1a1a25;
            --bg4: #222230;
            --purple: #8b5cf6;
            --purple-glow: #a78bfa;
            --purple-dark: #6d28d9;
            --pink: #ec4899;
            --text: #e2e8f0;
            --text2: #a0a0b8;
            --text3: #6b6b80;
            --border: #252535;
            --card: #151520;
            --card-hover: #1c1c2a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow: 0 4px 24px rgba(0, 0, 0, .5);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, .6);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, .25);
            --transition: 0.3s cubic-bezier(.4, 0, .2, 1);
            --transition-fast: 0.15s cubic-bezier(.4, 0, .2, 1);
            --transition-slow: 0.5s cubic-bezier(.4, 0, .2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --header-h: 64px;
            --max-width: 1400px;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            font-size: 16px;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: var(--header-h);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text3);
        }
        img {
            max-width: 100%;
            display: block;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
            color: inherit;
        }
        input {
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: .5;
            }
            50% {
                opacity: 1;
            }
        }
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(139, 92, 246, .3);
            }
            50% {
                box-shadow: 0 0 40px rgba(139, 92, 246, .6), 0 0 60px rgba(139, 92, 246, .2);
            }
        }
        .skeleton {
            background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }
        .skeleton-poster {
            aspect-ratio: 2/3;
            border-radius: var(--radius);
        }
        .skeleton-text {
            height: 14px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        .skeleton-text-sm {
            height: 10px;
            width: 60%;
            border-radius: 4px;
        }
        .skeleton-badge {
            height: 22px;
            width: 50px;
            border-radius: 20px;
        }
        .fade-in {
            animation: fadeIn .5s ease forwards;
        }
        .fade-in-up {
            animation: fadeInUp .5s ease forwards;
        }
        .fade-in-scale {
            animation: fadeInScale .4s ease forwards;
        }

            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--header-h);
            background: rgba(10, 10, 15, .85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            transition: var(--transition);
        }
        .header.scrolled {
            background: rgba(10, 10, 15, .95);
            box-shadow: 0 2px 20px rgba(0, 0, 0, .4);
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            z-index: 1001;
        }
        .hamburger:hover {
            background: var(--bg3);
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: var(--transition);
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--purple-glow), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-spacer {
            flex: 1;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: var(--bg3);
            color: var(--purple-glow);
        }
        .search-overlay {

        .search-input-wrap {

            padding: 12px 20px;

        }

        .search-results.active {

        }
        .mobile-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;

        .hero-section {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 450px;
            max-height: 700px;
            overflow: hidden;
            margin-bottom: 40px;
        }

            position: absolute;

        }
        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }
        .hero-bg::after {
            content: '';

            inset: 0;
            background: linear-gradient(0deg, var(--bg) 0%, transparent 50%, rgba(10, 10, 15, .7) 100%);
            z-index: 1;
        }
        .hero-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(10, 10, 15, .85) 100%);
            z-index: 2;
        }
        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 600px;
            animation: fadeInUp .6s ease forwards;

        .hero-content .hero-title {
            font-size: clamp(1.8rem, 3.5vw, 2.8rem);

            text-shadow: 0 2px 20px rgba(0, 0, 0, .7);
        }
        .hero-meta {
            display: flex;

            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .hero-score {
            display: inline-flex;

            background: var(--purple-dark);
            box-shadow: 0 6px 30px rgba(139, 92, 246, .5);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .2);

        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, .15);
            border-color: rgba(255, 255, 255, .35);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: .8rem;
            border-radius: 30px;
        }
        .hero-nav {
            position: absolute;
            bottom: 30px;
            right: 40px;
            z-index: 10;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .hero-arrow {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .2);

        }
        .hero-arrow:hover {

            border-color: rgba(255, 255, 255, .4);
        }
        .hero-dots {

        }
        .hero-dot {
            width: 10px;

        .hero-dot.active {
            background: var(--purple-glow);

        .main-content {

        }

            overflow: hidden;
            border-radius: var(--radius);
        }
        .carousel-track {

            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        .carousel-track:active {
            cursor: grabbing;
        }
        .carousel-track.dragging {
            transition: none;
        }
        .anime-card {
            flex: 0 0 auto;
            width: 160px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--card);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }
        .anime-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-glow);
            background: var(--card-hover);
            z-index: 5;
        }
        .anime-card .poster-wrap {
            position: relative;
            aspect-ratio: 2/3;

            border-radius: var(--radius) var(--radius) 0 0;

        .anime-card .card-title {
            font-size: .82rem;
            font-weight: 600;
            white-space: nowrap;

        <p style="font-size:.7rem;color:var(--text3);">This site does not host any files. All content is sourced from third-party APIs.</p>
    </footer>

    <script>
        (function() {
            // ==================== CONFIGURATION ====================
            const JIKAN_BASE = 'https://api.jikan.moe/v4';
            const CACHE_PREFIX = 'anime_stream_cache_';
            const CACHE_TTL = 5 * 60 * 1000; // 5 minutes
            const FETCH_TIMEOUT = 12000; // 12 seconds
            const MAX_RETRIES = 3;
            const RETRY_DELAY = 1500;
            const RATE_LIMIT_DELAY = 350; // ~3 requests per second for Jikan

            // ==================== DOM REFS ====================
            const header = document.getElementById('header');
            const hamburger = document.getElementById('hamburger');
            const mobileSidebar = document.getElementById('mobileSidebar');
            const sidebarBackdrop = document.getElementById('sidebarBackdrop');
            const searchToggle = document.getElementById('searchToggle');
            const searchOverlay = document.getElementById('searchOverlay');
            const searchClose = document.getElementById('searchClose');
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            const heroSection = document.getElementById('heroSection');
            const heroSkeleton = document.getElementById('heroSkeleton');
            const widgetsContainer = document.getElementById('widgetsContainer');
            const mainContent = document.getElementById('mainContent');

            // ==================== RATE LIMITER ====================
            let lastRequestTime = 0;
            const requestQueue = [];
            let processingQueue = false;

            async function rateLimitedFetch(url) {
                const now = Date.now();
                const timeSinceLast = now - lastRequestTime;
                if (timeSinceLast < RATE_LIMIT_DELAY) {
                    await new Promise(r => setTimeout(r, RATE_LIMIT_DELAY - timeSinceLast));
                }
                lastRequestTime = Date.now();
                return fetch(url);
            }

            // ==================== CACHE SYSTEM ====================
            function getCache(key) {
                try {
                    const item = localStorage.getItem(CACHE_PREFIX + key);
                    if (!item) return null;
                    const parsed = JSON.parse(item);
                    if (Date.now() - parsed.timestamp > CACHE_TTL) {
                        localStorage.removeItem(CACHE_PREFIX + key);
                        return null;
                    }
                    return parsed.data;
                } catch (e) {
                    return null;
                }
            }

            function setCache(key, data) {
                try {
                    localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({
                        data,
                        timestamp: Date.now()
                    }));
                } catch (e) {
                    // Storage full, clear old caches
                    try {
                        const keys = Object.keys(localStorage).filter(k => k.startsWith(CACHE_PREFIX));
                        keys.sort((a, b) => {
                            const da = JSON.parse(localStorage.getItem(a) || '{"timestamp":0}').timestamp;
                            const db = JSON.parse(localStorage.getItem(b) || '{"timestamp":0}').timestamp;
                            return da - db;
                        });
                        for (let i = 0; i < Math.ceil(keys.length * 0.3); i++) {
                            localStorage.removeItem(keys[i]);
                        }
                        localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ data, timestamp: Date
                                .now() }));
                    } catch (e2) { /* ignore */ }
                }
            }

            // ==================== ROBUST FETCH WITH RETRY ====================
            async function robustFetch(url, cacheKey = null, retries = MAX_RETRIES) {
                // Check cache first
                if (cacheKey) {
                    const cached = getCache(cacheKey);
                    if (cached) return cached;
                }

                let lastError;
                for (let attempt = 0; attempt <= retries; attempt++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);

                        const response = await rateLimitedFetch(url);

                        clearTimeout(timeoutId);

                        if (response.status === 429) {
                            // Rate limited - wait longer
                            const waitTime = (attempt + 1) * RETRY_DELAY * 2;
                            await new Promise(r => setTimeout(r, waitTime));
                            continue;
                        }

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }

                        const data = await response.json();

                        // Cache successful response
                        if (cacheKey && data) {
                            setCache(cacheKey, data);
                        }

                        return data;
                    } catch (error) {
                        lastError = error;
                        if (attempt < retries) {
                            const delay = RETRY_DELAY * (attempt + 1);
                            await new Promise(r => setTimeout(r, delay));
                        }
                    }
                }
                throw lastError || new Error('Fetch failed after all retries');
            }

            // ==================== SAFE DATA EXTRACTION ====================
            function safeGet(obj, path, fallback = null) {
                try {
                    const keys = path.split('.');
                    let current = obj;
                    for (const key of keys) {
                        if (current === null || current === undefined) return fallback;
                        current = current[key];
                    }
                    return current !== null && current !== undefined ? current : fallback;
                } catch (e) {
                    return fallback;
                }
            }

            // ==================== UNIVERSAL SLIDER SYSTEM ====================
            class UniversalSlider {
                constructor(containerEl, options = {}) {
                    this.container = containerEl;
                    this.track = containerEl.querySelector('.carousel-track');
                    this.prevBtn = containerEl.querySelector('.carousel-arrow.prev');
                    this.nextBtn = containerEl.querySelector('.carousel-arrow.next');
                    this.itemsPerScroll = options.itemsPerScroll || 4;
                    this.scrollAmount = 0;
                    this.maxScroll = 0;
                    this.isDragging = false;
                    this.startX = 0;
                    this.scrollLeft = 0;
                    this.initialized = false;
                    this._boundWheel = this._handleWheel.bind(this);
                    this._boundDragStart = this._dragStart.bind(this);
                    this._boundDragMove = this._dragMove.bind(this);
                    this._boundDragEnd = this._dragEnd.bind(this);
                    this._boundKeyNav = this._handleKeyNav.bind(this);
                }

                init() {
                    if (this.initialized) return;
                    if (!this.track || this.track.children.length === 0) return;

                    const cardWidth = this.track.children[0]?.offsetWidth || 160;
                    const gap = 14;
                    const itemWidth = cardWidth + gap;
                    this.scrollAmount = itemWidth * this.itemsPerScroll;
                    this.maxScroll = Math.max(0, this.track.scrollWidth - this.container.clientWidth);
                    this.initialized = true;

                    // Events
                    if (this.prevBtn) this.prevBtn.addEventListener('click', () => this.scrollBy(-this.scrollAmount));
                    if (this.nextBtn) this.nextBtn.addEventListener('click', () => this.scrollBy(this.scrollAmount));
                    this.container.addEventListener('wheel', this._boundWheel, { passive: false });
                    this.track.addEventListener('mousedown', this._boundDragStart);
                    this.track.addEventListener('touchstart', this._boundDragStart, { passive: true });
                    document.addEventListener('keydown', this._boundKeyNav);

                    this._updateArrows();
                }

                destroy() {
                    if (this.prevBtn) this.prevBtn.removeEventListener('click', () => this.scrollBy(-this.scrollAmount));
                    if (this.nextBtn) this.nextBtn.removeEventListener('click', () => this.scrollBy(this.scrollAmount));
                    this.container.removeEventListener('wheel', this._boundWheel);
                    this.track.removeEventListener('mousedown', this._boundDragStart);
                    this.track.removeEventListener('touchstart', this._boundDragStart);
                    document.removeEventListener('keydown', this._boundKeyNav);
                    document.removeEventListener('mousemove', this._boundDragMove);
                    document.removeEventListener('mouseup', this._boundDragEnd);
                    document.removeEventListener('touchmove', this._boundDragMove);
                    document.removeEventListener('touchend', this._boundDragEnd);
                    this.initialized = false;
                }

                scrollBy(amount) {
                    const current = this.track.style.transform ?
                        parseFloat(this.track.style.transform.replace('translateX(', '').replace('px)', '')) || 0 :
                        0;
                    let target = current + amount;
                    target = Math.max(-this.maxScroll, Math.min(0, target));
                    this.track.style.transform = `translateX(${target}px)`;
                    this._updateArrows();
                }

                _handleWheel(e) {
                    e.preventDefault();
                    this.scrollBy(e.deltaY > 0 ? -this.scrollAmount / 2 : this.scrollAmount / 2);
                }

                _dragStart(e) {
                    this.isDragging = true;
                    this.startX = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
                    const currentTransform = this.track.style.transform ?
                        parseFloat(this.track.style.transform.replace('translateX(', '').replace('px)', '')) || 0 :
                        0;
                    this.scrollLeft = currentTransform;
                    this.track.classList.add('dragging');
                    document.addEventListener('mousemove', this._boundDragMove);
                    document.addEventListener('mouseup', this._boundDragEnd);
                    document.addEventListener('touchmove', this._boundDragMove, { passive: true });
                    document.addEventListener('touchend', this._boundDragEnd);
                }

                _dragMove(e) {
                    if (!this.isDragging) return;
                    const x = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
                    const walk = (x - this.startX) * 1.2;
                    let target = this.scrollLeft + walk;
                    target = Math.max(-this.maxScroll, Math.min(0, target));
                    this.track.style.transform = `translateX(${target}px)`;
                }

                _dragEnd() {
                    this.isDragging = false;
                    this.track.classList.remove('dragging');
                    document.removeEventListener('mousemove', this._boundDragMove);
                    document.removeEventListener('mouseup', this._boundDragEnd);
                    document.removeEventListener('touchmove', this._boundDragMove);
                    document.removeEventListener('touchend', this._boundDragEnd);
                    this._updateArrows();
                }

                _handleKeyNav(e) {
                    if (!this.container.matches(':hover') && !this.container.querySelector(':focus')) return;
                    if (e.key === 'ArrowLeft') { e.preventDefault();
                        this.scrollBy(-this.scrollAmount); }
                    if (e.key === 'ArrowRight') { e.preventDefault();
                        this.scrollBy(this.scrollAmount); }
                }

                _updateArrows() {
                    const current = this.track.style.transform ?
                        parseFloat(this.track.style.transform.replace('translateX(', '').replace('px)', '')) || 0 :
                        0;
                    if (this.prevBtn) this.prevBtn.style.opacity = current >= 0 ? '0.4' : '';
                    if (this.nextBtn) this.nextBtn.style.opacity = current <= -this.maxScroll ? '0.4' : '';
                }

                reinit() {
                    this.destroy();
                    this.init();
                }
            }

            // ==================== CREATE ANIME CARD HTML ====================
            function createAnimeCard(anime) {
                const title = safeGet(anime, 'title', 'Unknown');
                const malId = safeGet(anime, 'mal_id', 0);
                const score = safeGet(anime, 'score', null);
                const episodes = safeGet(anime, 'episodes', null);
                const type = safeGet(anime, 'type', null);
                const imageUrl = safeGet(anime, 'images.jpg.large_image_url', '') ||
                    safeGet(anime, 'images.jpg.image_url', '') ||
                    'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" fill="%231a1a25"><rect width="160" height="240"/><text x="80" y="120" text-anchor="middle" fill="%236b6b80" font-size="14">No Image</text></svg>';

                const scoreDisplay = score ? `⭐ ${score.toFixed(1)}` : '';
                const epDisplay = episodes ? `Ep ${episodes}` : type || '';

                return `
                <div class="anime-card fade-in-scale" data-mal-id="${malId}" onclick="window.location.href='anime.html?id=${malId}'" role="button" tabindex="0" aria-label="${title}">
                    <div class="poster-wrap">
                        <img src="${imageUrl}" alt="${title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 160 240%22 fill=%22%231a1a25%22><rect width=%22160%22 height=%22240%22/><text x=%2280%22 y=%22120%22 text-anchor=%22middle%22 fill=%22%236b6b80%22 font-size=%2214%22>No Image</text></svg>'">
                        <div class="poster-overlay"></div>
                        <div class="card-badges">
                            ${score ? `<span class="badge badge-score">⭐ ${score.toFixed(1)}</span>` : ''}
                            ${type ? `<span class="badge badge-type">${type}</span>` : ''}
                            ${episodes ? `<span class="badge badge-ep">📺 ${episodes} eps</span>` : ''}
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-title" title="${title}">${title}</div>
                        <div class="card-meta">${epDisplay}</div>
                    </div>
                </div>`;
            }

            // ==================== CREATE WIDGET SECTION ====================
            function createWidgetSection(title, widgetId, icon = '🎬') {
                return `
                <section class="widget-section" id="widget-${widgetId}">
                    <div class="widget-header">
                        <h2 class="widget-title"><span class="indicator"></span>${icon} ${title}</h2>
                        <a href="search.html" class="widget-view-all">View All →</a>
                    </div>
                    <div class="carousel-container" id="carousel-${widgetId}">
                        <div class="carousel-track" id="track-${widgetId}">
                            <!-- Skeleton loading -->
                            ${Array(8).fill(0).map(() => `
                                <div class="anime-card" style="pointer-events:none;">
                                    <div class="poster-wrap skeleton skeleton-poster"></div>
                                    <div class="card-info">
                                        <div class="skeleton skeleton-text"></div>
                                        <div class="skeleton skeleton-text-sm"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button class="carousel-arrow prev" aria-label="Scroll left">◀</button>
                        <button class="carousel-arrow next" aria-label="Scroll right">▶</button>
                    </div>
                </section>`;
            }

            // ==================== POPULATE WIDGET ====================
            function populateWidget(widgetId, animeList) {
                const track = document.getElementById(`track-${widgetId}`);
                if (!track) return;
                const safeList = Array.isArray(animeList) ? animeList : [];
                if (safeList.length === 0) {
                    track.innerHTML =
                        '<div class="widget-error" style="grid-column:1/-1;width:100%;">No anime found. Please try again later.</div>';
                    return;
                }
                track.innerHTML = safeList.map(anime => createAnimeCard(anime)).join('');
                // Initialize slider
                const container = document.getElementById(`carousel-${widgetId}`);
                if (container && track.children.length > 0) {
                    const slider = new UniversalSlider(container, { itemsPerScroll: 3 });
                    slider.init();
                    // Store for potential reinit
                    container._slider = slider;
                }
            }

            function showWidgetError(widgetId, message = 'Could not load data.') {
                const track = document.getElementById(`track-${widgetId}`);
                if (!track) return;
                track.innerHTML = `
                <div class="widget-error" style="width:100%;text-align:center;padding:30px;">
                    <p>⚠️ ${message}</p>
                    <button class="retry-btn" onclick="window._retryWidget('${widgetId}')">🔄 Retry</button>
                </div>`;
            }

            // ==================== FETCH WIDGET DATA ====================
            async function fetchWidgetData(endpoint, cacheKey, limit = 15) {
                const url = `${JIKAN_BASE}/${endpoint}?limit=${limit}`;
                const data = await robustFetch(url, cacheKey);
                return safeGet(data, 'data', []);
            }

            // ==================== BUILD ALL WIDGETS ====================
            const widgetConfigs = [
                { title: 'Trending Now', id: 'trending', icon: '🔥', endpoint: 'top/anime?filter=airing',
                    cacheKey: 'trending' },
                { title: 'Top Rated', id: 'toprated', icon: '⭐', endpoint: 'top/anime?filter=bypopularity',
                    cacheKey: 'toprated' },
                { title: 'Top Airing', id: 'topairing', icon: '📡', endpoint: 'top/anime?filter=airing&limit=20',
                    cacheKey: 'topairing' },
                { title: 'Upcoming', id: 'upcoming', icon: '🆕', endpoint: 'seasons/upcoming', cacheKey: 'upcoming' },
                { title: 'Recently Updated', id: 'recent', icon: '🔄', endpoint: 'seasons/now', cacheKey: 'recent' },
                { title: 'Completed', id: 'completed', icon: '✅', endpoint: 'top/anime?filter=complete',
                cacheKey: 'completed' },
            ];

            function buildAllWidgets() {
                const html = widgetConfigs.map(w => createWidgetSection(w.title, w.id, w.icon)).join('');
                widgetsContainer.innerHTML = html;
            }

            // ==================== LOAD ALL WIDGETS WITH Promise.allSettled ====================
            async function loadAllWidgets() {
                const promises = widgetConfigs.map(async (config) => {
                    try {
                        const data = await fetchWidgetData(config.endpoint, config.cacheKey, 16);
                        return { config, data, success: true };
                    } catch (error) {
                        console.warn(`Widget "${config.title}" failed:`, error.message);
                        return { config, data: [], success: false, error: error.message };
                    }
                });

                const results = await Promise.allSettled(promises);

                results.forEach((result, index) => {
                    if (result.status === 'fulfilled') {
                        const { config, data, success, error } = result.value;
                        if (success && data.length > 0) {
                            populateWidget(config.id, data);
                        } else {
                            showWidgetError(config.id, error || 'No data available');
                        }
                    } else {
                        const config = widgetConfigs[index];
                        showWidgetError(config.id, 'Network error');
                    }
                });
            }

            // ==================== HERO SLIDER SYSTEM ====================
            let heroAnimeList = [];
            let heroCurrentIndex = 0;
            let heroAutoSlideInterval = null;
            let heroTouchStartX = 0;
            let heroTouchEndX = 0;

            function buildHeroSlide(anime, index) {
                const title = safeGet(anime, 'title', 'Unknown');
                const malId = safeGet(anime, 'mal_id', 0);
                const score = safeGet(anime, 'score', null);
                const synopsis = safeGet(anime, 'synopsis', 'No description available.');
                const genres = safeGet(anime, 'genres', []).slice(0, 3).map(g => g.name).join(' • ');
                const imageUrl = safeGet(anime, 'images.jpg.large_image_url', '') ||
                    safeGet(anime, 'images.jpg.image_url', '') || '';
                const trailerUrl = safeGet(anime, 'trailer.embed_url', '') ||
                    safeGet(anime, 'trailer.url', '');

                return `
                <div class="hero-slide ${index === 0 ? 'active' : ''}" data-index="${index}" data-mal-id="${malId}">
                    <div class="hero-bg">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${title}" loading="${index < 3 ? 'eager' : 'lazy'}" onerror="this.style.display='none'">` : ''}
                    </div>
                    <div class="hero-content">
                        <h1 class="hero-title">${title}</h1>
                        <div class="hero-meta">
                            ${score ? `<span class="hero-score">⭐ ${score.toFixed(1)}</span>` : ''}
                            ${genres ? `<span class="hero-genre">${genres}</span>` : ''}
                        </div>
                        <p class="hero-synopsis">${synopsis}</p>
                        <div class="hero-btns">
                            <a href="watch.html?id=${malId}&ep=1" class="btn btn-primary">▶ Watch Now</a>
                            <a href="anime.html?id=${malId}" class="btn btn-secondary">ℹ Details</a>
                        </div>
                    </div>
                </div>`;
            }

            function buildHeroDots(count) {
                return Array.from({ length: count }, (_, i) =>
                    `<button class="hero-dot ${i === 0 ? 'active' : ''}" data-index="${i}" aria-label="Slide ${i + 1}"></button>`
                ).join('');
            }

            function buildHeroNav(count) {
                return `
                <div class="hero-nav">
                    <button class="hero-arrow prev" aria-label="Previous slide">◀</button>
                    <div class="hero-dots">${buildHeroDots(count)}</div>
                    <button class="hero-arrow next" aria-label="Next slide">▶</button>
                </div>`;
            }

            function goToHeroSlide(index) {
                const slides = heroSection.querySelectorAll('.hero-slide:not(#heroSkeleton)');
                const dots = heroSection.querySelectorAll('.hero-dot');
                if (slides.length === 0) return;

                const totalSlides = slides.length;
                let targetIndex = ((index % totalSlides) + totalSlides) % totalSlides;

                // Remove active from all
                slides.forEach(s => s.classList.remove('active', 'prev'));
                dots.forEach(d => d.classList.remove('active'));

                // Set active
                slides[targetIndex].classList.add('active');
                if (dots[targetIndex]) dots[targetIndex].classList.add('active');
                heroCurrentIndex = targetIndex;
            }

            function nextHeroSlide() {
                goToHeroSlide(heroCurrentIndex + 1);
            }

            function prevHeroSlide() {
                goToHeroSlide(heroCurrentIndex - 1);
            }

            function startHeroAutoSlide() {
                stopHeroAutoSlide();
                heroAutoSlideInterval = setInterval(nextHeroSlide, 5000);
            }

            function stopHeroAutoSlide() {
                if (heroAutoSlideInterval) {
                    clearInterval(heroAutoSlideInterval);
                    heroAutoSlideInterval = null;
                }
            }

            async function loadHeroSlider() {
                try {
                    const data = await robustFetch(`${JIKAN_BASE}/top/anime?filter=bypopularity&limit=15`,
                        'hero_anime');
                    heroAnimeList = safeGet(data, 'data', []);

                    if (heroAnimeList.length < 5) {
                        // Fallback fetch
                        const fallbackData = await robustFetch(`${JIKAN_BASE}/top/anime?limit=15`, 'hero_fallback');
                        heroAnimeList = safeGet(fallbackData, 'data', []);
                    }

                    if (heroAnimeList.length === 0) {
                        heroSkeleton.innerHTML =
                            '<div style="position:relative;z-index:3;max-width:600px;color:var(--text2);"><p>Unable to load hero content. Please refresh.</p></div>';
                        return;
                    }

                    // Remove skeleton
                    if (heroSkeleton) heroSkeleton.remove();

                    // Build slides
                    const slidesHTML = heroAnimeList.map((anime, i) => buildHeroSlide(anime, i)).join('');
                    const navHTML = buildHeroNav(heroAnimeList.length);

                    heroSection.innerHTML = slidesHTML + navHTML;
                    heroCurrentIndex = 0;

                    // Event listeners
                    const prevArrow = heroSection.querySelector('.hero-arrow.prev');
                    const nextArrow = heroSection.querySelector('.hero-arrow.next');
                    const dots = heroSection.querySelectorAll('.hero-dot');

                    if (prevArrow) prevArrow.addEventListener('click', () => { prevHeroSlide();
                        resetAutoSlide(); });
                    if (nextArrow) nextArrow.addEventListener('click', () => { nextHeroSlide();
                        resetAutoSlide(); });
                    dots.forEach(dot => {
                        dot.addEventListener('click', () => {
                            goToHeroSlide(parseInt(dot.dataset.index));
                            resetAutoSlide();
                        });
                    });

                    // Touch swipe
                    heroSection.addEventListener('touchstart', (e) => {
                        heroTouchStartX = e.touches[0].clientX;
                    }, { passive: true });
                    heroSection.addEventListener('touchend', (e) => {
                        heroTouchEndX = e.changedTouches[0].clientX;
                        const diff = heroTouchStartX - heroTouchEndX;
                        if (Math.abs(diff) > 60) {
                            if (diff > 0) nextHeroSlide();
                            else prevHeroSlide();
                            resetAutoSlide();
                        }
                    });

                    // Keyboard
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowLeft') { prevHeroSlide();
                            resetAutoSlide(); }
                        if (e.key === 'ArrowRight') { nextHeroSlide();
                            resetAutoSlide(); }
                    });

                    // Pause on hover
                    heroSection.addEventListener('mouseenter', stopHeroAutoSlide);
                    heroSection.addEventListener('mouseleave', startHeroAutoSlide);
                    heroSection.addEventListener('touchstart', stopHeroAutoSlide, { passive: true });
                    heroSection.addEventListener('touchend', () => {
                        setTimeout(startHeroAutoSlide, 3000);
                    });

                    startHeroAutoSlide();
                } catch (error) {
                    console.error('Hero slider failed:', error);
                    if (heroSkeleton) {
                        heroSkeleton.innerHTML =
                            '<div style="position:relative;z-index:3;max-width:600px;color:var(--text2);"><p>⚠️ Unable to load hero. <button onclick="location.reload()" style="color:var(--purple-glow);text-decoration:underline;background:none;border:none;cursor:pointer;">Refresh page</button></p></div>';
                    }
                }
            }

            function resetAutoSlide() {
                stopHeroAutoSlide();
                startHeroAutoSlide();
            }

            // ==================== SEARCH FUNCTIONALITY ====================
            let searchDebounceTimer = null;

            async function performSearch(query) {
                if (!query || query.trim().length < 2) {
                    searchResults.innerHTML = '';
                    searchResults.classList.remove('active');
                    return;
                }

                try {
                    const data = await robustFetch(`${JIKAN_BASE}/anime?q=${encodeURIComponent(query)}&limit=8&sfw=true`,
                        null, 1);
                    const results = safeGet(data, 'data', []);

                    if (results.length === 0) {
                        searchResults.innerHTML =
                            '<div style="padding:20px;text-align:center;color:var(--text2);">No results found</div>';
                    } else {
                        searchResults.innerHTML = results.map(anime => {
                            const title = safeGet(anime, 'title', 'Unknown');
                            const malId = safeGet(anime, 'mal_id', 0);
                            const imageUrl = safeGet(anime, 'images.jpg.small_image_url', '');
                            const type = safeGet(anime, 'type', '');
                            const score = safeGet(anime, 'score', null);
                            return `
                                <div class="search-result-item" onclick="window.location.href='anime.html?id=${malId}'" role="button" tabindex="0">
                                    <img src="${imageUrl}" alt="${title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 45 65%22 fill=%22%231a1a25%22><rect width=%2245%22 height=%2265%22/></svg>'">
                                    <div class="search-result-info">
                                        <div class="title">${title}</div>
                                        <div class="meta">${type || ''} ${score ? '• ⭐ ' + score.toFixed(1) : ''}</div>
                                    </div>
                                </div>`;
                        }).join('');
                    }
                    searchResults.classList.add('active');
                } catch (error) {
                    searchResults.innerHTML =
                        '<div style="padding:20px;text-align:center;color:var(--text2);">Search unavailable</div>';
                    searchResults.classList.add('active');
                }
            }

            searchInput.addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => {
                    performSearch(searchInput.value.trim());
                }, 350);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeSearchOverlay();
                }
                if (e.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) {
                        window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                    }
                }
            });

            function openSearchOverlay() {
                searchOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                setTimeout(() => searchInput.focus(), 200);
            }

            function closeSearchOverlay() {
                searchOverlay.classList.remove('active');
                document.body.style.overflow = '';
                searchInput.value = '';
                searchResults.innerHTML = '';
                searchResults.classList.remove('active');
            }

            searchToggle.addEventListener('click', openSearchOverlay);
            searchClose.addEventListener('click', closeSearchOverlay);
            searchOverlay.addEventListener('click', (e) => {
                if (e.target === searchOverlay) closeSearchOverlay();
            });

            // ==================== MOBILE SIDEBAR ====================
            function openSidebar() {
                mobileSidebar.classList.add('active');
                sidebarBackdrop.classList.add('active');
                document.body.style.overflow = 'hidden';
                hamburger.classList.add('active');
            }

            function closeSidebar() {
                mobileSidebar.classList.remove('active');
                sidebarBackdrop.classList.remove('active');
                document.body.style.overflow = '';
                hamburger.classList.remove('active');
            }

            hamburger.addEventListener('click', () => {
                if (mobileSidebar.classList.contains('active')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });
            sidebarBackdrop.addEventListener('click', closeSidebar);

            // Close sidebar on link click
            mobileSidebar.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', () => {
                    setTimeout(closeSidebar, 200);
                });
            });

            // ==================== HEADER SCROLL EFFECT ====================
            window.addEventListener('scroll', () => {
                if (window.scrollY > 20) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // ==================== KEYBOARD SHORTCUTS ====================
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'k') {
                    e.preventDefault();
                    openSearchOverlay();
                }
                if (e.key === 'Escape') {
                    if (searchOverlay.classList.contains('active')) {
                        closeSearchOverlay();
                    }
                    if (mobileSidebar.classList.contains('active')) {
                        closeSidebar();
                    }
                }
            });

            // ==================== RETRY WIDGET (exposed globally) ====================
            window._retryWidget = async function(widgetId) {
                const config = widgetConfigs.find(w => w.id === widgetId);
                if (!config) return;
                const track = document.getElementById(`track-${widgetId}`);
                if (track) {
                    track.innerHTML = Array(8).fill(0).map(() => `
                        <div class="anime-card" style="pointer-events:none;">
                            <div class="poster-wrap skeleton skeleton-poster"></div>
                            <div class="card-info">
                                <div class="skeleton skeleton-text"></div>
                                <div class="skeleton skeleton-text-sm"></div>
                            </div>
                        </div>
                    `).join('');
                }
                try {
                    const data = await fetchWidgetData(config.endpoint, config.cacheKey + '_retry', 16);
                    if (data.length > 0) {
                        populateWidget(config.id, data);
                    } else {
                        showWidgetError(config.id, 'Still no data available');
                    }
                } catch (e) {
                    showWidgetError(config.id, 'Retry failed: ' + e.message);
                }
            };

            // ==================== INITIALIZATION ====================
            async function initApp() {
                // Build widget skeletons immediately
                buildAllWidgets();

                // Load hero and widgets in parallel with allSettled
                const results = await Promise.allSettled([
                    loadHeroSlider(),
                    loadAllWidgets(),
                ]);

                // Log any top-level failures
                results.forEach((result, i) => {
                    if (result.status === 'rejected') {
                        console.error(`Init task ${i} failed:`, result.reason);
                    }
                });

                // Ensure hero auto-slide is running if it loaded
                if (heroAnimeList.length > 0 && !heroAutoSlideInterval) {
                    startHeroAutoSlide();
                }

                console.log('✅ AnimeStream initialized successfully');
            }

            // Start the app
            initApp().catch(error => {
                console.error('Fatal initialization error:', error);
                // Show fallback in hero
                if (heroSkeleton) {
                    heroSkeleton.innerHTML =
                        '<div style="position:relative;z-index:3;max-width:600px;color:var(--text2);text-align:center;"><p>⚠️ Something went wrong.</p><button onclick="location.reload()" style="margin-top:10px;padding:10px 20px;border-radius:50px;background:var(--purple);color:#fff;border:none;cursor:pointer;font-weight:600;">🔄 Reload Page</button></div>';
                }
            });

            // ==================== SERVICE WORKER REGISTRATION FOR PWA-LIKE BEHAVIOR ====================
            // (Optional - can be enabled for offline caching)
            // if ('serviceWorker' in navigator) {
            //     // Basic service worker for caching API responses could be added here
            // }

            console.log('🚀 AnimeStream - Production Ready');
            console.log('📡 Using Jikan API v4');
            console.log('💡 Press Ctrl+K to open search');
            console.log('📱 Fully responsive');
            console.log('🎬 Hero slider with', '15', 'slides configured');
            console.log('📦', widgetConfigs.length, 'widget sections ready');
        })();
    </script>
</body>
</html>
