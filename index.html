    // ----- NEW: SPA ROUTING for GitHub Pages -----
    function parsePageFromURL() {
      const params = new URLSearchParams(window.location.search);
      const pageParam = params.get('p'); // original path from 404.html
      if (pageParam) {
        // decode and simulate that page
        const decoded = decodeURIComponent(pageParam);
        const url = new URL(decoded, window.location.origin);
        const path = url.pathname;
        const searchParams = url.searchParams;
        if (path.includes('anime.html')) {
          const id = searchParams.get('id');
          if (id) renderAnimePage(id);
        } else if (path.includes('watch.html')) {
          const id = searchParams.get('id');
          const ep = searchParams.get('ep') || '1';
          const type = searchParams.get('type') || 'sub';
          if (id) renderWatchPage(id, ep, type);
        } else if (path.includes('search.html')) {
          const q = searchParams.get('q');
          renderSearchPage(q);
        } else if (path.includes('schedule.html')) {
          renderSchedulePage();
        } else if (path.includes('creator.html')) {
          renderCreatorPage();
        } else if (path.includes('profile.html')) {
          renderProfilePage();
        } else if (path.includes('login.html')) {
          openAuthModal('login');
        } else if (path.includes('signup.html')) {
          openAuthModal('signup');
        }
        // Clean up the URL to remove the p= param
        window.history.replaceState(null, '', window.location.pathname + '?' + searchParams.toString());
      } else {
        // Default: home page
        renderHomePage();
      }
    }

    // On load, parse the URL and render the correct page
    window.addEventListener('DOMContentLoaded', () => {
      // Initialize Firebase, theme, particles, etc.
      // Then call parsePageFromURL()
      parsePageFromURL();
    });

    // ----- THEME TOGGLE (Light/Dark) -----
    const themeToggle = document.getElementById('themeToggle');
    // Default: dark mode (body does not have .light-mode)
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeToggle.textContent = isLight ? '☀️' : '🌙';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
    // Load saved theme
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.body.classList.add('light-mode');
        themeToggle.textContent = '☀️';
      } else {
        themeToggle.textContent = '🌙';
      }
    })();
