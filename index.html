<style>
/* ===== CSS VARIABLES ===== */
:root {
  --bg-primary: #080810;
  --bg-secondary: #0d0d1a;
  --bg-card: #111122;
  --bg-glass: rgba(255,255,255,0.04);
  --accent: #7c3aed;
  --accent-bright: #a855f7;
  --accent-glow: rgba(124,58,237,0.4);
  --neon: #c084fc;
  --text-primary: #f1f0ff;
  --text-secondary: #9ca3af;
  --text-muted: #4b5563;
  --border: rgba(124,58,237,0.2);
  --border-bright: rgba(124,58,237,0.5);
  --gradient-hero: linear-gradient(135deg, #080810 0%, #1a0533 50%, #080810 100%);
  --radius: 12px;
  --radius-lg: 20px;
  --shadow-glow: 0 0 30px rgba(124,58,237,0.3);
  --font-main: 'Outfit', sans-serif;
  --font-display: 'Orbitron', monospace;
  --header-h: 70px;
}

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
button { cursor: pointer; border: none; outline: none; font-family: var(--font-main); }
ul { list-style: none; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* ===== HEADER ===== */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--header-h);
  display: flex; align-items: center;
  padding: 0 24px;
  background: rgba(8,8,16,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: all 0.3s ease;
}
.header.scrolled { background: rgba(8,8,16,0.98); box-shadow: var(--shadow-glow); }
.header-left { display: flex; align-items: center; gap: 16px; }
.hamburger {
  width: 40px; height: 40px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
  background: var(--bg-glass); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all 0.3s;
}
.hamburger span {
  display: block; width: 20px; height: 2px;
  background: var(--text-primary); border-radius: 2px;
  transition: all 0.3s;
}
.hamburger:hover { border-color: var(--accent-bright); background: var(--accent-glow); }
.logo {
  font-family: var(--font-display);
  font-size: 1.5rem; font-weight: 900;
  background: linear-gradient(135deg, var(--neon), var(--accent-bright));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
}
.header-nav { display: flex; align-items: center; gap: 4px; margin-left: 24px; }
.header-nav a {
  padding: 8px 14px; border-radius: 8px;
  font-size: 0.875rem; font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.header-nav a:hover, .header-nav a.active {
  color: var(--text-primary); background: var(--bg-glass);
}
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-glass); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-secondary);
  transition: all 0.3s; font-size: 1.1rem;
}
.search-btn:hover { border-color: var(--accent-bright); color: var(--neon); background: var(--accent-glow); }

/* ===== SEARCH OVERLAY ===== */
.search-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(8,8,16,0.95); backdrop-filter: blur(20px);
  display: flex; flex-direction: column; align-items: center;
  padding-top: 100px;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.search-overlay.open { opacity: 1; pointer-events: all; }
.search-overlay-inner { width: 100%; max-width: 680px; padding: 0 24px; }
.search-input-wrap {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-card); border: 2px solid var(--border-bright);
  border-radius: var(--radius-lg); padding: 16px 20px;
  box-shadow: var(--shadow-glow);
}
.search-input-wrap svg { color: var(--neon); flex-shrink: 0; }
#searchInput {
  flex: 1; background: none; border: none; outline: none;
  font-family: var(--font-main); font-size: 1.1rem;
  color: var(--text-primary);
}
#searchInput::placeholder { color: var(--text-muted); }
.search-close {
  background: none; color: var(--text-secondary);
  font-size: 1.5rem; transition: color 0.2s;
}
.search-close:hover { color: var(--neon); }
.search-results {
  margin-top: 16px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  overflow: hidden; max-height: 480px; overflow-y: auto;
  display: none;
}
.search-results.show { display: block; }
.search-result-item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; transition: background 0.2s; cursor: pointer;
}
.search-result-item:hover { background: var(--bg-glass); }
.search-result-img {
  width: 48px; height: 68px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0; background: var(--bg-secondary);
}
.search-result-info h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
.search-result-info span { font-size: 0.78rem; color: var(--text-muted); }

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed; top: 0; left: -300px; width: 300px; height: 100vh;
  background: var(--bg-secondary); border-right: 1px solid var(--border);
  z-index: 1500; transition: left 0.35s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column; padding: 24px 0;
  overflow-y: auto;
}
.sidebar.open { left: 0; }
.sidebar-overlay {
  position: fixed; inset: 0; z-index: 1400;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.sidebar-overlay.open { opacity: 1; pointer-events: all; }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 24px 24px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.sidebar-close { background: none; color: var(--text-secondary); font-size: 1.5rem; transition: color 0.2s; }
.sidebar-close:hover { color: var(--neon); }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 24px; color: var(--text-secondary);
  font-size: 0.95rem; font-weight: 500;
  transition: all 0.2s; border-left: 3px solid transparent;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  color: var(--text-primary); background: var(--bg-glass);
  border-left-color: var(--accent-bright);
}
.sidebar-nav a svg { flex-shrink: 0; }

/* ===== HERO SLIDER ===== */
.hero {
  position: relative; height: 100vh; min-height: 580px;
  overflow: hidden; margin-top: 0;
}
.hero-slides { position: relative; width: 100%; height: 100%; }
.hero-slide {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 0.8s ease;
  will-change: opacity;
}
.hero-slide.active { opacity: 1; }
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  filter: blur(2px) brightness(0.4) saturate(1.2);
  transform: scale(1.05);
  transition: transform 6s ease;
}
.hero-slide.active .hero-bg { transform: scale(1); }
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to right,
    rgba(8,8,16,0.95) 0%,
    rgba(8,8,16,0.7) 50%,
    rgba(8,8,16,0.1) 100%
  ), linear-gradient(to top, rgba(8,8,16,1) 0%, transparent 40%);
}
.hero-content {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 0 6% 120px;
  display: flex; flex-direction: column;
  max-width: 650px;
  transform: translateY(20px); opacity: 0;
  transition: all 0.6s ease 0.2s;
}
.hero-slide.active .hero-content { transform: translateY(0); opacity: 1; }
.hero-rank {
  font-family: var(--font-display);
  font-size: 0.7rem; letter-spacing: 3px;
  color: var(--neon); margin-bottom: 12px;
  text-transform: uppercase;
}
.hero-title {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800; line-height: 1.1;
  margin-bottom: 12px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
}
.hero-meta {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.hero-score {
  display: flex; align-items: center; gap: 5px;
  color: #fbbf24; font-weight: 700; font-size: 0.9rem;
}
.hero-genres { display: flex; gap: 6px; flex-wrap: wrap; }
.genre-tag {
  padding: 3px 10px; border-radius: 20px;
  background: var(--bg-glass); border: 1px solid var(--border);
  font-size: 0.75rem; color: var(--text-secondary);
}
.hero-synopsis {
  font-size: 0.9rem; line-height: 1.7;
  color: var(--text-secondary); margin-bottom: 24px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-primary {
  padding: 12px 28px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  color: #fff; font-weight: 700; font-size: 0.9rem;
  transition: all 0.3s;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow); }
.btn-secondary {
  padding: 12px 24px; border-radius: 10px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: var(--text-primary); font-weight: 600; font-size: 0.9rem;
  transition: all 0.3s; backdrop-filter: blur(4px);
}
.btn-secondary:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }

/* Hero Controls */
.hero-arrows {
  position: absolute; bottom: 100px; right: 6%;
  display: flex; gap: 10px; z-index: 10;
}
.hero-arrow {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; color: var(--text-primary);
  transition: all 0.3s; cursor: pointer; backdrop-filter: blur(4px);
}
.hero-arrow:hover { background: var(--accent); border-color: var(--accent); }
.hero-dots {
  position: absolute; bottom: 40px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 10;
}
.hero-dot {
  width: 8px; height: 8px; border-radius: 4px;
  background: rgba(255,255,255,0.3); cursor: pointer;
  transition: all 0.3s;
}
.hero-dot.active { width: 24px; background: var(--neon); }

/* ===== SECTION COMMON ===== */
.section { padding: 60px 0; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px 20px; max-width: 1600px; margin: 0 auto;
}
.section-title {
  display: flex; align-items: center; gap: 12px;
  font-size: 1.2rem; font-weight: 700;
}
.section-title::before {
  content: '';
  display: block; width: 4px; height: 22px;
  background: linear-gradient(to bottom, var(--neon), var(--accent));
  border-radius: 2px;
}
.section-more {
  font-size: 0.83rem; color: var(--accent-bright);
  font-weight: 600; transition: color 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.section-more:hover { color: var(--neon); }

/* ===== SKELETON LOADING ===== */
.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-secondary) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-card {
  flex: 0 0 160px; height: 240px; border-radius: var(--radius);
  background: linear-gradient(90deg, var(--bg-card) 25%, #1a1a2e 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

/* ===== SLIDER WRAPPER ===== */
.slider-section { position: relative; }
.slider-outer { position: relative; }
.slider-track-wrap {
  overflow: hidden; padding: 4px 24px 20px;
  cursor: grab; user-select: none;
  max-width: 1600px; margin: 0 auto;
}
.slider-track-wrap:active { cursor: grabbing; }
.slider-track {
  display: flex; gap: 14px;
  transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  will-change: transform;
  min-width: max-content;
}

/* Slider Nav Buttons */
.slider-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 80px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(to right, rgba(8,8,16,0.9), transparent);
  border: none; color: #fff; font-size: 1.3rem;
  cursor: pointer; z-index: 10;
  transition: all 0.3s; opacity: 0.7;
}
.slider-nav:hover { opacity: 1; }
.slider-nav.prev { left: 0; border-radius: 0 8px 8px 0; }
.slider-nav.next { right: 0; background: linear-gradient(to left, rgba(8,8,16,0.9), transparent); border-radius: 8px 0 0 8px; }
.slider-nav.hidden { opacity: 0; pointer-events: none; }

/* ===== ANIME CARD ===== */
.anime-card {
  flex: 0 0 160px; position: relative;
  border-radius: var(--radius); overflow: hidden;
  cursor: pointer; transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
  background: var(--bg-card);
}
.anime-card:hover { transform: translateY(-8px) scale(1.03); z-index: 5; box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow); }
.anime-card-img {
  width: 100%; height: 230px;
  object-fit: cover; display: block;
  transition: filter 0.3s;
  background: var(--bg-secondary);
}
.anime-card:hover .anime-card-img { filter: brightness(0.7); }
.anime-card-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(8,8,16,0.98) 0%, transparent 100%);
  padding: 40px 10px 10px;
}
.anime-card-title {
  font-size: 0.78rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.anime-card-sub { font-size: 0.7rem; color: var(--text-muted); }
.badge {
  position: absolute; padding: 2px 6px; border-radius: 5px;
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
}
.badge-score {
  top: 8px; left: 8px;
  background: rgba(251,191,36,0.9); color: #000;
  display: flex; align-items: center; gap: 3px;
}
.badge-ep {
  top: 8px; right: 8px;
  background: rgba(124,58,237,0.9); color: #fff;
}
.badge-hd {
  bottom: 52px; right: 8px;
  background: rgba(16,185,129,0.9); color: #fff;
}
.badge-type {
  bottom: 52px; left: 8px;
  background: rgba(239,68,68,0.85); color: #fff;
}
.card-hover-btns {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  display: flex; gap: 8px;
  opacity: 0; transition: opacity 0.3s;
  z-index: 5;
}
.anime-card:hover .card-hover-btns { opacity: 1; }
.card-hover-btn {
  width: 40px; height: 40px;
  background: var(--accent); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.9rem;
  transition: all 0.2s;
}
.card-hover-btn:hover { background: var(--neon); transform: scale(1.1); }

/* ===== SECTION SEPARATOR ===== */
.section-sep {
  height: 1px; max-width: 1600px; margin: 0 auto;
  background: linear-gradient(to right, transparent, var(--border), transparent);
}

/* ===== ERROR STATE ===== */
.widget-error {
  padding: 40px 24px; text-align: center;
  color: var(--text-muted); font-size: 0.9rem;
}
.widget-error button {
  margin-top: 12px; padding: 8px 20px; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 0.85rem;
  font-weight: 600; transition: all 0.2s;
}
.widget-error button:hover { background: var(--accent-bright); }

/* ===== FOOTER ===== */
.footer {
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  padding: 30px 24px;
  text-align: center;
}
.footer-logo {
  font-family: var(--font-display);
  font-size: 1.3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--neon), var(--accent-bright));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 16px;
}
.footer-socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
.footer-social {
  width: 38px; height: 38px;
  background: var(--bg-glass); border: 1px solid var(--border);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); transition: all 0.3s; font-size: 1rem;
}
.footer-social:hover { border-color: var(--accent-bright); color: var(--neon); background: var(--accent-glow); }
.footer-copy { font-size: 0.78rem; color: var(--text-muted); }
.footer-copy span { color: var(--accent-bright); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .header-nav { display: none; }
  .hero-content { padding: 0 20px 100px; }
  .hero-arrows { display: none; }
  .anime-card { flex: 0 0 130px; }
  .anime-card-img { height: 190px; }
  .section { padding: 40px 0; }
}
@media (max-width: 480px) {
  .anime-card { flex: 0 0 115px; }
  .anime-card-img { height: 170px; }
}

/* ===== PAGE LOAD ANIMATION ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in-up { animation: fadeInUp 0.6s ease forwards; }

/* Scroll to top button */
.back-to-top {
  position: fixed; bottom: 30px; right: 30px; z-index: 500;
  width: 44px; height: 44px;
  background: var(--accent); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 1.1rem;
  opacity: 0; pointer-events: none;
  transition: all 0.3s; box-shadow: var(--shadow-glow);
}
.back-to-top.show { opacity: 1; pointer-events: all; }
.back-to-top:hover { transform: translateY(-4px); background: var(--accent-bright); }
</style>
</head>

<script>
/* ===================================================
   ANIVERSE - HOME PAGE JAVASCRIPT
   Production-ready with retry, fallback, stable loading
   =================================================== */

// ===== CONFIG =====
const API_BASE = 'https://api.jikan.moe/v4';
const RETRY_ATTEMPTS = 3;
const RETRY_DELAY = 1500; // ms
const FETCH_TIMEOUT = 10000; // 10s

// ===== SLIDER STATE =====
const sliderState = {};

// ===== HERO STATE =====
let heroSlides = [];
let heroIdx = 0;
let heroTimer = null;
let heroTouching = false;
let heroTouchX = 0;

// ===== UTILITIES =====

/** Fetch with timeout */
async function fetchWithTimeout(url, timeout = FETCH_TIMEOUT) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

/** Fetch with retry */
async function fetchWithRetry(url, attempts = RETRY_ATTEMPTS, delay = RETRY_DELAY) {
  for (let i = 0; i < attempts; i++) {
    try {
      return await fetchWithTimeout(url);
    } catch (e) {
      if (i < attempts - 1) {
        await new Promise(r => setTimeout(r, delay * (i + 1)));
      } else {
        throw e;
      }
    }
  }
}

/** Safe image src with fallback */
function safeImg(url, fallback = '') {
  if (!url) return fallback || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="230" viewBox="0 0 160 230"><rect fill="%23111122" width="160" height="230"/><text fill="%234b5563" font-size="12" x="80" y="115" text-anchor="middle">No Image</text></svg>';
  return url;
}

/** Escape HTML */
function esc(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/** Truncate */
function trunc(str, n) {
  if (!str) return '';
  return str.length > n ? str.slice(0, n) + '…' : str;
}

// ===== ANIME CARD BUILDER =====
function buildCard(anime) {
  if (!anime) return '';
  const id = anime.mal_id;
  const title = esc(anime.title || 'Unknown');
  const img = safeImg(anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url);
  const score = anime.score ? anime.score.toFixed(1) : null;
  const eps = anime.episodes;
  const type = anime.type || '';
  return `<div class="anime-card" onclick="goAnime(${id})" title="${title}">
    <img class="anime-card-img" src="${img}" alt="${title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\'><rect fill=\\'%23111122\\' width=\\'160\\' height=\\'230\\'/></svg>'">
    ${score ? `<span class="badge badge-score">⭐ ${score}</span>` : ''}
    ${eps ? `<span class="badge badge-ep">EP ${eps}</span>` : ''}
    <span class="badge badge-hd">HD</span>
    ${type ? `<span class="badge badge-type">${esc(type)}</span>` : ''}
    <div class="card-hover-btns">
      <button class="card-hover-btn" onclick="event.stopPropagation();goWatch(${id},1)" title="Play">▶</button>
    </div>
    <div class="anime-card-overlay">
      <div class="anime-card-title">${title}</div>
      <div class="anime-card-sub">${esc(anime.season || '')} ${anime.year || ''}</div>
    </div>
  </div>`;
}

// ===== SLIDER RENDER =====
function renderSlider(key, items) {
  const track = document.getElementById('track-' + key);
  if (!track) return;
  if (!items || items.length === 0) {
    track.innerHTML = `<div class="widget-error">
      <p>No anime found.</p>
      <button onclick="reloadSection('${key}')">Retry</button>
    </div>`;
    return;
  }
  track.innerHTML = items.map(a => buildCard(a)).join('');
  // init slider state
  sliderState[key] = { offset: 0, maxOffset: 0 };
  updateSliderNav(key);
}

function renderError(key, msg) {
  const track = document.getElementById('track-' + key);
  if (!track) return;
  track.innerHTML = `<div class="widget-error">
    <p>⚠️ ${esc(msg)}</p>
    <button onclick="reloadSection('${key}')">Try Again</button>
  </div>`;
}

// ===== SLIDER NAVIGATION =====
function sliderNav(key, dir) {
  const wrap = document.getElementById('drag-' + key);
  const track = document.getElementById('track-' + key);
  if (!wrap || !track) return;
  const state = sliderState[key] || { offset: 0 };
  const cardW = 160 + 14; // card width + gap
  const visible = Math.floor(wrap.offsetWidth / cardW);
  const totalCards = track.children.length;
  const maxOffset = Math.max(0, (totalCards - visible) * cardW);
  state.maxOffset = maxOffset;
  state.offset = Math.max(0, Math.min(state.offset + dir * cardW * 3, maxOffset));
  track.style.transform = `translateX(-${state.offset}px)`;
  sliderState[key] = state;
  updateSliderNav(key);
}

function updateSliderNav(key) {
  const wrap = document.getElementById('wrap-' + key);
  if (!wrap) return;
  // Show/hide prev/next nav arrows based on scroll position (just always show)
}

// ===== DRAG SCROLL =====
function initDragScroll(key) {
  const wrap = document.getElementById('drag-' + key);
  const track = document.getElementById('track-' + key);
  if (!wrap || !track) return;
  let isDown = false, startX = 0, scrollLeft = 0;
  wrap.addEventListener('mousedown', e => {
    isDown = true; wrap.style.cursor = 'grabbing';
    startX = e.pageX - wrap.offsetLeft;
    scrollLeft = sliderState[key]?.offset || 0;
  });
  wrap.addEventListener('mouseleave', () => { isDown = false; wrap.style.cursor = 'grab'; });
  wrap.addEventListener('mouseup', () => { isDown = false; wrap.style.cursor = 'grab'; });
  wrap.addEventListener('mousemove', e => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - wrap.offsetLeft;
    const walk = (x - startX) * 1.5;
    const cardW = 160 + 14;
    const totalCards = track.children.length;
    const visible = Math.floor(wrap.offsetWidth / cardW);
    const maxOffset = Math.max(0, (totalCards - visible) * cardW);
    const newOffset = Math.max(0, Math.min(scrollLeft - walk, maxOffset));
    if (!sliderState[key]) sliderState[key] = {};
    sliderState[key].offset = newOffset;
    sliderState[key].maxOffset = maxOffset;
    track.style.transform = `translateX(-${newOffset}px)`;
  });
  // Touch
  wrap.addEventListener('touchstart', e => {
    startX = e.touches[0].pageX;
    scrollLeft = sliderState[key]?.offset || 0;
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    const x = e.touches[0].pageX;
    const walk = (x - startX) * 1.2;
    const cardW = 160 + 14;
    const totalCards = track.children.length;
    const visible = Math.floor(wrap.offsetWidth / cardW);
    const maxOffset = Math.max(0, (totalCards - visible) * cardW);
    const newOffset = Math.max(0, Math.min(scrollLeft - walk, maxOffset));
    if (!sliderState[key]) sliderState[key] = {};
    sliderState[key].offset = newOffset;
    track.style.transform = `translateX(-${newOffset}px)`;
  }, { passive: true });
}

// ===== DATA FETCHERS =====
// Rate-limit safe: sequential fetch with delay between calls
async function fetchSection(url) {
  const data = await fetchWithRetry(url);
  return data?.data || [];
}

// ===== SECTION LOADERS WITH RATE LIMIT QUEUE =====
const fetchQueue = [];
let fetchRunning = false;

function queueFetch(fn) {
  return new Promise((resolve, reject) => {
    fetchQueue.push({ fn, resolve, reject });
    if (!fetchRunning) processQueue();
  });
}

async function processQueue() {
  if (fetchQueue.length === 0) { fetchRunning = false; return; }
  fetchRunning = true;
  const { fn, resolve, reject } = fetchQueue.shift();
  try {
    const result = await fn();
    resolve(result);
  } catch (e) {
    reject(e);
  }
  // Rate limit: 333ms between requests (3/s max for Jikan)
  await new Promise(r => setTimeout(r, 400));
  processQueue();
}

// ===== LOAD ALL SECTIONS =====
async function loadSection(key, url) {
  try {
    const items = await queueFetch(() => fetchSection(url));
    renderSlider(key, items);
    initDragScroll(key);
  } catch (e) {
    renderError(key, `Could not load ${key}`);
  }
}

function reloadSection(key) {
  const urls = {
    recent:    `${API_BASE}/anime?status=airing&order_by=start_date&sort=desc&limit=20`,
    trending:  `${API_BASE}/top/anime?filter=bypopularity&limit=20`,
    toprated:  `${API_BASE}/top/anime?filter=favorite&limit=20`,
    airing:    `${API_BASE}/top/anime?filter=airing&limit=20`,
    upcoming:  `${API_BASE}/top/anime?filter=upcoming&limit=20`,
    completed: `${API_BASE}/top/anime?filter=complete&limit=20`
  };
  if (urls[key]) loadSection(key, urls[key]);
}

// ===== HERO SLIDER =====
function buildHeroSlide(anime, idx) {
  const bg = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const title = esc(anime.title || 'Unknown');
  const score = anime.score ? anime.score.toFixed(1) : 'N/A';
  const genres = (anime.genres || []).slice(0, 3).map(g => `<span class="genre-tag">${esc(g.name)}</span>`).join('');
  const synopsis = esc(trunc(anime.synopsis, 200));
  const id = anime.mal_id;
  return `<div class="hero-slide${idx === 0 ? ' active' : ''}" data-idx="${idx}">
    <div class="hero-bg" style="background-image:url('${bg}')"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-rank"># ${idx+1} Trending</div>
      <h1 class="hero-title">${title}</h1>
      <div class="hero-meta">
        <span class="hero-score">⭐ ${score}</span>
        <div class="hero-genres">${genres}</div>
      </div>
      <p class="hero-synopsis">${synopsis}</p>
      <div class="hero-actions">
        <button class="btn-primary" onclick="goWatch(${id},1)">▶ Watch Now</button>
        <button class="btn-secondary" onclick="goAnime(${id})">ℹ Details</button>
      </div>
    </div>
  </div>`;
}

function buildHeroDots(count) {
  const dots = document.getElementById('heroDots');
  if (!dots) return;
  dots.innerHTML = Array.from({length: count}, (_, i) =>
    `<button class="hero-dot${i===0?' active':''}" onclick="goHeroSlide(${i})"></button>`
  ).join('');
}

function goHeroSlide(idx) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  slides.forEach(s => s.classList.remove('active'));
  dots.forEach(d => d.classList.remove('active'));
  if (slides[idx]) slides[idx].classList.add('active');
  if (dots[idx]) dots[idx].classList.add('active');
  heroIdx = idx;
  resetHeroTimer();
}

function heroNav(dir) {
  const slides = document.querySelectorAll('.hero-slide');
  const n = slides.length;
  goHeroSlide((heroIdx + dir + n) % n);
}

function resetHeroTimer() {
  clearInterval(heroTimer);
  heroTimer = setInterval(() => heroNav(1), 6000);
}

async function loadHero() {
  try {
    const data = await fetchWithRetry(`${API_BASE}/top/anime?filter=bypopularity&limit=15`);
    const items = (data?.data || []).slice(0, 12).filter(a => a.images?.jpg?.large_image_url);
    if (!items.length) return;
    const container = document.getElementById('heroSlides');
    if (!container) return;
    container.innerHTML = items.map((a, i) => buildHeroSlide(a, i)).join('');
    buildHeroDots(items.length);
    heroIdx = 0;
    resetHeroTimer();
    // Touch swipe hero
    const hero = document.querySelector('.hero');
    if (hero) {
      hero.addEventListener('touchstart', e => { heroTouching = true; heroTouchX = e.touches[0].clientX; }, { passive: true });
      hero.addEventListener('touchend', e => {
        if (!heroTouching) return;
        const dx = e.changedTouches[0].clientX - heroTouchX;
        if (Math.abs(dx) > 50) heroNav(dx < 0 ? 1 : -1);
        heroTouching = false;
      }, { passive: true });
    }
  } catch (e) {
    console.warn('Hero load failed:', e);
  }
}

// ===== NAVIGATION =====
function goAnime(id) { window.location.href = `anime.html?id=${id}`; }
function goWatch(id, ep) { window.location.href = `watch.html?id=${id}&ep=${ep || 1}`; }

// ===== SEARCH =====
let searchDebounce = null;
function openSearch() { document.getElementById('searchOverlay').classList.add('open'); document.getElementById('searchInput').focus(); }
function closeSearch() { document.getElementById('searchOverlay').classList.remove('open'); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
});

const searchInput = document.getElementById('searchInput');
if (searchInput) {
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const q = searchInput.value.trim();
    if (!q) { document.getElementById('searchResults').classList.remove('show'); return; }
    searchDebounce = setTimeout(() => doSearch(q), 400);
  });
}

async function doSearch(q) {
  const results = document.getElementById('searchResults');
  if (!results) return;
  results.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted)">Searching...</div>`;
  results.classList.add('show');
  try {
    const data = await fetchWithTimeout(`${API_BASE}/anime?q=${encodeURIComponent(q)}&limit=8`);
    const items = data?.data || [];
    if (!items.length) { results.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted)">No results found.</div>`; return; }
    results.innerHTML = items.map(a => `
      <div class="search-result-item" onclick="goAnime(${a.mal_id});closeSearch()">
        <img class="search-result-img" src="${safeImg(a.images?.jpg?.image_url)}" alt="${esc(a.title)}" loading="lazy">
        <div class="search-result-info">
          <h4>${esc(a.title)}</h4>
          <span>${esc(a.type||'')} • ${a.score ? '⭐'+a.score : 'N/A'}</span>
        </div>
      </div>`).join('');
  } catch (e) {
    results.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted)">Search failed. Try again.</div>`;
  }
}

// ===== SIDEBAR =====
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ===== HEADER SCROLL =====
window.addEventListener('scroll', () => {
  const header = document.getElementById('header');
  const btn = document.getElementById('backToTop');
  if (header) header.classList.toggle('scrolled', window.scrollY > 50);
  if (btn) btn.classList.toggle('show', window.scrollY > 400);
});

// ===== MAIN INIT =====
async function init() {
  // Load hero first (it's the most important visual)
  await loadHero();

  // Load all sections with rate-limited queue
  const sections = [
    ['recent',    `${API_BASE}/anime?status=airing&order_by=start_date&sort=desc&limit=20`],
    ['trending',  `${API_BASE}/top/anime?filter=bypopularity&limit=20`],
    ['toprated',  `${API_BASE}/top/anime?filter=favorite&limit=20`],
    ['airing',    `${API_BASE}/top/anime?filter=airing&limit=20`],
    ['upcoming',  `${API_BASE}/top/anime?filter=upcoming&limit=20`],
    ['completed', `${API_BASE}/top/anime?filter=complete&limit=20`]
  ];

  // Use Promise.allSettled so one failure won't block others
  await Promise.allSettled(sections.map(([key, url]) => loadSection(key, url)));
}

// Start when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
