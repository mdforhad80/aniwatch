<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeStream - Watch Anime Online Free</title>
<meta name="description" content="Watch anime online free in HD quality. Stream subbed and dubbed anime instantly.">
<meta property="og:title" content="AnimeStream - Watch Anime Online Free">
<meta property="og:description" content="Stream thousands of anime episodes in HD quality.">

<style>
/* ==================== CSS RESET & BASE ==================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;overflow-x:hidden;line-height:1.6}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
button{border:none;background:none;cursor:pointer;font-family:inherit;color:inherit}
ul,ol{list-style:none}
input,select{font-family:inherit;color:inherit}

/* ==================== CSS VARIABLES ==================== */
:root{
  --primary:#a855f7;--primary-dark:#7e22ce;--primary-glow:rgba(168,85,247,0.4);
  --bg:#0a0a0a;--bg-elevated:#141414;--bg-card:#1a1a1a;--bg-glass:rgba(20,20,20,0.85);
  --text:#e0e0e0;--text-secondary:#9ca3af;--text-muted:#6b7280;
  --border:rgba(255,255,255,0.08);--radius:12px;--radius-sm:8px;
  --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  --header-h:64px;--widget-h:320px;
}

/* ==================== SCROLLBAR ==================== */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

/* ==================== SKELETON LOADING ==================== */
.skeleton{background:linear-gradient(90deg,#1a1a1a 25%,#252525 50%,#1a1a1a 75%);background-size:200% 100%;animation:skeleton 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-banner{height:100%;width:100%;border-radius:0}
.skeleton-card{aspect-ratio:2/3;border-radius:var(--radius)}
.skeleton-text{height:16px;border-radius:4px;margin-top:8px}
.skeleton-text.short{width:60%}

/* ==================== HEADER ==================== */
.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);transition:var(--transition)}
.header.scrolled{background:rgba(10,10,10,0.95);box-shadow:0 4px 30px rgba(0,0,0,0.5)}
.header-left,.header-right{display:flex;align-items:center;gap:16px}
.logo{font-size:clamp(1.2rem,2.5vw,1.6rem);font-weight:800;background:linear-gradient(135deg,var(--primary),#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.logo span{color:var(--text);-webkit-text-fill-color:var(--text);font-weight:400}
.nav-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--text-secondary)}
.nav-btn:hover{background:var(--bg-card);color:var(--primary)}
.nav-btn svg{width:22px;height:22px}
.search-btn{position:relative}
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s;display:flex;align-items:flex-start;justify-content:center;padding-top:15vh}
.search-overlay.active{opacity:1;pointer-events:all}
.search-container{width:min(600px,90vw);position:relative}
.search-input{width:100%;padding:16px 24px;background:var(--bg-elevated);border:2px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:1.1rem;outline:none;transition:var(--transition)}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 20px var(--primary-glow)}
.search-results{position:absolute;top:calc(100%+8px);left:0;right:0;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);max-height:400px;overflow-y:auto;opacity:0;transform:translateY(-10px);transition:all 0.3s;pointer-events:none}
.search-results.active{opacity:1;transform:translateY(0);pointer-events:all}
.search-item{display:flex;gap:12px;padding:12px 16px;align-items:center;transition:var(--transition);cursor:pointer;border-bottom:1px solid var(--border)}
.search-item:hover{background:var(--bg-card)}
.search-item img{width:48px;height:72px;object-fit:cover;border-radius:var(--radius-sm);flex-shrink:0}
.search-item-info{flex:1;min-width:0}
.search-item-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.search-item-meta{font-size:0.8rem;color:var(--text-muted);margin-top:2px}
.search-close{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:var(--transition)}
.search-close:hover{background:var(--bg-card);color:var(--text)}

/* ==================== SIDEBAR ==================== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--bg-elevated);border-right:1px solid var(--border);z-index:1001;transform:translateX(-100%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);padding-top:var(--header-h);overflow-y:auto}
.sidebar.active{transform:translateX(0)}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.3s}
.sidebar-overlay.active{opacity:1;pointer-events:all}
.sidebar-nav{padding:16px}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);color:var(--text-secondary);font-weight:500;transition:var(--transition);margin-bottom:4px}
.sidebar-nav a:hover,.sidebar-nav a.active{background:var(--bg-card);color:var(--primary)}
.sidebar-nav a svg{width:22px;height:22px;flex-shrink:0}
.sidebar-section{margin-top:24px;padding:0 16px}
.sidebar-section-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:12px;font-weight:600}

/* ==================== HERO SLIDER ==================== */
.hero{position:relative;width:100%;height:clamp(400px,60vh,700px);overflow:hidden;margin-top:var(--header-h)}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 0.8s ease;pointer-events:none}
.hero-slide.active{opacity:1;pointer-events:all;z-index:2}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transition:transform 8s ease}
.hero-slide.active .hero-bg{transform:scale(1.05)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(10,10,10,0.7) 40%,rgba(10,10,10,0.3) 100%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:clamp(24px,5vw,64px);padding-bottom:clamp(40px,8vw,80px);z-index:3;max-width:800px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--primary);color:#fff;font-size:0.75rem;font-weight:700;border-radius:20px;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
.hero-title{font-size:clamp(1.8rem,4vw,3.5rem);font-weight:800;line-height:1.15;margin-bottom:16px;text-shadow:0 2px 20px rgba(0,0,0,0.5);opacity:0;transform:translateY(30px);transition:all 0.6s 0.2s}
.hero-slide.active .hero-title{opacity:1;transform:translateY(0)}
.hero-meta{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;opacity:0;transform:translateY(20px);transition:all 0.6s 0.35s}
.hero-slide.active .hero-meta{opacity:1;transform:translateY(0)}
.hero-score{display:flex;align-items:center;gap:6px;color:#fbbf24;font-weight:700;font-size:1rem}
.hero-genres{display:flex;gap:8px;flex-wrap:wrap}
.hero-genre{padding:4px 12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:20px;font-size:0.8rem;color:var(--text-secondary)}
.hero-synopsis{font-size:clamp(0.9rem,1.2vw,1.05rem);color:var(--text-secondary);line-height:1.6;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:0;transform:translateY(20px);transition:all 0.6s 0.5s}
.hero-slide.active .hero-synopsis{opacity:1;transform:translateY(0)}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap;opacity:0;transform:translateY(20px);transition:all 0.6s 0.65s}
.hero-slide.active .hero-buttons{opacity:1;transform:translateY(0)}
.btn-primary{padding:12px 28px;background:var(--primary);color:#fff;font-weight:700;border-radius:var(--radius);display:inline-flex;align-items:center;gap:8px;transition:var(--transition);font-size:0.95rem;box-shadow:0 4px 20px var(--primary-glow)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 8px 30px var(--primary-glow)}
.btn-secondary{padding:12px 28px;background:rgba(255,255,255,0.1);color:var(--text);font-weight:600;border-radius:var(--radius);display:inline-flex;align-items:center;gap:8px;transition:var(--transition);font-size:0.95rem;border:1px solid rgba(255,255,255,0.15)}
.btn-secondary:hover{background:rgba(255,255,255,0.2);transform:translateY(-2px)}
.hero-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;transition:var(--transition);border:1px solid rgba(255,255,255,0.1)}
.hero-nav:hover{background:rgba(0,0,0,0.8);color:var(--primary)}
.hero-nav.prev{left:clamp(16px,3vw,40px)}
.hero-nav.next{right:clamp(16px,3vw,40px)}
.hero-nav svg{width:24px;height:24px}
.hero-dots{position:absolute;bottom:clamp(20px,4vw,40px);left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
.hero-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.3);cursor:pointer;transition:var(--transition);border:2px solid transparent}
.hero-dot.active{background:var(--primary);border-color:rgba(168,85,247,0.3);transform:scale(1.3);box-shadow:0 0 10px var(--primary-glow)}

/* ==================== WIDGETS ==================== */
.main-content{padding:clamp(24px,4vw,48px) clamp(16px,4vw,48px);max-width:1600px;margin:0 auto}
.widget{margin-bottom:clamp(32px,5vw,56px)}
.widget-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.widget-title{font-size:clamp(1.1rem,2vw,1.4rem);font-weight:700;display:flex;align-items:center;gap:10px}
.widget-title svg{width:24px;height:24px;color:var(--primary)}
.widget-actions{display:flex;gap:8px}
.widget-btn{width:36px;height:36px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:var(--transition);border:1px solid var(--border)}
.widget-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.widget-btn svg{width:18px;height:18px}

/* ==================== UNIVERSAL SLIDER ==================== */
.slider-wrapper{position:relative;overflow:hidden}
.slider-track{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding:4px 4px 16px;cursor:grab}
.slider-track::-webkit-scrollbar{display:none}
.slider-track:active{cursor:grabbing}
.slider-track.dragging{scroll-behavior:auto;scroll-snap-type:none}
.anime-card{flex:0 0 auto;width:clamp(160px,18vw,220px);scroll-snap-align:start;position:relative;border-radius:var(--radius);overflow:hidden;background:var(--bg-card);transition:var(--transition);cursor:pointer;transform:translateZ(0)}
.anime-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 20px 40px rgba(0,0,0,0.4),0 0 30px var(--primary-glow);z-index:5}
.card-image{aspect-ratio:2/3;position:relative;overflow:hidden;border-radius:var(--radius) var(--radius) 0 0}
.card-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s}
.anime-card:hover .card-image img{transform:scale(1.1)}
.card-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,transparent 50%);pointer-events:none}
.card-badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.card-badge{padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.badge-hd{background:#ef4444;color:#fff}
.badge-score{background:rgba(0,0,0,0.7);color:#fbbf24;display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
.badge-ep{background:var(--primary);color:#fff}
.badge-type{background:rgba(255,255,255,0.15);color:#fff;backdrop-filter:blur(4px)}
.card-info{padding:12px 14px 14px}
.card-title{font-weight:600;font-size:0.9rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:0.8rem;color:var(--text-muted)}
.card-meta-dot{width:4px;height:4px;border-radius:50%;background:var(--text-muted)}

/* ==================== FOOTER ==================== */
.footer{border-top:1px solid var(--border);padding:clamp(24px,4vw,40px) clamp(16px,4vw,48px);text-align:center;background:var(--bg-elevated)}
.footer-content{max-width:1600px;margin:0 auto}
.footer-logo{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--primary),#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.footer-text{color:var(--text-muted);font-size:0.9rem;margin-bottom:16px}
.footer-socials{display:flex;justify-content:center;gap:16px;margin-bottom:16px}
.footer-social{width:40px;height:40px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:var(--transition);border:1px solid var(--border)}
.footer-social:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-3px)}
.footer-copyright{color:var(--text-muted);font-size:0.8rem}

/* ==================== RESPONSIVE ==================== */
@media(max-width:768px){
  .hero{height:clamp(350px,70vh,500px)}
  .hero-content{padding:20px;padding-bottom:60px}
  .hero-nav{display:none}
  .hero-buttons{flex-direction:column}
  .btn-primary,.btn-secondary{width:100%;justify-content:center}
  .anime-card{width:150px}
  .search-container{width:95vw}
}
@media(max-width:480px){
  .anime-card{width:130px}
  .hero-title{font-size:1.5rem}
}
@media(min-width:1920px){
  .main-content{max-width:1800px}
  .anime-card{width:240px}
}

/* ==================== ERROR / EMPTY STATES ==================== */
.error-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.error-state svg{width:48px;height:48px;margin-bottom:12px;color:var(--text-muted);opacity:0.5}
.error-state p{font-size:0.95rem}
.retry-btn{margin-top:12px;padding:8px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.85rem;transition:var(--transition)}
.retry-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ==================== ANIMATIONS ==================== */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.6s ease forwards}
</style>

<!-- ==================== HERO SLIDER ==================== -->

      <div class="slider-track" id="slider-trending"></div>

  <section class="widget" id="widget-top">
    <div class="widget-header">

const API_BASE = 'https://api.jikan.moe/v4';
const CACHE_TTL = 5 * 60 * 1000; // 5 minutes
const MAX_RETRIES = 3;
const RETRY_DELAY = 1000;

// ==================== UTILITY FUNCTIONS ====================
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function getCache(key) {
  try {
    const item = localStorage.getItem('as_cache_' + key);
    if (!item) return null;
    const parsed = JSON.parse(item);
    if (Date.now() - parsed.ts > CACHE_TTL) { localStorage.removeItem('as_cache_' + key); return null; }
    return parsed.data;
  } catch { return null; }
}
function setCache(key, data) {
  try { localStorage.setItem('as_cache_' + key, JSON.stringify({ ts: Date.now(), data })); } catch {}
}

async function fetchWithRetry(url, retries = MAX_RETRIES) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    clearTimeout(timeout);
    if (retries > 0) { await sleep(RETRY_DELAY * (MAX_RETRIES - retries + 1)); return fetchWithRetry(url, retries - 1); }
    throw err;
  }
}

async function apiRequest(endpoint, cacheKey) {
  const cached = getCache(cacheKey);
  if (cached) return cached;
  const data = await fetchWithRetry(API_BASE + endpoint);
  setCache(cacheKey, data);
  return data;
}

// ==================== UNIVERSAL SLIDER SYSTEM ====================
class SliderSystem {
  constructor() {
    this.sliders = new Map();
    this.initAll();
    this.setupGlobalListeners();
  }

  register(id, track) {
    if (this.sliders.has(id)) return;
    const slider = {
      track,
      isDragging: false,
      startX: 0,
      scrollLeft: 0,
      velocity: 0,
      lastX: 0,
      lastTime: 0,
      rafId: null,
      initialized: false
    };
    this.sliders.set(id, slider);
    this.setupSliderEvents(id, slider);
  }

  setupSliderEvents(id, slider) {
    const track = slider.track;

    // Mouse drag
    track.addEventListener('mousedown', (e) => {
      slider.isDragging = true;
      slider.startX = e.pageX - track.offsetLeft;
      slider.scrollLeft = track.scrollLeft;
      slider.lastX = e.pageX;
      slider.lastTime = Date.now();
      track.classList.add('dragging');
    });

    document.addEventListener('mousemove', (e) => {
      if (!slider.isDragging) return;
      e.preventDefault();
      const x = e.pageX - track.offsetLeft;
      const walk = (x - slider.startX) * 1.5;
      track.scrollLeft = slider.scrollLeft - walk;
      const now = Date.now();
      slider.velocity = (e.pageX - slider.lastX) / (now - slider.lastTime + 1);
      slider.lastX = e.pageX;
      slider.lastTime = now;
    });

    document.addEventListener('mouseup', () => {
      if (!slider.isDragging) return;
      slider.isDragging = false;
      track.classList.remove('dragging');
      // Inertia scroll
      const decelerate = () => {
        if (Math.abs(slider.velocity) < 0.1) return;
        track.scrollLeft -= slider.velocity * 20;
        slider.velocity *= 0.9;
        slider.rafId = requestAnimationFrame(decelerate);
      };
      cancelAnimationFrame(slider.rafId);
      decelerate();
    });

    // Touch support
    track.addEventListener('touchstart', (e) => {
      slider.isDragging = true;
      slider.startX = e.touches[0].pageX - track.offsetLeft;
      slider.scrollLeft = track.scrollLeft;
    }, { passive: true });

    track.addEventListener('touchmove', (e) => {
      if (!slider.isDragging) return;
      const x = e.touches[0].pageX - track.offsetLeft;
      const walk = (x - slider.startX) * 1.5;
      track.scrollLeft = slider.scrollLeft - walk;
    }, { passive: true });

    track.addEventListener('touchend', () => { slider.isDragging = false; });

    // Wheel scroll horizontal
    track.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        track.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  }

  scroll(id, direction) {
    const slider = this.sliders.get(id);
    if (!slider) return;
    const card = slider.track.querySelector('.anime-card');
    if (!card) return;
    const scrollAmount = (card.offsetWidth + 16) * 4;
    slider.track.scrollBy({ left: direction === 'next' ? scrollAmount : -scrollAmount, behavior: 'smooth' });
  }

  initAll() {
    $$('[data-slider]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.scroll(btn.dataset.slider, btn.dataset.dir);
      });
    });
  }

  setupGlobalListeners() {
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        this.sliders.forEach(s => {
          if (s.track) s.track.style.scrollBehavior = 'auto';
        });
      }, 250);
    });
  }
}

    this.dotsContainer.innerHTML = this.slides.map((_, i) =>
      `<button class="hero-dot ${i === 0 ? 'active' : ''}" data-index="${i}" aria-label="Go to slide ${i+1}"></button>`
    ).join('');
  }

  goTo(index) {

    dots[this.current].classList.add('active');
  }

  next() { this.goTo(this.current + 1); }
  prev() { this.goTo(this.current - 1); }

  startAutoSlide() {
    if (this.interval) clearInterval(this.interval);
    this.interval = setInterval(() => this.next(), 6000);
  }

  setupEvents() {
    $('#heroPrev').addEventListener('click', () => { this.prev(); this.startAutoSlide(); });
    $('#heroNext').addEventListener('click', () => { this.next(); this.startAutoSlide(); });
    this.dotsContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('hero-dot')) {
        this.goTo(parseInt(e.target.dataset.index));
        this.startAutoSlide();
      }
    });

    // Touch swipe
    const hero = $('#hero');
    hero.addEventListener('touchstart', (e) => { this.touchStartX = e.touches[0].clientX; }, { passive: true });
    hero.addEventListener('touchend', (e) => {
      const diff = this.touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) { diff > 0 ? this.next() : this.prev(); this.startAutoSlide(); }
    }, { passive: true });

    // Mouse drag
    hero.addEventListener('mousedown', (e) => { this.isDragging = true; this.touchStartX = e.clientX; });
    hero.addEventListener('mouseup', (e) => {
      if (!this.isDragging) return;
      this.isDragging = false;
      const diff = this.touchStartX - e.clientX;
      if (Math.abs(diff) > 50) { diff > 0 ? this.next() : this.prev(); this.startAutoSlide(); }
    });
  }
}

// ==================== WIDGET LOADER ====================
async function loadWidget(id, endpoint, cacheKey, extraBadgesFn = null, fallbackFn = null) {
  const track = $(`#slider-${id}`);
  if (!track) return;

  // Show skeletons
  track.innerHTML = Array(6).fill(createSkeletonCard()).join('');
  sliderSystem.register(id, track);

  try {
    const data = await apiRequest(endpoint, cacheKey);
    const list = data?.data || [];
    if (list.length === 0) throw new Error('Empty response');

    track.innerHTML = list.slice(0, 18).map(anime => {
      const extra = extraBadgesFn ? extraBadgesFn(anime) : '';
      return createCard(anime, extra);
    }).join('');
  } catch (err) {
    console.error(`Widget ${id} failed:`, err);
    const fallback = fallbackFn ? fallbackFn() : getFallbackData();
    track.innerHTML = fallback.data.slice(0, 12).map(anime => createCard(anime)).join('');
  }
}

// ==================== SEARCH ====================
let searchAbort = null;

async function performSearch(query) {
  const results = $('#searchResults');
  if (!query || query.length < 2) { results.classList.remove('active'); return; }

  if (searchAbort) searchAbort.abort();
  searchAbort = new AbortController();

  try {
    const res = await fetch(`${API_BASE}/anime?q=${encodeURIComponent(query)}&limit=8&sfw=true`, { signal: searchAbort.signal });
    const data = await res.json();
    const list = data?.data || [];

    if (list.length === 0) {
      results.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">No results found</div>';
    } else {
      results.innerHTML = list.map(anime => {
        const img = anime.images?.jpg?.image_url || '';
        const title = anime.title_english || anime.title;
        const type = anime.type || 'TV';
        const meta = anime.type || 'TV';
        return `
          <div class="search-item" onclick="goToAnime(${anime.mal_id});closeSearch()">
            <img src="${img}" alt="${title}" loading="lazy">
            <div class="search-item-info">
              <div class="search-item-title">${title}</div>
              <div class="search-item-meta">${meta}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    results.classList.add('active');
  } catch {
    results.classList.remove('active');
  }
}

const debouncedSearch = debounce(performSearch, 400);

function openSearch() { $('#searchOverlay').classList.add('active'); $('#searchInput').focus(); document.body.style.overflow = 'hidden'; }
function closeSearch() { $('#searchOverlay').classList.remove('active'); $('#searchResults').classList.remove('active'); $('#searchInput').value = ''; document.body.style.overflow = ''; }

// ==================== HEADER SCROLL ====================
window.addEventListener('scroll', () => {
  $('#header').classList.toggle('scrolled', window.scrollY > 50);
});

// ==================== SIDEBAR ====================
function openSidebar() { $('#sidebar').classList.add('active'); $('#sidebarOverlay').classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeSidebar() { $('#sidebar').classList.remove('active'); $('#sidebarOverlay').classList.remove('active'); document.body.style.overflow = ''; }

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  // Sidebar
  $('#menuBtn').addEventListener('click', openSidebar);
  $('#sidebarOverlay').addEventListener('click', closeSidebar);

  // Search
  $('#searchBtn').addEventListener('click', openSearch);
  $('#searchClose').addEventListener('click', closeSearch);
  $('#searchInput').addEventListener('input', (e) => debouncedSearch(e.target.value));
  $('#searchOverlay').addEventListener('click', (e) => { if (e.target === $('#searchOverlay')) closeSearch(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSearch();
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
  });

  // Hero
  const hero = new HeroSlider();

  // Widgets - load in parallel with Promise.allSettled
  const widgets = [
    ['recent', '/seasons/now?limit=18', 'seasons_now', null, () => getFallbackData(12)],
    ['trending', '/top/anime?filter=airing&limit=18', 'trending_airing', null, () => getFallbackData(12)],
    ['top', '/top/anime?limit=18', 'top_all', null, () => getFallbackData(12)],
    ['airing', '/top/anime?filter=airing&limit=18', 'top_airing_2', null, () => getFallbackData(12)],
    ['upcoming', '/top/anime?filter=upcoming&limit=18', 'top_upcoming', null, () => getFallbackData(12)],
    ['completed', '/top/anime?status=complete&limit=18', 'top_completed', null, () => getFallbackData(12)]
  ];

  Promise.allSettled(widgets.map(([id, ep, ck, eb, fb]) => loadWidget(id, ep, ck, eb, fb)));
});
</script>
