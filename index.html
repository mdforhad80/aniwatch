<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Watch Anime Online | Premium HD Streaming</title>
    <meta name="description" content="Stream the latest anime in HD for free. Watch dubbed and subbed anime episodes with no ads. Premium Netflix-quality anime streaming experience.">
    <meta name="keywords" content="anime streaming, watch anime online, free anime, hd anime, subbed anime, dubbed anime">
    <meta property="og:title" content="AnimeStream - Premium Anime Streaming">
    <meta property="og:description" content="Watch anime in HD quality. Latest episodes, popular series, and classic favorites all in one place.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://animestream.pages.dev/">
    <meta property="og:image" content="https://animestream.pages.dev/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AnimeStream - Premium Anime Streaming">
    <meta name="twitter:description" content="Watch anime in HD quality. Latest episodes, popular series, and classic favorites.">
    <meta name="theme-color" content="#0b0b0f">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>">
    <style>
        /* ===== SAME VARIABLES & BASE STYLES AS BEFORE (unchanged) ===== */
        :root { /* ... all CSS variables ... */ }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-top: var(--header-height);
            padding-bottom: env(safe-area-inset-bottom, 0);
            position: relative;
        }

        /* === CURSOR GLOW === */
        .cursor-glow { /* ... same ... */ }

        /* === PARTICLES === */
        .particles-container { /* ... same ... */ }
        .particle { /* ... same ... */ }
        @keyframes floatUp { /* ... same ... */ }

        /* === HEADER / NAVBAR (unchanged) === */
        .header { /* ... same ... */ }
        .header.scrolled { /* ... same ... */ }
        .header-inner { /* ... same ... */ }
        .header-left { /* ... same ... */ }
        .header-center { /* ... same ... */ }
        .header-right { /* ... same ... */ }
        .logo-icon { /* ... same ... */ }
        .logo-text { /* ... same ... */ }
        .icon-btn { /* ... same ... */ }

        /* === SIDEBAR (unchanged) === */
        .sidebar-overlay { /* ... same ... */ }
        .sidebar { /* ... same ... */ }
        .sidebar.active { /* ... same ... */ }
        .sidebar-nav a { /* ... same ... */ }
        .sidebar-nav a.active { /* ... same ... */ }

        /* === SEARCH OVERLAY (unchanged) === */
        .search-overlay { /* ... same ... */ }
        .search-overlay.active { /* ... same ... */ }
        .search-input-row { /* ... same ... */ }
        .search-results { /* ... same ... */ }
        .search-result-item { /* ... same ... */ }
        .search-no-results { /* ... same ... */ }

        /* === MAIN CONTENT === */
        .main-content {
            position: relative;
            z-index: 1;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 16px;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 22px;
            background: linear-gradient(180deg, var(--purple), var(--pink));
            border-radius: 4px;
        }

        /* ===== FULL-WIDTH HERO SLIDER (unchanged) ===== */
        .hero-slider { /* ... same full-width styles ... */ }
        .hero-slider-wrapper { /* ... same ... */ }
        .hero-slide { /* ... same ... */ }
        .hero-slide.active { /* ... same ... */ }
        .hero-slide::before { /* ... same ... */ }
        .hero-info { /* ... same ... */ }
        .hero-info .hero-title { /* ... same ... */ }
        .hero-info .hero-subtitle { /* ... same ... */ }
        .hero-meta { /* ... same ... */ }
        .hero-meta .hero-badge { /* ... same ... */ }
        .hero-synopsis { /* ... same ... */ }
        .hero-buttons { /* ... same ... */ }
        .btn { /* ... same ... */ }
        .btn-primary { /* ... same ... */ }
        .btn-outline { /* ... same ... */ }
        .hero-dots { /* ... same ... */ }
        .hero-dot { /* ... same ... */ }
        .hero-dot.active { /* ... same ... */ }

        /* ===== ANIME GRID (responsive, always 12 cards) ===== */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        @media (min-width: 600px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 18px;
            }
        }
        @media (min-width: 1024px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
                gap: 20px;
            }
        }
        .anime-card {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-tertiary);
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
        }
        .anime-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--glow-purple), 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 2;
        }
        .anime-card .poster-wrap {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        .anime-card .poster-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .anime-card:hover .poster-wrap img {
            transform: scale(1.08);
        }
        .anime-card .card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            z-index: 2;
        }
        .anime-card .card-rating {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(139, 92, 246, 0.85);
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .anime-card .card-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .anime-card .card-title {
            font-weight: 600;
            font-size: 0.85rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }
        .anime-card .card-meta {
            font-size: 0.72rem;
            color: var(--muted);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .anime-card .quick-watch {
            position: absolute;
            bottom: 60px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--purple);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all var(--transition-fast);
            z-index: 3;
            box-shadow: var(--glow-purple);
        }
        .anime-card:hover .quick-watch {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 600px) {
            .anime-card .quick-watch {
                opacity: 1;
                transform: translateY(0);
                bottom: 55px;
                right: 6px;
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
        }

        /* === SKELETON === */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, #1f1f2e 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-card {
            aspect-ratio: 3/4;
            border-radius: var(--radius);
        }

        /* === FOOTER === */
        .site-footer {
            text-align: center;
            padding: 30px 16px;
            color: var(--muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-light);
            margin-top: 40px;
        }
        .site-footer a {
            color: #c4b5fd;
            text-decoration: none;
        }
        .site-footer a:hover {
            text-decoration: underline;
        }

        /* === LOADING SCREEN === */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        .loader-ring {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-light);
            border-top-color: var(--purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-screen .loader-logo {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #c4b5fd, #f0abfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hidden { display: none !important; }
        a { color: inherit; }
    </style>
</head>
<body>
    <!-- Cursor Glow, Particles, Loading Screen, Header, Sidebar, Search Overlay (all unchanged) -->
    <!-- ... (same as previous full-width slider version) ... -->

    <!-- FULL-WIDTH HERO SLIDER -->
    <div class="hero-slider-wrapper">
        <section class="hero-slider" id="heroSlider">
            <div class="hero-dots" id="heroDots"></div>
        </section>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Continue Watching -->
        <section id="continueWatchingSection" class="hidden">
            <h2 class="section-title">Continue Watching</h2>
            <div class="carousel-row" id="continueWatchingRow"></div>
        </section>

        <!-- Latest Updates (12 cards) -->
        <section>
            <h2 class="section-title">🔥 Latest Updates</h2>
            <div class="anime-grid" id="latestUpdatesGrid"></div>
        </section>

        <!-- Trending Now (12 cards) -->
        <section>
            <h2 class="section-title">📈 Trending Now</h2>
            <div class="anime-grid" id="trendingGrid"></div>
        </section>

        <!-- Popular Anime (12 cards) -->
        <section>
            <h2 class="section-title">⭐ Popular Anime</h2>
            <div class="anime-grid" id="popularGrid"></div>
        </section>

        <!-- Popular Movies (12 cards) -->
        <section>
            <h2 class="section-title">🎬 Popular Movies</h2>
            <div class="anime-grid" id="popularMoviesGrid"></div>
        </section>

        <!-- Upcoming (now grid with 12 cards) -->
        <section>
            <h2 class="section-title">📅 Upcoming</h2>
            <div class="anime-grid" id="upcomingGrid"></div>
        </section>

        <!-- Completed Series (12 cards) -->
        <section>
            <h2 class="section-title">✅ Completed Series</h2>
            <div class="anime-grid" id="completedGrid"></div>
        </section>
    </main>

    <!-- Footer unchanged -->

    <script>
        // ==================== CORE APP ====================
        const JIKAN_BASE = 'https://api.jikan.moe/v4';
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        // === DOM Elements (same as before) ===
        const loadingScreen = $('#loadingScreen');
        const header = $('#header');
        const menuBtn = $('#menuBtn');
        const sidebar = $('#sidebar');
        const sidebarOverlay = $('#sidebarOverlay');
        const searchBtn = $('#searchBtn');
        const searchOverlay = $('#searchOverlay');
        const searchInput = $('#searchInput');
        const searchResults = $('#searchResults');
        const searchCloseBtn = $('#searchCloseBtn');
        const cursorGlow = $('#cursorGlow');
        const particlesContainer = $('#particles');
        const heroSlider = $('#heroSlider');
        const heroDots = $('#heroDots');

        // === STORAGE (unchanged) ===
        const storage = {
            get(key, fallback = null) {
                try { const v = localStorage.getItem('as_' + key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
            },
            set(key, value) { try { localStorage.setItem('as_' + key, JSON.stringify(value)); } catch {} },
            getWatchHistory() { return this.get('watchHistory', []); },
            addWatchHistory(item) {
                let history = this.getWatchHistory();
                history = history.filter(h => h.malId !== item.malId);
                history.unshift({ ...item, timestamp: Date.now() });
                if (history.length > 30) history = history.slice(0, 30);
                this.set('watchHistory', history);
            },
            getContinueWatching() { return this.get('continueWatching', []); },
            updateContinueWatching(item) {
                let cw = this.getContinueWatching();
                cw = cw.filter(c => c.malId !== item.malId);
                cw.unshift({ ...item, updatedAt: Date.now() });
                if (cw.length > 20) cw = cw.slice(0, 20);
                this.set('continueWatching', cw);
            },
        };

        // === PARTICLES & CURSOR (unchanged) ===
        function createParticles() { /* ... same ... */ }
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        // === HEADER SCROLL (unchanged) ===
        window.addEventListener('scroll', () => {
            header.classList.toggle('scrolled', window.scrollY > 30);
        });

        // === SIDEBAR & SEARCH (unchanged) ===

        // === DEBOUNCED SEARCH (unchanged) ===

        // === API HELPERS ===
        async function fetchJikan(endpoint) {
            try {
                const res = await fetch(`${JIKAN_BASE}${endpoint}`);
                if (!res.ok) throw new Error('API error');
                return await res.json();
            } catch (e) {
                console.error('Jikan API error:', e);
                return null;
            }
        }

        function createAnimeCard(anime) {
            const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
            const title = anime.title_english || anime.title || 'Unknown';
            const type = anime.type || '';
            const episodes = anime.episodes || '?';
            const score = anime.score || 'N/A';
            const status = anime.status || '';
            return `
            <a href="anime.html?id=${anime.mal_id}" class="anime-card" data-mal-id="${anime.mal_id}">
              <div class="poster-wrap">
                <img src="${img}" alt="${title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 140%22><rect fill=%22%231a1a24%22 width=%22100%22 height=%22140%22/><text x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2212%22>No Img</text></svg>'">
                <span class="card-badge">${type || 'TV'}</span>
                <span class="card-rating">⭐ ${score}</span>
              </div>
              <div class="card-info">
                <span class="card-title">${title}</span>
                <span class="card-meta">${episodes} eps • ${status}</span>
              </div>
              <button class="quick-watch" onclick="event.preventDefault();event.stopPropagation();window.location.href='watch.html?id=${anime.mal_id}&ep=1&type=sub'" title="Watch Now">▶</button>
            </a>
          `;
        }

        // === FALLBACK IDS (12 IDs for every section) ===
        const fallbackIdsDefault = [5114, 9253, 1535, 16498, 30276, 11061, 28851, 36456, 32281, 31240, 38000, 40456]; // 12 popular
        const fallbackMovies = [1, 5, 6, 7, 8, 16, 20, 21, 22, 23, 24, 25]; // movie IDs
        const fallbackCompleted = [5114, 1535, 11061, 820, 2251, 32, 34, 45, 68, 72, 79, 80]; // completed series
        const fallbackUpcoming = [123, 456, 789, 1011, 1213, 1415, 1617, 1819, 2021, 2223, 2425, 2627]; // placeholder upcoming IDs (valid ones would be better, but we'll use the default if API fails)

        // Unified function to load exactly 12 cards into a grid
        async function loadGridWith12(gridId, apiEndpoint, fallbackIds) {
            const grid = document.getElementById(gridId);
            if (!grid) return;

            // Show skeleton loading
            grid.innerHTML = Array(12).fill('<div class="skeleton skeleton-card"></div>').join('');

            // Try to fetch data
            let cards = [];
            const data = await fetchJikan(apiEndpoint);

            if (data && data.data && data.data.length > 0) {
                cards = data.data.slice(0, 12);
            }

            // If not enough cards, fill the rest with individual fallback IDs
            if (cards.length < 12) {
                const needed = 12 - cards.length;
                const fallbackSlice = fallbackIds.slice(0, needed);
                const fallbackPromises = fallbackSlice.map(id => fetchJikan(`/anime/${id}`));
                const fallbackResults = await Promise.all(fallbackPromises);
                const fallbackCards = fallbackResults
                    .filter(res => res && res.data)
                    .map(res => res.data);
                cards = cards.concat(fallbackCards).slice(0, 12);
            }

            // Render the cards
            grid.innerHTML = cards.map(createAnimeCard).join('');
        }

        // For the Continue Watching row (carousel) we keep the original logic
        function loadContinueWatching() {
            const cw = storage.getContinueWatching();
            const section = $('#continueWatchingSection');
            const row = $('#continueWatchingRow');
            if (!cw.length || !section || !row) {
                if (section) section.classList.add('hidden');
                return;
            }
            section.classList.remove('hidden');
            const promises = cw.slice(0, 10).map(item => fetchJikan(`/anime/${item.malId}`));
            Promise.all(promises).then(results => {
                row.innerHTML = results.filter(r => r && r.data).map((r, i) => {
                    const anime = r.data;
                    const cwItem = cw[i];
                    const img = anime.images?.jpg?.large_image_url || '';
                    return `
                    <a href="watch.html?id=${anime.mal_id}&ep=${cwItem.episode || 1}&type=${cwItem.type || 'sub'}" class="anime-card">
                      <div class="poster-wrap">
                        <img src="${img}" alt="${anime.title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 140%22><rect fill=%22%231a1a24%22 width=%22100%22 height=%22140%22/></svg>'">
                        <span class="card-badge">Ep ${cwItem.episode || 1}</span>
                      </div>
                      <div class="card-info">
                        <span class="card-title">${anime.title_english || anime.title}</span>
                        <span class="card-meta">Continue Ep ${cwItem.episode || 1}</span>
                      </div>
                    </a>
                  `;
                }).join('');
            }).catch(() => {
                if (section) section.classList.add('hidden');
            });
        }

        // === HERO SLIDER (unchanged) ===
        function buildHeroSlide(anime) { /* ... same ... */ }
        async function loadHeroSlider() { /* ... same ... */ }
        function initHeroSlider(totalSlides) { /* ... same ... */ }

        // === LOAD HOME PAGE ===
        async function loadHomePage() {
            loadHeroSlider();

            // All sections now load exactly 12 cards
            await Promise.all([
                loadGridWith12('latestUpdatesGrid', '/seasons/now?limit=12', fallbackIdsDefault),
                loadGridWith12('trendingGrid', '/top/anime?filter=airing&limit=12', fallbackIdsDefault),
                loadGridWith12('popularGrid', '/top/anime?filter=bypopularity&limit=12', fallbackIdsDefault),
                loadGridWith12('popularMoviesGrid', '/top/anime?type=movie&filter=bypopularity&limit=12', fallbackMovies),
                loadGridWith12('upcomingGrid', '/seasons/upcoming?limit=12', fallbackUpcoming),  // now a grid
                loadGridWith12('completedGrid', '/top/anime?filter=favorite&limit=12&status=complete&type=tv', fallbackCompleted),
            ]);

            loadContinueWatching();
        }

        // === INIT ===
        function init() {
            createParticles();
            const path = window.location.pathname;
            const pageName = path.split('/').pop() || 'index.html';

            if (pageName === 'index.html' || pageName === '' || pageName === '/') {
                loadHomePage();
            }

            setTimeout(() => loadingScreen.classList.add('hidden'), 600);

            const navLinks = $$('.sidebar-nav a');
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === pageName || (pageName === '' && href === 'index.html') || (pageName === '/' && href === 'index.html')) {
                    link.classList.add('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
