<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AnimeX - Premium Anime Streaming Platform. Watch the latest anime online in HD.">
<meta property="og:title" content="AnimeX - Stream Anime Online Free">
<meta property="og:description" content="Watch trending, top rated, and upcoming anime for free in HD quality.">
<meta property="og:type" content="website">
<title>AnimeX — Premium Anime Streaming</title>
<style>
/* ========================================
   RESET & ROOT VARIABLES
======================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  overflow-x: hidden;
  max-width: 100%;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #07070f;
  color: #e8e8f0;
  scroll-behavior: smooth;
}

:root {
  --primary: #8b5cf6;
  --primary-dark: #6d28d9;
  --primary-glow: rgba(139, 92, 246, 0.4);
  --accent: #06b6d4;
  --accent-glow: rgba(6, 182, 212, 0.3);
  --bg: #07070f;
  --bg2: #0d0d1a;
  --bg3: #12121f;
  --card-bg: rgba(255,255,255,0.04);
  --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08);
  --text: #e8e8f0;
  --text-muted: #8888a8;
  --radius: 12px;
  --header-h: 64px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ========================================
   SCROLLBAR
======================================== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

/* ========================================
   HEADER
======================================== */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  z-index: 1000;
  display: flex;
  align-items: center;
  padding: 0 clamp(12px, 3vw, 32px);
  gap: 16px;
  background: linear-gradient(180deg, rgba(7,7,15,0.98) 0%, rgba(7,7,15,0.85) 100%);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}

.header-logo {
  flex: 1;
  display: flex;
  justify-content: center;
}
.logo-text {
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #fff 0%, var(--primary) 50%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
  user-select: none;
}

.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 80px;
}
.header-right { justify-content: flex-end; }

.icon-btn {
  width: 40px; height: 40px;
  border: none;
  background: var(--glass);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  transition: all var(--transition);
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

/* NAV LINKS — desktop */
.nav-links {
  display: flex;
  gap: 4px;
  list-style: none;
}
.nav-links a {
  padding: 6px 12px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  transition: all var(--transition);
  white-space: nowrap;
}
.nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--glass); }

/* ========================================
   SIDEBAR (mobile)
======================================== */
#sidebar-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1100;
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition);
  backdrop-filter: blur(4px);
}
#sidebar-overlay.open { opacity: 1; pointer-events: all; }

#sidebar {
  position: fixed;
  top: 0; left: 0;
  width: min(280px, 80vw);
  height: 100%;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  z-index: 1200;
  transform: translateX(-100%);
  transition: transform var(--transition);
  display: flex;
  flex-direction: column;
  padding: 24px 0;
}
#sidebar.open { transform: translateX(0); }

.sidebar-header {
  padding: 0 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar-nav {
  padding: 16px 0;
  flex: 1;
  overflow-y: auto;
}
.sidebar-nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  transition: all var(--transition);
}
.sidebar-nav a:hover { color: var(--text); background: var(--glass); }
.sidebar-nav a svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

/* ========================================
   SEARCH OVERLAY
======================================== */
#search-overlay {
  position: fixed; inset: 0;
  background: rgba(7,7,15,0.95);
  z-index: 2000;
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(16px, 5vw, 80px) clamp(16px, 5vw, 40px);
  overflow-y: auto;
}
#search-overlay.open { opacity: 1; pointer-events: all; }

.search-box {
  width: 100%;
  max-width: 700px;
  position: relative;
  margin-top: 20px;
}
.search-box input {
  width: 100%;
  padding: 16px 56px 16px 20px;
  font-size: clamp(16px, 3vw, 20px);
  background: var(--bg3);
  border: 2px solid var(--primary);
  border-radius: 50px;
  color: var(--text);
  outline: none;
  box-shadow: 0 0 30px var(--primary-glow);
}
.search-box input::placeholder { color: var(--text-muted); }
.search-close {
  position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--text-muted); cursor: pointer;
  font-size: 20px;
  transition: color var(--transition);
}
.search-close:hover { color: var(--text); }

#search-results {
  width: 100%;
  max-width: 700px;
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.search-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  text-decoration: none;
  color: var(--text);
}
.search-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px var(--primary-glow); }
.search-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
.search-card-info { padding: 8px; font-size: 12px; font-weight: 600; line-height: 1.3; }

/* ========================================
   HERO SLIDER
======================================== */
#hero {
  position: relative;
  width: 100%;
  height: clamp(480px, 80vh, 800px);
  overflow: hidden;
  margin-top: var(--header-h);
}

.hero-track {
  display: flex;
  height: 100%;
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}

.hero-slide {
  min-width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0;
  background: var(--bg) no-repeat center center / cover;
  transform: scale(1.05);
  transition: transform 8s ease;
}
.hero-slide.active .hero-bg { transform: scale(1); }

.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    90deg,
    rgba(7,7,15,0.92) 0%,
    rgba(7,7,15,0.6) 40%,
    rgba(7,7,15,0.1) 70%,
    transparent 100%
  ),
  linear-gradient(0deg, rgba(7,7,15,0.95) 0%, transparent 40%);
}

.hero-content {
  position: absolute;
  bottom: clamp(40px, 8vh, 100px);
  left: clamp(20px, 5vw, 80px);
  max-width: min(580px, 90vw);
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
}
.hero-slide.active .hero-content { opacity: 1; transform: translateY(0); }

.hero-genres {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.genre-tag {
  padding: 3px 10px;
  background: var(--primary-glow);
  border: 1px solid var(--primary);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.hero-title {
  font-size: clamp(22px, 4.5vw, 52px);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 10px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.8);
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.hero-score {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #fbbf24;
  font-weight: 700;
  font-size: 14px;
}
.hero-type {
  padding: 2px 10px;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-muted);
}

.hero-synopsis {
  font-size: clamp(12px, 1.5vw, 14px);
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 20px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary:hover { background: var(--primary-dark); box-shadow: 0 8px 30px var(--primary-glow); transform: translateY(-2px); }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  background: var(--glass);
  color: white;
  border: 1px solid var(--border);
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: all var(--transition);
  white-space: nowrap;
  backdrop-filter: blur(10px);
}
.btn-secondary:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }

/* Hero arrows */
.hero-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px; height: 44px;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: white;
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all var(--transition);
  flex-shrink: 0;
}
.hero-arrow:hover { background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
.hero-arrow.prev { left: clamp(8px, 2vw, 20px); }
.hero-arrow.next { right: clamp(8px, 2vw, 20px); }

/* Hero dots */
.hero-dots {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 10;
}
.hero-dot {
  width: 6px; height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.3);
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}
.hero-dot.active { width: 24px; background: var(--primary); }

/* Hero skeleton */
.hero-skeleton {
  width: 100%;
  height: 100%;
  background: linear-gradient(110deg, var(--bg2) 0%, var(--bg3) 50%, var(--bg2) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

/* ========================================
   MAIN CONTENT
======================================== */
#main {
  padding: 0 clamp(12px, 3vw, 40px);
  max-width: 1800px;
  margin: 0 auto;
}

/* ========================================
   WIDGETS
======================================== */
.widget {
  margin: 40px 0;
}

.widget-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
}

.widget-title {
  font-size: clamp(16px, 2.5vw, 22px);
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
}
.widget-title::before {
  content: '';
  display: block;
  width: 4px; height: 22px;
  background: var(--primary);
  border-radius: 2px;
  box-shadow: 0 0 10px var(--primary-glow);
  flex-shrink: 0;
}

.widget-see-all {
  color: var(--primary);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: color var(--transition);
}
.widget-see-all:hover { color: var(--accent); }

/* Slider wrapper */
.slider-wrapper {
  position: relative;
}

.slider-container {
  overflow: hidden;
}

.slider-track {
  display: flex;
  gap: 14px;
  cursor: grab;
  user-select: none;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
  padding-bottom: 4px;
}
.slider-track:active { cursor: grabbing; }

/* Slider arrows */
.slider-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px; height: 40px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  flex-shrink: 0;
}
.slider-arrow:hover { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
.slider-arrow.prev { left: -16px; }
.slider-arrow.next { right: -16px; }
.slider-arrow.hidden { opacity: 0; pointer-events: none; }

/* ========================================
   ANIME CARD
======================================== */
.anime-card {
  flex-shrink: 0;
  width: clamp(130px, 13vw, 175px);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--card-bg);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  text-decoration: none;
  color: var(--text);
  display: block;
  position: relative;
}
.anime-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 12px 40px rgba(139, 92, 246, 0.3);
  border-color: var(--primary);
}

.card-img-wrapper {
  position: relative;
  aspect-ratio: 2/3;
  overflow: hidden;
}
.card-img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform var(--transition);
}
.anime-card:hover .card-img-wrapper img { transform: scale(1.08); }

.card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(7,7,15,0.9) 0%, transparent 50%);
  opacity: 0;
  transition: opacity var(--transition);
}
.anime-card:hover .card-overlay { opacity: 1; }

.card-badges {
  position: absolute;
  top: 8px; left: 8px;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.badge {
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.badge-hd { background: #16a34a; color: white; }
.badge-score { background: rgba(251,191,36,0.9); color: #000; }
.badge-ep { background: rgba(139,92,246,0.9); color: white; }
.badge-type { background: rgba(0,0,0,0.7); color: var(--text-muted); border: 1px solid var(--border); }

.card-info {
  padding: 10px 10px 12px;
}
.card-title {
  font-size: clamp(11px, 1.2vw, 13px);
  font-weight: 700;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 4px;
}
.card-meta {
  font-size: 10px;
  color: var(--text-muted);
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

/* Card skeleton */
.card-skeleton {
  flex-shrink: 0;
  width: clamp(130px, 13vw, 175px);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg2);
  border: 1px solid var(--border);
}
.sk-img { aspect-ratio: 2/3; background: var(--bg3); }
.sk-info { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.sk-line { height: 10px; background: var(--bg3); border-radius: 4px; }
.sk-line.w60 { width: 60%; }
.sk-line.w80 { width: 80%; }
.sk-pulse { animation: shimmer 1.5s infinite; }

/* Widget error */
.widget-error {
  padding: 30px;
  text-align: center;
  color: var(--text-muted);
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
}
.widget-error .retry-btn {
  margin-top: 12px;
  padding: 8px 20px;
  background: var(--primary);
  border: none;
  border-radius: 20px;
  color: white;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition);
}
.widget-error .retry-btn:hover { background: var(--primary-dark); }

/* ========================================
   ANIMATIONS
======================================== */
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.sk-pulse {
  background: linear-gradient(110deg, var(--bg2) 0%, var(--bg3) 50%, var(--bg2) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
.sk-img.sk-pulse, .sk-line.sk-pulse { background: linear-gradient(110deg, var(--bg3) 0%, #1a1a2e 50%, var(--bg3) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }

/* ========================================
   FOOTER
======================================== */
#footer {
  margin-top: 60px;
  padding: 24px clamp(12px, 3vw, 40px);
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  background: var(--bg2);
}
.footer-logo {
  font-size: 20px;
  font-weight: 900;
  background: linear-gradient(135deg, #fff, var(--primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
  display: block;
}
.footer-icons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 12px 0;
}
.footer-icon {
  width: 36px; height: 36px;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  text-decoration: none;
  transition: all var(--transition);
  font-size: 14px;
}
.footer-icon:hover { background: var(--primary); color: white; }

/* ========================================
   RESPONSIVE
======================================== */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .slider-arrow.prev { left: -8px; }
  .slider-arrow.next { right: -8px; }
  .hero-arrow { width: 36px; height: 36px; font-size: 14px; }
}
@media (max-width: 480px) {
  .hero-actions .btn-secondary { display: none; }
  .slider-arrow { display: none; }
}
</style>
</head>
<body>

     SIDEBAR
======================================== -->
<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div class="sidebar-header">
    <span class="logo-text">AnimeX</span>
    <button class="icon-btn" onclick="closeSidebar()">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>

  <nav class="sidebar-nav">

    </a>

    </a>
  </nav>
</aside>

<!-- ========================================
     HEADER
======================================== -->
<header id="header">

<script>
/* ========================================
   CONFIG & CONSTANTS
======================================== */
const API = 'https://api.jikan.moe/v4';
const CACHE_TTL = 5 * 60 * 1000; // 5 min
const RETRY_DELAYS = [1000, 2000, 4000];
const MAX_RETRIES = 3;

/* ========================================
   CACHE SYSTEM
======================================== */
const cache = {
  get(key) {
    try {
      const raw = localStorage.getItem('ax_' + key);
      if (!raw) return null;
      const {data, ts} = JSON.parse(raw);
      if (Date.now() - ts > CACHE_TTL) { localStorage.removeItem('ax_' + key); return null; }
      return data;
    } catch { return null; }
  },
  set(key, data) {
    try { localStorage.setItem('ax_' + key, JSON.stringify({data, ts: Date.now()})); } catch {}
  }
};

/* ========================================
   FETCH WITH RETRY & TIMEOUT
======================================== */
async function fetchWithRetry(url, retries = MAX_RETRIES) {
  const cached = cache.get(url);
  if (cached) return cached;

  for (let i = 0; i <= retries; i++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(url, {signal: ctrl.signal});
      clearTimeout(timer);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json && json.data) { cache.set(url, json); return json; }
      throw new Error('Empty data');
    } catch (e) {
      if (i < retries) {
        await new Promise(r => setTimeout(r, RETRY_DELAYS[i] || 4000));
      } else {
        throw e;
      }
    }
  }
}

/* ========================================
   SIDEBAR
======================================== */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ========================================
   SEARCH
======================================== */
let searchTimer = null;
function openSearch() {
  document.getElementById('search-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('search-input').focus(), 100);
}
function closeSearch() {
  document.getElementById('search-overlay').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); closeSidebar(); }
});

document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 400);
});

async function doSearch(q) {
  const el = document.getElementById('search-results');
  el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px;width:100%;">Searching...</p>';
  try {
    const res = await fetchWithRetry(`${API}/anime?q=${encodeURIComponent(q)}&limit=12&sfw=true`);
    const items = res.data || [];
    if (!items.length) { el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px;width:100%;">No results found.</p>'; return; }
    el.innerHTML = items.map(a => `
      <a href="anime.html?id=${a.mal_id}" class="search-card" onclick="closeSearch()">
        <img src="${safeImg(a)}" alt="${escHtml(a.title)}" loading="lazy">
        <div class="search-card-info">${escHtml(a.title)}</div>
      </a>
    `).join('');
  } catch {
    el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px;width:100%;">Search failed. Try again.</p>';
  }
}

/* ========================================
   UTILS
======================================== */
function safeImg(a) {
  return a?.images?.jpg?.large_image_url || a?.images?.jpg?.image_url || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2 3"><rect fill="%230d0d1a" width="2" height="3"/></svg>';
}
function safeBanner(a) {
  return a?.trailer?.images?.maximum_image_url || safeImg(a);
}
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function truncate(s, n) {
  s = String(s || '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

/* ========================================
   HERO SLIDER
======================================== */
let heroAnimes = [];
let heroIndex = 0;
let heroAutoTimer = null;
let heroDragging = false;
let heroDragStartX = 0;
let heroDragDelta = 0;

async function initHero() {
  try {
    const res = await fetchWithRetry(`${API}/top/anime?filter=airing&limit=15&sfw=true`);
    heroAnimes = (res.data || []).filter(a => a && a.mal_id).slice(0, 12);
    if (!heroAnimes.length) throw new Error('no data');
    buildHero();
  } catch {
    document.getElementById('hero-skeleton').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:16px;">Could not load featured anime.</div>';
  }
}

function buildHero() {
  const track = document.getElementById('hero-track');
  const dots = document.getElementById('hero-dots');
  track.innerHTML = heroAnimes.map((a, i) => `
    <div class="hero-slide${i===0?' active':''}" data-index="${i}">
      <div class="hero-bg" style="background-image:url('${safeBanner(a)}')"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-genres">${(a.genres||[]).slice(0,3).map(g=>`<span class="genre-tag">${escHtml(g.name)}</span>`).join('')}</div>
        <h1 class="hero-title">${escHtml(truncate(a.title, 50))}</h1>
        <div class="hero-meta">
          <span class="hero-score">★ ${a.score || 'N/A'}</span>
          <span class="hero-type">${escHtml(a.type || 'TV')}</span>
          ${a.episodes ? `<span class="hero-type">${a.episodes} eps</span>` : ''}
        </div>
        <p class="hero-synopsis">${escHtml(truncate(a.synopsis, 200))}</p>
        <div class="hero-actions">
          <a href="watch.html?id=${a.mal_id}&ep=1" class="btn-primary">▶ Watch Now</a>
          <a href="anime.html?id=${a.mal_id}" class="btn-secondary">ⓘ Details</a>
        </div>
      </div>
    </div>
  `).join('');
  dots.innerHTML = heroAnimes.map((_,i) => `<div class="hero-dot${i===0?' active':''}" onclick="goHeroSlide(${i})"></div>`).join('');

  // Show elements
  document.getElementById('hero-skeleton').style.display = 'none';
  track.style.display = 'flex';
  document.getElementById('hero-prev').style.display = 'flex';
  document.getElementById('hero-next').style.display = 'flex';
  dots.style.display = 'flex';

  startHeroAuto();
  setupHeroDrag();
}

function goHeroSlide(idx) {
  const slides = document.querySelectorAll('.hero-slide');
  const dotEls = document.querySelectorAll('.hero-dot');
  if (!slides.length) return;
  slides[heroIndex]?.classList.remove('active');
  dotEls[heroIndex]?.classList.remove('active');
  heroIndex = ((idx % heroAnimes.length) + heroAnimes.length) % heroAnimes.length;
  slides[heroIndex]?.classList.add('active');
  dotEls[heroIndex]?.classList.add('active');
  const track = document.getElementById('hero-track');
  track.style.transform = `translateX(-${heroIndex * 100}%)`;
}

function heroSlide(dir) {
  goHeroSlide(heroIndex + dir);
  resetHeroAuto();
}

function startHeroAuto() {
  clearInterval(heroAutoTimer);
  heroAutoTimer = setInterval(() => goHeroSlide(heroIndex + 1), 5000);
}
function resetHeroAuto() {
  clearInterval(heroAutoTimer);
  heroAutoTimer = setInterval(() => goHeroSlide(heroIndex + 1), 5000);
}

function setupHeroDrag() {
  const track = document.getElementById('hero-track');
  if (!track) return;
  track.addEventListener('mousedown', e => { heroDragging = true; heroDragStartX = e.clientX; clearInterval(heroAutoTimer); });
  track.addEventListener('mousemove', e => { if (!heroDragging) return; heroDragDelta = e.clientX - heroDragStartX; });
  track.addEventListener('mouseup', () => { if (!heroDragging) return; heroDragging = false; if (heroDragDelta < -50) heroSlide(1); else if (heroDragDelta > 50) heroSlide(-1); heroDragDelta = 0; });
  track.addEventListener('mouseleave', () => { if (heroDragging) { heroDragging = false; heroDragDelta = 0; startHeroAuto(); } });
  track.addEventListener('touchstart', e => { heroDragStartX = e.touches[0].clientX; clearInterval(heroAutoTimer); }, {passive:true});
  track.addEventListener('touchend', e => { const diff = e.changedTouches[0].clientX - heroDragStartX; if (diff < -50) heroSlide(1); else if (diff > 50) heroSlide(-1); else startHeroAuto(); }, {passive:true});
}

/* ========================================
   WIDGET SYSTEM
======================================== */
function renderSkeletons(containerId, count = 10) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = `
    <div class="widget-header"><h2 class="widget-title">Loading...</h2></div>
    <div class="slider-wrapper">
      <div class="slider-container">
        <div class="slider-track">
          ${Array(count).fill(0).map(() => `
            <div class="card-skeleton">
              <div class="sk-img sk-pulse"></div>
              <div class="sk-info">
                <div class="sk-line w80 sk-pulse"></div>
                <div class="sk-line w60 sk-pulse"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
}

function renderWidget(containerId, title, items, seeAllUrl) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!items || !items.length) {
    el.innerHTML = `
      <div class="widget-header"><h2 class="widget-title">${title}</h2></div>
      <div class="widget-error">No data available. <button class="retry-btn" onclick="location.reload()">Retry</button></div>`;
    return;
  }
  const cards = items.slice(0, 20).map(a => buildCard(a)).join('');
  el.innerHTML = `
    <div class="widget-header">
      <h2 class="widget-title">${title}</h2>
      ${seeAllUrl ? `<a href="${seeAllUrl}" class="widget-see-all">See All →</a>` : ''}
    </div>
    <div class="slider-wrapper" id="${containerId}-wrapper">
      <button class="slider-arrow prev" onclick="slideWidget('${containerId}', -1)">&#8249;</button>
      <div class="slider-container" id="${containerId}-container">
        <div class="slider-track" id="${containerId}-track">${cards}</div>
      </div>
      <button class="slider-arrow next" onclick="slideWidget('${containerId}', 1)">&#8250;</button>
    </div>`;
  initSlider(containerId);
}

function buildCard(a) {
  if (!a || !a.mal_id) return '';
  const score = a.score ? `<span class="badge badge-score">★${a.score}</span>` : '';
  const ep = a.episodes ? `<span class="badge badge-ep">${a.episodes}ep</span>` : '';
  const type = a.type ? `<span class="badge badge-type">${escHtml(a.type)}</span>` : '';
  return `
    <a href="anime.html?id=${a.mal_id}" class="anime-card">
      <div class="card-img-wrapper">
        <img src="${safeImg(a)}" alt="${escHtml(a.title)}" loading="lazy">
        <div class="card-overlay"></div>
        <div class="card-badges"><span class="badge badge-hd">HD</span>${score}${ep}</div>
      </div>
      <div class="card-info">
        <div class="card-title">${escHtml(truncate(a.title, 40))}</div>
        <div class="card-meta">${type}<span>${a.year || ''}</span></div>
      </div>
    </a>`;
}

function renderWidgetError(containerId, title, fetchFn) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = `
    <div class="widget-header"><h2 class="widget-title">${title}</h2></div>
    <div class="widget-error">Could not load ${title}. <button class="retry-btn" onclick="retryWidget('${containerId}','${title}')">Retry</button></div>`;
}

/* ========================================
   SLIDER LOGIC
======================================== */
const sliderStates = {};

function initSlider(id) {
  const track = document.getElementById(`${id}-track`);
  const container = document.getElementById(`${id}-container`);
  if (!track || !container) return;

  const state = sliderStates[id] = {offset: 0, isDragging: false, startX: 0, scrollLeft: 0};

  // Drag scroll
  track.addEventListener('mousedown', e => {
    state.isDragging = true;
    state.startX = e.pageX - container.offsetLeft;
    state.scrollLeft = state.offset;
    track.style.transition = 'none';
  }, {passive: true});

  document.addEventListener('mouseup', () => {
    if (!state.isDragging) return;
    state.isDragging = false;
    track.style.transition = '';
  });

  document.addEventListener('mousemove', e => {
    if (!state.isDragging) return;
    const x = e.pageX - container.offsetLeft;
    const walk = (x - state.startX) * 1.5;
    const max = getMaxOffset(id);
    state.offset = Math.max(0, Math.min(max, state.scrollLeft - walk));
    track.style.transform = `translateX(-${state.offset}px)`;
  });

  // Touch
  track.addEventListener('touchstart', e => {
    state.startX = e.touches[0].pageX;
    state.scrollLeft = state.offset;
    track.style.transition = 'none';
  }, {passive: true});
  track.addEventListener('touchmove', e => {
    const x = e.touches[0].pageX;
    const walk = (state.startX - x) * 1.5;
    const max = getMaxOffset(id);
    state.offset = Math.max(0, Math.min(max, state.scrollLeft + walk));
    track.style.transform = `translateX(-${state.offset}px)`;
  }, {passive: true});
  track.addEventListener('touchend', () => { track.style.transition = ''; }, {passive: true});

  // Wheel
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const max = getMaxOffset(id);
    state.offset = Math.max(0, Math.min(max, state.offset + e.deltaY * 2));
    track.style.transform = `translateX(-${state.offset}px)`;
  }, {passive: false});
}

function getMaxOffset(id) {
  const track = document.getElementById(`${id}-track`);
  const container = document.getElementById(`${id}-container`);
  if (!track || !container) return 0;
  return Math.max(0, track.scrollWidth - container.clientWidth);
}

function slideWidget(id, dir) {
  const state = sliderStates[id];
  if (!state) return;
  const container = document.getElementById(`${id}-container`);
  if (!container) return;
  const step = container.clientWidth * 0.75;
  const max = getMaxOffset(id);
  state.offset = Math.max(0, Math.min(max, state.offset + dir * step));
  const track = document.getElementById(`${id}-track`);
  if (track) track.style.transform = `translateX(-${state.offset}px)`;
}

/* ========================================
   LOAD ALL WIDGETS
======================================== */
const WIDGETS = [
  { id: 'widget-recently-updated', title: '🕐 Recently Updated', url: `${API}/anime?status=airing&order_by=end_date&sort=desc&limit=20&sfw=true`, seeAll: 'search.html' },
  { id: 'widget-trending', title: '🔥 Trending Now', url: `${API}/top/anime?filter=bypopularity&limit=20&sfw=true`, seeAll: 'search.html?sort=bypopularity' },
  { id: 'widget-top-rated', title: '⭐ Top Rated', url: `${API}/top/anime?filter=favorite&limit=20&sfw=true`, seeAll: 'search.html?sort=favorite' },
  { id: 'widget-airing', title: '📡 Top Airing', url: `${API}/top/anime?filter=airing&limit=20&sfw=true`, seeAll: 'search.html?status=airing' },
  { id: 'widget-upcoming', title: '📅 Upcoming', url: `${API}/top/anime?filter=upcoming&limit=20&sfw=true`, seeAll: 'search.html?status=upcoming' },
  { id: 'widget-completed', title: '✅ Completed', url: `${API}/anime?status=complete&order_by=score&sort=desc&limit=20&sfw=true`, seeAll: 'search.html?status=complete' },
];

async function loadWidget(widget) {
  renderSkeletons(widget.id);
  try {
    const res = await fetchWithRetry(widget.url);
    renderWidget(widget.id, widget.title, res.data || [], widget.seeAll);
  } catch {
    renderWidgetError(widget.id, widget.title);
  }
}

async function loadAll() {
  // Load hero and widgets concurrently, handle each independently
  const heroPromise = initHero();
  // Stagger widget loads to avoid rate limiting
  for (let i = 0; i < WIDGETS.length; i++) {
    setTimeout(() => loadWidget(WIDGETS[i]), i * 350);
  }
  await heroPromise;
}

function retryWidget(id, title) {
  const w = WIDGETS.find(w => w.id === id);
  if (w) loadWidget(w);
}

// Reinitialize sliders on resize
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    Object.keys(sliderStates).forEach(id => {
      const state = sliderStates[id];
      if (!state) return;
      const max = getMaxOffset(id);
      if (state.offset > max) {
        state.offset = max;
        const track = document.getElementById(`${id}-track`);
        if (track) track.style.transform = `translateX(-${state.offset}px)`;
      }
    });
  }, 200);
}, {passive: true});

// Start
loadAll();
</script>
