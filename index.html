<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KageStream - Watch Anime Online</title>
<meta name="description" content="Premium Anime Streaming Platform">
<meta property="og:title" content="KageStream">
<meta property="og:type" content="website">
<style>
:root{
--bg:#07070a;
--card:#12121a;
--accent:#8b5cf6;
--accent2:#a855f7;
--text:#f5f5f5;
--muted:#9ca3af;
--glass:rgba(255,255,255,.06);
--border:rgba(255,255,255,.1);
--radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;scroll-behavior:smooth}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at top right,rgba(139,92,246,.15),transparent 40%);pointer-events:none;z-index:-1}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{border:none;cursor:pointer}
.container{width:min(1500px,94%);margin:auto}
header{position:sticky;top:0;z-index:1000;background:rgba(0,0,0,.55);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 0}
.logo{font-size:clamp(1.5rem,3vw,2.5rem);font-weight:800;background:linear-gradient(90deg,var(--accent),#fff);-webkit-background-clip:text;color:transparent}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--glass);display:grid;place-items:center;color:#fff}
.hero{position:relative;height:85vh;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.slide.active{opacity:1;z-index:2}
.slide img{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.9),rgba(0,0,0,.3),rgba(0,0,0,.8))}
.hero-content{position:absolute;left:5%;bottom:12%;max-width:650px;display:grid;gap:1rem;animation:fadeUp .6s ease}
.badges{display:flex;gap:.7rem;flex-wrap:wrap}
.badge{padding:.5rem .9rem;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);font-size:.8rem}
.hero h1{font-size:clamp(2rem,5vw,5rem)}
.hero p{color:#ddd;line-height:1.6}
.hero-actions{display:flex;gap:1rem;flex-wrap:wrap}
.btn{padding:1rem 1.3rem;border-radius:14px;font-weight:700;transition:.3s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-secondary{background:rgba(255,255,255,.12);color:#fff}
.btn:hover{transform:translateY(-3px)}
.hero-nav{position:absolute;bottom:30px;right:40px;display:flex;gap:1rem;z-index:20}
.hero-nav button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:1.2rem}
.section{padding:2.5rem 0}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.section h2{font-size:clamp(1.4rem,3vw,2rem)}
.slider-wrap{position:relative}
.slider{display:flex;gap:1rem;overflow:auto;padding:.4rem;scroll-behavior:smooth;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.card{min-width:180px;max-width:180px;background:var(--card);border-radius:20px;overflow:hidden;position:relative;border:1px solid var(--border);scroll-snap-align:start;transition:.3s}
.card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 0 30px rgba(139,92,246,.25)}
.poster{aspect-ratio:2/3;position:relative;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.card-content{padding:.9rem}
.card-title{font-size:.95rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;color:var(--muted);margin-top:.5rem;font-size:.75rem}
.top-badges{position:absolute;top:10px;left:10px;display:flex;gap:.4rem;flex-wrap:wrap;z-index:2}
.top-badges span{font-size:.7rem;padding:.35rem .5rem;border-radius:999px;background:rgba(0,0,0,.7)}
.skeleton{animation:pulse 1.2s infinite;background:linear-gradient(90deg,#111,#222,#111);background-size:200% 100%}
.skeleton-card{min-width:180px;height:320px;border-radius:20px}
footer{padding:2rem 0;border-top:1px solid var(--border);margin-top:4rem;text-align:center;color:var(--muted)}
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:2000}
.search-overlay.active{display:flex}
.search-box{width:min(800px,92%)}
.search-input{width:100%;padding:1.2rem;border-radius:18px;background:#111;border:1px solid var(--border);color:#fff;font-size:1.1rem}
.search-results{margin-top:1rem;display:grid;gap:1rem;max-height:70vh;overflow:auto}
.result-item{display:flex;gap:1rem;background:#111;padding:1rem;border-radius:18px}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:768px){
.hero{height:75vh}
.card{min-width:150px;max-width:150px}
.hero-content{bottom:8%}
.hero-nav{right:20px}
}
</style>
</head>
<body>
<header>
<div class="container nav">
<button class="icon-btn">☰</button>
<div class="logo">KageStream</div>
<button class="icon-btn" id="searchToggle">⌕</button>
</div>
</header>

<section class="hero" id="hero"></section>

<main class="container" id="content"></main>

<footer>
<p>© 2026 KageStream • Anime data powered by Jikan API</p>
</footer>

<div class="search-overlay" id="searchOverlay">
<div class="search-box">
<input class="search-input" id="searchInput" placeholder="Search anime instantly...">
<div class="search-results" id="searchResults"></div>
</div>
</div>

<script>
const API='https://api.jikan.moe/v4';
const cacheTTL=1000*60*30;
const sliders=new Map();
const state={hero:[],destroyers:[]};

const sections=[
['Trending Now','top/anime?filter=bypopularity'],
['Top Rated','top/anime'],
['Top Airing','top/anime?filter=airing'],
['Upcoming','seasons/upcoming'],
['Completed','top/anime?status=complete'],
['Recently Updated','watch/episodes']
];

function debounce(fn,delay=400){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),delay)}}

async function fetchWithRetry(url,retries=3,timeout=12000){
for(let i=0;i<retries;i++){
try{
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),timeout);
const res=await fetch(url,{signal:controller.signal});
clearTimeout(timer);
if(!res.ok) throw new Error('Network');
const data=await res.json();
return data;
}catch(err){
if(i===retries-1) return null;
await new Promise(r=>setTimeout(r,1000*(i+1)));
}
}
}

async function cachedFetch(key,url){
try{
const cached=JSON.parse(localStorage.getItem(key)||'null');
if(cached&&Date.now()-cached.time<cacheTTL) return cached.data;
const data=await fetchWithRetry(url);
if(data) localStorage.setItem(key,JSON.stringify({time:Date.now(),data}));
return data;
}catch{return null}
}

function skeletonCards(count=8){
return Array.from({length:count},()=>'<div class="skeleton skeleton-card"></div>').join('')
}

function safe(v,f='Unknown'){return v??f}

function createCard(anime){
const img=anime.images?.webp?.large_image_url||anime.images?.jpg?.image_url||'';
return `
<a class="card" href="anime.html?id=${anime.mal_id}">
<div class="poster">
<div class="top-badges">
<span>⭐ ${safe(anime.score,'N/A')}</span>
<span>HD</span>
</div>
<img loading="lazy" src="${img}" alt="${anime.title}">
</div>
<div class="card-content">
<div class="card-title">${anime.title}</div>
<div class="meta">
<span>${safe(anime.type)}</span>
<span>${safe(anime.episodes,'?')} EP</span>
</div>
</div>
</a>`
}

function initSlider(wrapper){
if(!wrapper||sliders.has(wrapper)) return;
const slider=wrapper.querySelector('.slider');
let isDown=false,startX,scrollLeft;
const move=e=>{
if(!isDown) return;
slider.scrollLeft=scrollLeft-(e.pageX-startX);
}
slider.addEventListener('mousedown',e=>{isDown=true;startX=e.pageX;scrollLeft=slider.scrollLeft});
window.addEventListener('mouseup',()=>isDown=false);
slider.addEventListener('mousemove',move);
slider.addEventListener('wheel',e=>{e.preventDefault();slider.scrollLeft+=e.deltaY},{passive:false});
sliders.set(wrapper,true);
}

async function buildHero(){
const data=await cachedFetch('hero',`${API}/top/anime?filter=bypopularity&limit=10`);
const hero=document.getElementById('hero');
const items=data?.data||[];
if(!items.length){hero.innerHTML='<h2 style="padding:2rem">Could not load hero</h2>';return}
hero.innerHTML=items.map((anime,i)=>`
<div class="slide ${i===0?'active':''}">
<img src="${anime.images.jpg.large_image_url}" alt="${anime.title}">
<div class="overlay"></div>
<div class="hero-content">
<div class="badges">
<span class="badge">⭐ ${safe(anime.score)}</span>
<span class="badge">${safe(anime.status)}</span>
</div>
<h1>${anime.title}</h1>
<p>${safe(anime.synopsis,'No synopsis available').slice(0,220)}...</p>
<div class="hero-actions">
<a class="btn btn-primary" href="watch.html?id=${anime.mal_id}&ep=1">Watch Now</a>
<a class="btn btn-secondary" href="anime.html?id=${anime.mal_id}">Details</a>
</div>
</div>
</div>`).join('')+`<div class="hero-nav"><button id="prev">‹</button><button id="next">›</button></div>`;
let current=0;
const slides=[...document.querySelectorAll('.slide')];
const show=i=>slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));
const next=()=>{current=(current+1)%slides.length;show(current)};
const prev=()=>{current=(current-1+slides.length)%slides.length;show(current)};
setInterval(next,6000);
hero.querySelector('#next').onclick=next;
hero.querySelector('#prev').onclick=prev;
}

async function buildSections(){
const content=document.getElementById('content');
content.innerHTML=sections.map(([title])=>`
<section class="section">
<div class="section-head"><h2>${title}</h2></div>
<div class="slider-wrap">
<div class="slider">${skeletonCards(12)}</div>
</div>
</section>`).join('');

const responses=await Promise.allSettled(sections.map(([,endpoint],i)=>cachedFetch('sec'+i,`${API}/${endpoint}&limit=12`)));

responses.forEach((res,i)=>{
const slider=content.querySelectorAll('.slider')[i];
if(res.status!=='fulfilled'||!res.value?.data?.length){
slider.innerHTML='<p style="padding:1rem">Could not load section.</p>';
return;
}
slider.innerHTML=res.value.data.map(createCard).join('');
initSlider(slider.parentElement);
})
}

const overlay=document.getElementById('searchOverlay');
document.getElementById('searchToggle').onclick=()=>overlay.classList.toggle('active');

const liveSearch=debounce(async e=>{
const q=e.target.value.trim();
if(q.length<2) return document.getElementById('searchResults').innerHTML='';
const data=await fetchWithRetry(`${API}/anime?q=${encodeURIComponent(q)}&limit=8`);
const list=data?.data||[];
const results=document.getElementById('searchResults');
results.innerHTML=list.map(a=>`
<a class="result-item" href="anime.html?id=${a.mal_id}">
<img src="${a.images.jpg.image_url}" width="70">
<div>
<h3>${a.title}</h3>
<p>${safe(a.score,'N/A')}</p>
</div>
</a>`).join('');
},400)

document.getElementById('searchInput').addEventListener('input',liveSearch);
window.addEventListener('resize',debounce(()=>sliders.clear(),300));
window.addEventListener('orientationchange',()=>location.reload());

(async()=>{
await Promise.allSettled([buildHero(),buildSections()])
})();
</script>
</body>
</html>
