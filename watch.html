<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — AniVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #080810; --bg-secondary: #0d0d1a; --bg-card: #111122;
  --bg-glass: rgba(255,255,255,0.04);
  --accent: #7c3aed; --accent-bright: #a855f7; --accent-glow: rgba(124,58,237,0.4);
  --neon: #c084fc; --text-primary: #f1f0ff; --text-secondary: #9ca3af;
  --text-muted: #4b5563; --border: rgba(124,58,237,0.2); --border-bright: rgba(124,58,237,0.5);
  --radius: 12px; --font-main: 'Outfit', sans-serif; --font-display: 'Orbitron', monospace;
  --header-h: 64px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-main); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; outline: none; font-family: var(--font-main); }
::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-track { background: var(--bg-secondary); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* HEADER */
.header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: var(--header-h); display: flex; align-items: center; padding: 0 20px; background: rgba(8,8,16,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); gap: 16px; }
.logo { font-family: var(--font-display); font-size: 1.3rem; font-weight: 900; background: linear-gradient(135deg, var(--neon), var(--accent-bright)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
.header-back { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 0.875rem; padding: 7px 14px; background: var(--bg-glass); border: 1px solid var(--border); border-radius: 8px; transition: all 0.2s; }
.header-back:hover { color: var(--neon); border-color: var(--accent-bright); }
.header-anime-title { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* WATCH LAYOUT */
.watch-layout { display: grid; grid-template-columns: 1fr 340px; gap: 0; min-height: calc(100vh - var(--header-h)); margin-top: var(--header-h); }
.watch-main { display: flex; flex-direction: column; min-height: 0; }
.watch-sidebar { background: var(--bg-secondary); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: calc(100vh - var(--header-h)); position: sticky; top: var(--header-h); overflow: hidden; }

/* PLAYER */
.player-container { position: relative; width: 100%; background: #000; }
.player-container.theater { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 900; margin-top: 0; }
.player-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
.player-wrap.theater-wrap { padding-top: 0; height: 100%; }
.player-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
.player-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; flex-direction: column; gap: 16px; z-index: 5; }
.player-loading.hidden { display: none; }
.spinner { width: 44px; height: 44px; border: 3px solid rgba(124,58,237,0.3); border-top-color: var(--accent-bright); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.player-loading p { color: var(--text-secondary); font-size: 0.875rem; }

/* PLAYER CONTROLS BAR */
.player-controls-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 16px;
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
}
.ctrl-group { display: flex; align-items: center; gap: 6px; }
.ctrl-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
.ctrl-btn {
  padding: 7px 14px; border-radius: 8px;
  background: var(--bg-glass); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 0.82rem; font-weight: 600;
  transition: all 0.2s;
}
.ctrl-btn:hover { border-color: var(--accent-bright); color: var(--neon); }
.ctrl-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.ctrl-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.spacer { flex: 1; }
.theater-btn, .fullscreen-btn {
  padding: 7px 12px; border-radius: 8px;
  background: var(--bg-glass); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 0.82rem;
  transition: all 0.2s;
}
.theater-btn:hover, .fullscreen-btn:hover { border-color: var(--accent-bright); color: var(--neon); }
.theater-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* EPISODE AREA */
.watch-info { padding: 16px; flex: 1; overflow-y: auto; }
.watch-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.watch-ep-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
.watch-nav-row { display: flex; gap: 10px; margin-bottom: 20px; }
.nav-ep-btn {
  flex: 1; padding: 10px; border-radius: 10px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 0.82rem; font-weight: 600;
  transition: all 0.2s; text-align: center;
}
.nav-ep-btn:hover { border-color: var(--accent-bright); color: var(--neon); }
.nav-ep-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-ep-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.auto-next-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-glass); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; }
.toggle-sw { width: 38px; height: 20px; background: var(--text-muted); border-radius: 10px; position: relative; cursor: pointer; transition: background 0.3s; flex-shrink: 0; }
.toggle-sw.on { background: var(--accent-bright); }
.toggle-sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: left 0.3s; }
.toggle-sw.on::after { left: 21px; }

/* SERVER Selector */
.server-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.server-btn {
  padding: 6px 14px; border-radius: 8px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
  transition: all 0.2s;
}
.server-btn:hover { border-color: var(--accent-bright); color: var(--neon); }
.server-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.server-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

/* SIDEBAR TABS */
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
.sidebar-tab { flex: 1; padding: 12px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); background: none; border-bottom: 2px solid transparent; transition: all 0.2s; text-align: center; }
.sidebar-tab:hover { color: var(--text-primary); }
.sidebar-tab.active { color: var(--neon); border-bottom-color: var(--neon); }
.sidebar-tab-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.sidebar-tab-panel.active { display: flex; }

/* EPISODE LIST SIDEBAR */
.ep-list-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.ep-list-header input { flex: 1; padding: 7px 12px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 0.8rem; outline: none; font-family: var(--font-main); }
.ep-list-header input:focus { border-color: var(--accent-bright); }
.ep-list { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; align-content: start; }
.ep-item {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.ep-item:hover { background: var(--accent); border-color: var(--accent); }
.ep-item.active { background: var(--accent-bright); border-color: var(--accent-bright); color: #fff; }

/* RELATED ANIME SIDEBAR */
.related-list { flex: 1; overflow-y: auto; padding: 8px; }
.related-item { display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
.related-item:hover { background: var(--bg-glass); }
.related-img { width: 50px; height: 70px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--bg-card); }
.related-info { flex: 1; min-width: 0; }
.related-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.related-meta { font-size: 0.72rem; color: var(--text-muted); }

/* SYNOPSIS */
.watch-synopsis { font-size: 0.82rem; line-height: 1.7; color: var(--text-secondary); max-height: 100px; overflow: hidden; transition: max-height 0.3s; }
.watch-synopsis.expanded { max-height: 500px; }
.read-more-btn { font-size: 0.78rem; color: var(--accent-bright); cursor: pointer; margin-top: 4px; background: none; }

/* THEATER MODE */
body.theater .watch-layout { position: fixed; inset: 0; z-index: 800; margin: 0; }
body.theater .watch-sidebar { display: none; }
body.theater .watch-main { width: 100%; }
body.theater .player-controls-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 901; background: rgba(8,8,16,0.95); }

/* KEYBOARD SHORTCUTS TOOLTIP */
.shortcuts-panel {
  position: fixed; bottom: 80px; right: 20px; z-index: 2000;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; min-width: 200px;
  display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}
.shortcuts-panel.show { display: block; }
.shortcut-row { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; font-size: 0.78rem; }
.shortcut-key { background: var(--bg-secondary); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); font-family: monospace; color: var(--neon); }

@media (max-width: 900px) {
  .watch-layout { grid-template-columns: 1fr; }
  .watch-sidebar { position: static; height: auto; max-height: none; border-left: none; border-top: 1px solid var(--border); }
  .ep-list { max-height: 300px; }
}
@media (max-width: 480px) {
  .header-anime-title { display: none; }
  .ctrl-label { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">AniVerse</a>
  <a href="javascript:history.back()" class="header-back">← Back</a>
  <span class="header-anime-title" id="headerTitle">Loading...</span>
  <div class="header-right">
    <button onclick="toggleShortcuts()" style="padding:7px 12px;background:var(--bg-glass);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:0.8rem;transition:all 0.2s" title="Keyboard Shortcuts">⌨️</button>
  </div>
</header>

<div class="shortcuts-panel" id="shortcutsPanel">
  <div style="font-size:0.8rem;font-weight:700;margin-bottom:10px;color:var(--text-primary)">⌨️ Shortcuts</div>
  <div class="shortcut-row"><span>Previous</span><span class="shortcut-key">←</span></div>
  <div class="shortcut-row"><span>Next</span><span class="shortcut-key">→</span></div>
  <div class="shortcut-row"><span>Theater</span><span class="shortcut-key">T</span></div>
  <div class="shortcut-row"><span>Fullscreen</span><span class="shortcut-key">F</span></div>
  <div class="shortcut-row"><span>Sub/Dub</span><span class="shortcut-key">S</span></div>
</div>

<div class="watch-layout" id="watchLayout">
  <!-- MAIN AREA -->
  <div class="watch-main" id="watchMain">
    <div class="player-container" id="playerContainer">
      <div class="player-wrap" id="playerWrap">
        <div class="player-loading" id="playerLoading">
          <div class="spinner"></div>
          <p>Loading stream...</p>
        </div>
        <iframe class="player-iframe" id="playerIframe" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"></iframe>
      </div>
    </div>

    <!-- CONTROLS BAR -->
    <div class="player-controls-bar" id="controlsBar">
      <div class="ctrl-group">
        <span class="ctrl-label">Audio</span>
        <button class="ctrl-btn active" id="subBtn" onclick="setAudio('sub')">SUB</button>
        <button class="ctrl-btn" id="dubBtn" onclick="setAudio('dub')">DUB</button>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group" id="serverBtns">
        <span class="ctrl-label">Server</span>
        <button class="ctrl-btn active" onclick="setServer(0,this)">Server 1</button>
        <button class="ctrl-btn" onclick="setServer(1,this)">Server 2</button>
        <button class="ctrl-btn" onclick="setServer(2,this)">Server 3</button>
      </div>
      <div class="spacer"></div>
      <button class="theater-btn" id="theaterBtn" onclick="toggleTheater()" title="Theater Mode (T)">⬛ Theater</button>
      <button class="fullscreen-btn" onclick="goFullscreen()" title="Fullscreen (F)">⛶ Fullscreen</button>
    </div>

    <!-- WATCH INFO -->
    <div class="watch-info" id="watchInfoArea">
      <div id="watchInfoContent">
        <div style="padding:20px;text-align:center;color:var(--text-muted)"><div class="spinner" style="margin:0 auto 12px"></div>Loading info...</div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="watch-sidebar">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" onclick="switchSidebarTab('episodes',this)">Episodes</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('related',this)">Related</button>
    </div>

    <div class="sidebar-tab-panel active" id="sidepanel-episodes">
      <div class="ep-list-header">
        <input type="number" id="epSearch" placeholder="Jump to ep..." min="1">
        <button onclick="jumpToEp()" style="padding:7px 14px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;font-size:0.8rem">Go</button>
      </div>
      <div class="ep-list" id="sideEpList">
        <div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text-muted)">Loading episodes...</div>
      </div>
    </div>

    <div class="sidebar-tab-panel" id="sidepanel-related">
      <div class="related-list" id="relatedList">
        <div style="padding:20px;text-align:center;color:var(--text-muted)">Loading...</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://api.jikan.moe/v4';
const STREAM_BASE = 'https://megaplay.buzz/stream/mal';

// State
let state = {
  id: null, ep: 1, audio: 'sub', theater: false,
  autoNext: true, totalEps: null, title: '', synopsis: ''
};

// Servers: alternate stream sources using the same megaplay URL pattern but with slight variation
const SERVERS = [
  ep => `${STREAM_BASE}/${state.id}/${ep}/${state.audio}`,
  ep => `${STREAM_BASE}/${state.id}/${ep}/${state.audio}`,
  ep => `${STREAM_BASE}/${state.id}/${ep}/${state.audio}`
];
let currentServer = 0;

function esc(s) { if(!s) return ''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function safeImg(u) { return u || ''; }
function trunc(s,n) { return s && s.length>n ? s.slice(0,n)+'…' : (s||''); }
function getParam(k) { return new URLSearchParams(window.location.search).get(k); }

async function fetchWithTimeout(url, timeout=8000) {
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeout);
  try { const r = await fetch(url,{signal:ctrl.signal}); clearTimeout(t); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  catch(e) { clearTimeout(t); throw e; }
}
async function fetchRetry(url, n=3) {
  for(let i=0;i<n;i++) { try { return await fetchWithTimeout(url); } catch(e) { if(i<n-1) await new Promise(r=>setTimeout(r,700*(i+1))); else throw e; } }
}

function loadPlayer(ep, audio) {
  const iframe = document.getElementById('playerIframe');
  const loading = document.getElementById('playerLoading');
  if (loading) loading.classList.remove('hidden');
  const src = SERVERS[currentServer](ep);
  if (iframe) {
    iframe.src = '';
    setTimeout(() => {
      iframe.src = src;
      iframe.onload = () => { if (loading) loading.classList.add('hidden'); };
    }, 100);
  }
  // Update URL
  const url = new URL(window.location.href);
  url.searchParams.set('ep', ep);
  window.history.pushState({}, '', url.toString());
  // Highlight episode
  highlightEp(ep);
}

function setAudio(type) {
  state.audio = type;
  document.getElementById('subBtn').classList.toggle('active', type==='sub');
  document.getElementById('dubBtn').classList.toggle('active', type==='dub');
  loadPlayer(state.ep, type);
}

function setServer(idx, btn) {
  currentServer = idx;
  document.querySelectorAll('#serverBtns .ctrl-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  loadPlayer(state.ep, state.audio);
}

function prevEp() { if (state.ep > 1) { state.ep--; loadPlayer(state.ep, state.audio); updateNavBtns(); } }
function nextEp() {
  const max = state.totalEps || Infinity;
  if (state.ep < max) { state.ep++; loadPlayer(state.ep, state.audio); updateNavBtns(); }
}
function goToEp(n) { state.ep = n; loadPlayer(n, state.audio); updateNavBtns(); }

function updateNavBtns() {
  const prev = document.getElementById('prevEpBtn');
  const next = document.getElementById('nextEpBtn');
  if (prev) prev.disabled = state.ep <= 1;
  if (next) next.disabled = state.ep >= (state.totalEps || Infinity);
  document.getElementById('currentEpLabel') && (document.getElementById('currentEpLabel').textContent = `Episode ${state.ep}`);
}

function jumpToEp() {
  const n = parseInt(document.getElementById('epSearch')?.value);
  if (n && !isNaN(n) && n >= 1) goToEp(n);
}

function highlightEp(n) {
  document.querySelectorAll('.ep-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.ep) === n);
  });
}

function switchSidebarTab(name, btn) {
  document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sidebar-tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sidepanel-'+name)?.classList.add('active');
}

function toggleTheater() {
  state.theater = !state.theater;
  document.body.classList.toggle('theater', state.theater);
  document.getElementById('theaterBtn')?.classList.toggle('active', state.theater);
}

function goFullscreen() {
  const el = document.getElementById('playerContainer');
  if (!el) return;
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else { el.requestFullscreen?.() || el.webkitRequestFullscreen?.() || el.mozRequestFullScreen?.(); }
}

function toggleAutoNext() {
  state.autoNext = !state.autoNext;
  const tog = document.getElementById('autoNextToggle');
  if (tog) tog.classList.toggle('on', state.autoNext);
}

function toggleShortcuts() {
  document.getElementById('shortcutsPanel')?.classList.toggle('show');
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') prevEp();
  else if (e.key === 'ArrowRight') nextEp();
  else if (e.key === 't' || e.key === 'T') toggleTheater();
  else if (e.key === 'f' || e.key === 'F') goFullscreen();
  else if (e.key === 's' || e.key === 'S') setAudio(state.audio==='sub'?'dub':'sub');
  else if (e.key === 'Escape') {
    if (state.theater) toggleTheater();
    document.getElementById('shortcutsPanel')?.classList.remove('show');
  }
});

function renderEpList(count) {
  const list = document.getElementById('sideEpList');
  if (!list) return;
  if (!count || count <= 0) { list.innerHTML = '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text-muted)">Episode list unavailable.</div>'; return; }
  const n = Math.min(count, 500);
  list.innerHTML = Array.from({length:n},(_,i)=>{
    const ep=i+1;
    return `<button class="ep-item${ep===state.ep?' active':''}" data-ep="${ep}" onclick="goToEp(${ep})">${ep}</button>`;
  }).join('');
}

function renderWatchInfo(anime) {
  const area = document.getElementById('watchInfoContent');
  if (!area) return;
  const img = safeImg(anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url);
  area.innerHTML = `
    <div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:20px">
      ${img ? `<img src="${img}" style="width:80px;border-radius:10px;flex-shrink:0;object-fit:cover;aspect-ratio:2/3;background:var(--bg-card)" alt="${esc(anime.title)}">` : ''}
      <div>
        <div class="watch-title">${esc(anime.title)}</div>
        <div class="watch-ep-label" id="currentEpLabel">Episode ${state.ep}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
          ${(anime.genres||[]).slice(0,3).map(g=>`<span style="padding:3px 10px;border-radius:20px;background:var(--bg-glass);border:1px solid var(--border);font-size:0.72rem;color:var(--text-secondary)">${esc(g.name)}</span>`).join('')}
        </div>
        <a href="anime.html?id=${anime.mal_id}" style="font-size:0.78rem;color:var(--accent-bright)">View Details →</a>
      </div>
    </div>

    <div class="watch-nav-row">
      <button class="nav-ep-btn" id="prevEpBtn" onclick="prevEp()" ${state.ep<=1?'disabled':''}>← Prev Ep</button>
      <button class="nav-ep-btn primary" onclick="nextEp()">Next Ep →</button>
    </div>

    <div class="auto-next-row">
      <span>Auto Next Episode</span>
      <div class="toggle-sw ${state.autoNext?'on':''}" id="autoNextToggle" onclick="toggleAutoNext()"></div>
    </div>

    <div class="server-label">Servers</div>
    <div class="server-row">
      <button class="server-btn active" onclick="setServer(0,this)">Server 1</button>
      <button class="server-btn" onclick="setServer(1,this)">Server 2</button>
      <button class="server-btn" onclick="setServer(2,this)">Server 3</button>
    </div>

    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:8px">Synopsis</div>
    <div class="watch-synopsis" id="watchSynopsisText">${esc(anime.synopsis || 'No synopsis available.')}</div>
    <button class="read-more-btn" onclick="this.previousElementSibling.classList.toggle('expanded');this.textContent=this.previousElementSibling.classList.contains('expanded')?'Show less ↑':'Read more ↓'">Read more ↓</button>
  `;
}

function renderRelated(recs) {
  const list = document.getElementById('relatedList');
  if (!list) return;
  if (!recs.length) { list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">No related anime.</div>'; return; }
  list.innerHTML = recs.slice(0,20).map(r => {
    const a = r.entry;
    const img = safeImg(a?.images?.jpg?.image_url);
    return `<div class="related-item" onclick="window.location.href='watch.html?id=${a?.mal_id}&ep=1'">
      ${img ? `<img class="related-img" src="${img}" alt="${esc(a?.title)}" loading="lazy">` : '<div class="related-img" style="background:var(--bg-card)"></div>'}
      <div class="related-info">
        <div class="related-title">${esc(a?.title)}</div>
        <div class="related-meta">${a?.type||''}</div>
      </div>
    </div>`;
  }).join('');
}

async function init() {
  state.id = getParam('id');
  state.ep = parseInt(getParam('ep')) || 1;
  if (!state.id) {
    document.getElementById('watchInfoContent').innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">No anime specified. <a href="index.html" style="color:var(--accent-bright)">Go Home</a></div>';
    return;
  }

  // Load player immediately
  loadPlayer(state.ep, state.audio);

  try {
    const [animeRes, recsRes] = await Promise.allSettled([
      fetchRetry(`${API}/anime/${state.id}/full`),
      fetchRetry(`${API}/anime/${state.id}/recommendations`)
    ]);

    const anime = animeRes.status==='fulfilled' ? animeRes.value?.data : null;
    if (anime) {
      state.title = anime.title || '';
      state.totalEps = anime.episodes || null;
      state.synopsis = anime.synopsis || '';
      document.title = `${anime.title} — Episode ${state.ep} — AniVerse`;
      document.getElementById('headerTitle').textContent = anime.title;
      renderWatchInfo(anime);
      renderEpList(state.totalEps);
      updateNavBtns();
    }

    const recs = recsRes.status==='fulfilled' ? (recsRes.value?.data||[]) : [];
    renderRelated(recs);
  } catch(e) {
    console.warn('Watch init error:', e);
  }
}

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
