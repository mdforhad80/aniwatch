<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch | AnimeHub</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    .watch-page { display:flex; flex-direction:column; }
    .watch-layout { display:grid; grid-template-columns:1fr 340px; min-height:calc(100vh - 64px); }
    @media(max-width:1024px) { .watch-layout { grid-template-columns:1fr; } .watch-sidebar { height:400px; position:relative; top:0; } }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="loader-logo">ANIMEHUB</div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<nav id="navbar">
  <a href="index.html" class="nav-logo">ANIMEHUB</a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Home</a>
    <a href="search.html" class="nav-link">Browse</a>
  </div>
  <div class="nav-search">
    <input type="text" id="nav-search-input" placeholder="Search anime..." autocomplete="off">
    <svg class="nav-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <div id="search-dropdown"></div>
  </div>
  <div class="nav-actions">
    <div id="nav-auth-btns" style="display:flex;gap:8px">
      <a href="login.html" class="nav-btn nav-btn-ghost">Login</a>
      <a href="signup.html" class="nav-btn nav-btn-primary">Sign Up</a>
    </div>
    <div id="nav-user-menu" class="nav-avatar-wrap" style="display:none">
      <div class="nav-avatar" id="nav-avatar-letter">U</div>
      <div class="nav-dropdown">
        <a href="profile.html">👤 My Profile</a>
        <button id="nav-logout-btn">🚪 Logout</button>
      </div>
    </div>
  </div>
</nav>

<main class="main-content" style="padding:0">
  <div class="watch-page" id="watch-page">
    <!-- Dynamic content -->
    <div style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 64px)">
      <div class="player-loading-spinner"></div>
    </div>
  </div>
</main>

<div id="toast-container"></div>

<script type="module">
import { initApp } from './assets/js/app.js';
import { initAuth, updateNavbarAuth, handleLogout } from './assets/js/auth.js';
import Jikan from './api/jikan.js';
import { getStreamUrl, generateEpisodes } from './api/anime.js';
import { getParam, showToast, debounce } from './assets/js/utils.js';
import { animeCard } from './assets/js/ui.js';

initApp();
initAuth();

const { onUserChange } = await import('./assets/js/auth.js');
let currentUser = null;
onUserChange(user => {
  currentUser = user;
  updateNavbarAuth(user);
});
document.getElementById('nav-logout-btn')?.addEventListener('click', handleLogout);

const malId = getParam('id');
const epNum = parseInt(getParam('ep') || '1');
const streamType = getParam('type') || 'sub';

if (!malId) window.location.href = 'index.html';

let animeData = null;
let episodes = [];
let currentEp = epNum;
let currentType = streamType;

async function loadWatchPage() {
  try {
    const [animeRes] = await Promise.allSettled([Jikan.getAnime(malId)]);
    animeData = animeRes.value?.data;
    if (!animeData) throw new Error('Anime not found');

    const epCount = animeData.episodes || 24;
    episodes = generateEpisodes(malId, epCount);

    renderWatchPage();
    loadStreamUrl();

    // Save continue watching
    if (currentUser) {
      saveContinueWatching();
    }

    // Load recommendations
    loadRecommendations();

  } catch(e) {
    document.getElementById('watch-page').innerHTML = `
      <div style="text-align:center;padding:80px;color:var(--muted)">
        <h2>Failed to load</h2>
        <a href="index.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex">Go Home</a>
      </div>`;
  }
}

function renderWatchPage() {
  const title = animeData.title_english || animeData.title;
  document.title = `${title} - Episode ${currentEp} | AnimeHub`;

  const page = document.getElementById('watch-page');
  page.innerHTML = `
    <div class="watch-layout">

      <!-- Player Side -->
      <div class="player-section">
        <!-- Player -->
        <div class="player-wrapper" id="player-wrapper">
          <div class="player-loading" id="player-loading">
            <div class="player-loading-spinner"></div>
            <span style="color:var(--muted);font-size:0.875rem">Loading stream...</span>
          </div>
          <iframe id="player-iframe" allowfullscreen allow="autoplay; fullscreen" style="display:none;width:100%;height:100%;border:none"></iframe>
        </div>

        <!-- Player Controls -->
        <div class="player-controls">
          <div class="player-title" id="ep-title">${title} — Episode ${currentEp}</div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div class="type-switcher">
              <button class="type-btn ${currentType==='sub'?'active':''}" onclick="setType('sub')">SUB</button>
              <button class="type-btn ${currentType==='dub'?'active':''}" onclick="setType('dub')">DUB</button>
            </div>
            <select class="server-select" id="server-select" onchange="changeServer(this.value)">
              <option value="vidcloud">VidCloud</option>
            </select>
            <div class="episode-nav">
              <button class="ep-nav-btn" id="prev-btn" onclick="prevEp()" ${currentEp <= 1 ? 'disabled' : ''}>
                ← Prev
              </button>
              <button class="ep-nav-btn" id="next-btn" onclick="nextEp()" ${currentEp >= (animeData?.episodes||999) ? 'disabled' : ''}>
                Next →
              </button>
            </div>
            <button class="ep-nav-btn" onclick="window.open(document.getElementById('player-iframe').src, '_blank')">
              ⛶ Theater
            </button>
          </div>
        </div>

        <!-- Anime Info Below Player -->
        <div style="padding:20px 24px;background:var(--bg-secondary);border-bottom:1px solid var(--border)">
          <div style="display:flex;gap:16px;align-items:flex-start">
            <img src="${animeData.images?.webp?.image_url || 'assets/images/no-image.svg'}" 
              style="width:70px;height:100px;border-radius:8px;object-fit:cover;flex-shrink:0"
              onerror="this.src='assets/images/no-image.svg'">
            <div style="flex:1;min-width:0">
              <h2 style="font-family:'Rajdhani',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:6px">${title}</h2>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
                ${animeData.score ? `<span style="color:#fbbf24;font-size:0.8rem">⭐ ${animeData.score}</span>` : ''}
                ${animeData.type ? `<span style="color:var(--muted);font-size:0.8rem">${animeData.type}</span>` : ''}
                ${animeData.status ? `<span style="color:var(--muted);font-size:0.8rem">${animeData.status}</span>` : ''}
              </div>
              <div style="display:flex;gap:8px">
                <a href="anime.html?id=${malId}" class="ep-nav-btn" style="text-decoration:none">Details</a>
              </div>
            </div>
          </div>
        </div>

        <!-- Mobile Episode List -->
        <div style="padding:16px 24px;background:var(--bg-secondary)" class="mobile-only" id="mobile-eps">
          <h3 style="font-family:'Rajdhani',sans-serif;font-weight:700;margin-bottom:12px">Episodes</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-height:180px;overflow-y:auto" id="mobile-ep-grid">
            ${episodes.map(ep => `
              <button class="ep-btn ${ep.episode == currentEp ? 'active' : ''}" onclick="goToEp(${ep.episode})">
                ${ep.episode}
              </button>
            `).join('')}
          </div>
        </div>

      </div><!-- end player section -->

      <!-- Sidebar -->
      <div class="watch-sidebar">
        <div class="watch-sidebar-header">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span>Episodes</span>
            <span style="font-size:0.8rem;color:var(--muted)">${animeData.episodes || '?'} total</span>
          </div>
        </div>
        <div class="ep-list" id="ep-list">
          ${episodes.map(ep => `
            <div class="ep-list-item ${ep.episode == currentEp ? 'active' : ''}" onclick="goToEp(${ep.episode})" id="ep-item-${ep.episode}">
              <span class="ep-list-num">${ep.episode}</span>
              <span class="ep-list-title">Episode ${ep.episode}</span>
              ${ep.episode == currentEp ? '<span style="width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0"></span>' : ''}
            </div>
          `).join('')}
        </div>
        <!-- Recommendations -->
        <div style="padding:16px;border-top:1px solid var(--border)">
          <h3 style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:0.95rem;margin-bottom:12px">You May Also Like</h3>
          <div id="recommendations-list"></div>
        </div>
      </div>

    </div><!-- end watch-layout -->
  `;

  // Scroll to active episode
  setTimeout(() => {
    document.getElementById(`ep-item-${currentEp}`)?.scrollIntoView({ block: 'nearest' });
  }, 100);
}

function loadStreamUrl() {
  const url = getStreamUrl(malId, currentEp, currentType);
  const iframe = document.getElementById('player-iframe');
  const loading = document.getElementById('player-loading');

  if (!iframe) return;

  iframe.style.display = 'none';
  loading.style.display = 'flex';

  iframe.src = url;
  iframe.onload = () => {
    loading.style.display = 'none';
    iframe.style.display = 'block';
  };

  // Update URL
  const newUrl = new URL(window.location);
  newUrl.searchParams.set('id', malId);
  newUrl.searchParams.set('ep', currentEp);
  newUrl.searchParams.set('type', currentType);
  window.history.replaceState({}, '', newUrl);

  // Update title
  const titleEl = document.getElementById('ep-title');
  if (titleEl) titleEl.textContent = `${animeData?.title_english || animeData?.title} — Episode ${currentEp}`;
  document.title = `${animeData?.title_english || animeData?.title} - Episode ${currentEp} | AnimeHub`;
}

async function loadRecommendations() {
  try {
    const res = await Jikan.getAnimeRecommendations(malId);
    const recs = res.data?.slice(0, 5) || [];
    const list = document.getElementById('recommendations-list');
    if (!list) return;
    list.innerHTML = recs.map(r => `
      <a href="watch.html?id=${r.entry.mal_id}&ep=1&type=sub" style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);text-decoration:none">
        <img src="${r.entry.images?.webp?.image_url || 'assets/images/no-image.svg'}" 
          style="width:48px;height:68px;border-radius:6px;object-fit:cover;flex-shrink:0"
          onerror="this.src='assets/images/no-image.svg'">
        <div style="flex:1;min-width:0">
          <div style="font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.entry.title}</div>
          <div style="font-size:0.7rem;color:var(--purple-light);margin-top:2px">Watch Now →</div>
        </div>
      </a>
    `).join('');
  } catch(e) {}
}

async function saveContinueWatching() {
  if (!currentUser) return;
  try {
    const { saveContinueWatching: save } = await import('./firebase/firestore.js');
    await save(currentUser.uid, {
      mal_id: malId,
      title: animeData?.title_english || animeData?.title,
      image: animeData?.images?.webp?.large_image_url,
      episode: currentEp,
      type: currentType,
      progress: Math.round((currentEp / (animeData?.episodes || 1)) * 100),
    });
  } catch(e) {}
}

// Global functions
window.goToEp = function(ep) {
  currentEp = parseInt(ep);
  loadStreamUrl();
  saveContinueWatching();
  // Update active states
  document.querySelectorAll('.ep-list-item').forEach(el => {
    el.classList.toggle('active', el.id === `ep-item-${ep}`);
  });
  document.querySelectorAll('.ep-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim() == ep);
  });
  document.getElementById(`ep-item-${ep}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
};
window.prevEp = function() { if (currentEp > 1) window.goToEp(currentEp - 1); };
window.nextEp = function() { if (currentEp < (animeData?.episodes || 999)) window.goToEp(currentEp + 1); };
window.setType = function(type) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === type));
  loadStreamUrl();
  saveContinueWatching();
};
window.changeServer = function() { loadStreamUrl(); };

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'n') window.nextEp();
  if (e.key === 'ArrowLeft' || e.key === 'p') window.prevEp();
});

// Search
const searchInput = document.getElementById('nav-search-input');
const searchDropdown = document.getElementById('search-dropdown');
const doSearch = debounce(async q => {
  if (!q) { searchDropdown.classList.remove('visible'); return; }
  const res = await Jikan.search(q, { limit: 5 });
  searchDropdown.innerHTML = (res.data || []).map(a => `<a href="anime.html?id=${a.mal_id}" class="search-result-item"><img class="search-result-img" src="${a.images?.webp?.image_url||'assets/images/no-image.svg'}" onerror="this.src='assets/images/no-image.svg'"><div class="search-result-info"><div class="search-result-title">${a.title_english||a.title}</div></div></a>`).join('');
  searchDropdown.classList.add('visible');
}, 400);
searchInput?.addEventListener('input', e => doSearch(e.target.value));
searchInput?.addEventListener('keydown', e => { if (e.key === 'Enter') window.location.href = `search.html?q=${encodeURIComponent(e.target.value)}`; });
document.addEventListener('click', e => { if (!e.target.closest('.nav-search')) searchDropdown.classList.remove('visible'); });

loadWatchPage();
</script>
</body>
</html>
