<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Anime - AnimeStream</title>
    <!-- COPY THE EXACT <style> TAG FROM index.html HERE -->
</head>
<body>
    <!-- Same header, sidebar, search overlay as index.html -->

    <main class="main-content" id="mainContent">
        <div id="watchContent">
            <!-- Dynamic player and controls -->
        </div>
    </main>

    <footer class="site-footer">
        <!-- same footer -->
    </footer>

    <script>
        const JIKAN_BASE = 'https://api.jikan.moe/v4';
        const STREAM_BASE = 'https://megaplay.buzz/stream/mal';
        const $ = (sel) => document.querySelector(sel);

        const storage = {
            get(key, fallback = null) {
                try { const v = localStorage.getItem('as_' + key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
            },
            set(key, value) { try { localStorage.setItem('as_' + key, JSON.stringify(value)); } catch {} },
            updateContinueWatching(item) {
                let cw = this.get('continueWatching', []);
                cw = cw.filter(c => c.malId !== item.malId);
                cw.unshift({ ...item, updatedAt: Date.now() });
                if (cw.length > 20) cw = cw.slice(0, 20);
                this.set('continueWatching', cw);
            }
        };

        async function fetchJikan(endpoint) {
            try {
                const res = await fetch(`${JIKAN_BASE}${endpoint}`);
                if (!res.ok) throw new Error('API error');
                return await res.json();
            } catch (e) { return null; }
        }

        async function loadWatch() {
            const params = new URLSearchParams(location.search);
            const malId = params.get('id');
            const ep = params.get('ep') || '1';
            const type = params.get('type') || 'sub'; // sub or dub

            if (!malId) return document.getElementById('watchContent').innerHTML = '<p>No anime ID.</p>';

            // Save watch progress
            storage.updateContinueWatching({ malId: parseInt(malId), episode: parseInt(ep), type });

            // Fetch anime info for title
            const data = await fetchJikan(`/anime/${malId}`);
            const anime = data?.data;
            const title = anime?.title_english || anime?.title || 'Unknown';
            const totalEpisodes = anime?.episodes || 1;
            const streamUrl = `${STREAM_BASE}/${malId}/${ep}/${type}`;

            // Build episode grid
            const episodeButtons = Array.from({ length: totalEpisodes || 1 }, (_, i) => i + 1)
                .map(num => {
                    const isActive = num === parseInt(ep) ? 'active' : '';
                    return `<a href="?id=${malId}&ep=${num}&type=${type}" class="ep-btn ${isActive}">${num}</a>`;
                }).join('');

            document.getElementById('watchContent').innerHTML = `
                <h1 style="margin-bottom:12px;">${title} - Episode ${ep} (${type.toUpperCase()})</h1>
                <div class="player-container">
                    <iframe src="${streamUrl}" allowfullscreen allow="autoplay; fullscreen"></iframe>
                </div>
                <div class="type-toggle" style="margin-bottom:16px;">
                    <button class="${type === 'sub' ? 'active' : ''}" onclick="location.href='?id=${malId}&ep=${ep}&type=sub'">Sub</button>
                    <button class="${type === 'dub' ? 'active' : ''}" onclick="location.href='?id=${malId}&ep=${ep}&type=dub'">Dub</button>
                </div>
                <div class="episode-grid">${episodeButtons}</div>
                <div style="margin-top:16px;">
                    <a href="anime.html?id=${malId}" class="btn btn-outline">← Back to Details</a>
                </div>
            `;
        }

        loadWatch();
    </script>
</body>
</html>
