<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Watch</title>
    <style>
        :root {
            --bg: #0a0a0f; --bg2: #111118; --bg3: #1a1a25; --text: #e2e2e2; --text2: #a0a0b0;
            --accent: #7c3aed; --accent2: #a855f7; --radius: 12px; --transition: 0.3s;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
        .header { position:sticky; top:0; z-index:1000; background:rgba(10,10,15,0.9); backdrop-filter:blur(20px); padding:0 16px; height:56px; display:flex; align-items:center; justify-content:space-between; }
        .logo { font-weight:800; background:linear-gradient(135deg,var(--accent2),#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .player-wrapper { width:100%; max-width:1200px; margin:20px auto; padding:0 12px; }
        .iframe-container { position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:var(--radius); overflow:hidden; }
        .iframe-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
        .controls { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }
        .btn { padding:8px 16px; border-radius:20px; background:var(--bg3); color:var(--text); font-size:14px; transition:var(--transition); }
        .btn.active { background:var(--accent); }
        .episode-select { display:flex; gap:6px; flex-wrap:wrap; max-height:200px; overflow-y:auto; margin:10px 0; }
        .episode-select button { padding:6px 12px; border-radius:6px; background:var(--bg3); color:var(--text); }
        .episode-select button.current { background:var(--accent); }
        .anime-sidebar { margin-top:20px; }
        .footer { text-align:center; padding:20px; color:var(--text2); }
        @media(max-width:600px){ .btn { font-size:12px; padding:6px 10px; } }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">AnimeStream</a>
        <a href="search.html" style="color:var(--text2);">Search</a>
    </header>
    <div class="player-wrapper" id="app"><div style="text-align:center;padding:40px;">Loading player...</div></div>
    <footer class="footer">© 2026 AnimeStream</footer>
    <script>
        (function(){
            const params=new URLSearchParams(window.location.search);
            const malId=params.get('id');
            const ep=parseInt(params.get('ep'))||1;
            if(!malId){ document.getElementById('app').innerHTML='Missing anime ID.'; return; }
            let sub=true;
            function getStreamUrl(subMode){ return `https://megaplay.buzz/stream/mal/${malId}/${ep}/${subMode?'sub':'dub'}`; }
            function render(){
                document.getElementById('app').innerHTML=`
                    <div class="iframe-container"><iframe src="${getStreamUrl(sub)}" allowfullscreen allow="autoplay; fullscreen"></iframe></div>
                    <div class="controls">
                        <button class="btn ${sub?'active':''}" id="subBtn">Sub</button>
                        <button class="btn ${!sub?'active':''}" id="dubBtn">Dub</button>
                        <button class="btn" id="prevBtn" ${ep<=1?'disabled':''}>◀ Prev</button>
                        <button class="btn" id="nextBtn">Next ▶</button>
                        <button class="btn" id="fullscreenBtn">⛶ Fullscreen</button>
                    </div>
                    <div class="episode-select" id="epList">Loading episodes...</div>
                `;
                document.getElementById('subBtn').addEventListener('click',()=>{ sub=true; render(); });
                document.getElementById('dubBtn').addEventListener('click',()=>{ sub=false; render(); });
                document.getElementById('prevBtn').addEventListener('click',()=>{ if(ep>1) window.location.href=`watch.html?id=${malId}&ep=${ep-1}`; });
                document.getElementById('nextBtn').addEventListener('click',()=>{ window.location.href=`watch.html?id=${malId}&ep=${ep+1}`; });
                document.getElementById('fullscreenBtn').addEventListener('click',()=>{ document.querySelector('iframe').requestFullscreen(); });
                loadEpisodes();
            }
            async function loadEpisodes(){
                try{
                    const resp=await fetch(`https://api.jikan.moe/v4/anime/${malId}/full`);
                    const data=await resp.json();
                    const total=data.data.episodes||24;
                    const epList=document.getElementById('epList');
                    let html='';
                    for(let i=1;i<=Math.min(total,24);i++){
                        html+=`<button class="${i===ep?'current':''}" onclick="window.location.href='watch.html?id=${malId}&ep=${i}'">Ep ${i}</button>`;
                    }
                    epList.innerHTML=html;
                }catch(e){ document.getElementById('epList').innerHTML='Could not load episodes.'; }
            }
            render();
            document.addEventListener('keydown',function(e){
                if(e.key==='ArrowRight') window.location.href=`watch.html?id=${malId}&ep=${ep+1}`;
                if(e.key==='ArrowLeft'&&ep>1) window.location.href=`watch.html?id=${malId}&ep=${ep-1}`;
            });
        })();
    </script>
</body>
</html>
