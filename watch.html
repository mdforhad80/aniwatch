<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — AnimeX</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#07070f;color:#e8e8f0;}
:root{
  --primary:#8b5cf6;--primary-dark:#6d28d9;--primary-glow:rgba(139,92,246,0.4);
  --accent:#06b6d4;--bg:#07070f;--bg2:#0d0d1a;--bg3:#12121f;
  --card-bg:rgba(255,255,255,0.04);--glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);--text:#e8e8f0;--text-muted:#8888a8;
  --radius:12px;--header-h:64px;--transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
::-webkit-scrollbar{width:6px;height:4px;} ::-webkit-scrollbar-track{background:var(--bg2);} ::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:1000;display:flex;align-items:center;padding:0 clamp(12px,3vw,32px);gap:16px;background:linear-gradient(180deg,rgba(7,7,15,0.98),rgba(7,7,15,0.85));backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo-text{font-size:clamp(20px,4vw,26px);font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#fff,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}
.icon-btn{width:40px;height:40px;border:none;background:var(--glass);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all var(--transition);flex-shrink:0;}
.icon-btn:hover{background:var(--primary);box-shadow:0 0 20px var(--primary-glow);}
.icon-btn svg{width:18px;height:18px;fill:currentColor;}
.header-logo{flex:1;display:flex;justify-content:center;}
.header-left,.header-right{display:flex;align-items:center;gap:8px;min-width:80px;}
.header-right{justify-content:flex-end;}

/* SIDEBAR */
#sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1100;opacity:0;pointer-events:none;transition:opacity var(--transition);}
#sidebar-overlay.open{opacity:1;pointer-events:all;}
#sidebar{position:fixed;top:0;left:0;width:min(280px,80vw);height:100%;background:var(--bg2);border-right:1px solid var(--border);z-index:1200;transform:translateX(-100%);transition:transform var(--transition);display:flex;flex-direction:column;padding:24px 0;}
#sidebar.open{transform:translateX(0);}
.sidebar-header{padding:0 20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-nav{padding:16px 0;}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text-muted);text-decoration:none;font-size:15px;font-weight:500;transition:all var(--transition);}
.sidebar-nav a:hover{color:var(--text);background:var(--glass);}
.sidebar-nav a svg{width:18px;height:18px;fill:currentColor;}

/* MAIN WATCH LAYOUT */
#watch-layout{
  margin-top:var(--header-h);
  display:grid;
  grid-template-columns:1fr min(360px,30vw);
  min-height:calc(100vh - var(--header-h));
  align-items:start;
}
@media(max-width:900px){#watch-layout{grid-template-columns:1fr;}}

/* PLAYER SIDE */
#player-side{
  display:flex;flex-direction:column;
  min-width:0;
}

/* Player box */
#player-box{
  position:relative;
  width:100%;
  background:#000;
}
#player-box.theater{
  /* Theater mode handled by JS toggling max-width */
}
.player-ratio{
  position:relative;
  width:100%;
  padding-top:56.25%;
  background:#000;
}
#player-iframe{
  position:absolute;inset:0;width:100%;height:100%;border:none;
  display:block;
}
#player-loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.8);
  flex-direction:column;gap:12px;
  font-size:14px;color:var(--text-muted);
}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Controls bar */
#controls-bar{
  padding:clamp(10px,2vw,16px);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.ctrl-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ctrl-label{font-size:12px;color:var(--text-muted);font-weight:600;white-space:nowrap;}

.pill-btn{
  padding:6px 14px;background:var(--card-bg);border:1px solid var(--border);
  border-radius:20px;color:var(--text-muted);font-size:12px;font-weight:600;
  cursor:pointer;transition:all var(--transition);white-space:nowrap;
}
.pill-btn:hover,.pill-btn.active{background:var(--primary);border-color:var(--primary);color:white;}

.ep-nav-btn{
  padding:6px 14px;background:var(--glass);border:1px solid var(--border);
  border-radius:20px;color:var(--text);font-size:12px;font-weight:600;
  cursor:pointer;transition:all var(--transition);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
}
.ep-nav-btn:hover{background:var(--primary);border-color:var(--primary);}
.ep-nav-btn:disabled{opacity:0.4;pointer-events:none;}

.theater-btn{
  margin-left:auto;padding:6px 14px;background:var(--glass);border:1px solid var(--border);
  border-radius:20px;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--transition);
}
.theater-btn:hover{background:var(--glass);color:var(--text);}

/* Anime info below player */
#anime-info-bar{
  padding:clamp(12px,2vw,20px);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.anime-watch-title{font-size:clamp(16px,3vw,22px);font-weight:800;margin-bottom:8px;line-height:1.2;}
.anime-watch-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.meta-tag{padding:3px 10px;background:var(--card-bg);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text-muted);}
.meta-tag.score{color:#fbbf24;border-color:rgba(251,191,36,0.3);}

/* Episode list below info */
#ep-section{
  padding:clamp(12px,2vw,20px);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
.ep-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.ep-section-title{font-size:15px;font-weight:800;}
#ep-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(48px,1fr));
  gap:6px;
  max-height:220px;overflow-y:auto;
  padding:2px;
}
.ep-item{
  padding:8px 4px;background:var(--card-bg);border:1px solid var(--border);
  border-radius:8px;text-align:center;font-size:12px;font-weight:700;
  color:var(--text-muted);cursor:pointer;transition:all var(--transition);
}
.ep-item:hover,.ep-item.active{background:var(--primary);border-color:var(--primary);color:white;}

/* SIDEBAR - episode & related */
#watch-sidebar{
  background:var(--bg2);
  border-left:1px solid var(--border);
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  position:sticky;
  top:var(--header-h);
}
@media(max-width:900px){#watch-sidebar{height:auto;position:static;border-left:none;border-top:1px solid var(--border);}}

.sidebar-section{padding:16px;border-bottom:1px solid var(--border);}
.sidebar-section-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sidebar-section-title::before{content:'';display:block;width:3px;height:16px;background:var(--primary);border-radius:2px;}

/* Related card */
.rel-card{
  display:flex;gap:10px;padding:8px;border-radius:8px;
  text-decoration:none;color:var(--text);transition:background var(--transition);
  cursor:pointer;
}
.rel-card:hover{background:var(--card-bg);}
.rel-card img{width:50px;height:70px;object-fit:cover;border-radius:6px;flex-shrink:0;}
.rel-info{flex:1;min-width:0;}
.rel-title{font-size:12px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;}
.rel-meta{font-size:11px;color:var(--text-muted);}

/* Server selector */
#server-list{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0;}
.server-btn{padding:5px 12px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all var(--transition);}
.server-btn.active{background:var(--primary);border-color:var(--primary);color:white;}

/* Comments stub */
#comments-section{padding:20px;background:var(--bg2);border-top:1px solid var(--border);}
.comment-placeholder{text-align:center;padding:24px;color:var(--text-muted);font-size:13px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);}

/* FOOTER */
#footer{padding:24px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--bg2);border-top:1px solid var(--border);}
</style>
</head>
<body>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div class="sidebar-header">
    <span class="logo-text">AnimeX</span>
    <button class="icon-btn" onclick="closeSidebar()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg> Home</a>
    <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg> Search</a>
    <a href="schedule.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Schedule</a>
  </nav>
</aside>

<header id="header">
  <div class="header-left">
    <button class="icon-btn" onclick="openSidebar()"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    <a href="index.html" style="color:var(--text-muted);font-size:13px;text-decoration:none;">← Back</a>
  </div>
  <div class="header-logo"><a href="index.html" class="logo-text">AnimeX</a></div>
  <div class="header-right">
    <button class="icon-btn" id="fullscreen-btn" onclick="toggleFullscreen()" title="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div id="watch-layout">
  <!-- Player Side -->
  <div id="player-side">
    <!-- Player -->
    <div id="player-box">
      <div class="player-ratio">
        <div id="player-loading">
          <div class="spinner"></div>
          Loading stream...
        </div>
        <iframe id="player-iframe" src="" allowfullscreen allow="fullscreen; autoplay" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </div>

    <!-- Controls Bar -->
    <div id="controls-bar">
      <div class="ctrl-group">
        <span class="ctrl-label">Audio:</span>
        <button class="pill-btn active" id="btn-sub" onclick="setAudio('sub')">Sub</button>
        <button class="pill-btn" id="btn-dub" onclick="setAudio('dub')">Dub</button>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Episode:</span>
        <button class="ep-nav-btn" id="btn-prev" onclick="changeEp(-1)">&#8249; Prev</button>
        <span id="ep-current-label" style="font-size:13px;font-weight:700;color:var(--primary)">EP 1</span>
        <button class="ep-nav-btn" id="btn-next" onclick="changeEp(1)">Next &#8250;</button>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Auto Next:</span>
        <button class="pill-btn" id="btn-autonext" onclick="toggleAutoNext()">Off</button>
      </div>
      <button class="theater-btn" onclick="toggleTheater()">⊡ Theater</button>
    </div>

    <!-- Anime Info -->
    <div id="anime-info-bar">
      <div id="anime-watch-title" class="anime-watch-title">Loading...</div>
      <div id="anime-watch-meta" class="anime-watch-meta"></div>
    </div>

    <!-- Episode List -->
    <div id="ep-section">
      <div class="ep-section-header">
        <span class="ep-section-title">Episodes</span>
        <span id="ep-count-label" style="font-size:12px;color:var(--text-muted)"></span>
      </div>
      <div id="ep-list">
        <!-- generated by JS -->
      </div>
    </div>

    <!-- Servers -->
    <div class="sidebar-section" style="background:var(--bg2);border-top:1px solid var(--border);padding:16px;">
      <div class="sidebar-section-title">Servers</div>
      <div id="server-list">
        <button class="server-btn active" onclick="setServer(1)">Server 1</button>
        <button class="server-btn" onclick="setServer(2)">Server 2</button>
        <button class="server-btn" onclick="setServer(3)">Server 3</button>
      </div>
    </div>

    <!-- Comments -->
    <div id="comments-section">
      <div class="sidebar-section-title" style="margin-bottom:12px;">Comments</div>
      <div class="comment-placeholder">💬 Comments are coming soon. Join the discussion!</div>
    </div>
  </div>

  <!-- Watch Sidebar -->
  <aside id="watch-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-title">Related Anime</div>
      <div id="related-list">
        <div style="color:var(--text-muted);font-size:13px;text-align:center;padding:16px;">Loading...</div>
      </div>
    </div>
  </aside>
</div>

<footer id="footer">
  <p>© 2025 AnimeX — Streaming powered by MegaPlay</p>
</footer>

<script>
const API = 'https://api.jikan.moe/v4';
const STREAM_BASE = 'https://megaplay.buzz/stream/mal';
const CACHE_TTL = 10 * 60 * 1000;
const cache = {
  get(k){try{const r=localStorage.getItem('ax_'+k);if(!r)return null;const{data,ts}=JSON.parse(r);if(Date.now()-ts>CACHE_TTL){localStorage.removeItem('ax_'+k);return null;}return data;}catch{return null;}},
  set(k,d){try{localStorage.setItem('ax_'+k,JSON.stringify({data:d,ts:Date.now()}));}catch{}}
};
async function fetchJ(url){
  const c=cache.get(url);if(c)return c;
  for(let i=0;i<3;i++){
    try{const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),10000);const r=await fetch(url,{signal:ctrl.signal});clearTimeout(t);if(!r.ok)throw new Error();const j=await r.json();cache.set(url,j);return j;}
    catch(e){if(i<2)await new Promise(r=>setTimeout(r,1500*(i+1)));else throw e;}
  }
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeImg(a){return a?.images?.jpg?.large_image_url||a?.images?.jpg?.image_url||'';}

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSidebar();
  if(e.key==='ArrowRight'&&!e.target.matches('input'))changeEp(1);
  if(e.key==='ArrowLeft'&&!e.target.matches('input'))changeEp(-1);
  if(e.key==='f'||e.key==='F')toggleFullscreen();
});

const params = new URLSearchParams(location.search);
let MAL_ID = params.get('id');
let currentEp = parseInt(params.get('ep')) || 1;
let currentAudio = 'sub';
let autoNext = false;
let totalEps = 1;
let animeData = null;
let theaterMode = false;
let autoNextTimer = null;

function getStreamUrl(ep, audio) {
  return `${STREAM_BASE}/${MAL_ID}/${ep}/${audio}`;
}

function loadStream(ep, audio) {
  currentEp = ep;
  currentAudio = audio;
  const iframe = document.getElementById('player-iframe');
  const loading = document.getElementById('player-loading');
  loading.style.display = 'flex';
  iframe.src = '';
  setTimeout(() => {
    iframe.src = getStreamUrl(ep, audio);
    iframe.onload = () => { loading.style.display = 'none'; };
  }, 300);

  // Update UI
  document.getElementById('ep-current-label').textContent = `EP ${ep}`;
  document.querySelectorAll('.ep-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.ep) === ep);
  });
  document.querySelectorAll('#btn-sub,#btn-dub').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+audio)?.classList.add('active');

  // Update URL without reload
  const url = new URL(location.href);
  url.searchParams.set('ep', ep);
  url.searchParams.set('audio', audio);
  history.replaceState(null, '', url.toString());

  if (autoNext) {
    clearTimeout(autoNextTimer);
    autoNextTimer = setTimeout(() => changeEp(1), 24*60*1000);
  }
}

function setAudio(a) { loadStream(currentEp, a); }
function changeEp(dir) {
  const next = currentEp + dir;
  if (next < 1 || next > totalEps) return;
  loadStream(next, currentAudio);
  const epEl = document.querySelector(`.ep-item[data-ep="${next}"]`);
  if (epEl) epEl.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function toggleAutoNext() {
  autoNext = !autoNext;
  const btn = document.getElementById('btn-autonext');
  btn.textContent = autoNext ? 'On' : 'Off';
  btn.classList.toggle('active', autoNext);
}

function toggleTheater() {
  theaterMode = !theaterMode;
  const layout = document.getElementById('watch-layout');
  const sidebar = document.getElementById('watch-sidebar');
  if (theaterMode) {
    layout.style.gridTemplateColumns = '1fr';
    sidebar.style.display = 'none';
  } else {
    layout.style.gridTemplateColumns = '';
    sidebar.style.display = '';
  }
}

function setServer(n) {
  document.querySelectorAll('.server-btn').forEach((b,i)=>b.classList.toggle('active',i===n-1));
  // Same source, just visual feedback
  loadStream(currentEp, currentAudio);
}

function toggleFullscreen() {
  const el = document.getElementById('player-box');
  if (!document.fullscreenElement) {
    el.requestFullscreen?.() || el.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
}

function buildEpList(count) {
  const list = document.getElementById('ep-list');
  list.innerHTML = Array.from({length:count},(_,i)=>{
    const ep=i+1;
    return `<div class="ep-item${ep===currentEp?' active':''}" data-ep="${ep}" onclick="loadStream(${ep},'${currentAudio}')">${ep}</div>`;
  }).join('');
  document.getElementById('ep-count-label').textContent = `${count} episodes`;
}

async function init() {
  if (!MAL_ID) { document.getElementById('anime-watch-title').textContent = 'No anime selected.'; return; }

  // Set audio from URL
  const audioParam = params.get('audio');
  if (audioParam === 'dub') currentAudio = 'dub';

  // Load stream immediately
  loadStream(currentEp, currentAudio);

  try {
    const res = await fetchJ(`${API}/anime/${MAL_ID}`);
    animeData = res?.data;
    if (!animeData) return;

    document.title = `${animeData.title} — AnimeX`;
    document.getElementById('anime-watch-title').textContent = animeData.title;

    const meta = [];
    if (animeData.score) meta.push(`<span class="meta-tag score">★ ${animeData.score}</span>`);
    if (animeData.type) meta.push(`<span class="meta-tag">${esc(animeData.type)}</span>`);
    if (animeData.status) meta.push(`<span class="meta-tag">${esc(animeData.status)}</span>`);
    document.getElementById('anime-watch-meta').innerHTML = meta.join('');

    totalEps = animeData.episodes || 24;
    buildEpList(totalEps);

    // Related
    const recRes = await fetchJ(`${API}/anime/${MAL_ID}/recommendations`);
    const recs = (recRes?.data || []).slice(0,15);
    if (recs.length) {
      document.getElementById('related-list').innerHTML = recs.map(r=>{
        const e=r.entry;if(!e)return '';
        return `<a href="watch.html?id=${e.mal_id}&ep=1" class="rel-card">
          <img src="${esc(e.images?.jpg?.image_url||'')}" alt="${esc(e.title)}" loading="lazy">
          <div class="rel-info">
            <div class="rel-title">${esc(e.title)}</div>
            <div class="rel-meta">Anime</div>
          </div>
        </a>`;
      }).join('');
    }
  } catch {
    document.getElementById('anime-watch-title').textContent = `Anime #${MAL_ID}`;
    buildEpList(24);
  }
}

init();
</script>
</body>
</html>
