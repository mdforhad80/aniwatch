<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var originalPath = window.location.pathname + window.location.search + window.location.hash;
    if (originalPath === '/' || originalPath === '') {
      window.location.replace('/');
    } else {
      window.location.replace('/?p=' + encodeURIComponent(originalPath));
    }
  </script>
</head>
<body>
  <p>Redirecting to the correct page…</p>
</body>
</html>
