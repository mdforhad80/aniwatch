<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Search and filter anime by genre, season, year, type, and more.">
<meta name="theme-color" content="#0a0a0a">
<title>Search Anime - AnimeStream</title>
<link rel="preconnect" href="https://api.jikan.moe">
<link rel="preconnect" href="https://cdn.myanimelist.net">
<style>
/* ========== CSS VARIABLES & RESET ========== */
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #111111;
  --bg-card: #161616;
  --bg-glass: rgba(22,22,22,0.85);
  --bg-overlay: rgba(0,0,0,0.7);
  --accent: #8b5cf6;
  --accent-light: #a78bfa;
  --accent-glow: rgba(139,92,246,0.4);
  --text-primary: #ffffff;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(139,92,246,0.3);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 30px var(--accent-glow);
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.5s ease;
  --header-height: 64px;
  --max-width: 1400px;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { max-width:100%; display:block; }
a { text-decoration:none; color:inherit; }
button { border:none; background:none; cursor:pointer; font-family:inherit; color:inherit; }
ul,ol { list-style:none; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, #1f1f1f 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ========== HEADER ========== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-height);
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 3vw, 40px);
  transition: var(--transition-normal);
}
.header.scrolled { background: rgba(10,10,10,0.98); box-shadow: var(--shadow-md); }

.header-left { display:flex; align-items:center; gap:16px; }
.menu-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.menu-btn:hover { background: var(--bg-card); }
.menu-btn svg { width:24px; height:24px; stroke:var(--text-primary); stroke-width:2; fill:none; }

.logo {
  font-size: clamp(1.2rem, 2vw, 1.5rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}
.logo span { -webkit-text-fill-color: var(--text-primary); background: none; }

.header-right { display:flex; align-items:center; gap:12px; }
.search-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.search-btn:hover { background: var(--bg-card); }
.search-btn svg { width:22px; height:22px; stroke:var(--text-primary); stroke-width:2; fill:none; }

/* ========== MOBILE SIDEBAR ========== */
.sidebar-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  z-index: 2000;
  opacity: 0; visibility: hidden;
  transition: var(--transition-normal);
}
.sidebar-overlay.active { opacity:1; visibility:visible; }
.sidebar {
  position: fixed; top:0; left:0; bottom:0;
  width: min(280px, 80vw);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  z-index: 2001;
  transform: translateX(-100%);
  transition: transform var(--transition-normal);
  overflow-y: auto;
  padding: 24px 0;
}
.sidebar.active { transform: translateX(0); }
.sidebar-close {
  position: absolute; top:16px; right:16px;
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm);
}
.sidebar-close svg { width:20px; height:20px; stroke:var(--text-secondary); stroke-width:2; fill:none; }
.sidebar-logo { padding: 0 24px 24px; font-size:1.3rem; font-weight:800; }
.sidebar-nav { padding: 0 16px; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 500;
  transition: var(--transition-fast);
  margin-bottom: 4px;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: rgba(139,92,246,0.15);
  color: var(--accent-light);
}
.sidebar-nav a svg { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; flex-shrink:0; }

/* ========== SEARCH OVERLAY ========== */
.search-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(10px);
  z-index: 1500;
  opacity: 0; visibility: hidden;
  transition: var(--transition-normal);
  display: flex; flex-direction: column; align-items: center;
  padding-top: clamp(80px, 15vh, 150px);
}
.search-overlay.active { opacity:1; visibility:visible; }
.search-container {
  width: min(600px, 90vw);
  position: relative;
}
.search-input {
  width: 100%;
  padding: 16px 24px 16px 52px;
  background: var(--bg-glass);
  border: 1px solid var(--border-hover);
  border-radius: var(--radius-xl);
  color: var(--text-primary);
  font-size: 1.1rem;
  outline: none;
  transition: var(--transition-fast);
}
.search-input:focus { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute; left:18px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; stroke:var(--text-muted); stroke-width:2; fill:none;
}
.search-close {
  position: absolute; top:-50px; right:0;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
}
.search-close svg { width:20px; height:20px; stroke:var(--text-primary); stroke-width:2; fill:none; }
.search-suggestions {
  margin-top: 12px;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-height: 400px;
  overflow-y: auto;
  display: none;
}
.search-suggestions.active { display: block; }
.suggestion-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: var(--transition-fast);
  cursor: pointer;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: rgba(139,92,246,0.1); }
.suggestion-item img {
  width: 48px; height: 68px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.suggestion-info { flex: 1; min-width: 0; }
.suggestion-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestion-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

/* ========== SEARCH PAGE ========== */
.search-page {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: calc(var(--header-height) + 24px) clamp(16px, 3vw, 40px) 24px;
}

.search-header {
  margin-bottom: 24px;
}
.search-header-title {
  font-size: clamp(1.5rem, 3vw, 2rem);
  font-weight: 800;
  margin-bottom: 16px;
}

/* ========== SEARCH BAR ========== */
.main-search-bar {
  display: flex; gap: 12px;
  margin-bottom: 20px;
}
.main-search-input {
  flex: 1;
  padding: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 1rem;
  outline: none;
  transition: var(--transition-fast);
}
.main-search-input:focus { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.main-search-input::placeholder { color: var(--text-muted); }
.main-search-btn {
  padding: 14px 28px;
  background: var(--accent);
  color: white;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  transition: var(--transition-fast);
}
.main-search-btn:hover { background: var(--accent-light); }

/* ========== FILTERS ========== */
.filters-bar {
  display: flex; gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.filter-group {
  display: flex; flex-direction: column; gap: 6px;
}
.filter-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.filter-select {
  padding: 8px 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.85rem;
  outline: none;
  cursor: pointer;
  min-width: 120px;
}
.filter-select:focus { border-color: var(--accent); }
.filter-select option { background: var(--bg-secondary); color: var(--text-primary); }

/* ========== RESULTS GRID ========== */
.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

/* ========== ANIME CARD ========== */
.anime-card {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-card);
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
  cursor: pointer;
}
.anime-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-glow);
}
.anime-card:hover .card-img { transform: scale(1.08); }
.card-img-wrap {
  position: relative;
  aspect-ratio: 2/3;
  overflow: hidden;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.card-img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform var(--transition-slow);
}
.card-badges {
  position: absolute; top: 8px; left: 8px;
  display: flex; flex-direction: column; gap: 4px;
  z-index: 2;
}
.card-badge {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.card-badge.score { background: rgba(255,193,7,0.9); color: #000; }
.card-badge.ep { background: rgba(139,92,246,0.9); color: #fff; }
.card-badge.hd { background: rgba(34,197,94,0.9); color: #fff; }
.card-badge.type { background: rgba(59,130,246,0.9); color: #fff; }
.card-info { padding: 12px; }
.card-title {
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}
.card-meta {
  font-size: 0.75rem;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 8px;
}

/* ========== LOAD MORE ========== */
.load-more-container {
  display: flex; justify-content: center;
  margin: 32px 0;
}
.load-more-btn {
  padding: 12px 32px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 0.9rem;
  font-weight: 600;
  transition: var(--transition-fast);
}
.load-more-btn:hover { background: var(--accent); border-color: var(--accent); }
.load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.load-more-btn.loading::after {
  content: '';
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid currentColor;
  border-top-color: transparent;
  border-radius: 50%;
  margin-left: 8px;
  animation: spin 1s linear infinite;
}

/* ========== RESULTS COUNT ========== */
.results-count {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.results-count span { color: var(--accent-light); font-weight: 700; }

/* ========== EMPTY STATE ========== */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px;
  text-align: center;
  color: var(--text-muted);
}
.empty-state svg { width:64px; height:64px; stroke:var(--text-muted); stroke-width:1.5; fill:none; margin-bottom:16px; }
.empty-state h3 { font-size: 1.3rem; color: var(--text-primary); margin-bottom: 8px; }
.empty-state p { font-size: 0.9rem; }

/* ========== FOOTER ========== */
.footer {
  border-top: 1px solid var(--border);
  padding: clamp(24px, 4vw, 40px) clamp(16px, 3vw, 40px);
  text-align: center;
  background: var(--bg-secondary);
}
.footer-content {
  max-width: var(--max-width);
  margin: 0 auto;
}
.footer-logo {
  font-size: 1.3rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.footer-text {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.footer-social {
  display: flex; justify-content: center; gap: 16px;
}
.footer-social a {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 50%;
  transition: var(--transition-fast);
}
.footer-social a:hover { background: var(--accent); border-color: var(--accent); }
.footer-social a svg { width:16px; height:16px; stroke:var(--text-secondary); stroke-width:2; fill:none; }
.footer-social a:hover svg { stroke: white; }

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .results-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .filters-bar { padding: 12px; }
  .filter-group { flex: 1; min-width: 140px; }
}
@media (max-width: 480px) {
  .results-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ========== LOADING ========== */
.page-loader {
  position: fixed; inset: 0;
  background: var(--bg-primary);
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
.page-loader.hidden { opacity: 0; visibility: hidden; }
.loader-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--bg-card);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 0.9rem; color: var(--text-muted); }
</style>
<base target="_blank">
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Searching anime...</div>
</div>

<header class="header" id="header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <a href="index.html" class="logo">Anime<span>Stream</span></a>
  </div>
  <div class="header-right">
    <button class="search-btn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="sidebar-logo">AnimeStream</div>
  <nav class="sidebar-nav">
    <a href="index.html">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="search.html" class="active">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Search
    </a>
    <a href="schedule.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Schedule
    </a>
    <a href="creator.html">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Creator
    </a>
  </nav>
</div>

<div class="search-overlay" id="searchOverlay">
  <button class="search-close" id="searchClose" aria-label="Close search">
    <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Search anime..." autocomplete="off">
    <div class="search-suggestions" id="searchSuggestions"></div>
  </div>
</div>

<div class="search-page">
  <div class="search-header">
    <h1 class="search-header-title">Search Anime</h1>
    <div class="main-search-bar">
      <input type="text" class="main-search-input" id="mainSearchInput" placeholder="Search for anime titles, genres..." autocomplete="off">
      <button class="main-search-btn" id="mainSearchBtn">Search</button>
    </div>
  </div>

  <div class="filters-bar">
    <div class="filter-group">
      <label class="filter-label">Genre</label>
      <select class="filter-select" id="genreFilter">
        <option value="">All Genres</option>
        <option value="1">Action</option>
        <option value="2">Adventure</option>
        <option value="4">Comedy</option>
        <option value="8">Drama</option>
        <option value="10">Fantasy</option>
        <option value="14">Horror</option>
        <option value="22">Romance</option>
        <option value="24">Sci-Fi</option>
        <option value="30">Sports</option>
        <option value="37">Supernatural</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Type</label>
      <select class="filter-select" id="typeFilter">
        <option value="">All Types</option>
        <option value="tv">TV</option>
        <option value="movie">Movie</option>
        <option value="ova">OVA</option>
        <option value="ona">ONA</option>
        <option value="special">Special</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Status</label>
      <select class="filter-select" id="statusFilter">
        <option value="">All Status</option>
        <option value="airing">Airing</option>
        <option value="complete">Completed</option>
        <option value="upcoming">Upcoming</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Season</label>
      <select class="filter-select" id="seasonFilter">
        <option value="">All Seasons</option>
        <option value="winter">Winter</option>
        <option value="spring">Spring</option>
        <option value="summer">Summer</option>
        <option value="fall">Fall</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Year</label>
      <select class="filter-select" id="yearFilter">
        <option value="">All Years</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Sort By</label>
      <select class="filter-select" id="sortFilter">
        <option value="popularity">Popularity</option>
        <option value="score">Score</option>
        <option value="members">Members</option>
        <option value="start_date">Start Date</option>
      </select>
    </div>
  </div>

  <div class="results-count" id="resultsCount"></div>
  <div class="results-grid" id="resultsGrid"></div>
  <div class="load-more-container" id="loadMoreContainer" style="display:none;">
    <button class="load-more-btn" id="loadMoreBtn">Load More</button>
  </div>
</div>

<footer class="footer">
  <div class="footer-content">
    <div class="footer-logo">AnimeStream</div>
    <p class="footer-text">Premium anime streaming experience. Built with passion for anime fans worldwide.</p>
    <div class="footer-social">
      <a href="#" aria-label="GitHub"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.53 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg></a>
      <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg></a>
      <a href="#" aria-label="Discord"><svg viewBox="0 0 24 24"><path d="M18 9a5 5 0 0 0-4-2 5 5 0 0 0-4 2M6 9a5 5 0 0 1 4-2 5 5 0 0 1 4 2M6 15a5 5 0 0 0 4 2 5 5 0 0 0 4-2M18 15a5 5 0 0 1-4 2 5 5 0 0 1-4-2"/></svg></a>
    </div>
  </div>
</footer>

<script>
const CONFIG = {
  API_BASE: 'https://api.jikan.moe/v4',
  CACHE_TTL: 30 * 60 * 1000,
  TIMEOUT: 8000,
  RETRIES: 2,
  RETRY_DELAY: 1500,
  DEBOUNCE_MS: 300,
  PER_PAGE: 24
};

const Cache = {
  get(key) {
    try {
      const item = localStorage.getItem('cache_' + key);
      if (!item) return null;
      const { data, timestamp } = JSON.parse(item);
      if (Date.now() - timestamp > CONFIG.CACHE_TTL) { localStorage.removeItem('cache_' + key); return null; }
      return data;
    } catch (e) { return null; }
  },
  set(key, data) {
    try { localStorage.setItem('cache_' + key, JSON.stringify({ data, timestamp: Date.now() })); } catch (e) {}
  }
};

async function apiFetch(endpoint, retries = CONFIG.RETRIES) {
  const cacheKey = endpoint.replace(/[^a-zA-Z0-9]/g, '_');
  const cached = Cache.get(cacheKey);
  if (cached) return cached;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT);
  try {
    const response = await fetch(CONFIG.API_BASE + endpoint, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (data && data.data) { Cache.set(cacheKey, data); return data; }
    throw new Error('Invalid API response');
  } catch (error) {
    clearTimeout(timeoutId);
    if (retries > 0) { await new Promise(r => setTimeout(r, CONFIG.RETRY_DELAY)); return apiFetch(endpoint, retries - 1); }
    console.error('API Error:', endpoint, error.message);
    return null;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getUrlParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

// ========== STATE ==========
let currentPage = 1;
let currentQuery = '';
let currentGenre = '';
let currentType = '';
let currentStatus = '';
let currentSeason = '';
let currentYear = '';
let currentSort = 'popularity';
let isLoading = false;
let hasMore = true;

// ========== SEARCH ==========
let searchDebounceTimer = null;
function setupSearch() {
  const searchBtn = document.getElementById('searchBtn');
  const searchOverlay = document.getElementById('searchOverlay');
  const searchClose = document.getElementById('searchClose');
  const searchInput = document.getElementById('searchInput');
  const suggestions = document.getElementById('searchSuggestions');

  searchBtn?.addEventListener('click', () => {
    searchOverlay.classList.add('active');
    setTimeout(() => searchInput?.focus(), 100);
    document.body.style.overflow = 'hidden';
  });

  const closeSearch = () => {
    searchOverlay.classList.remove('active');
    searchInput.value = '';
    suggestions.classList.remove('active');
    document.body.style.overflow = '';
  };

  searchClose?.addEventListener('click', closeSearch);
  searchOverlay?.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearch(); });

  searchInput?.addEventListener('input', (e) => {
    clearTimeout(searchDebounceTimer);
    const query = e.target.value.trim();
    if (!query) { suggestions.classList.remove('active'); return; }
    searchDebounceTimer = setTimeout(async () => {
      const data = await apiFetch(`/anime?q=${encodeURIComponent(query)}&limit=8&sfw`);
      if (!data?.data?.length) { suggestions.classList.remove('active'); return; }
      suggestions.innerHTML = data.data.map(anime => {
        const img = anime.images?.jpg?.image_url || '';
        const title = anime.title_english || anime.title || 'Unknown';
        const type = anime.type || 'TV';
        const score = anime.score ? anime.score.toFixed(1) : 'N/A';
        return `<div class="suggestion-item" onclick="window.location.href='anime.html?id=${anime.mal_id}'"><img src="${escapeHtml(img)}" alt="${escapeHtml(title)}"><div class="suggestion-info"><div class="suggestion-title">${escapeHtml(title)}</div><div class="suggestion-meta">${type} · Score: ${score}</div></div></div>`;
      }).join('');
      suggestions.classList.add('active');
    }, CONFIG.DEBOUNCE_MS);
  });

  searchInput?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const query = searchInput.value.trim(); if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`; }
    if (e.key === 'Escape') closeSearch();
  });
}

function setupSidebar() {
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebarClose = document.getElementById('sidebarClose');
  const open = () => { sidebar.classList.add('active'); sidebarOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; };
  const close = () => { sidebar.classList.remove('active'); sidebarOverlay.classList.remove('active'); document.body.style.overflow = ''; };
  menuBtn?.addEventListener('click', open);
  sidebarClose?.addEventListener('click', close);
  sidebarOverlay?.addEventListener('click', close);
}

function setupHeader() {
  const header = document.getElementById('header');
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => { header?.classList.toggle('scrolled', window.scrollY > 50); ticking = false; });
      ticking = true;
    }
  }, { passive: true });
}

// ========== ANIME CARD ==========
function animeCardHTML(anime) {
  if (!anime) return '';
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const title = anime.title_english || anime.title || 'Unknown';
  const score = anime.score ? anime.score.toFixed(1) : 'N/A';
  const type = anime.type || 'TV';
  const episodes = anime.episodes || '?';
  const year = anime.year || (anime.aired?.string?.match(/\d{4}/)?.[0]) || '';
  const genres = (anime.genres || []).slice(0, 2).map(g => g.name).join(', ');

  return `
    <a href="anime.html?id=${anime.mal_id}" class="anime-card">
      <div class="card-img-wrap">
        <img class="card-img" src="${escapeHtml(img)}" alt="${escapeHtml(title)}" loading="lazy">
        <div class="card-badges">
          <span class="card-badge score">${score}</span>
          <span class="card-badge ep">EP ${episodes}</span>
          <span class="card-badge hd">HD</span>
          <span class="card-badge type">${type}</span>
        </div>
      </div>
      <div class="card-info">
        <div class="card-title">${escapeHtml(title)}</div>
        <div class="card-meta">
          <span>${year}</span>
          <span>${escapeHtml(genres)}</span>
        </div>
      </div>
    </a>
  `;
}

// ========== SKELETON ==========
function skeletonCards(count = 12) {
  return Array.from({ length: count }, () => `
    <div class="anime-card">
      <div class="card-img-wrap"><div class="skeleton" style="width:100%;height:100%;"></div></div>
      <div class="card-info">
        <div class="skeleton" style="width:80%;height:16px;margin-bottom:8px;"></div>
        <div class="skeleton" style="width:50%;height:12px;"></div>
      </div>
    </div>
  `).join('');
}

// ========== SEARCH LOGIC ==========
function buildSearchUrl(page = 1) {
  let url = `/anime?limit=${CONFIG.PER_PAGE}&page=${page}&sfw`;
  if (currentQuery) url += `&q=${encodeURIComponent(currentQuery)}`;
  if (currentGenre) url += `&genres=${currentGenre}`;
  if (currentType) url += `&type=${currentType}`;
  if (currentStatus) url += `&status=${currentStatus}`;
  if (currentSeason) url += `&season=${currentSeason}`;
  if (currentYear) url += `&start_date=${currentYear}`;
  if (currentSort) url += `&order_by=${currentSort}&sort=desc`;
  return url;
}

async function performSearch(reset = true) {
  if (isLoading) return;
  isLoading = true;

  if (reset) {
    currentPage = 1;
    hasMore = true;
    document.getElementById('resultsGrid').innerHTML = skeletonCards(CONFIG.PER_PAGE);
    document.getElementById('loadMoreContainer').style.display = 'none';
  }

  const btn = document.getElementById('loadMoreBtn');
  if (btn) { btn.disabled = true; btn.classList.add('loading'); btn.textContent = 'Loading...'; }

  const data = await apiFetch(buildSearchUrl(currentPage));
  const items = data?.data || [];
  const pagination = data?.pagination || {};

  if (reset) {
    document.getElementById('resultsGrid').innerHTML = '';
  }

  const grid = document.getElementById('resultsGrid');
  if (!items.length && reset) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <h3>No results found</h3>
        <p>Try adjusting your search or filters</p>
      </div>
    `;
    document.getElementById('resultsCount').innerHTML = '';
    document.getElementById('loadMoreContainer').style.display = 'none';
    isLoading = false;
    if (btn) { btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Load More'; }
    return;
  }

  const html = items.map(animeCardHTML).join('');
  if (reset) grid.innerHTML = html;
  else grid.insertAdjacentHTML('beforeend', html);

  const total = pagination?.items?.total || items.length;
  document.getElementById('resultsCount').innerHTML = `Found <span>${total}</span> results`;

  hasMore = pagination?.has_next_page || false;
  document.getElementById('loadMoreContainer').style.display = hasMore ? 'flex' : 'none';

  isLoading = false;
  if (btn) { btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'Load More'; }
}

function loadMore() {
  if (isLoading || !hasMore) return;
  currentPage++;
  performSearch(false);
}

// ========== EVENT LISTENERS ==========
function setupFilters() {
  const mainSearchInput = document.getElementById('mainSearchInput');
  const mainSearchBtn = document.getElementById('mainSearchBtn');
  const genreFilter = document.getElementById('genreFilter');
  const typeFilter = document.getElementById('typeFilter');
  const statusFilter = document.getElementById('statusFilter');
  const seasonFilter = document.getElementById('seasonFilter');
  const yearFilter = document.getElementById('yearFilter');
  const sortFilter = document.getElementById('sortFilter');

  const doSearch = () => {
    currentQuery = mainSearchInput?.value.trim() || '';
    currentGenre = genreFilter?.value || '';
    currentType = typeFilter?.value || '';
    currentStatus = statusFilter?.value || '';
    currentSeason = seasonFilter?.value || '';
    currentYear = yearFilter?.value || '';
    currentSort = sortFilter?.value || 'popularity';
    performSearch(true);
  };

  mainSearchBtn?.addEventListener('click', doSearch);
  mainSearchInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  [genreFilter, typeFilter, statusFilter, seasonFilter, yearFilter, sortFilter].forEach(el => {
    el?.addEventListener('change', doSearch);
  });

  document.getElementById('loadMoreBtn')?.addEventListener('click', loadMore);
}

// ========== INFINITE SCROLL ==========
function setupInfiniteScroll() {
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
          loadMore();
        }
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  setupSidebar();
  setupSearch();
  setupHeader();
  setupFilters();
  setupInfiniteScroll();

  // Load from URL params
  const q = getUrlParam('q');
  if (q) {
    document.getElementById('mainSearchInput').value = q;
    currentQuery = q;
  }
  performSearch(true);

  const loader = document.getElementById('pageLoader');
  if (loader) loader.classList.add('hidden');
});
</script>
