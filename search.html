<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Anime - AnimeStream</title>
    <!-- COPY THE EXACT <style> TAG FROM index.html HERE -->
</head>
<body>
    <!-- Same header, sidebar, search overlay as index.html -->

    <main class="main-content" id="mainContent">
        <h2 class="section-title">🔍 Search Anime</h2>
        <div class="search-input-row" style="margin-bottom:20px;">
            <input type="text" id="searchQuery" placeholder="Search by title..." value="">
            <button class="btn btn-primary" id="searchBtnPage">Search</button>
        </div>

        <div class="flex-wrap gap-2" style="margin-bottom:20px;">
            <select id="typeFilter" class="meta-tag"><option value="">All Types</option><option>tv</option><option>movie</option><option>ova</option><option>special</option></select>
            <select id="statusFilter" class="meta-tag"><option value="">All Status</option><option>airing</option><option>complete</option><option>upcoming</option></select>
            <select id="seasonFilter" class="meta-tag"><option value="">Any Season</option><option>spring</option><option>summer</option><option>fall</option><option>winter</option></select>
            <input type="number" id="yearFilter" placeholder="Year" class="meta-tag" style="width:80px;">
        </div>

        <div class="anime-grid" id="searchResultsGrid">
            <p style="color:var(--muted);">Search for an anime to see results.</p>
        </div>
        <div id="loadMoreBtn" class="text-center mt-4 hidden">
            <button class="btn btn-outline" onclick="loadMore()">Load More</button>
        </div>
    </main>

    <footer class="site-footer">
        <!-- same footer -->
    </footer>

    <script>
        const JIKAN_BASE = 'https://api.jikan.moe/v4';
        const $ = (sel) => document.querySelector(sel);
        let currentPage = 1;
        let lastQuery = '';

        async function searchAnime(page = 1) {
            const query = document.getElementById('searchQuery').value.trim();
            const type = document.getElementById('typeFilter').value;
            const status = document.getElementById('statusFilter').value;
            const season = document.getElementById('seasonFilter').value;
            const year = document.getElementById('yearFilter').value;

            let url = `${JIKAN_BASE}/anime?page=${page}&limit=12&sfw=true`;
            if (query) url += `&q=${encodeURIComponent(query)}`;
            if (type) url += `&type=${type}`;
            if (status) url += `&status=${status}`;
            if (season && year) url += `&season=${season}&year=${year}`;

            const res = await fetch(url);
            const data = await res.json();
            return data;
        }

        function createAnimeCard(anime) {
            const img = anime.images?.jpg?.large_image_url || '';
            const title = anime.title_english || anime.title || 'Unknown';
            const type = anime.type || '';
            const episodes = anime.episodes || '?';
            const score = anime.score || 'N/A';
            return `
            <a href="anime.html?id=${anime.mal_id}" class="anime-card">
              <div class="poster-wrap">
                <img src="${img}" alt="${title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 140%22><rect fill=%22%231a1a24%22 width=%22100%22 height=%22140%22/></svg>'">
                <span class="card-badge">${type || 'TV'}</span>
                <span class="card-rating">⭐ ${score}</span>
              </div>
              <div class="card-info">
                <span class="card-title">${title}</span>
                <span class="card-meta">${episodes} eps</span>
              </div>
            </a>`;
        }

        async function performSearch(newSearch = true) {
            if (newSearch) {
                currentPage = 1;
                lastQuery = document.getElementById('searchQuery').value.trim();
                document.getElementById('searchResultsGrid').innerHTML = '';
            }

            const data = await searchAnime(currentPage);
            if (data && data.data) {
                const grid = document.getElementById('searchResultsGrid');
                if (currentPage === 1) grid.innerHTML = '';
                data.data.forEach(anime => grid.insertAdjacentHTML('beforeend', createAnimeCard(anime)));
                document.getElementById('loadMoreBtn').classList.toggle('hidden', !data.pagination?.has_next_page);
            } else {
                if (currentPage === 1) document.getElementById('searchResultsGrid').innerHTML = '<p>No results found.</p>';
            }
        }

        function loadMore() {
            currentPage++;
            performSearch(false);
        }

        document.getElementById('searchBtnPage').addEventListener('click', performSearch);
        document.getElementById('searchQuery').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
