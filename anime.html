<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Anime Details - AnimeVault</title>
    <meta name="description" content="Watch anime details, episodes, and stream in HD.">
    <meta property="og:title" content="Anime Details - AnimeVault">
    <meta property="og:type" content="website">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">AnimeVault</div>
            <div class="loading-bar"><div class="loading-progress"></div></div>
            <p class="loading-text">Loading anime details...</p>
        </div>
    </div>

    <div id="cursor-glow" class="cursor-glow"></div>
    <div id="particles" class="particles"></div>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon"><i class="fas fa-play-circle"></i></span>
                <span class="logo-text">AnimeVault</span>
            </a>
            <div class="nav-links" id="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="search.html" class="nav-link">Browse</a>
                <a href="schedule.html" class="nav-link">Schedule</a>
            </div>
            <div class="nav-actions">
                <div class="search-trigger" id="search-trigger"><i class="fas fa-search"></i></div>
                <div class="user-menu" id="user-menu">
                    <a href="login.html" class="btn btn-primary btn-sm" id="login-btn">Sign In</a>
                    <div class="user-dropdown hidden" id="user-dropdown">
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> Profile</a>
                        <a href="#" class="dropdown-item" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
            <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <div class="mobile-nav" id="mobile-nav">
        <a href="index.html" class="mobile-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="search.html" class="mobile-nav-item"><i class="fas fa-search"></i><span>Search</span></a>
        <a href="schedule.html" class="mobile-nav-item"><i class="fas fa-calendar"></i><span>Schedule</span></a>
        <a href="profile.html" class="mobile-nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </div>

    <div class="search-overlay" id="search-overlay">
        <div class="search-container">
            <div class="search-header">
                <input type="text" class="search-input" id="search-input" placeholder="Search anime..." autocomplete="off">
                <button class="search-close" id="search-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="search-results" id="search-results"></div>
        </div>
    </div>

    <main class="main-content anime-page">
        <!-- Anime Banner -->
        <section class="anime-banner" id="anime-banner">
            <div class="banner-image" id="banner-image"></div>
            <div class="banner-overlay"></div>
        </section>

        <!-- Anime Info -->
        <section class="anime-info-section">
            <div class="anime-info-container">
                <div class="anime-poster-wrapper">
                    <img src="" alt="Anime Poster" class="anime-poster" id="anime-poster" loading="lazy">
                    <div class="poster-actions">
                        <button class="btn btn-primary btn-block" id="watch-btn">
                            <i class="fas fa-play"></i> Watch Now
                        </button>
                        <div class="action-row">
                            <button class="btn btn-icon" id="bookmark-btn" title="Bookmark">
                                <i class="far fa-bookmark"></i>
                            </button>
                            <button class="btn btn-icon" id="favorite-btn" title="Favorite">
                                <i class="far fa-heart"></i>
                            </button>
                            <button class="btn btn-icon" id="share-btn" title="Share">
                                <i class="fas fa-share-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="anime-details">
                    <h1 class="anime-title" id="anime-title"></h1>
                    <p class="anime-japanese-title" id="anime-japanese-title"></p>

                    <div class="anime-meta" id="anime-meta"></div>

                    <div class="anime-rating" id="anime-rating">
                        <div class="rating-score">
                            <span class="score-value" id="score-value"></span>
                            <span class="score-max">/10</span>
                        </div>
                        <div class="rating-stars" id="rating-stars"></div>
                        <span class="rating-count" id="rating-count"></span>
                    </div>

                    <div class="anime-synopsis" id="anime-synopsis"></div>

                    <div class="anime-info-grid" id="anime-info-grid"></div>

                    <div class="anime-links" id="anime-links">
                        <span>Links:</span>
                        <a href="#" target="_blank" id="mal-link">MAL</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sub/Dub Switch -->
        <section class="stream-options">
            <div class="stream-toggle">
                <button class="toggle-btn active" data-type="sub">SUB</button>
                <button class="toggle-btn" data-type="dub">DUB</button>
            </div>
        </section>

        <!-- Episodes -->
        <section class="episodes-section">
            <div class="section-header">
                <h2 class="section-title"><i class="fas fa-list"></i> Episodes</h2>
                <div class="episode-filter">
                    <input type="text" id="episode-search" placeholder="Search episodes...">
                </div>
            </div>
            <div class="episodes-grid" id="episodes-grid"></div>
        </section>

        <!-- Characters -->
        <section class="content-section">
            <div class="section-header">
                <h2 class="section-title"><i class="fas fa-users"></i> Characters</h2>
            </div>
            <div class="content-carousel" id="characters-carousel"></div>
        </section>

        <!-- Trailer -->
        <section class="trailer-section" id="trailer-section">
            <div class="section-header">
                <h2 class="section-title"><i class="fas fa-video"></i> Trailer</h2>
            </div>
            <div class="trailer-container" id="trailer-container"></div>
        </section>

        <!-- Related Anime -->
        <section class="content-section">
            <div class="section-header">
                <h2 class="section-title"><i class="fas fa-project-diagram"></i> Related Anime</h2>
            </div>
            <div class="anime-grid" id="related-grid"></div>
        </section>

        <!-- Recommendations -->
        <section class="content-section">
            <div class="section-header">
                <h2 class="section-title"><i class="fas fa-thumbs-up"></i> Recommendations</h2>
            </div>
            <div class="content-carousel" id="recommendations-carousel"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <div class="logo">
                    <span class="logo-icon"><i class="fas fa-play-circle"></i></span>
                    <span class="logo-text">AnimeVault</span>
                </div>
                <p>Your premium destination for anime streaming.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p> AnimeVault. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="assets/js/anime-page.js"></script>
</body>
</html>
