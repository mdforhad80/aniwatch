<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Anime Details - AnimeX">
<title>Anime Details — AnimeX</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #07070f; color: #e8e8f0; }
:root {
  --primary: #8b5cf6; --primary-dark: #6d28d9; --primary-glow: rgba(139,92,246,0.4);
  --accent: #06b6d4; --bg: #07070f; --bg2: #0d0d1a; --bg3: #12121f;
  --card-bg: rgba(255,255,255,0.04); --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.08); --text: #e8e8f0; --text-muted: #8888a8;
  --radius: 12px; --header-h: 64px; --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg2); } ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

/* HEADER */
#header {
  position: fixed; top:0; left:0; right:0; height: var(--header-h); z-index:1000;
  display:flex; align-items:center; padding: 0 clamp(12px,3vw,32px); gap:16px;
  background: linear-gradient(180deg,rgba(7,7,15,0.98),rgba(7,7,15,0.85));
  backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
}
.logo-text { font-size: clamp(20px,4vw,28px); font-weight:900; letter-spacing:-1px; background: linear-gradient(135deg,#fff,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; text-decoration:none; }
.icon-btn { width:40px;height:40px;border:none;background:var(--glass);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all var(--transition);flex-shrink:0; }
.icon-btn:hover { background:var(--primary);box-shadow:0 0 20px var(--primary-glow); }
.icon-btn svg { width:18px;height:18px;fill:currentColor; }
.header-logo { flex:1;display:flex;justify-content:center; }
.header-left,.header-right { display:flex;align-items:center;gap:8px;min-width:80px; }
.header-right { justify-content:flex-end; }
.nav-links { display:flex;gap:4px;list-style:none; }
.nav-links a { padding:6px 12px;color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:500;border-radius:8px;transition:all var(--transition);white-space:nowrap; }
.nav-links a:hover { color:var(--text);background:var(--glass); }

/* SIDEBAR */
#sidebar-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1100;opacity:0;pointer-events:none;transition:opacity var(--transition);backdrop-filter:blur(4px); }
#sidebar-overlay.open { opacity:1;pointer-events:all; }
#sidebar { position:fixed;top:0;left:0;width:min(280px,80vw);height:100%;background:var(--bg2);border-right:1px solid var(--border);z-index:1200;transform:translateX(-100%);transition:transform var(--transition);display:flex;flex-direction:column;padding:24px 0; }
#sidebar.open { transform:translateX(0); }
.sidebar-header { padding:0 20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between; }
.sidebar-nav { padding:16px 0;flex:1;overflow-y:auto; }
.sidebar-nav a { display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text-muted);text-decoration:none;font-size:15px;font-weight:500;transition:all var(--transition); }
.sidebar-nav a:hover { color:var(--text);background:var(--glass); }
.sidebar-nav a svg { width:18px;height:18px;fill:currentColor;flex-shrink:0; }

/* SEARCH OVERLAY */
#search-overlay { position:fixed;inset:0;background:rgba(7,7,15,0.95);z-index:2000;opacity:0;pointer-events:none;transition:opacity var(--transition);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;padding:clamp(16px,5vw,80px) clamp(16px,5vw,40px);overflow-y:auto; }
#search-overlay.open { opacity:1;pointer-events:all; }
.search-box { width:100%;max-width:700px;position:relative;margin-top:20px; }
.search-box input { width:100%;padding:16px 56px 16px 20px;font-size:clamp(16px,3vw,20px);background:var(--bg3);border:2px solid var(--primary);border-radius:50px;color:var(--text);outline:none;box-shadow:0 0 30px var(--primary-glow); }
.search-box input::placeholder { color:var(--text-muted); }
.search-close { position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px; }
#search-results { width:100%;max-width:700px;margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px; }
.search-card { background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform var(--transition);text-decoration:none;color:var(--text); }
.search-card:hover { transform:translateY(-4px); }
.search-card img { width:100%;aspect-ratio:2/3;object-fit:cover;display:block; }
.search-card-info { padding:8px;font-size:12px;font-weight:600;line-height:1.3; }

/* BANNER */
#banner {
  position:relative; width:100%; height:clamp(280px,45vw,520px);
  margin-top:var(--header-h);
  overflow:hidden;
}
#banner-img { width:100%;height:100%;object-fit:cover;object-position:center top;display:block; }
.banner-overlay { position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,7,15,1) 0%,rgba(7,7,15,0.5) 40%,rgba(7,7,15,0.1) 100%); }

/* DETAILS LAYOUT */
#details-wrap {
  position:relative;z-index:2;
  max-width:1400px; margin:0 auto;
  padding: clamp(16px,3vw,40px);
  margin-top:-160px;
}
#details-grid {
  display:grid;
  grid-template-columns: clamp(150px,20vw,240px) 1fr;
  gap: clamp(20px,3vw,40px);
  align-items:start;
}
@media(max-width:600px) {
  #details-grid { grid-template-columns:1fr; }
  #poster-col { display:flex;gap:16px;align-items:flex-start; }
  #poster-img { width:120px;flex-shrink:0; }
  #details-wrap { margin-top:-80px; }
}

#poster-img {
  width:100%;border-radius:var(--radius);border:2px solid var(--border);
  box-shadow:0 8px 40px rgba(0,0,0,0.8);display:block;
}
.watch-btn {
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:12px;padding:12px;
  background:var(--primary);color:white;border:none;
  border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;
  text-decoration:none;transition:all var(--transition);
}
.watch-btn:hover { background:var(--primary-dark);box-shadow:0 0 30px var(--primary-glow); }

/* Info col */
.anime-title-main { font-size:clamp(20px,4vw,38px);font-weight:900;line-height:1.1;margin-bottom:8px; }
.anime-title-en { font-size:clamp(13px,2vw,18px);color:var(--text-muted);margin-bottom:16px;font-weight:400; }
.meta-row { display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center; }
.meta-chip {
  padding:4px 12px;background:var(--card-bg);border:1px solid var(--border);
  border-radius:20px;font-size:12px;color:var(--text-muted);
  display:flex;align-items:center;gap:5px;
}
.meta-chip.score { background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.3);color:#fbbf24;font-weight:700; }
.meta-chip.airing { background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:#4ade80; }
.meta-chip.primary { background:rgba(139,92,246,0.15);border-color:var(--primary);color:var(--primary);font-weight:600; }

.genres-wrap { display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px; }
.genre-pill { padding:4px 12px;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.3);border-radius:20px;font-size:12px;color:var(--primary);font-weight:600; }

.section-title { font-size:clamp(16px,2.5vw,20px);font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px; }
.section-title::before { content:'';display:block;width:4px;height:20px;background:var(--primary);border-radius:2px;flex-shrink:0; }

.synopsis { font-size:clamp(13px,1.5vw,15px);color:#b0b0c8;line-height:1.75;margin-bottom:24px; }

/* Info table */
.info-table { width:100%;border-collapse:collapse;margin-bottom:24px; }
.info-table td { padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top; }
.info-table td:first-child { color:var(--text-muted);width:120px;font-weight:600;padding-right:12px;flex-shrink:0; }

/* Trailer */
.trailer-wrap { position:relative;width:100%;padding-top:56.25%;margin-bottom:24px;border-radius:var(--radius);overflow:hidden;background:var(--bg2); }
.trailer-wrap iframe { position:absolute;inset:0;width:100%;height:100%;border:none; }

/* Episodes */
#ep-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(52px,1fr));
  gap:6px;
  max-height:280px;
  overflow-y:auto;
  padding:12px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:24px;
}
.ep-btn {
  padding:8px 4px;background:var(--card-bg);border:1px solid var(--border);
  border-radius:8px;font-size:12px;font-weight:700;color:var(--text-muted);
  cursor:pointer;text-align:center;text-decoration:none;transition:all var(--transition);
  display:flex;align-items:center;justify-content:center;
}
.ep-btn:hover { background:var(--primary);border-color:var(--primary);color:white;box-shadow:0 0 10px var(--primary-glow); }

/* Characters */
#chars-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(130px,40vw),1fr));
  gap:12px;
  margin-bottom:24px;
}
.char-card {
  background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:transform var(--transition),box-shadow var(--transition);
}
.char-card:hover { transform:translateY(-4px);box-shadow:0 8px 30px var(--primary-glow); }
.char-card img { width:100%;aspect-ratio:3/4;object-fit:cover;display:block; }
.char-info { padding:8px;font-size:12px; }
.char-name { font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
.char-role { color:var(--text-muted);font-size:11px;margin-top:2px; }

/* Slider for recommendations */
.rec-slider-wrap { position:relative; }
.rec-track {
  display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding-bottom:8px;cursor:grab;
  scrollbar-width:thin;scrollbar-color:var(--primary) var(--bg2);
}
.rec-track:active { cursor:grabbing; }
.rec-card {
  flex-shrink:0;width:clamp(120px,13vw,160px);border-radius:var(--radius);
  overflow:hidden;background:var(--card-bg);border:1px solid var(--border);
  cursor:pointer;scroll-snap-align:start;text-decoration:none;color:var(--text);
  transition:transform var(--transition),box-shadow var(--transition);
}
.rec-card:hover { transform:translateY(-5px);box-shadow:0 8px 30px var(--primary-glow); }
.rec-card img { width:100%;aspect-ratio:2/3;object-fit:cover;display:block; }
.rec-info { padding:8px;font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }

/* FOOTER */
#footer { margin-top:60px;padding:24px clamp(12px,3vw,40px);border-top:1px solid var(--border);text-align:center;color:var(--text-muted);font-size:13px;background:var(--bg2); }
.footer-logo { font-size:20px;font-weight:900;background:linear-gradient(135deg,#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;display:block; }

/* Skeleton */
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.sk-pulse { background:linear-gradient(110deg,var(--bg2) 0%,var(--bg3) 50%,var(--bg2) 100%);background-size:200% 100%;animation:shimmer 1.5s infinite; }

/* FULL PAGE */
#details-main { max-width:1400px;margin:0 auto;padding:0 clamp(16px,3vw,40px) 40px; }
.two-col { display:grid;grid-template-columns:1fr min(340px,30vw);gap:32px;align-items:start; }
@media(max-width:900px) { .two-col { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside id="sidebar">
  <div class="sidebar-header">
    <span class="logo-text">AnimeX</span>
    <button class="icon-btn" onclick="closeSidebar()"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg> Home</a>
    <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg> Search</a>
    <a href="schedule.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Schedule</a>
  </nav>
</aside>

<header id="header">
  <div class="header-left">
    <button class="icon-btn" onclick="openSidebar()"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    <nav><ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="schedule.html">Schedule</a></li>
    </ul></nav>
  </div>
  <div class="header-logo"><a href="index.html" class="logo-text">AnimeX</a></div>
  <div class="header-right">
    <button class="icon-btn" onclick="openSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
  </div>
</header>

<div id="search-overlay">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search anime..." autocomplete="off">
    <button class="search-close" onclick="closeSearch()">✕</button>
  </div>
  <div id="search-results"></div>
</div>

<!-- BANNER -->
<div id="banner">
  <img id="banner-img" src="" alt="" loading="eager">
  <div class="banner-overlay"></div>
</div>

<!-- DETAILS -->
<div id="details-wrap">
  <div id="details-grid">
    <div id="poster-col">
      <img id="poster-img" src="" alt="Anime Poster" loading="eager">
      <a id="watch-link" href="#" class="watch-btn">▶ Watch Now</a>
    </div>
    <div id="info-col">
      <div id="info-loading" style="color:var(--text-muted)">Loading...</div>
    </div>
  </div>
</div>

<div id="details-main">
  <div class="two-col">
    <div>
      <div id="synopsis-section"></div>
      <div id="trailer-section"></div>
      <div id="episodes-section"></div>
      <div id="chars-section"></div>
      <div id="relations-section"></div>
      <div id="recommendations-section"></div>
    </div>
    <div id="sidebar-info"></div>
  </div>
</div>

<footer id="footer">
  <span class="footer-logo">AnimeX</span>
  <p>© 2025 AnimeX — All rights reserved. Powered by Jikan API.</p>
</footer>

<script>
const API = 'https://api.jikan.moe/v4';
const CACHE_TTL = 10 * 60 * 1000;
const cache = {
  get(k){try{const r=localStorage.getItem('ax_'+k);if(!r)return null;const{data,ts}=JSON.parse(r);if(Date.now()-ts>CACHE_TTL){localStorage.removeItem('ax_'+k);return null;}return data;}catch{return null;}},
  set(k,d){try{localStorage.setItem('ax_'+k,JSON.stringify({data:d,ts:Date.now()}));}catch{}}
};

async function fetchJ(url) {
  const c=cache.get(url);if(c)return c;
  for(let i=0;i<3;i++){
    try{
      const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),10000);
      const r=await fetch(url,{signal:ctrl.signal});clearTimeout(t);
      if(!r.ok)throw new Error();
      const j=await r.json();if(j)cache.set(url,j);return j;
    }catch(e){if(i<2)await new Promise(r=>setTimeout(r,1500*(i+1)));else throw e;}
  }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeImg(a){return a?.images?.jpg?.large_image_url||a?.images?.jpg?.image_url||'';}
function safeBanner(a){return a?.trailer?.images?.maximum_image_url||safeImg(a);}

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-overlay').classList.remove('open');document.body.style.overflow='';}
function openSearch(){document.getElementById('search-overlay').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>document.getElementById('search-input').focus(),100);}
function closeSearch(){document.getElementById('search-overlay').classList.remove('open');document.body.style.overflow='';document.getElementById('search-input').value='';document.getElementById('search-results').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();closeSidebar();}});
let sTimer=null;
document.getElementById('search-input').addEventListener('input',e=>{
  clearTimeout(sTimer);const q=e.target.value.trim();
  if(!q){document.getElementById('search-results').innerHTML='';return;}
  sTimer=setTimeout(async()=>{
    try{const r=await fetchJ(`${API}/anime?q=${encodeURIComponent(q)}&limit=12&sfw=true`);
    document.getElementById('search-results').innerHTML=(r.data||[]).map(a=>`<a href="anime.html?id=${a.mal_id}" class="search-card" onclick="closeSearch()"><img src="${safeImg(a)}" loading="lazy"><div class="search-card-info">${esc(a.title)}</div></a>`).join('');}catch{}
  },400);
});

const params = new URLSearchParams(location.search);
const MAL_ID = params.get('id');

async function loadAnime() {
  if (!MAL_ID) { document.getElementById('info-col').innerHTML = '<p style="color:var(--text-muted)">No anime ID provided.</p>'; return; }
  try {
    const [mainRes, charsRes, recsRes] = await Promise.allSettled([
      fetchJ(`${API}/anime/${MAL_ID}/full`),
      fetchJ(`${API}/anime/${MAL_ID}/characters`),
      fetchJ(`${API}/anime/${MAL_ID}/recommendations`)
    ]);

    const a = mainRes.status === 'fulfilled' ? mainRes.value?.data : null;
    if (!a) { document.getElementById('info-col').innerHTML = '<p style="color:var(--text-muted)">Could not load anime details.</p>'; return; }

    // Update page meta
    document.title = `${a.title} — AnimeX`;

    // Banner + poster
    const banner = safeBanner(a);
    const poster = safeImg(a);
    document.getElementById('banner-img').src = banner || poster;
    document.getElementById('banner-img').alt = a.title;
    document.getElementById('poster-img').src = poster;
    document.getElementById('poster-img').alt = a.title;
    document.getElementById('watch-link').href = `watch.html?id=${a.mal_id}&ep=1`;

    // Info col
    const genres = (a.genres||[]).map(g=>`<span class="genre-pill">${esc(g.name)}</span>`).join('');
    const score = a.score ? `<span class="meta-chip score">★ ${a.score}</span>` : '';
    const status = a.status ? `<span class="meta-chip ${a.status==='Currently Airing'?'airing':''}">${esc(a.status)}</span>` : '';
    const type = a.type ? `<span class="meta-chip primary">${esc(a.type)}</span>` : '';
    const eps = a.episodes ? `<span class="meta-chip">${a.episodes} Episodes</span>` : '';

    document.getElementById('info-col').innerHTML = `
      <h1 class="anime-title-main">${esc(a.title)}</h1>
      ${a.title_english && a.title_english !== a.title ? `<div class="anime-title-en">${esc(a.title_english)}</div>` : ''}
      <div class="meta-row">${score}${status}${type}${eps}</div>
      <div class="genres-wrap">${genres}</div>
    `;
    document.getElementById('info-loading').remove();

    // Synopsis
    document.getElementById('synopsis-section').innerHTML = a.synopsis ? `
      <h2 class="section-title">Synopsis</h2>
      <p class="synopsis">${esc(a.synopsis)}</p>` : '';

    // Trailer
    if (a.trailer?.embed_url) {
      document.getElementById('trailer-section').innerHTML = `
        <h2 class="section-title">Trailer</h2>
        <div class="trailer-wrap"><iframe src="${esc(a.trailer.embed_url)}" allowfullscreen loading="lazy"></iframe></div>`;
    }

    // Episodes
    const epCount = a.episodes || 12;
    const epItems = Array.from({length: Math.min(epCount, 200)}, (_,i) => {
      const ep = i+1;
      return `<a href="watch.html?id=${a.mal_id}&ep=${ep}" class="ep-btn">${ep}</a>`;
    }).join('');
    document.getElementById('episodes-section').innerHTML = `
      <h2 class="section-title">Episodes</h2>
      <div id="ep-grid">${epItems}</div>`;

    // Characters
    const chars = charsRes.status === 'fulfilled' ? (charsRes.value?.data || []).slice(0,12) : [];
    if (chars.length) {
      document.getElementById('chars-section').innerHTML = `
        <h2 class="section-title">Characters</h2>
        <div id="chars-grid">${chars.map(c => {
          const img = c.character?.images?.jpg?.image_url || '';
          return `<div class="char-card">
            <img src="${esc(img)}" alt="${esc(c.character?.name)}" loading="lazy">
            <div class="char-info">
              <div class="char-name">${esc(c.character?.name)}</div>
              <div class="char-role">${esc(c.role)}</div>
            </div>
          </div>`;
        }).join('')}</div>`;
    }

    // Recommendations
    const recs = recsRes.status === 'fulfilled' ? (recsRes.value?.data || []).slice(0,15) : [];
    if (recs.length) {
      document.getElementById('recommendations-section').innerHTML = `
        <h2 class="section-title">Recommendations</h2>
        <div class="rec-slider-wrap">
          <div class="rec-track">${recs.map(r => {
            const entry = r.entry;
            if (!entry) return '';
            return `<a href="anime.html?id=${entry.mal_id}" class="rec-card">
              <img src="${esc(entry.images?.jpg?.large_image_url||entry.images?.jpg?.image_url||'')}" alt="${esc(entry.title)}" loading="lazy">
              <div class="rec-info">${esc(entry.title)}</div>
            </a>`;
          }).join('')}</div>
        </div>`;
    }

    // Sidebar info table
    const infoRows = [
      ['Japanese', a.title_japanese],
      ['Type', a.type],
      ['Episodes', a.episodes],
      ['Status', a.status],
      ['Aired', a.aired?.string],
      ['Season', a.season ? `${a.season} ${a.year}` : a.year],
      ['Studio', (a.studios||[]).map(s=>s.name).join(', ')],
      ['Source', a.source],
      ['Duration', a.duration],
      ['Rating', a.rating],
      ['Ranked', a.rank ? `#${a.rank}` : null],
      ['Popularity', a.popularity ? `#${a.popularity}` : null],
      ['Members', a.members?.toLocaleString()],
    ].filter(r=>r[1]).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(String(r[1]))}</td></tr>`).join('');

    document.getElementById('sidebar-info').innerHTML = `
      <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;">
        <h3 class="section-title" style="font-size:16px;">Information</h3>
        <table class="info-table"><tbody>${infoRows}</tbody></table>
      </div>`;

    // Relations
    if (a.relations?.length) {
      const rels = a.relations.slice(0,6);
      document.getElementById('relations-section').innerHTML = `
        <h2 class="section-title">Related</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,45vw),1fr));gap:10px;margin-bottom:24px;">
          ${rels.map(rel=>rel.entry?.map(e=>`
            <a href="anime.html?id=${e.mal_id}" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-decoration:none;color:var(--text);transition:border-color var(--transition);display:block;">
              <div style="font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px;">${esc(rel.relation)}</div>
              <div style="font-size:13px;font-weight:600;line-height:1.3;">${esc(e.name)}</div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${esc(e.type)}</div>
            </a>`).join('')).join('')}
        </div>`;
    }
  } catch(e) {
    document.getElementById('info-col').innerHTML = `<p style="color:var(--text-muted)">Failed to load anime. <a href="#" onclick="loadAnime()" style="color:var(--primary)">Retry</a></p>`;
  }
}

loadAnime();
</script>
</body>
</html>
