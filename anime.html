<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AnimeStream - Watch HD Anime Online with Sub & Dub">
    <meta property="og:title" content="AnimeStream - Premium Anime Streaming">
    <meta property="og:description" content="Watch HD Anime Online with Sub & Dub. Trending, Top Rated, and more.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0a0a0f">
    <title>AnimeStream - Watch HD Anime Online</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #14141e;
            --surface2: #1a1a28;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --pink: #ec4899;
            --gold: #f59e0b;
            --text: #f1f5f9;
            --text2: #a1a1aa;
            --text3: #71717a;
            --radius: 14px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow-glow: 0 0 30px rgba(139, 92, 246, 0.25);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.5);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --header-h: 60px;
            --max-width: 1400px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: clamp(14px, 1.5vw, 16px);
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            overflow-x: hidden;
            max-width: 100%;
            width: 100%;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            display: block;
        }
        button {
            cursor: pointer;
            border: none;
            font-family: inherit;
            background: none;
            color: inherit;
        }
        input {
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            height: var(--header-h);
            display: flex;
            align-items: center;
            padding: 0 clamp(12px, 3vw, 32px);
            gap: 16px;
        }
        .header .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            z-index: 1001;
            flex-shrink: 0;
        }
        .header .hamburger:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .header .hamburger span {
            width: 22px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: var(--transition);
        }
        .header .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .header .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .header .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .header .logo {
            font-size: clamp(1.2rem, 2.5vw, 1.5rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent2), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .header .logo span {
            -webkit-text-fill-color: var(--text);
            font-weight: 400;
            font-size: 0.7em;
            margin-left: 2px;
        }
        .header .nav-links {
            display: flex;
            gap: clamp(8px, 2vw, 20px);
            margin-left: auto;
            align-items: center;
            flex-shrink: 0;
        }
        .header .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text2);
            transition: var(--transition);
            white-space: nowrap;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
        }
        .header .nav-links a:hover,
        .header .nav-links a.active {
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
        }
        .header .search-trigger {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
            font-size: 1.2rem;
        }
        .header .search-trigger:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .header .nav-links a.hide-mobile {
            display: none;
        }
        @media(min-width:768px) {
            .header .nav-links a.hide-mobile {
                display: inline;
            }
        }

        /* SIDEBAR */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: min(300px, 80vw);
            height: 100vh;
            background: var(--surface);
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 80px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }
        .sidebar.active {
            transform: translateX(0);
        }
        .sidebar a {
            display: block;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            transition: var(--transition);
            color: var(--text2);
            font-size: 0.95rem;
        }
        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(139, 92, 246, 0.12);
            color: var(--text);
        }
        .sidebar .sidebar-social {
            margin-top: auto;
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--text3);
        }

        /* SEARCH OVERLAY */
        .search-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(40px, 8vh, 80px) clamp(16px, 4vw, 40px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            gap: 20px;
        }
        .search-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .search-overlay .search-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }
        .search-overlay .search-close:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .search-overlay .search-input-wrap {
            width: min(600px, 90vw);
            position: relative;
        }
        .search-overlay input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            font-size: 1.1rem;
            background: var(--surface2);
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            transition: var(--transition);
            color: var(--text);
        }
        .search-overlay input:focus {
            border-color: var(--accent);
            box-shadow: var(--shadow-glow);
        }
        .search-overlay .search-icon-inner {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            color: var(--text3);
            pointer-events: none;
        }
        .search-overlay .search-results {
            width: min(600px, 90vw);
            max-height: 50vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .search-overlay .search-result-item {
            display: flex;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
            align-items: center;
        }
        .search-overlay .search-result-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .search-overlay .search-result-item img {
            width: 48px;
            height: 64px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: var(--surface2);
        }
        .search-overlay .search-result-item .info {
            font-size: 0.9rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .search-overlay .search-result-item .info small {
            display: block;
            color: var(--text3);
            font-weight: 400;
            font-size: 0.75rem;
        }

        /* HERO SLIDER */
        .hero-section {
            position: relative;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            height: clamp(380px, 55vw, 620px);
            margin-bottom: clamp(20px, 3vw, 40px);
        }
        .hero-track {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: transform;
        }
        .hero-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            flex-shrink: 0;
        }
        .hero-slide .hero-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .hero-slide .hero-gradient {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(to top, var(--bg) 0%, rgba(10, 10, 15, 0.7) 30%, rgba(10, 10, 15, 0.25) 60%, rgba(10, 10, 15, 0.4) 100%),
                linear-gradient(to right, rgba(10, 10, 15, 0.9) 0%, transparent 50%, rgba(10, 10, 15, 0.5) 100%);
        }
        .hero-slide .hero-content {
            position: absolute;
            z-index: 2;
            bottom: clamp(30px, 8%, 80px);
            left: clamp(16px, 5vw, 60px);
            max-width: min(600px, 85vw);
        }
        .hero-slide .hero-content .hero-title {
            font-size: clamp(1.6rem, 4vw, 3rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);
        }
        .hero-slide .hero-content .hero-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text2);
            margin-bottom: 8px;
        }
        .hero-slide .hero-content .hero-meta .score {
            color: var(--gold);
            font-weight: 700;
            font-size: 0.9rem;
        }
        .hero-slide .hero-content .hero-synopsis {
            font-size: clamp(0.75rem, 1.3vw, 0.9rem);
            color: var(--text2);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .hero-slide .hero-content .hero-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hero-slide .hero-content .hero-btns .btn {
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-primary:hover {
            background: #7c3aed;
            box-shadow: 0 6px 28px rgba(139, 92, 246, 0.55);
            transform: translateY(-2px);
        }
        .btn-outline {
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            backdrop-filter: blur(8px);
        }
        .btn-outline:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }
        .hero-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: var(--transition);
            color: #fff;
        }
        .hero-arrow:hover {
            background: rgba(139, 92, 246, 0.5);
            border-color: var(--accent);
        }
        .hero-arrow.prev {
            left: clamp(8px, 2vw, 20px);
        }
        .hero-arrow.next {
            right: clamp(8px, 2vw, 20px);
        }
        .hero-dots {
            position: absolute;
            bottom: 16px;
            right: clamp(16px, 5vw, 40px);
            z-index: 5;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .hero-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transition: var(--transition);
            cursor: pointer;
        }
        .hero-dots .dot.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            width: 24px;
            border-radius: 20px;
        }
        @media(max-width:600px) {
            .hero-arrow {
                width: 34px;
                height: 34px;
                font-size: 0.9rem;
            }
            .hero-dots .dot {
                width: 6px;
                height: 6px;
            }
            .hero-dots .dot.active {
                width: 18px;
            }
            .hero-slide .hero-content .hero-btns .btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }

        /* UNIVERSAL SLIDER SECTION */
        .widget-section {
            padding: 0 clamp(12px, 3vw, 32px);
            margin-bottom: clamp(24px, 4vw, 48px);
            position: relative;
            z-index: 1;
        }
        .widget-section .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .widget-section .section-title {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .widget-section .section-title .icon {
            color: var(--accent);
            font-size: 1.1em;
        }
        .widget-section .slider-wrap {
            position: relative;
            overflow: hidden;
        }
        .widget-section .slider-track {
            display: flex;
            gap: clamp(10px, 1.5vw, 16px);
            transition: transform 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: transform;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            padding: 4px 0;
        }
        .widget-section .slider-track:active {
            cursor: grabbing;
        }
        .widget-section .slider-track.dragging {
            transition: none;
        }
        .anime-card {
            flex-shrink: 0;
            width: clamp(140px, 18vw, 175px);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
            transition: var(--transition);
            position: relative;
            box-shadow: var(--shadow-card);
            cursor: pointer;
        }
        .anime-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.3);
            z-index: 2;
        }
        .anime-card .card-poster {
            aspect-ratio: 2/3;
            width: 100%;
            object-fit: cover;
            background: var(--surface2);
            display: block;
        }
        .anime-card .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 10px 10px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            pointer-events: none;
        }
        .anime-card .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .anime-card .card-badges {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            z-index: 2;
        }
        .anime-card .badge {
            font-size: 0.65rem;
            padding: 3px 7px;
            border-radius: 20px;
            font-weight: 700;
            backdrop-filter: blur(6px);
            color: #fff;
            letter-spacing: 0.3px;
        }
        .badge-score {
            background: rgba(245, 158, 11, 0.85);
        }
        .badge-ep {
            background: rgba(139, 92, 246, 0.85);
        }
        .badge-hd {
            background: rgba(236, 72, 153, 0.85);
        }
        .badge-type {
            background: rgba(30, 200, 160, 0.85);
        }
        .widget-section .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: var(--transition);
            color: #fff;
        }
        .widget-section .slider-arrow:hover {
            background: rgba(139, 92, 246, 0.6);
            border-color: var(--accent);
        }
        .widget-section .slider-arrow.prev {
            left: -8px;
        }
        .widget-section .slider-arrow.next {
            right: -8px;
        }
        @media(max-width:600px) {
            .widget-section .slider-arrow {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
            .anime-card {
                width: clamp(120px, 32vw, 150px);
            }
        }

        /* SKELETON */
        .skeleton {
            background: var(--surface2);
            border-radius: var(--radius);
            animation: shimmer 1.5s infinite;
            position: relative;
            overflow: hidden;
        }
        .skeleton::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            animation: shimmerMove 1.5s infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        @keyframes shimmerMove {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        .skeleton-card {
            flex-shrink: 0;
            width: clamp(140px, 18vw, 175px);
            aspect-ratio: 2/3;
            border-radius: var(--radius);
        }

        /* FOOTER */
        .footer {
            padding: 24px clamp(12px, 3vw, 32px);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: var(--text3);
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer .footer-social {
            display: flex;
            gap: 14px;
            font-size: 1.1rem;
            color: var(--text2);
        }
        .footer .footer-social a:hover {
            color: var(--accent);
            transition: var(--transition);
        }

        /* ERROR FALLBACK */
        .error-widget {
            padding: 30px;
            text-align: center;
            color: var(--text3);
            font-size: 0.9rem;
            background: var(--surface);
            border-radius: var(--radius);
        }
        .error-widget button {
            margin-top: 10px;
            padding: 8px 18px;
            background: var(--accent);
            color: #fff;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        @media(min-width:1800px) {
            .anime-card {
                width: 190px;
            }
            .skeleton-card {
                width: 190px;
            }
        }
        @media(max-width:480px) {
            .header .nav-links a {
                font-size: 0.75rem;
                padding: 4px 6px;
            }
            .header .logo {
                font-size: 1rem;
            }
            .hero-section {
                height: clamp(300px, 70vw, 400px);
            }
            .hero-slide .hero-content {
                bottom: 20px;
                left: 12px;
                max-width: 90vw;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
            <span></span><span></span><span></span>

    <script>
        (function() {
            // ==================== GLOBAL STATE ====================
            const JIKAN_BASE = 'https://api.jikan.moe/v4';
            const CACHE_PREFIX = 'anstream_cache_';
            const CACHE_TTL = 15 * 60 * 1000; // 15 minutes
            const REQUEST_TIMEOUT = 12000;
            const MAX_RETRIES = 2;

            // ==================== UTILITY FUNCTIONS ====================
            function getCache(key) {
                try {
                    const d = localStorage.getItem(CACHE_PREFIX + key);
                    if (!d) return null;
                    const p = JSON.parse(d);
                    if (Date.now() - p.ts > CACHE_TTL) { localStorage.removeItem(CACHE_PREFIX + key); return null; }
                    return p.data;
                } catch (e) { return null; }
            }

            function setCache(key, data) {
                try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(),
                        data })); } catch (e) {}
            }

            async function fetchWithRetry(url, cacheKey = null, retries = MAX_RETRIES) {
                if (cacheKey) {
                    const cached = getCache(cacheKey);
                    if (cached) return cached;
                }
                for (let i = 0; i <= retries; i++) {
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
                        const resp = await fetch(url, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                        const json = await resp.json();
                        if (cacheKey) setCache(cacheKey, json);
                        return json;
                    } catch (e) {
                        if (i === retries) throw e;
                        await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                    }
                }
            }

            function safeGet(arr, idx, def = null) {
                try { return arr && arr[idx] !== undefined ? arr[idx] : def; } catch (e) { return def; }
            }

            // ==================== UNIVERSAL SLIDER CLASS ====================
            class UniversalSlider {
                constructor(trackEl, containerEl, options = {}) {
                    this.track = trackEl;
                    this.container = containerEl;
                    this.cardWidth = options.cardWidth || 175;
                    this.gap = options.gap || 16;
                    this.scrollAmount = options.scrollAmount || null;
                    this.isDragging = false;
                    this.startX = 0;
                    this.scrollLeft = 0;
                    this.currentOffset = 0;
                    this.maxOffset = 0;
                    this.initialized = false;
                    this.arrows = { prev: null, next: null };
                    this.onChange = options.onChange || null;
                    this._boundRecalc = this._recalc.bind(this);
                    this._boundMouseDown = this._onMouseDown.bind(this);
                    this._boundMouseMove = this._onMouseMove.bind(this);
                    this._boundMouseUp = this._onMouseUp.bind(this);
                    this._boundTouchStart = this._onTouchStart.bind(this);
                    this._boundTouchMove = this._onTouchMove.bind(this);
                    this._boundTouchEnd = this._onTouchEnd.bind(this);
                    this._boundWheel = this._onWheel.bind(this);
                }

                init() {
                    if (this.initialized) this.destroy();
                    this.track.addEventListener('mousedown', this._boundMouseDown);
                    this.track.addEventListener('touchstart', this._boundTouchStart, { passive: false });
                    this.track.addEventListener('wheel', this._boundWheel, { passive: false });
                    this.container.addEventListener('mouseleave', this._boundMouseUp);
                    window.addEventListener('resize', this._boundRecalc);
                    this._recalc();
                    this.initialized = true;
                }

                destroy() {
                    this.track.removeEventListener('mousedown', this._boundMouseDown);
                    this.track.removeEventListener('touchstart', this._boundTouchStart);
                    this.track.removeEventListener('wheel', this._boundWheel);
                    this.container.removeEventListener('mouseleave', this._boundMouseUp);
                    window.removeEventListener('resize', this._boundRecalc);
                    document.removeEventListener('mousemove', this._boundMouseMove);
                    document.removeEventListener('mouseup', this._boundMouseUp);
                    document.removeEventListener('touchmove', this._boundTouchMove);
                    document.removeEventListener('touchend', this._boundTouchEnd);
                    this.initialized = false;
                }

                setArrows(prevBtn, nextBtn) {
                    this.arrows.prev = prevBtn;
                    this.arrows.next = nextBtn;
                    if (prevBtn) prevBtn.addEventListener('click', () => this.scrollBy(-1));
                    if (nextBtn) nextBtn.addEventListener('click', () => this.scrollBy(1));
                }

                _recalc() {
                    const trackWidth = this.track.scrollWidth;
                    const containerWidth = this.container.clientWidth;
                    this.maxOffset = Math.max(0, trackWidth - containerWidth);
                    this.scrollAmount = this.scrollAmount || (this.cardWidth + this.gap) * 3;
                    this._clampOffset();
                    this._updateArrows();
                }

                _clampOffset() {
                    this.currentOffset = Math.max(0, Math.min(this.currentOffset, this.maxOffset));
                    this.track.style.transform = `translateX(-${this.currentOffset}px)`;
                }

                scrollBy(direction) {
                    this._recalc();
                    this.currentOffset += direction * this.scrollAmount;
                    this._clampOffset();
                    if (this.onChange) this.onChange(this.currentOffset);
                }

                _updateArrows() {
                    if (this.arrows.prev) this.arrows.prev.style.opacity = this.currentOffset <= 0 ? '0.4' :
                        '1';
                    if (this.arrows.next) this.arrows.next.style.opacity = this.currentOffset >= this
                        .maxOffset ? '0.4' : '1';
                }

                _onMouseDown(e) {
                    this.isDragging = true;
                    this.track.classList.add('dragging');
                    this.startX = e.pageX;
                    this.scrollLeft = this.currentOffset;
                    document.addEventListener('mousemove', this._boundMouseMove);
                    document.addEventListener('mouseup', this._boundMouseUp);
                }
                _onMouseMove(e) {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    const dx = (this.startX - e.pageX);
                    this.currentOffset = this.scrollLeft + dx;
                    this._clampOffset();
                }
                _onMouseUp() {
                    this.isDragging = false;
                    this.track.classList.remove('dragging');
                    document.removeEventListener('mousemove', this._boundMouseMove);
                    document.removeEventListener('mouseup', this._boundMouseUp);
                    this._updateArrows();
                }
                _onTouchStart(e) {
                    this.isDragging = true;
                    this.track.classList.add('dragging');
                    this.startX = e.touches[0].pageX;
                    this.scrollLeft = this.currentOffset;
                    document.addEventListener('touchmove', this._boundTouchMove, { passive: false });
                    document.addEventListener('touchend', this._boundTouchEnd);
                }
                _onTouchMove(e) {
                    if (!this.isDragging) return;
                    const dx = (this.startX - e.touches[0].pageX);
                    this.currentOffset = this.scrollLeft + dx;
                    this._clampOffset();
                }
                _onTouchEnd() {
                    this.isDragging = false;
                    this.track.classList.remove('dragging');
                    document.removeEventListener('touchmove', this._boundTouchMove);
                    document.removeEventListener('touchend', this._boundTouchEnd);
                    this._updateArrows();
                }
                _onWheel(e) {
                    e.preventDefault();
                    this._recalc();
                    this.currentOffset += e.deltaY > 0 ? this.scrollAmount / 2 : -this.scrollAmount / 2;
                    this._clampOffset();
                    this._updateArrows();
                }

                reset() {
                    this.currentOffset = 0;
                    this._clampOffset();
                    this._updateArrows();
                }
            }

            // ==================== CREATE ANIME CARD HTML ====================
            function createAnimeCard(anime) {
                const title = safeGet(anime, 'title', 'Unknown');
                const titleEng = safeGet(anime, 'title_english', '') || title;
                const displayTitle = titleEng.length < 60 ? titleEng : title;
                const score = safeGet(anime, 'score', null);
                const episodes = safeGet(anime, 'episodes', null);
                const type = safeGet(anime, 'type', 'TV');
                const malId = safeGet(anime, 'mal_id', 0);
                const imgUrl = safeGet(anime, 'images.jpg.large_image_url', '') ||
                    safeGet(anime, 'images.jpg.image_url', '') ||
                    'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="175" height="262" fill="%231a1a28"><rect width="175" height="262"/><text x="50%" y="50%" text-anchor="middle" fill="%2371717a" font-size="14">No Image</text></svg>';
                const rating = safeGet(anime, 'rating', '');
                const isHd = rating && (rating.includes('R') || rating.includes('PG') || type === 'Movie');

                let badgesHtml = '';
                if (score) badgesHtml +=
                    `<span class="badge badge-score">⭐ ${typeof score === 'number' ? score.toFixed(1) : score}</span>`;
                if (episodes) badgesHtml += `<span class="badge badge-ep">📺 ${episodes} ep</span>`;
                if (isHd || type === 'Movie') badgesHtml += `<span class="badge badge-hd">HD</span>`;
                if (type && type !== 'TV') badgesHtml += `<span class="badge badge-type">${type}</span>`;

                return `
            <div class="anime-card" data-mal-id="${malId}" onclick="window.location.href='anime.html?id=${malId}'" title="${displayTitle}">
              <img class="card-poster" loading="lazy" src="${imgUrl}" alt="${displayTitle}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22175%22 height=%22262%22 fill=%22%231a1a28%22><rect width=%22175%22 height=%22262%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%2371717a%22 font-size=%2214%22>No Image</text></svg>'">
              <div class="card-badges">${badgesHtml}</div>
              <div class="card-overlay"><span class="card-title">${displayTitle}</span></div>
            </div>`;
            }

            function createSkeletonCards(count = 6) {
                let html = '';
                for (let i = 0; i < count; i++) html += '<div class="skeleton skeleton-card"></div>';
                return html;
            }

            // ==================== LOAD WIDGET ====================
            const sliderInstances = {};

            async function loadWidget(trackId, containerId, apiUrl, cacheKey, cardCount = 15) {
                const track = document.getElementById(trackId);
                const container = document.getElementById(containerId);
                if (!track || !container) return;
                track.innerHTML = createSkeletonCards(8);

                try {
                    const data = await fetchWithRetry(apiUrl, cacheKey);
                    const animeList = safeGet(data, 'data', []);
                    if (!animeList.length) {
                        track.innerHTML =
                            '<div class="error-widget"><p>No anime found. Try refreshing.</p><button onclick="location.reload()">Refresh</button></div>';
                        return;
                    }
                    const cardsHtml = animeList.slice(0, cardCount).map(a => createAnimeCard(a)).join('');
                    track.innerHTML = cardsHtml;

                    // Initialize or reinitialize slider
                    if (sliderInstances[trackId]) sliderInstances[trackId].destroy();
                    const slider = new UniversalSlider(track, container, { cardWidth: 175, gap: 16,
                        scrollAmount: null });
                    slider.init();
                    // Add arrow buttons if they exist
                    const prevBtn = container.querySelector('.slider-arrow.prev');
                    const nextBtn = container.querySelector('.slider-arrow.next');
                    if (prevBtn || nextBtn) slider.setArrows(prevBtn, nextBtn);
                    sliderInstances[trackId] = slider;

                } catch (e) {
                    console.warn(`Widget ${trackId} failed:`, e.message);
                    track.innerHTML =
                        '<div class="error-widget"><p>Could not load. Please try again.</p><button onclick="location.reload()">Retry</button></div>';
                }
            }

            // Add arrows to widget containers
            function addSliderArrows(containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;
                if (!container.querySelector('.slider-arrow.prev')) {
                    const prev = document.createElement('button');
                    prev.className = 'slider-arrow prev';
                    prev.innerHTML = '◀';
                    prev.setAttribute('aria-label', 'Scroll left');
                    container.querySelector('.slider-wrap').appendChild(prev);
                }
                if (!container.querySelector('.slider-arrow.next')) {
                    const next = document.createElement('button');
                    next.className = 'slider-arrow next';
                    next.innerHTML = '▶';
                    next.setAttribute('aria-label', 'Scroll right');
                    container.querySelector('.slider-wrap').appendChild(next);
                }
            }

            // ==================== HERO SLIDER ====================
            let heroData = [];
            let heroIndex = 0;
            let heroAutoTimer = null;
            let heroTouchStartX = 0;
            let heroTouchDiff = 0;
            const HERO_INTERVAL = 5000;

            function buildHeroSlides(data) {
                const track = document.getElementById('heroTrack');
                const dots = document.getElementById('heroDots');
                if (!track || !dots) return;
                heroData = data.slice(0, 12);
                heroIndex = 0;
                track.innerHTML = heroData.map((anime, i) => {
                    const title = safeGet(anime, 'title', 'Unknown');
                    const titleEng = safeGet(anime, 'title_english', '') || title;
                    const synopsis = safeGet(anime, 'synopsis', 'No description available.');
                    const score = safeGet(anime, 'score', '?');
                    const genres = safeGet(anime, 'genres', []).slice(0, 3).map(g => g.name).join(
                        ' · ') || 'Anime';
                    const malId = safeGet(anime, 'mal_id', 0);
                    const banner = safeGet(anime, 'images.jpg.large_image_url', '') ||
                        safeGet(anime, 'images.jpg.image_url', '');
                    const truncatedSynopsis = synopsis.length > 200 ? synopsis.substring(0, 200) +
                        '...' : synopsis;
                    return `
                <div class="hero-slide" data-index="${i}">
                  <img class="hero-bg" src="${banner}" alt="${title}" loading="${i===0?'eager':'lazy'}" onerror="this.style.display='none'">
                  <div class="hero-gradient"></div>
                  <div class="hero-content">
                    <h1 class="hero-title">${titleEng}</h1>
                    <div class="hero-meta"><span class="score">⭐ ${typeof score==='number'?score.toFixed(1):score}</span><span>${genres}</span></div>
                    <p class="hero-synopsis">${truncatedSynopsis}</p>
                    <div class="hero-btns">
                      <a href="watch.html?id=${malId}&ep=1" class="btn btn-primary">▶ Watch Now</a>
                      <a href="anime.html?id=${malId}" class="btn btn-outline">ℹ Details</a>
                    </div>
                  </div>
                </div>`;
                }).join('');
                dots.innerHTML = heroData.map((_, i) =>
                    `<span class="dot${i===0?' active':''}" data-index="${i}"></span>`).join('');
                goToSlide(0, false);
                startHeroAuto();
            }

            function goToSlide(index, animate = true) {
                const track = document.getElementById('heroTrack');
                const dots = document.getElementById('heroDots');
                if (!track || !dots) return;
                heroIndex = ((index % heroData.length) + heroData.length) % heroData.length;
                if (!animate) track.style.transition = 'none';
                else track.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1)';
                track.style.transform = `translateX(-${heroIndex * 100}%)`;
                if (!animate) { track.offsetHeight;
                    track.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1)'; }
                dots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === heroIndex));
            }

            function startHeroAuto() {
                stopHeroAuto();
                heroAutoTimer = setInterval(() => goToSlide(heroIndex + 1), HERO_INTERVAL);
            }

            function stopHeroAuto() {
                if (heroAutoTimer) clearInterval(heroAutoTimer);
                heroAutoTimer = null;
            }

            async function loadHero() {
                const track = document.getElementById('heroTrack');
                if (!track) return;
                track.innerHTML =
                    '<div class="hero-slide" style="display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:1.2rem;">Loading...</div>';
                try {
                    const data = await fetchWithRetry(`${JIKAN_BASE}/top/anime?filter=bypopularity&limit=12`,
                        'hero_trending');
                    const list = safeGet(data, 'data', []);
                    if (list.length >= 3) {
                        buildHeroSlides(list);
                    } else {
                        track.innerHTML =
                            '<div class="hero-slide" style="display:flex;align-items:center;justify-content:center;color:var(--text3);">No hero data available. <button onclick="location.reload()" style="margin-left:10px;padding:8px 16px;background:var(--accent);color:#fff;border-radius:50px;">Retry</button></div>';
                    }
                } catch (e) {
                    console.warn('Hero failed:', e.message);
                    track.innerHTML =
                        '<div class="hero-slide" style="display:flex;align-items:center;justify-content:center;color:var(--text3);">Could not load hero. <button onclick="location.reload()" style="margin-left:10px;padding:8px 16px;background:var(--accent);color:#fff;border-radius:50px;">Retry</button></div>';
                }
            }

            // Hero event listeners
            document.addEventListener('DOMContentLoaded', () => {
                const heroPrev = document.getElementById('heroPrev');
                const heroNext = document.getElementById('heroNext');
                const heroDots = document.getElementById('heroDots');
                const heroTrack = document.getElementById('heroTrack');
                if (heroPrev) heroPrev.addEventListener('click', () => { goToSlide(heroIndex - 1);
                    startHeroAuto(); });
                if (heroNext) heroNext.addEventListener('click', () => { goToSlide(heroIndex + 1);
                    startHeroAuto(); });
                if (heroDots) heroDots.addEventListener('click', (e) => {
                    const dot = e.target.closest('.dot');
                    if (dot && dot.dataset.index !== undefined) { goToSlide(parseInt(dot.dataset
                            .index));
                        startHeroAuto(); }
                });
                if (heroTrack) {
                    heroTrack.addEventListener('touchstart', (e) => {
                        heroTouchStartX = e.touches[0].pageX;
                        heroTouchDiff = 0;
                        stopHeroAuto();
                    }, { passive: true });
                    heroTrack.addEventListener('touchmove', (e) => {
                        heroTouchDiff = e.touches[0].pageX - heroTouchStartX;
                    }, { passive: true });
                    heroTrack.addEventListener('touchend', () => {
                        if (Math.abs(heroTouchDiff) > 50) {
                            goToSlide(heroIndex + (heroTouchDiff < 0 ? 1 : -1));
                        }
                        startHeroAuto();
                    });
                    heroTrack.addEventListener('mouseenter', stopHeroAuto);
                    heroTrack.addEventListener('mouseleave', startHeroAuto);
                }
            });

            // ==================== INIT ALL ====================
            async function initAllWidgets() {
                // Add arrows
                ['widgetTrending', 'widgetTopRated', 'widgetAiring', 'widgetUpcoming', 'widgetCompleted',
                    'widgetRecent'
                ].forEach(addSliderArrows);

                const promises = [
                    loadWidget('trackTrending', 'widgetTrending', `${JIKAN_BASE}/top/anime?filter=bypopularity&limit=18`,
                        'widget_trending', 18),
                    loadWidget('trackTopRated', 'widgetTopRated', `${JIKAN_BASE}/top/anime?filter=&limit=18`,
                        'widget_toprated', 18),
                    loadWidget('trackAiring', 'widgetAiring', `${JIKAN_BASE}/top/anime?filter=airing&limit=18`,
                        'widget_airing', 18),
                    loadWidget('trackUpcoming', 'widgetUpcoming', `${JIKAN_BASE}/top/anime?filter=upcoming&limit=18`,
                        'widget_upcoming', 18),
                    loadWidget('trackCompleted', 'widgetCompleted',
                        `${JIKAN_BASE}/top/anime?filter=complete&limit=18`, 'widget_completed', 18),
                    loadWidget('trackRecent', 'widgetRecent', `${JIKAN_BASE}/seasons/now?limit=18`,
                        'widget_recent', 18),
                    loadHero(),
                ];
                await Promise.allSettled(promises);
                // Reconnect arrows for sliders
                setTimeout(() => {
                    Object.entries(sliderInstances).forEach(([trackId, slider]) => {
                        const container = document.getElementById(trackId.replace('track',
                            'widgetTrending').replace('trackTopRated',
                            'widgetTopRated').replace('trackAiring', 'widgetAiring')
                            .replace('trackUpcoming', 'widgetUpcoming').replace(
                                'trackCompleted', 'widgetCompleted').replace('trackRecent',
                                'widgetRecent'));
                        // Try to find parent widget
                        const allWidgets = ['widgetTrending', 'widgetTopRated', 'widgetAiring',
                            'widgetUpcoming', 'widgetCompleted', 'widgetRecent'
                        ];
                        for (const wid of allWidgets) {
                            const w = document.getElementById(wid);
                            if (w && w.contains(document.getElementById(trackId))) {
                                const prevBtn = w.querySelector('.slider-arrow.prev');
                                const nextBtn = w.querySelector('.slider-arrow.next');
                                if (prevBtn || nextBtn) slider.setArrows(prevBtn, nextBtn);
                                break;
                            }
                        }
                    });
                }, 300);
            }

            // ==================== SIDEBAR ====================
            function initSidebar() {
                const hamburger = document.getElementById('hamburgerBtn');
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (!hamburger || !sidebar || !overlay) return;

                function open() { sidebar.classList.add('active');
                    overlay.classList.add('active');
                    hamburger.classList.add('active'); }
                function close() { sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                    hamburger.classList.remove('active'); }
                hamburger.addEventListener('click', () => { sidebar.classList.contains('active') ? close() :
                    open(); });
                overlay.addEventListener('click', close);
                // Close on link click
                sidebar.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
                // Swipe to close
                let touchStartX = 0;
                sidebar.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].pageX; }, { passive: true });
                sidebar.addEventListener('touchmove', (e) => {
                    const dx = e.touches[0].pageX - touchStartX;
                    if (dx < -40) close();
                }, { passive: true });
            }

            // ==================== SEARCH OVERLAY ====================
            function initSearchOverlay() {
                const trigger = document.getElementById('searchTrigger');
                const overlay = document.getElementById('searchOverlay');
                const closeBtn = document.getElementById('searchClose');
                const input = document.getElementById('searchInput');
                const results = document.getElementById('searchResults');
                if (!trigger || !overlay || !closeBtn || !input || !results) return;
                let debounceTimer = null;

                function open() { overlay.classList.add('active');
                    input.focus(); }
                function close() { overlay.classList.remove('active');
                    input.value = '';
                    results.innerHTML = ''; }
                trigger.addEventListener('click', open);
                closeBtn.addEventListener('click', close);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && overlay.classList.contains('active')) close();
                    if (e.ctrlKey && e.key === 'k') { e.preventDefault();
                        open(); }
                });

                input.addEventListener('input', () => {
                    clearTimeout(debounceTimer);
                    const q = input.value.trim();
                    if (!q) { results.innerHTML = ''; return; }
                    results.innerHTML = '<div style="padding:16px;color:var(--text3);">Searching...</div>';
                    debounceTimer = setTimeout(async () => {
                        try {
                            const data = await fetchWithRetry(
                                `${JIKAN_BASE}/anime?q=${encodeURIComponent(q)}&limit=8&sfw=true`);
                            const list = safeGet(data, 'data', []);
                            if (!list.length) {
                                results.innerHTML =
                                    '<div style="padding:16px;color:var(--text3);">No results found.</div>';
                                return;
                            }
                            results.innerHTML = list.map(a => {
                                const img = safeGet(a, 'images.jpg.image_url', '');
                                const title = safeGet(a, 'title', 'Unknown');
                                const malId = safeGet(a, 'mal_id', 0);
                                const type = safeGet(a, 'type', '');
                                return `
                        <div class="search-result-item" onclick="window.location.href='anime.html?id=${malId}'">
                          <img src="${img}" alt="${title}" loading="lazy" onerror="this.style.display='none'">
                          <span class="info">${title}<small>${type}</small></span>
                        </div>`;
                            }).join('');
                        } catch (e) {
                            results.innerHTML =
                                '<div style="padding:16px;color:var(--text3);">Search failed. Try again.</div>';
                        }
                    }, 400);
                });
            }

            // ==================== INIT ON DOM READY ====================
            function init() {
                initSidebar();
                initSearchOverlay();
                initAllWidgets();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // Handle orientation changes
            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    Object.values(sliderInstances).forEach(s => { if (s && s._recalc) s._recalc(); });
                }, 400);
            });

            // Expose for debugging
            window.__animeStream = { sliderInstances, heroData, heroIndex, goToSlide, loadHero,
                initAllWidgets };
        })();
    </script>
</body>
</html>
