<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anime details - AnimeStream">
    <title>AnimeStream - Details</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #111118;
            --bg3: #1a1a25;
            --text: #e2e2e2;
            --text2: #a0a0b0;
            --accent: #7c3aed;
            --accent2: #a855f7;
            --glow: rgba(124, 58, 237, 0.5);
            --radius: 12px;
            --radius2: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:var(--font); overflow-x:hidden; }
        body::-webkit-scrollbar { width:6px; }
        body::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }
        a { text-decoration:none; color:inherit; }
        img { max-width:100%; display:block; }
        button { cursor:pointer; border:none; font-family:inherit; }

        .header {
            position:sticky; top:0; z-index:1000; background:rgba(10,10,15,0.85); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,0.06); padding:0 clamp(12px,3vw,40px); height:60px;
            display:flex; align-items:center; justify-content:space-between;
        }
        .header-left { display:flex; align-items:center; gap:12px; }
        .hamburger { background:none; color:var(--text); font-size:24px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .logo { font-size:clamp(18px,3vw,24px); font-weight:800; background:linear-gradient(135deg,var(--accent2),#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .search-trigger { background:var(--bg3); color:var(--text2); border-radius:24px; padding:8px 16px; display:flex; align-items:center; gap:8px; }
        .search-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(16px); z-index:2000; display:flex; align-items:flex-start; justify-content:center; padding-top:15vh; opacity:0; pointer-events:none; transition:opacity 0.35s; }
        .search-overlay.active { opacity:1; pointer-events:all; }
        .search-overlay-inner { width:min(90vw,650px); position:relative; }
        .search-overlay input { width:100%; padding:16px 50px 16px 20px; font-size:18px; border-radius:30px; border:2px solid rgba(255,255,255,0.15); background:var(--bg2); color:var(--text); outline:none; }
        .search-overlay-close { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; color:var(--text2); font-size:22px; }
        .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1500; opacity:0; pointer-events:none; transition:opacity 0.3s; }
        .sidebar-overlay.active { opacity:1; pointer-events:all; }
        .sidebar { position:fixed; top:0; left:0; width:min(80vw,320px); height:100vh; background:var(--bg2); z-index:1600; transform:translateX(-100%); transition:transform 0.35s; padding:24px; display:flex; flex-direction:column; gap:20px; overflow-y:auto; }
        .sidebar.active { transform:translateX(0); }
        .sidebar a { padding:12px 16px; border-radius:var(--radius); }
        .sidebar a:hover, .sidebar a.active { background:rgba(124,58,237,0.2); color:var(--accent2); }

        .banner {
            position:relative; width:100%; height:clamp(300px,45vw,500px); overflow:hidden;
        }
        .banner img { width:100%; height:100%; object-fit:cover; }
        .banner-overlay { position:absolute; inset:0; background:linear-gradient(to top, var(--bg) 0%, transparent 60%); }
        .detail-container {
            max-width:1200px; margin:-80px auto 40px; padding:0 clamp(16px,5vw,40px); position:relative; z-index:2;
            display:flex; gap:24px; flex-wrap:wrap;
        }
        .poster {
            flex:0 0 220px; border-radius:var(--radius2); overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.7);
        }
        .poster img { width:100%; aspect-ratio:2/3; object-fit:cover; }
        .info { flex:1; min-width:280px; }
        .info h1 { font-size:clamp(22px,4vw,36px); font-weight:800; margin-bottom:8px; }
        .meta { display:flex; gap:12px; flex-wrap:wrap; color:var(--text2); margin-bottom:12px; }
        .genres { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .genre-tag { background:rgba(124,58,237,0.2); border:1px solid var(--accent); padding:4px 12px; border-radius:16px; font-size:12px; }
        .synopsis { color:var(--text2); line-height:1.6; margin-bottom:20px; }
        .watch-btn { display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff; padding:12px 28px; border-radius:28px; font-weight:600; box-shadow:0 4px 20px var(--glow); transition:var(--transition); }
        .watch-btn:hover { background:var(--accent2); transform:translateY(-2px); }

        .section { margin:30px 0; }
        .section h2 { font-size:20px; margin-bottom:12px; }
        .episode-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; }
        .ep-btn { background:var(--bg3); border-radius:8px; padding:8px; text-align:center; font-size:13px; transition:var(--transition); }
        .ep-btn:hover { background:var(--accent); }
        .char-list { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; }
        .char-card { flex:0 0 90px; text-align:center; }
        .char-card img { width:70px; height:70px; border-radius:50%; object-fit:cover; margin:0 auto; }
        .rec-slider { display:flex; gap:12px; overflow-x:auto; }
        .rec-card { flex:0 0 150px; border-radius:var(--radius); overflow:hidden; background:var(--bg3); }
        .rec-card img { aspect-ratio:2/3; object-fit:cover; }
        .footer { text-align:center; padding:28px; border-top:1px solid rgba(255,255,255,0.06); color:var(--text2); }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="hamburger" id="hamburgerBtn">☰</button>
            <a href="index.html" class="logo">AnimeStream</a>
        </div>
        <button class="search-trigger" id="searchTrigger">🔍 <span>Search</span></button>
    </header>
    <div class="search-overlay" id="searchOverlay"><div class="search-overlay-inner"><input type="text" id="searchInput" placeholder="Search..."><button class="search-overlay-close" id="searchClose">✕</button><div id="searchSuggestions" style="margin-top:8px;"></div></div></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar"><button id="sidebarClose" style="align-self:flex-end;background:none;color:#fff;font-size:24px;">✕</button><a href="index.html">🏠 Home</a><a href="search.html">🔍 Search</a><a href="schedule.html">📅 Schedule</a><a href="creator.html">👤 Creator</a></aside>

    <div id="content"><div style="text-align:center;padding:60px;">Loading...</div></div>
    <footer class="footer">© 2026 AnimeStream</footer>

    <script>
        (function(){
            const API='https://api.jikan.moe/v4';
            const cache={};
            async function fetchJSON(url){
                if(cache[url]) return cache[url];
                const resp=await fetch(url);
                if(!resp.ok) throw new Error('fail');
                const json=await resp.json();
                cache[url]=json;
                return json;
            }
            const params=new URLSearchParams(window.location.search);
            const id=params.get('id');
            if(!id) { document.getElementById('content').innerHTML='<div style="text-align:center;padding:40px;">No anime ID provided.</div>'; return; }

            async function load(){
                try{
                    const [anime,chars,recs]=await Promise.all([
                        fetchJSON(`${API}/anime/${id}/full`),
                        fetchJSON(`${API}/anime/${id}/characters`),
                        fetchJSON(`${API}/anime/${id}/recommendations`)
                    ]);
                    const a=anime.data;
                    const title=a.title_english||a.title;
                    document.getElementById('content').innerHTML=`
                        <div class="banner"><img src="${a.images?.jpg?.large_image_url||''}" alt=""><div class="banner-overlay"></div></div>
                        <div class="detail-container">
                            <div class="poster"><img src="${a.images?.jpg?.large_image_url||''}" alt=""></div>
                            <div class="info">
                                <h1>${title}</h1>
                                <div class="meta">⭐ ${a.score||'N/A'} • ${a.type||'TV'} • ${a.status||'?'} • ${a.episodes||'?'} eps</div>
                                <div class="genres">${(a.genres||[]).map(g=>`<span class="genre-tag">${g.name}</span>`).join('')}</div>
                                <p class="synopsis">${a.synopsis||'No synopsis.'}</p>
                                <a href="watch.html?id=${a.mal_id}&ep=1" class="watch-btn">▶ Watch Now</a>
                            </div>
                        </div>
                        <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,5vw,40px);">
                            <div class="section"><h2>Characters</h2><div class="char-list">${(chars.data||[]).slice(0,15).map(c=>`<div class="char-card"><img src="${c.character.images?.jpg?.image_url||''}" alt=""><small>${c.character.name}</small></div>`).join('')}</div></div>
                            <div class="section"><h2>Recommendations</h2><div class="rec-slider">${(recs.data||[]).slice(0,12).map(r=>`<a class="rec-card" href="anime.html?id=${r.entry.mal_id}"><img src="${r.entry.images?.jpg?.image_url||''}" alt=""><div style="padding:6px;font-size:12px;">${r.entry.title}</div></a>`).join('')}</div></div>
                            <div class="section"><h2>Episodes</h2><div class="episode-grid">${Array.from({length:Math.min(a.episodes||24,24)},(_,i)=>`<a href="watch.html?id=${a.mal_id}&ep=${i+1}" class="ep-btn">Ep ${i+1}</a>`).join('')}</div></div>
                        </div>`;
                }catch(e){ document.getElementById('content').innerHTML='<div style="text-align:center;padding:40px;">Failed to load anime details.</div>'; }
            }
            load();

            // header/sidebar/search scripts same as index
            document.getElementById('hamburgerBtn').addEventListener('click',()=>{ document.getElementById('sidebar').classList.add('active'); document.getElementById('sidebarOverlay').classList.add('active'); });
            document.getElementById('sidebarClose').addEventListener('click',()=>{ document.getElementById('sidebar').classList.remove('active'); document.getElementById('sidebarOverlay').classList.remove('active'); });
            document.getElementById('sidebarOverlay').addEventListener('click',()=>{ document.getElementById('sidebar').classList.remove('active'); document.getElementById('sidebarOverlay').classList.remove('active'); });
            const searchOverlay=document.getElementById('searchOverlay');
            document.getElementById('searchTrigger').addEventListener('click',()=>{ searchOverlay.classList.add('active'); document.getElementById('searchInput').focus(); });
            document.getElementById('searchClose').addEventListener('click',()=>{ searchOverlay.classList.remove('active'); });
            document.getElementById('searchInput').addEventListener('keydown',function(e){ if(e.key==='Enter'&&this.value.trim()) window.location.href='search.html?q='+encodeURIComponent(this.value.trim()); });
        })();
    </script>
</body>
</html>
