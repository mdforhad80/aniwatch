<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Details - AnimeStream</title>
<meta name="description" content="Anime details, episodes, characters, and more.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;overflow-x:hidden;line-height:1.6}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
button{border:none;background:none;cursor:pointer;font-family:inherit;color:inherit}
ul,ol{list-style:none}

:root{
  --primary:#a855f7;--primary-dark:#7e22ce;--primary-glow:rgba(168,85,247,0.4);
  --bg:#0a0a0a;--bg-elevated:#141414;--bg-card:#1a1a1a;--bg-glass:rgba(20,20,20,0.85);
  --text:#e0e0e0;--text-secondary:#9ca3af;--text-muted:#6b7280;
  --border:rgba(255,255,255,0.08);--radius:12px;--radius-sm:8px;
  --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);--header-h:64px;
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

.skeleton{background:linear-gradient(90deg,#1a1a1a 25%,#252525 50%,#1a1a1a 75%);background-size:200% 100%;animation:skeleton 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Header */
.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--bg-glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px)}
.header-left,.header-right{display:flex;align-items:center;gap:16px}
.logo{font-size:clamp(1.2rem,2.5vw,1.6rem);font-weight:800;background:linear-gradient(135deg,var(--primary),#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.logo span{-webkit-text-fill-color:var(--text);font-weight:400}
.nav-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--text-secondary)}
.nav-btn:hover{background:var(--bg-card);color:var(--primary)}
.nav-btn svg{width:22px;height:22px}

/* Sidebar */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--bg-elevated);border-right:1px solid var(--border);z-index:1001;transform:translateX(-100%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);padding-top:var(--header-h);overflow-y:auto}
.sidebar.active{transform:translateX(0)}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.3s}
.sidebar-overlay.active{opacity:1;pointer-events:all}
.sidebar-nav{padding:16px}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-sm);color:var(--text-secondary);font-weight:500;transition:var(--transition);margin-bottom:4px}
.sidebar-nav a:hover,.sidebar-nav a.active{background:var(--bg-card);color:var(--primary)}
.sidebar-nav a svg{width:22px;height:22px;flex-shrink:0}

/* Anime Banner */
.anime-banner{position:relative;width:100%;height:clamp(300px,45vh,500px);margin-top:var(--header-h);overflow:hidden;background:var(--bg-card)}
.anime-banner-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:blur(2px) brightness(0.4);transform:scale(1.1)}
.anime-banner-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(10,10,10,0.8) 50%,rgba(10,10,10,0.4) 100%)}
.anime-banner-content{position:absolute;bottom:0;left:0;right:0;padding:clamp(24px,5vw,48px);display:flex;gap:clamp(20px,4vw,40px);align-items:flex-end;max-width:1400px;margin:0 auto}
.anime-poster{width:clamp(140px,22vw,220px);aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);flex-shrink:0;background:var(--bg-card)}
.anime-poster img{width:100%;height:100%;object-fit:cover}
.anime-poster img{width:100%;height:100%;object-fit:cover}
.anime-info{flex:1;min-width:0;padding-bottom:8px}
.anime-title{font-size:clamp(1.6rem,3.5vw,2.8rem);font-weight:800;line-height:1.2;margin-bottom:12px;text-shadow:0 2px 20px rgba(0,0,0,0.5)}
.anime-meta{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;font-size:0.9rem}
.anime-score{display:flex;align-items:center;gap:6px;color:#fbbf24;font-weight:700;font-size:1.1rem;background:rgba(0,0,0,0.4);padding:6px 14px;border-radius:20px}
.anime-status{padding:4px 14px;border-radius:20px;font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.status-airing{background:#22c55e;color:#fff}
.status-finished{background:#3b82f6;color:#fff}
.status-upcoming{background:#f59e0b;color:#fff}
.anime-genres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.anime-genre{padding:6px 16px;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);border-radius:20px;font-size:0.85rem;color:var(--primary);font-weight:500}
.anime-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn-primary{padding:12px 28px;background:var(--primary);color:#fff;font-weight:700;border-radius:var(--radius);display:inline-flex;align-items:center;gap:8px;transition:var(--transition);font-size:0.95rem;box-shadow:0 4px 20px var(--primary-glow)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 8px 30px var(--primary-glow)}
.btn-secondary{padding:12px 28px;background:rgba(255,255,255,0.1);color:var(--text);font-weight:600;border-radius:var(--radius);display:inline-flex;align-items:center;gap:8px;transition:var(--transition);font-size:0.95rem;border:1px solid rgba(255,255,255,0.15)}
.btn-secondary:hover{background:rgba(255,255,255,0.2);transform:translateY(-2px)}

/* Tabs */
.tabs-container{padding:clamp(24px,4vw,48px) clamp(16px,4vw,48px);max-width:1400px;margin:0 auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-bottom:24px}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 20px;color:var(--text-muted);font-weight:600;font-size:0.95rem;white-space:nowrap;border-bottom:2px solid transparent;transition:var(--transition);cursor:pointer;background:none}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Details Grid */
.details-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-bottom:32px}
.detail-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.detail-label{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.detail-value{font-size:1rem;color:var(--text);font-weight:500}
.detail-value a{color:var(--primary);transition:var(--transition)}
.detail-value a:hover{text-decoration:underline}

/* Synopsis */
.synopsis-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:32px}
.synopsis-section h3{font-size:1.1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.synopsis-section h3 svg{width:20px;height:20px;color:var(--primary)}
.synopsis-text{color:var(--text-secondary);line-height:1.8;font-size:0.95rem}

/* Trailer */
.trailer-section{margin-bottom:32px}
.trailer-section h3{font-size:1.1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.trailer-section h3 svg{width:20px;height:20px;color:var(--primary)}
.trailer-container{position:relative;padding-bottom:56.25%;border-radius:var(--radius);overflow:hidden;background:var(--bg-card)}
.trailer-container iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.trailer-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:1rem}

/* Episode List */
.episode-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.episode-item{display:flex;gap:16px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);transition:var(--transition);cursor:pointer;align-items:center}
.episode-item:hover{background:var(--bg-elevated);border-color:var(--primary);transform:translateX(4px)}
.episode-num{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0}
.episode-info{flex:1;min-width:0}
.episode-title{font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.episode-meta{font-size:0.8rem;color:var(--text-muted)}
.episode-play{width:40px;height:40px;border-radius:50%;background:rgba(168,85,247,0.15);display:flex;align-items:center;justify-content:center;color:var(--primary);transition:var(--transition);flex-shrink:0}
.episode-item:hover .episode-play{background:var(--primary);color:#fff}

/* Character Grid */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.char-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:var(--transition);cursor:pointer}
.char-card:hover{transform:translateY(-4px);border-color:var(--primary)}
.char-img{aspect-ratio:2/3;overflow:hidden}
.char-img img{width:100%;height:100%;object-fit:cover}
.char-info{padding:12px}
.char-name{font-weight:600;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-role{font-size:0.75rem;color:var(--text-muted);margin-top:2px}

/* Relation / Recommend Grid */
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.rel-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:var(--transition);cursor:pointer}
.rel-card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(0,0,0,0.3);border-color:var(--primary)}
.rel-img{aspect-ratio:2/3;position:relative;overflow:hidden}
.rel-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s}
.rel-card:hover .rel-img img{transform:scale(1.1)}
.rel-gradient{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.8) 0%,transparent 50%)}
.rel-type{position:absolute;top:8px;left:8px;padding:4px 10px;background:var(--primary);color:#fff;font-size:0.7rem;font-weight:700;border-radius:20px;text-transform:uppercase}
.rel-info{padding:12px}
.rel-title{font-weight:600;font-size:0.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}

/* Loading states */
.loading-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.loading-state svg{width:48px;height:48px;margin-bottom:12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.error-state svg{width:48px;height:48px;margin-bottom:12px;color:var(--text-muted);opacity:0.5}
.retry-btn{margin-top:12px;padding:8px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:0.85rem;transition:var(--transition);cursor:pointer}
.retry-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Footer */
.footer{border-top:1px solid var(--border);padding:clamp(24px,4vw,40px) clamp(16px,4vw,48px);text-align:center;background:var(--bg-elevated);margin-top:48px}
.footer-logo{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--primary),#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.footer-text{color:var(--text-muted);font-size:0.9rem;margin-bottom:16px}
.footer-socials{display:flex;justify-content:center;gap:16px;margin-bottom:16px}
.footer-social{width:40px;height:40px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:var(--transition);border:1px solid var(--border)}
.footer-social:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-3px)}
.footer-copyright{color:var(--text-muted);font-size:0.8rem}
@media(max-width:768px){
  .anime-banner{height:auto;min-height:clamp(500px,80vh,650px)}
  .anime-banner-bg{background-position:center top;background-size:cover}
  .anime-banner-content{position:relative;flex-direction:column;align-items:center;text-align:center;padding:clamp(20px,5vw,32px);padding-top:120px}
  .anime-poster{width:clamp(160px,55vw,240px);margin:0 auto}
  .anime-poster img{width:100%;height:100%;object-fit:cover}
  .anime-info{width:100%;padding-bottom:0}
  .anime-meta{justify-content:center}
  .anime-genres{justify-content:center}
  .anime-actions{justify-content:center}
  .episode-list{grid-template-columns:1fr}
  .char-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .rel-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
}
</style>

    </div>
    <p class="footer-copyright"> AnimeStream. All rights reserved.</p>
  </div>
</footer>

<script>
const API_BASE = 'https://api.jikan.moe/v4';
const CACHE_TTL = 5 * 60 * 1000;
const MAX_RETRIES = 3;
const RETRY_DELAY = 1000;
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function getCache(key) {
  try {
    const item = localStorage.getItem('as_cache_' + key);
    if (!item) return null;
    const parsed = JSON.parse(item);
    if (Date.now() - parsed.ts > CACHE_TTL) { localStorage.removeItem('as_cache_' + key); return null; }
    return parsed.data;
  } catch { return null; }
}
function setCache(key, data) {
  try { localStorage.setItem('as_cache_' + key, JSON.stringify({ ts: Date.now(), data })); } catch {}
}

async function fetchWithRetry(url, retries = MAX_RETRIES) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    clearTimeout(timeout);
    if (retries > 0) { await sleep(RETRY_DELAY * (MAX_RETRIES - retries + 1)); return fetchWithRetry(url, retries - 1); }
    throw err;
  }
}

async function apiRequest(endpoint, cacheKey) {
  const cached = getCache(cacheKey);
  if (cached) return cached;
  const data = await fetchWithRetry(API_BASE + endpoint);
  setCache(cacheKey, data);
  return data;
}

function getAnimeId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function goToWatch(id, ep) { window.location.href = `watch.html?id=${id}&ep=${ep}`; }
function goToAnime(id) { window.location.href = `anime.html?id=${id}`; }

// Sidebar
function openSidebar() { $('#sidebar').classList.add('active'); $('#sidebarOverlay').classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeSidebar() { $('#sidebar').classList.remove('active'); $('#sidebarOverlay').classList.remove('active'); document.body.style.overflow = ''; }

// Tabs
function initTabs() {
  $('#tabs').addEventListener('click', (e) => {
    if (!e.target.classList.contains('tab-btn')) return;
    $$('.tab-btn').forEach(b => b.classList.remove('active'));
    $$('.tab-panel').forEach(p => p.classList.remove('active'));
    e.target.classList.add('active');
    $(`#tab-${e.target.dataset.tab}`).classList.add('active');
  });
}

async function loadAnimeDetails() {
  const id = getAnimeId();
  if (!id) { showError('No anime ID provided'); return; }

  try {
    const [animeData, episodesData, charactersData, relationsData, recData] = await Promise.allSettled([
      apiRequest(`/anime/${id}/full`, `anime_${id}_full`),
      apiRequest(`/anime/${id}/episodes`, `anime_${id}_episodes`),
      apiRequest(`/anime/${id}/characters`, `anime_${id}_chars`),
      apiRequest(`/anime/${id}/relations`, `anime_${id}_rels`),
      apiRequest(`/anime/${id}/recommendations`, `anime_${id}_recs`)
    ]);

    const anime = animeData.status === 'fulfilled' ? animeData.value?.data : null;
    if (!anime) { showError('Failed to load anime details'); return; }

    renderBanner(anime);
    renderDetails(anime);
    renderSynopsis(anime);
    renderTrailer(anime);
    renderEpisodes(episodesData.status === 'fulfilled' ? episodesData.value : null, id);
    renderCharacters(charactersData.status === 'fulfilled' ? charactersData.value : null);
    renderRelations(relationsData.status === 'fulfilled' ? relationsData.value : null);
    renderRecommendations(recData.status === 'fulfilled' ? recData.value : null);
  } catch (err) {
    console.error(err);
    showError('Failed to load anime details');
  }
}

function renderBanner(anime) {
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const poster = anime.images?.jpg?.large_image_url || '';
  const title = anime.title_english || anime.title;
  const score = anime.score ? anime.score.toFixed(2) : 'N/A';
  const status = anime.status || 'Unknown';
  const statusClass = status.toLowerCase().includes('airing') ? 'status-airing' : status.toLowerCase().includes('finished') ? 'status-finished' : 'status-upcoming';
  const genres = (anime.genres || []).slice(0, 4);

  $('#bannerBg').style.backgroundImage = `url('${img}')`;
  $('#animePoster').innerHTML = `<img src="${poster}" alt="${title}" onerror="this.style.display='none'">`;
  $('#animeInfo').innerHTML = `
    <h1 class="anime-title">${title}</h1>
    <div class="anime-meta">
      <span class="anime-score"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> ${score}</span>
      <span class="anime-status ${statusClass}">${status}</span>
      <span style="color:var(--text-muted)">${anime.type || 'TV'} · ${anime.episodes || '?'} eps</span>
    </div>
    <div class="anime-genres">${genres.map(g => `<span class="anime-genre">${g.name}</span>`).join('')}</div>
    <div class="anime-actions">
      <button class="btn-primary" onclick="goToWatch(${anime.mal_id},1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Watch Now</button>
      <button class="btn-secondary" onclick="goToWatch(${anime.mal_id},1)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Episode 1</button>
    </div>
  `;
  document.title = `${title} - AnimeStream`;
}

function renderDetails(anime) {
  const details = [
    { label: 'Type', value: anime.type || 'Unknown' },
    { label: 'Episodes', value: anime.episodes || 'Unknown' },
    { label: 'Status', value: anime.status || 'Unknown' },
    { label: 'Aired', value: anime.aired?.string || 'Unknown' },
    { label: 'Premiered', value: anime.season ? `${anime.season.charAt(0).toUpperCase() + anime.season.slice(1)} ${anime.year || ''}` : 'Unknown' },
    { label: 'Broadcast', value: anime.broadcast?.string || 'Unknown' },
    { label: 'Source', value: anime.source || 'Unknown' },
    { label: 'Duration', value: anime.duration || 'Unknown' },
    { label: 'Rating', value: anime.rating || 'Unknown' },
    { label: 'Score', value: anime.score ? `${anime.score} (${anime.scored_by?.toLocaleString() || 0} users)` : 'N/A' },
    { label: 'Ranked', value: anime.rank ? `#${anime.rank}` : 'N/A' },
    { label: 'Popularity', value: anime.popularity ? `#${anime.popularity}` : 'N/A' },
    { label: 'Members', value: anime.members?.toLocaleString() || 'N/A' },
    { label: 'Favorites', value: anime.favorites?.toLocaleString() || 'N/A' },
    { label: 'Studios', value: (anime.studios || []).map(s => s.name).join(', ') || 'Unknown' },
    { label: 'Producers', value: (anime.producers || []).map(p => p.name).join(', ') || 'Unknown' },
    { label: 'Licensors', value: (anime.licensors || []).map(l => l.name).join(', ') || 'Unknown' },
    { label: 'Genres', value: (anime.genres || []).map(g => g.name).join(', ') || 'Unknown' }
  ];

  $('#detailsGrid').innerHTML = details.map(d => `
    <div class="detail-card">
      <div class="detail-label">${d.label}</div>
      <div class="detail-value">${d.value}</div>
    </div>
  `).join('');
}

function renderSynopsis(anime) {
  $('#synopsisText').textContent = anime.synopsis || 'No synopsis available.';
}

function renderTrailer(anime) {
  const trailer = anime.trailer?.embed_url;
  if (!trailer) return;
  $('#trailerSection').style.display = 'block';
  $('#trailerContainer').innerHTML = `<iframe src="${trailer}" allowfullscreen allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" loading="lazy"></iframe>`;
}

function renderEpisodes(data, animeId) {
  const container = $('#episodeList');
  const episodes = data?.data || [];

  if (episodes.length === 0) {
    // Generate placeholder episodes based on total episodes count
    const total = parseInt($('#detailsGrid')?.querySelector('.detail-card:nth-child(2) .detail-value')?.textContent) || 12;
    container.innerHTML = Array.from({ length: Math.min(total, 24) }, (_, i) => `
      <div class="episode-item" onclick="goToWatch(${animeId},${i+1})">
        <div class="episode-num">${i+1}</div>
        <div class="episode-info">
          <div class="episode-title">Episode ${i+1}</div>
          <div class="episode-meta">Click to watch</div>
        </div>
        <div class="episode-play"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
      </div>
    `).join('');
    return;
  }

  container.innerHTML = episodes.map(ep => `
    <div class="episode-item" onclick="goToWatch(${animeId},${ep.mal_id || ep.episode_id || 1})">
      <div class="episode-num">${ep.mal_id || ep.episode_id || '?'}</div>
      <div class="episode-info">
        <div class="episode-title">${ep.title || `Episode ${ep.mal_id || ep.episode_id || '?'}`}</div>
        <div class="episode-meta">${ep.aired ? new Date(ep.aired).toLocaleDateString() : 'Aired'}</div>
      </div>
      <div class="episode-play"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
    </div>
  `).join('');
}

function renderCharacters(data) {
  const container = $('#charGrid');
  const chars = data?.data || [];

  if (chars.length === 0) {
    container.innerHTML = '<div class="error-state" style="grid-column:1/-1"><p>No character data available</p></div>';
    return;
  }

  container.innerHTML = chars.slice(0, 24).map(c => {
    const char = c.character || c;
    const img = char.images?.jpg?.image_url || '';
    const name = char.name || 'Unknown';
    const role = c.role || 'Character';
    return `
      <div class="char-card">
        <div class="char-img"><img src="${img}" alt="${name}" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="char-info">
          <div class="char-name">${name}</div>
          <div class="char-role">${role}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderRelations(data) {
  const container = $('#relGrid');
  const rels = data?.data || [];

  if (rels.length === 0) {
    container.innerHTML = '<div class="error-state" style="grid-column:1/-1"><p>No relations available</p></div>';
    return;
  }

  const allEntries = rels.flatMap(r => (r.entry || []).map(e => ({ ...e, relation: r.relation })));

  container.innerHTML = allEntries.slice(0, 18).map(r => {
    const img = r.images?.jpg?.image_url || r.images?.jpg?.large_image_url || '';
    return `
      <div class="rel-card" onclick="goToAnime(${r.mal_id})">
        <div class="rel-img">
          <img src="${img}" alt="${r.name}" loading="lazy" onerror="this.style.display='none'">
          <div class="rel-gradient"></div>
          <span class="rel-type">${r.relation || 'Related'}</span>
        </div>
        <div class="rel-info">
          <div class="rel-title">${r.name}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderRecommendations(data) {
  const container = $('#recGrid');
  const recs = data?.data || [];

  if (recs.length === 0) {
    container.innerHTML = '<div class="error-state" style="grid-column:1/-1"><p>No recommendations available</p></div>';
    return;
  }

  container.innerHTML = recs.slice(0, 18).map(r => {
    const entry = r.entry || r;
    const img = entry.images?.jpg?.image_url || entry.images?.jpg?.large_image_url || '';
    return `
      <div class="rel-card" onclick="goToAnime(${entry.mal_id})">
        <div class="rel-img">
          <img src="${img}" alt="${entry.title}" loading="lazy" onerror="this.style.display='none'">
          <div class="rel-gradient"></div>
        </div>
        <div class="rel-info">
          <div class="rel-title">${entry.title}</div>
        </div>
      </div>
    `;
  }).join('');
}

function showError(msg) {
  $('#animeBanner').innerHTML = `
    <div class="error-state" style="padding-top:120px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <p>${msg}</p>
      <button class="retry-btn" onclick="location.reload()">Reload Page</button>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  $('#menuBtn').addEventListener('click', openSidebar);
  $('#sidebarOverlay').addEventListener('click', closeSidebar);
  initTabs();
  loadAnimeDetails();
});
</script>
</body>
</html>
