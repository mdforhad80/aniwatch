<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>AniVerse — Anime Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

:root{
  --bg-primary:#080810;
  --bg-secondary:#0d0d1a;
  --bg-card:#111122;

  --accent:#7c3aed;
  --accent-bright:#a855f7;
  --accent-glow:rgba(124,58,237,.35);

  --text-primary:#f5f3ff;
  --text-secondary:#b4b7c5;
  --text-muted:#72758a;

  --border:rgba(124,58,237,.18);

  --radius:14px;
  --radius-lg:22px;

  --header-h:72px;

  --font-main:'Outfit',sans-serif;
  --font-display:'Orbitron',sans-serif;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  max-width:100%;
  overflow-x:hidden;
  scroll-behavior:smooth;
}

body{
  font-family:var(--font-main);
  background:var(--bg-primary);
  color:var(--text-primary);
}

img{
  width:100%;
  display:block;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  border:none;
  outline:none;
  cursor:pointer;
  font-family:var(--font-main);
}

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-thumb{
  background:var(--accent);
  border-radius:10px;
}

/* =====================================================
HEADER
===================================================== */

.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:var(--header-h);

  z-index:999;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 24px;

  background:rgba(8,8,16,.92);
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--border);
}

.header-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  font-family:var(--font-display);
  font-size:1.6rem;
  font-weight:900;

  background:linear-gradient(135deg,#d8b4fe,var(--accent-bright));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hamburger{
  width:42px;
  height:42px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;

  background:rgba(255,255,255,.03);

  border:1px solid var(--border);
  border-radius:12px;
}

.hamburger span{
  width:18px;
  height:2px;
  background:#fff;
}

.search-btn{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:rgba(255,255,255,.03);

  border:1px solid var(--border);

  color:#fff;
}

/* =====================================================
SIDEBAR
===================================================== */

.sidebar{
  position:fixed;
  top:0;
  left:-280px;

  width:280px;
  height:100vh;

  z-index:1200;

  background:var(--bg-secondary);

  transition:.35s;

  border-right:1px solid var(--border);

  padding:24px 0;
}

.sidebar.open{
  left:0;
}

.sidebar-overlay{
  position:fixed;
  inset:0;

  z-index:1100;

  background:rgba(0,0,0,.6);

  opacity:0;
  pointer-events:none;

  transition:.3s;
}

.sidebar-overlay.open{
  opacity:1;
  pointer-events:auto;
}

.sidebar-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px 20px;

  border-bottom:1px solid var(--border);
}

.sidebar-close{
  background:none;
  color:#fff;
  font-size:1.4rem;
}

.sidebar-links{
  display:flex;
  flex-direction:column;
  margin-top:10px;
}

.sidebar-links a{
  padding:15px 22px;

  color:var(--text-secondary);

  transition:.25s;
}

.sidebar-links a:hover{
  background:rgba(255,255,255,.03);
  color:#fff;
}

/* =====================================================
BANNER
===================================================== */

.banner{
  position:relative;

  width:100%;
  height:420px;

  margin-top:var(--header-h);

  overflow:hidden;
}

.banner-bg{
  position:absolute;
  inset:0;

  background-size:cover;
  background-position:center;

  filter:blur(8px) brightness(.28);

  transform:scale(1.1);
}

.banner-overlay{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to top,
      var(--bg-primary) 0%,
      rgba(8,8,16,.65) 55%,
      transparent 100%
    );
}

/* =====================================================
DETAILS WRAP
===================================================== */

.details-wrap{
  max-width:1320px;

  margin:auto;

  padding:0 24px;

  margin-top:-160px;

  position:relative;
  z-index:2;
}

.details-grid{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:34px;
}

/* =====================================================
LEFT
===================================================== */

.poster-col{
  position:sticky;
  top:92px;
  align-self:start;
}

.poster{
  border-radius:22px;
  overflow:hidden;

  box-shadow:
    0 20px 60px rgba(0,0,0,.7),
    0 0 40px rgba(124,58,237,.25);

  border:2px solid rgba(124,58,237,.3);
}

.watch-btn{
  width:100%;

  margin-top:14px;

  padding:14px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent-bright)
    );

  color:#fff;
  font-weight:700;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.3s;
}

.watch-btn:hover{
  transform:translateY(-2px);
}

.quick-info{
  display:flex;
  flex-direction:column;
  gap:10px;

  margin-top:14px;
}

.quick-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  gap:10px;

  padding:10px 12px;

  background:rgba(255,255,255,.03);

  border-radius:12px;

  border:1px solid var(--border);

  font-size:.82rem;
}

.quick-row span:first-child{
  color:var(--text-muted);
}

.quick-row span:last-child{
  text-align:right;
  max-width:58%;
  word-break:break-word;
}

/* =====================================================
RIGHT
===================================================== */

.info-col{
  padding-top:160px;
}

.status-badge{
  display:inline-flex;
  align-items:center;

  padding:6px 14px;

  border-radius:999px;

  font-size:.75rem;
  font-weight:700;

  margin-bottom:16px;

  background:rgba(16,185,129,.15);
  color:#10b981;

  border:1px solid rgba(16,185,129,.25);
}

.title{
  font-size:clamp(2rem,5vw,3.6rem);
  line-height:1.1;
  font-weight:900;

  margin-bottom:10px;
}

.sub-title{
  color:var(--text-muted);
  margin-bottom:20px;
}

.score-row{
  display:flex;
  flex-wrap:wrap;
  gap:26px;

  margin-bottom:24px;
}

.score-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.score-number{
  font-size:2rem;
  font-weight:900;
  color:#facc15;
}

.score-small{
  font-size:.75rem;
  color:var(--text-muted);
}

.stat{
  text-align:center;
}

.stat-num{
  font-size:1.1rem;
  font-weight:700;
}

.stat-label{
  font-size:.7rem;
  color:var(--text-muted);
}

.genres{
  display:flex;
  flex-wrap:wrap;
  gap:10px;

  margin-bottom:24px;
}

.genre{
  padding:7px 16px;

  border-radius:999px;

  background:rgba(255,255,255,.03);

  border:1px solid var(--border);

  color:var(--text-secondary);

  font-size:.82rem;
}

.synopsis-title{
  font-size:.85rem;
  letter-spacing:2px;
  text-transform:uppercase;

  color:var(--text-muted);

  margin-bottom:12px;
}

.synopsis{
  color:var(--text-secondary);

  line-height:1.85;
  font-size:.95rem;
}

/* =====================================================
TABS
===================================================== */

.tabs{
  display:flex;
  gap:4px;

  overflow-x:auto;

  margin:40px 0 24px;

  border-bottom:1px solid var(--border);

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab-btn{
  flex-shrink:0;

  padding:14px 18px;

  background:none;

  color:var(--text-muted);

  font-weight:600;

  border-bottom:2px solid transparent;

  transition:.25s;
}

.tab-btn.active{
  color:#c084fc;
  border-color:#c084fc;
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

/* =====================================================
EPISODES
===================================================== */

.ep-search{
  display:flex;
  gap:12px;

  margin-bottom:20px;
}

.ep-search input{
  flex:1;

  padding:12px 16px;

  border-radius:12px;

  background:var(--bg-card);

  border:1px solid var(--border);

  color:#fff;
}

.ep-go{
  padding:12px 22px;

  border-radius:12px;

  background:var(--accent);

  color:#fff;
  font-weight:700;
}

.ep-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
  gap:10px;
}

.ep-btn{
  aspect-ratio:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:var(--bg-card);

  border:1px solid var(--border);

  color:#fff;

  transition:.25s;
}

.ep-btn:hover{
  transform:translateY(-2px);
  background:var(--accent);
}

.ep-btn span{
  font-size:.65rem;
  color:var(--text-muted);
}

/* =====================================================
CHARACTERS
===================================================== */

.characters{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}

.character{
  background:var(--bg-card);

  border-radius:16px;

  overflow:hidden;

  border:1px solid var(--border);

  transition:.25s;
}

.character:hover{
  transform:translateY(-4px);
}

.character img{
  height:220px;
  object-fit:cover;
  object-position:top;
}

.character-info{
  padding:12px;
}

.character-name{
  font-size:.85rem;
  font-weight:700;
  margin-bottom:3px;
}

.character-role{
  font-size:.72rem;
  color:var(--text-muted);
}

/* =====================================================
RECOMMENDATIONS
===================================================== */

.recommendations{
  display:flex;
  gap:14px;

  overflow-x:auto;

  padding-bottom:10px;
}

.recommendations::-webkit-scrollbar{
  height:4px;
}

.rec-card{
  flex:0 0 150px;

  background:var(--bg-card);

  border-radius:14px;

  overflow:hidden;

  border:1px solid var(--border);

  transition:.25s;
}

.rec-card:hover{
  transform:translateY(-4px);
}

.rec-card img{
  height:220px;
  object-fit:cover;
}

.rec-title{
  padding:10px;
  font-size:.78rem;
  font-weight:600;
}

/* =====================================================
TRAILER
===================================================== */

.trailer{
  position:relative;

  width:100%;
  max-width:760px;

  border-radius:22px;

  overflow:hidden;
}

.trailer::before{
  content:'';
  display:block;
  padding-top:56.25%;
}

.trailer iframe{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;
}

/* =====================================================
FOOTER
===================================================== */

.footer{
  margin-top:60px;

  padding:30px 20px;

  border-top:1px solid var(--border);

  text-align:center;

  background:var(--bg-secondary);
}

.footer-logo{
  font-family:var(--font-display);
  font-size:1.3rem;
  margin-bottom:10px;
}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1100px){

  .details-grid{
    grid-template-columns:210px 1fr;
  }

}

@media(max-width:900px){

  .banner{
    height:320px;
  }

  .details-grid{
    grid-template-columns:1fr;
  }

  .poster-col{
    position:static;

    display:flex;
    gap:18px;
    align-items:flex-start;
  }

  .poster{
    width:190px;
    flex-shrink:0;
  }

  .quick-info{
    flex:1;
  }

  .info-col{
    padding-top:0;
  }

  .watch-btn{
    display:none;
  }

}

@media(max-width:768px){

  .header{
    padding:0 16px;
  }

  .banner{
    height:260px;
  }

  .details-wrap{
    margin-top:-90px;
    padding:0 16px;
  }

  .poster-col{
    flex-direction:column;
    align-items:center;
  }

  .poster{
    width:180px;
  }

  .quick-info{
    width:100%;
  }

  .title{
    text-align:center;
    font-size:2rem;
  }

  .sub-title{
    text-align:center;
  }

  .status-badge{
    margin:auto auto 14px;
    display:flex;
    width:max-content;
  }

  .score-row{
    justify-content:center;
  }

  .genres{
    justify-content:center;
  }

  .tabs{
    margin-top:30px;
  }

  .ep-search{
    flex-direction:column;
  }

  .ep-grid{
    grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
  }

  .characters{
    grid-template-columns:repeat(2,1fr);
  }

  .character img{
    height:180px;
  }

}

@media(max-width:480px){

  .title{
    font-size:1.7rem;
  }

  .poster{
    width:160px;
  }

  .score-number{
    font-size:1.6rem;
  }

  .ep-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .rec-card{
    flex:0 0 120px;
  }

  .rec-card img{
    height:180px;
  }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar-overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">

  <div class="sidebar-top">
    <div class="logo">AniVerse</div>

    <button class="sidebar-close" id="closeSidebar">
      ✕
    </button>
  </div>

  <div class="sidebar-links">
    <a href="index.html">Home</a>
    <a href="search.html">Browse</a>
    <a href="schedule.html">Schedule</a>
    <a href="creator.html">Creator</a>
  </div>

</div>

<!-- HEADER -->

<header class="header">

  <div class="header-left">

    <button class="hamburger" id="openSidebar">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="index.html" class="logo">
      AniVerse
    </a>

  </div>

  <a href="search.html" class="search-btn">

    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>

  </a>

</header>

<!-- BANNER -->

<section class="banner">

  <div class="banner-bg" id="bannerBg"></div>

  <div class="banner-overlay"></div>

</section>

<!-- DETAILS -->

<div class="details-wrap">

  <div id="root">

    <div style="padding:80px 20px;text-align:center;color:#999;">
      Loading anime...
    </div>

  </div>

</div>

<!-- FOOTER -->

<footer class="footer">

  <div class="footer-logo">
    AniVerse
  </div>

  <div style="color:#777;font-size:.85rem;">
    © 2025 AniVerse
  </div>

</footer>

<script>

const API = 'https://api.jikan.moe/v4';

const root = document.getElementById('root');

const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

document.getElementById('openSidebar').onclick = () => {
  sidebar.classList.add('open');
  overlay.classList.add('open');
};

document.getElementById('closeSidebar').onclick = closeSidebar;
overlay.onclick = closeSidebar;

function closeSidebar(){
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
}

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function esc(str=''){
  return str.replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m]));
}

function tab(name){

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.classList.remove('active');
  });

  document.querySelectorAll('.tab-content').forEach(content=>{
    content.classList.remove('active');
  });

  document.getElementById('btn-'+name).classList.add('active');
  document.getElementById(name).classList.add('active');
}

async function loadAnime(){

  const id = getParam('id');

  if(!id){
    root.innerHTML = '<div style="padding:80px;text-align:center;">Anime not found.</div>';
    return;
  }

  try{

    const [
      animeRes,
      charRes,
      recRes
    ] = await Promise.all([

      fetch(`${API}/anime/${id}/full`),
      fetch(`${API}/anime/${id}/characters`),
      fetch(`${API}/anime/${id}/recommendations`)

    ]);

    const animeData = await animeRes.json();
    const charData = await charRes.json();
    const recData = await recRes.json();

    const anime = animeData.data;

    document.title = anime.title + ' — AniVerse';

    const banner =
      anime.images.jpg.large_image_url ||
      anime.images.jpg.image_url;

    document.getElementById('bannerBg').style.backgroundImage =
      `url(${banner})`;

    const genres = anime.genres.map(g=>`
      <div class="genre">${g.name}</div>
    `).join('');

    const chars = charData.data.slice(0,16).map(c=>`

      <div class="character">

        <img
          src="${c.character.images.jpg.image_url}"
          alt="${esc(c.character.name)}"
        >

        <div class="character-info">

          <div class="character-name">
            ${esc(c.character.name)}
          </div>

          <div class="character-role">
            ${esc(c.role)}
          </div>

        </div>

      </div>

    `).join('');

    const recs = recData.data.slice(0,12).map(r=>`

      <a
        href="anime.html?id=${r.entry.mal_id}"
        class="rec-card"
      >

        <img
          src="${r.entry.images.jpg.image_url}"
          alt="${esc(r.entry.title)}"
        >

        <div class="rec-title">
          ${esc(r.entry.title)}
        </div>

      </a>

    `).join('');

    const episodes = Array.from({
      length:Math.min(anime.episodes || 24,200)
    },(_,i)=>`

      <a
        href="watch.html?id=${anime.mal_id}&ep=${i+1}"
        class="ep-btn"
      >
        ${i+1}
        <span>EP</span>
      </a>

    `).join('');

    root.innerHTML = `

      <div class="details-grid">

        <!-- LEFT -->

        <div class="poster-col">

          <img
            src="${banner}"
            class="poster"
          >

          <a
            href="watch.html?id=${anime.mal_id}&ep=1"
            class="watch-btn"
          >
            ▶ Watch Now
          </a>

          <div class="quick-info">

            <div class="quick-row">
              <span>Score</span>
              <span>⭐ ${anime.score || 'N/A'}</span>
            </div>

            <div class="quick-row">
              <span>Rank</span>
              <span>#${anime.rank || 'N/A'}</span>
            </div>

            <div class="quick-row">
              <span>Episodes</span>
              <span>${anime.episodes || '?'}</span>
            </div>

            <div class="quick-row">
              <span>Status</span>
              <span>${anime.status}</span>
            </div>

            <div class="quick-row">
              <span>Studio</span>
              <span>${anime.studios.map(s=>s.name).join(', ')}</span>
            </div>

            <div class="quick-row">
              <span>Duration</span>
              <span>${anime.duration}</span>
            </div>

          </div>

        </div>

        <!-- RIGHT -->

        <div class="info-col">

          <div class="status-badge">
            Currently Airing
          </div>

          <h1 class="title">
            ${esc(anime.title)}
          </h1>

          <div class="sub-title">
            ${esc(anime.title_english || '')}
          </div>

          <div class="score-row">

            <div class="score-box">

              <div class="score-number">
                ${anime.score || 'N/A'}
              </div>

              <div class="score-small">
                MAL<br>Score
              </div>

            </div>

            <div class="stat">
              <div class="stat-num">
                #${anime.rank || 'N/A'}
              </div>
              <div class="stat-label">
                Ranked
              </div>
            </div>

            <div class="stat">
              <div class="stat-num">
                #${anime.popularity || 'N/A'}
              </div>
              <div class="stat-label">
                Popularity
              </div>
            </div>

          </div>

          <div class="genres">
            ${genres}
          </div>

          <div class="synopsis-title">
            Synopsis
          </div>

          <div class="synopsis">
            ${anime.synopsis || 'No synopsis available.'}
          </div>

          <!-- TABS -->

          <div class="tabs">

            <button
              class="tab-btn active"
              id="btn-episodes"
              onclick="tab('episodes')"
            >
              Episodes
            </button>

            <button
              class="tab-btn"
              id="btn-characters"
              onclick="tab('characters')"
            >
              Characters
            </button>

            <button
              class="tab-btn"
              id="btn-trailer"
              onclick="tab('trailer')"
            >
              Trailer
            </button>

            <button
              class="tab-btn"
              id="btn-recommendations"
              onclick="tab('recommendations')"
            >
              Similar
            </button>

          </div>

          <!-- EPISODES -->

          <div class="tab-content active" id="episodes">

            <div class="ep-search">

              <input
                type="number"
                placeholder="Jump to episode..."
                id="jumpInput"
              >

              <button
                class="ep-go"
                onclick="jumpEpisode(${anime.mal_id})"
              >
                Go
              </button>

            </div>

            <div class="ep-grid">
              ${episodes}
            </div>

          </div>

          <!-- CHARACTERS -->

          <div class="tab-content" id="characters">

            <div class="characters">
              ${chars}
            </div>

          </div>

          <!-- TRAILER -->

          <div class="tab-content" id="trailer">

            ${
              anime.trailer.embed_url

              ?

              `
              <div class="trailer">

                <iframe
                  src="${anime.trailer.embed_url}"
                  allowfullscreen
                ></iframe>

              </div>
              `

              :

              `<div style="color:#888;">No trailer available.</div>`
            }

          </div>

          <!-- RECOMMENDATIONS -->

          <div class="tab-content" id="recommendations">

            <div class="recommendations">
              ${recs}
            </div>

          </div>

        </div>

      </div>

    `;

  }catch(err){

    root.innerHTML = `
      <div style="padding:80px;text-align:center;color:#999;">
        Failed to load anime.
      </div>
    `;

  }

}

function jumpEpisode(id){

  const ep = document.getElementById('jumpInput').value;

  if(!ep) return;

  location.href = `watch.html?id=${id}&ep=${ep}`;

}

loadAnime();

</script>

</body>
</html>
