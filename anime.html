<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:title" content="Anime Details - AnimeStream">
  <meta property="og:description" content="View detailed anime information, episodes, characters, and more.">

  <style>

/* ========== CSS VARIABLES & RESET ========== */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a2e;
  --bg-glass: rgba(26, 26, 46, 0.7);
  --accent: #8b5cf6;
  --accent-glow: #a78bfa;
  --accent-dark: #7c3aed;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: rgba(139, 92, 246, 0.15);
  --border-glow: rgba(139, 92, 246, 0.4);
  --gradient-hero: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
  --gradient-card: linear-gradient(180deg, rgba(26,26,46,0.9) 0%, rgba(10,10,15,0.95) 100%);
  --shadow-glow: 0 0 30px rgba(139, 92, 246, 0.15);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.5s ease;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a {
  text-decoration: none;
  color: inherit;
}

img {
  max-width: 100%;
  display: block;
}

button {
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
}

ul, ol {
  list-style: none;
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg-primary);
}
::-webkit-scrollbar-thumb {
  background: var(--accent-dark);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}

/* ========== SKELETON LOADING ========== */
@keyframes skeleton-pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}
.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, #2a2a4a 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton-text {
  height: 16px;
  margin-bottom: 8px;
}
.skeleton-title {
  height: 24px;
  width: 60%;
  margin-bottom: 12px;
}
.skeleton-card {
  aspect-ratio: 2/3;
  border-radius: var(--radius-md);
}
.skeleton-banner {
  height: 100%;
  border-radius: var(--radius-xl);
}

/* ========== HEADER ========== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  height: 70px;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  transition: var(--transition-normal);
}

.header.scrolled {
  background: rgba(10, 10, 15, 0.95);
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.hamburger {
  width: 40px;
  height: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.hamburger:hover {
  background: rgba(139, 92, 246, 0.1);
}
.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--text-primary);
  border-radius: 2px;
  transition: var(--transition-fast);
}
.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

.logo {
  font-size: 1.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-glow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-trigger {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
  color: var(--text-secondary);
}
.search-trigger:hover {
  background: rgba(139, 92, 246, 0.1);
  color: var(--text-primary);
}

/* ========== MOBILE SIDEBAR ========== */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition-normal);
}
.sidebar-overlay.active {
  opacity: 1;
  visibility: visible;
}

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 280px;
  height: 100vh;
  background: var(--bg-secondary);
  z-index: 1001;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  border-right: 1px solid var(--border);
}
.sidebar.active {
  transform: translateX(0);
}

.sidebar-header {
  padding: 24px;
  border-bottom: 1px solid var(--border);
}

.sidebar-nav {
  padding: 16px 0;
}

.sidebar-nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  color: var(--text-secondary);
  transition: var(--transition-fast);
  font-size: 0.95rem;
}
.sidebar-nav a:hover,
.sidebar-nav a.active {
  color: var(--accent-glow);
  background: rgba(139, 92, 246, 0.08);
}

/* ========== SEARCH OVERLAY ========== */
.search-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 15, 0.95);
  backdrop-filter: blur(20px);
  z-index: 1002;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 15vh;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition-normal);
}
.search-overlay.active {
  opacity: 1;
  visibility: visible;
}

.search-container {
  width: 90%;
  max-width: 700px;
}

.search-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.search-input {
  width: 100%;
  padding: 18px 24px 18px 56px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius-xl);
  color: var(--text-primary);
  font-size: 1.1rem;
  outline: none;
  transition: var(--transition-fast);
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
}
.search-input::placeholder {
  color: var(--text-muted);
}

.search-icon {
  position: absolute;
  left: 20px;
  color: var(--text-muted);
}

.search-close {
  position: absolute;
  top: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: var(--transition-fast);
}
.search-close:hover {
  background: var(--accent-dark);
  color: var(--text-primary);
}

.search-suggestions {
  margin-top: 16px;
  max-height: 60vh;
  overflow-y: auto;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  display: none;
}
.search-suggestions.active {
  display: block;
}

.suggestion-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: var(--transition-fast);
  cursor: pointer;
}
.suggestion-item:hover {
  background: rgba(139, 92, 246, 0.08);
}
.suggestion-item img {
  width: 48px;
  height: 68px;
  object-fit: cover;
  border-radius: var(--radius-sm);
}
.suggestion-item .suggestion-info {
  flex: 1;
}
.suggestion-item .suggestion-title {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-primary);
}
.suggestion-item .suggestion-meta {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ========== HERO SLIDER ========== */
.hero-section {
  position: relative;
  width: 100%;
  height: 85vh;
  min-height: 600px;
  max-height: 900px;
  overflow: hidden;
  margin-top: 70px;
}

.hero-slider {
  position: relative;
  width: 100%;
  height: 100%;
}

.hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
.hero-slide.active {
  opacity: 1;
  visibility: visible;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  transition: transform 8s ease;
}
.hero-slide.active .hero-bg {
  transform: scale(1.05);
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--bg-primary) 0%, transparent 50%, rgba(10,10,15,0.4) 100%);
}
.hero-overlay::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, var(--bg-primary) 0%, transparent 60%);
}

.hero-content {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 60px 48px 80px;
  z-index: 2;
  max-width: 700px;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(139, 92, 246, 0.2);
  border: 1px solid var(--border-glow);
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--accent-glow);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.hero-title {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 16px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.hero-score {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #fbbf24;
  font-weight: 700;
  font-size: 1rem;
}

.hero-genres {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.hero-genre {
  padding: 4px 12px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.hero-synopsis {
  font-size: 1rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 24px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hero-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.95rem;
  transition: var(--transition-fast);
  cursor: pointer;
}

.btn-primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
}
.btn-primary:hover {
  background: var(--accent-dark);
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(139, 92, 246, 0.4);
}

.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.12);
  border-color: var(--border-glow);
}

.hero-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  border-radius: 50%;
  color: white;
  z-index: 10;
  transition: var(--transition-fast);
  border: 1px solid rgba(255,255,255,0.1);
}
.hero-nav:hover {
  background: rgba(139, 92, 246, 0.3);
  border-color: var(--accent);
}
.hero-prev { left: 24px; }
.hero-next { right: 24px; }

.hero-dots {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
}

.hero-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  cursor: pointer;
  transition: var(--transition-fast);
  border: none;
}
.hero-dot.active {
  background: var(--accent);
  width: 28px;
  border-radius: 5px;
}

/* ========== WIDGET SECTIONS ========== */
.section {
  padding: 48px 24px;
  max-width: 1400px;
  margin: 0 auto;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.section-title {
  font-size: 1.4rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title .icon {
  color: var(--accent);
}

.section-link {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--accent-glow);
  font-size: 0.9rem;
  font-weight: 600;
  transition: var(--transition-fast);
}
.section-link:hover {
  gap: 8px;
}

/* ========== UNIVERSAL SLIDER SYSTEM ========== */
.slider-wrapper {
  position: relative;
  overflow: hidden;
}

.slider-track {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 8px 4px;
  cursor: grab;
}
.slider-track::-webkit-scrollbar {
  display: none;
}
.slider-track.dragging {
  cursor: grabbing;
  scroll-behavior: auto;
}

.slider-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 10, 15, 0.8);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-primary);
  z-index: 5;
  transition: var(--transition-fast);
  opacity: 0;
  visibility: hidden;
}
.slider-wrapper:hover .slider-nav {
  opacity: 1;
  visibility: visible;
}
.slider-nav:hover {
  background: var(--accent);
  border-color: var(--accent);
}
.slider-prev { left: -8px; }
.slider-next { right: -8px; }

/* ========== ANIME CARD ========== */
.anime-card {
  flex: 0 0 auto;
  width: 185px;
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}
.anime-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-glow);
}

.card-poster {
  position: relative;
  aspect-ratio: 2/3;
  overflow: hidden;
  border-radius: var(--radius-md);
}
.card-poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.anime-card:hover .card-poster img {
  transform: scale(1.08);
}

.card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10,10,15,0.95) 0%, transparent 60%);
  opacity: 0.7;
  transition: opacity 0.3s ease;
}
.anime-card:hover .card-overlay {
  opacity: 1;
}

.card-badges {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card-badge {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
}
.badge-hd {
  background: #ef4444;
  color: white;
}
.badge-score {
  background: rgba(251, 191, 36, 0.9);
  color: #1a1a2e;
  display: flex;
  align-items: center;
  gap: 2px;
}
.badge-ep {
  background: var(--accent);
  color: white;
}
.badge-type {
  background: rgba(255,255,255,0.15);
  color: white;
  backdrop-filter: blur(4px);
}

.card-info {
  padding: 10px 4px 4px;
}

.card-title {
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text-primary);
}

.card-meta {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ========== ERROR FALLBACK ========== */
.error-fallback {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
}
.error-fallback svg {
  width: 48px;
  height: 48px;
  margin-bottom: 12px;
  color: var(--text-muted);
  opacity: 0.5;
}
.error-fallback p {
  font-size: 0.9rem;
  margin-bottom: 12px;
}
.error-fallback .retry-btn {
  padding: 8px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 0.85rem;
  transition: var(--transition-fast);
}
.error-fallback .retry-btn:hover {
  border-color: var(--accent);
  color: var(--accent-glow);
}

/* ========== FOOTER ========== */
.footer {
  padding: 40px 24px;
  text-align: center;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

.footer-content {
  max-width: 600px;
  margin: 0 auto;
}

.footer-logo {
  font-size: 1.3rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-glow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
}

.footer-text {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-bottom: 16px;
}

.footer-social {
  display: flex;
  justify-content: center;
  gap: 16px;
}

.footer-social a {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: var(--transition-fast);
  border: 1px solid var(--border);
}
.footer-social a:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  transform: translateY(-2px);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .header {
    padding: 0 16px;
    height: 60px;
  }
  .hero-section {
    height: 70vh;
    min-height: 500px;
    margin-top: 60px;
  }
  .hero-content {
    padding: 40px 20px 60px;
    max-width: 100%;
  }
  .hero-title {
    font-size: 1.8rem;
  }
  .hero-synopsis {
    -webkit-line-clamp: 2;
  }
  .hero-nav {
    display: none;
  }
  .section {
    padding: 32px 16px;
  }
  .anime-card {
    width: 150px;
  }
  .slider-nav {
    display: none;
  }
  .btn {
    padding: 10px 20px;
    font-size: 0.9rem;
  }
}

@media (max-width: 480px) {
  .anime-card {
    width: 130px;
  }
  .hero-title {
    font-size: 1.5rem;
  }
}

/* ========== LOADING STATES ========== */
.loading-shimmer {
  background: linear-gradient(90deg, var(--bg-card) 25%, #252545 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {

/* ========== CONFIG ========== */
const CONFIG = {
  JIKAN_BASE: 'https://api.jikan.moe/v4',
  RETRY_ATTEMPTS: 3,
  RETRY_DELAY: 1000,
  TIMEOUT: 8000,
  CACHE_TTL: 5 * 60 * 1000, // 5 minutes
  RATE_LIMIT_DELAY: 400, // ms between requests
};

/* ========== API UTILITIES ========== */
let lastRequestTime = 0;

async function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function rateLimit() {
  const now = Date.now();
  const elapsed = now - lastRequestTime;
  if (elapsed < CONFIG.RATE_LIMIT_DELAY) {
    await sleep(CONFIG.RATE_LIMIT_DELAY - elapsed);
  }
  lastRequestTime = Date.now();
}

async function fetchWithTimeout(url, options = {}, timeout = CONFIG.TIMEOUT) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    await rateLimit();
    const response = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(id);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    return response;
  } catch (error) {
    clearTimeout(id);
    throw error;
  }
}

async function fetchWithRetry(url, options = {}, retries = CONFIG.RETRY_ATTEMPTS) {
  let lastError;
  for (let i = 0; i < retries; i++) {
    try {
      const response = await fetchWithTimeout(url, options);
      return await response.json();
    } catch (error) {
      lastError = error;
      if (i < retries - 1) {
        const delay = CONFIG.RETRY_DELAY * Math.pow(2, i);
        console.warn(`Retry ${i + 1}/${retries} for ${url} after ${delay}ms`);
        await sleep(delay);
      }
    }
  }
  throw lastError;
}

function getCacheKey(url) {
  return 'cache_' + btoa(url);
}

function getCached(url) {
  try {
    const key = getCacheKey(url);
    const cached = localStorage.getItem(key);
    if (cached) {
      const { data, timestamp } = JSON.parse(cached);
      if (Date.now() - timestamp < CONFIG.CACHE_TTL) {
        return data;
      }
    }
  } catch (e) {}
  return null;
}

function setCache(url, data) {
  try {
    const key = getCacheKey(url);
    localStorage.setItem(key, JSON.stringify({ data, timestamp: Date.now() }));
  } catch (e) {}
}

async function jikanFetch(endpoint, useCache = true) {
  const url = CONFIG.JIKAN_BASE + endpoint;
  if (useCache) {
    const cached = getCached(url);
    if (cached) return cached;
  }
  const data = await fetchWithRetry(url);
  if (useCache && data && data.data) {
    setCache(url, data);
  }
  return data;
}

/* ========== SAFE DOM UTILITIES ========== */
function safeText(value, fallback = 'N/A') {
  if (value === null || value === undefined) return fallback;
  if (typeof value === 'string') return value || fallback;
  if (typeof value === 'number') return String(value);
  return fallback;
}

function safeArray(value) {
  if (Array.isArray(value)) return value;
  if (value === null || value === undefined) return [];
  return [value];
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function createErrorFallback(message, onRetry) {
  const div = document.createElement('div');
  div.className = 'error-fallback';
  div.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p>${escapeHtml(message)}</p>
    ${onRetry ? '<button class="retry-btn">Try Again</button>' : ''}
  `;
  if (onRetry) {
    div.querySelector('.retry-btn').addEventListener('click', onRetry);
  }
  return div;
}

/* ========== UNIVERSAL SLIDER SYSTEM ========== */
class UniversalSlider {
  constructor(container) {
    this.container = container;
    this.track = container.querySelector('.slider-track');
    this.prevBtn = container.querySelector('.slider-prev');
    this.nextBtn = container.querySelector('.slider-next');
    this.isDragging = false;
    this.startX = 0;
    this.scrollLeft = 0;
    this.initialized = false;

    if (!this.track) return;
    this.init();
  }

  init() {
    if (this.initialized) return;
    this.initialized = true;

    // Navigation buttons
    if (this.prevBtn) {
      this.prevBtn.addEventListener('click', () => this.scroll(-1));
    }
    if (this.nextBtn) {
      this.nextBtn.addEventListener('click', () => this.scroll(1));
    }

    // Mouse drag
    this.track.addEventListener('mousedown', (e) => {
      this.isDragging = true;
      this.track.classList.add('dragging');
      this.startX = e.pageX - this.track.offsetLeft;
      this.scrollLeft = this.track.scrollLeft;
    });

    this.track.addEventListener('mouseleave', () => {
      this.isDragging = false;
      this.track.classList.remove('dragging');
    });

    this.track.addEventListener('mouseup', () => {
      this.isDragging = false;
      this.track.classList.remove('dragging');
    });

    this.track.addEventListener('mousemove', (e) => {
      if (!this.isDragging) return;
      e.preventDefault();
      const x = e.pageX - this.track.offsetLeft;
      const walk = (x - this.startX) * 1.5;
      this.track.scrollLeft = this.scrollLeft - walk;
    });

    // Touch support
    let touchStartX = 0;
    let touchScrollLeft = 0;

    this.track.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchScrollLeft = this.track.scrollLeft;
    }, { passive: true });

    this.track.addEventListener('touchmove', (e) => {
      const touchX = e.touches[0].clientX;
      const diff = touchStartX - touchX;
      this.track.scrollLeft = touchScrollLeft + diff;
    }, { passive: true });

    // Wheel scroll (horizontal)
    this.track.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        this.track.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // Update nav visibility
    this.track.addEventListener('scroll', () => this.updateNavVisibility(), { passive: true });
    this.updateNavVisibility();
  }

  scroll(direction) {
    const cardWidth = this.track.querySelector('.anime-card')?.offsetWidth || 200;
    const gap = 16;
    const scrollAmount = (cardWidth + gap) * 3;
    this.track.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
  }

  updateNavVisibility() {
    if (!this.prevBtn || !this.nextBtn) return;
    const { scrollLeft, scrollWidth, clientWidth } = this.track;
    this.prevBtn.style.opacity = scrollLeft > 10 ? '1' : '0.3';
    this.nextBtn.style.opacity = scrollLeft < scrollWidth - clientWidth - 10 ? '1' : '0.3';
  }

  destroy() {
    this.initialized = false;
  }
}

/* ========== HEADER & NAVIGATION ========== */
function initHeader() {
  const header = document.querySelector('.header');
  const hamburger = document.querySelector('.hamburger');
  const sidebar = document.querySelector('.sidebar');
  const sidebarOverlay = document.querySelector('.sidebar-overlay');
  const searchTrigger = document.querySelector('.search-trigger');
  const searchOverlay = document.querySelector('.search-overlay');
  const searchClose = document.querySelector('.search-close');
  const searchInput = document.querySelector('.search-input');
  const searchSuggestions = document.querySelector('.search-suggestions');

  // Scroll effect
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  }, { passive: true });

  // Sidebar toggle
  if (hamburger) {
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      sidebar.classList.toggle('active');
      sidebarOverlay.classList.toggle('active');
      document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    });
  }

  if (sidebarOverlay) {
    sidebarOverlay.addEventListener('click', () => {
      hamburger.classList.remove('active');
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
      document.body.style.overflow = '';
    });
  }

  // Search overlay
  if (searchTrigger) {
    searchTrigger.addEventListener('click', () => {
      searchOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      setTimeout(() => searchInput?.focus(), 100);
    });
  }

  if (searchClose) {
    searchClose.addEventListener('click', () => {
      searchOverlay.classList.remove('active');
      document.body.style.overflow = '';
      searchSuggestions.classList.remove('active');
    });
  }

  // Live search
  let searchTimeout;
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      if (query.length < 2) {
        searchSuggestions.classList.remove('active');
        return;
      }
      searchTimeout = setTimeout(() => performLiveSearch(query), 400);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (query) {
          window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        }
      }
    });
  }

  // Keyboard shortcut for search
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      searchTrigger?.click();
    }
    if (e.key === 'Escape') {
      if (searchOverlay?.classList.contains('active')) {
        searchClose?.click();
      }
      if (sidebar?.classList.contains('active')) {
        sidebarOverlay?.click();
      }
    }
  });
}

async function performLiveSearch(query) {
  const suggestions = document.querySelector('.search-suggestions');
  try {
    const data = await jikanFetch(`/anime?q=${encodeURIComponent(query)}&limit=6&sfw=true`, false);
    if (!data || !data.data || !data.data.length) {
      suggestions.classList.remove('active');
      return;
    }

    suggestions.innerHTML = data.data.map(anime => `
      <div class="suggestion-item" onclick="window.location.href='anime.html?id=${anime.mal_id}'">
        <img src="${anime.images?.jpg?.small_image_url || anime.images?.jpg?.image_url || ''}" alt="" loading="lazy">
        <div class="suggestion-info">
          <div class="suggestion-title">${escapeHtml(anime.title)}</div>
          <div class="suggestion-meta">${anime.type || 'TV'} · ${anime.score ? anime.score + ' ★' : 'N/A'} · ${anime.year || 'N/A'}</div>
        </div>
      </div>
    `).join('');
    suggestions.classList.add('active');
  } catch (error) {
    console.error('Live search error:', error);
    suggestions.classList.remove('active');
  }
}

/* ========== WIDGET LOADER ========== */
class WidgetLoader {
  constructor(containerId, fetchFn, renderFn, options = {}) {
    this.container = document.getElementById(containerId);
    this.fetchFn = fetchFn;
    this.renderFn = renderFn;
    this.options = { minItems: 12, ...options };
    this.slider = null;
    this.loaded = false;
  }

  async load() {
    if (!this.container || this.loaded) return;

    const track = this.container.querySelector('.slider-track');
    if (!track) return;

    // Show skeleton
    track.innerHTML = createSkeletonCards(this.options.minItems);

    try {
      const data = await this.fetchFn();
      const items = safeArray(data?.data || data);

      if (items.length === 0) {
        track.innerHTML = '';
        this.container.appendChild(createErrorFallback('No anime found', () => this.load()));
        return;
      }

      track.innerHTML = items.slice(0, Math.max(items.length, this.options.minItems))
        .map(item => this.renderFn(item))
        .join('');

      // Initialize slider after DOM update
      requestAnimationFrame(() => {
        if (this.slider) {
          this.slider.destroy();
        }
        this.slider = new UniversalSlider(this.container);
      });

      this.loaded = true;
    } catch (error) {
      console.error(`Widget ${this.container.id} error:`, error);
      track.innerHTML = '';
      this.container.appendChild(createErrorFallback(
        error.message || 'Could not load content',
        () => { this.loaded = false; this.load(); }
      ));
    }
  }
}

                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Watch Now
              </button>
              <button class="btn btn-secondary" onclick="window.location.href='anime.html?id=${anime.mal_id}'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                Details
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('') + `
      <button class="hero-nav hero-prev" aria-label="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="hero-nav hero-next" aria-label="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="hero-dots">
        ${this.slides.map((_, i) => `<button class="hero-dot ${i === 0 ? 'active' : ''}" data-index="${i}" aria-label="Slide ${i + 1}"></button>`).join('')}
      </div>
    `;
  }

  setupEvents() {
    const prev = this.container.querySelector('.hero-prev');
    const next = this.container.querySelector('.hero-next');
    const dots = this.container.querySelectorAll('.hero-dot');

    prev?.addEventListener('click', () => this.prev());
    next?.addEventListener('click', () => this.next());

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        this.goTo(parseInt(dot.dataset.index));
      });
    });

    // Touch swipe
    this.container.addEventListener('touchstart', (e) => {
      this.touchStartX = e.touches[0].clientX;
    }, { passive: true });

    this.container.addEventListener('touchend', (e) => {
      const diff = this.touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        diff > 0 ? this.next() : this.prev();
      }
    }, { passive: true });

    // Pause on hover
    this.container.addEventListener('mouseenter', () => this.stopAutoSlide());
    this.container.addEventListener('mouseleave', () => this.startAutoSlide());
  }

  goTo(index) {
    const slides = this.container.querySelectorAll('.hero-slide');
    const dots = this.container.querySelectorAll('.hero-dot');

    slides[this.current].classList.remove('active');
    dots[this.current].classList.remove('active');

    this.current = (index + this.slides.length) % this.slides.length;

    slides[this.current].classList.add('active');
    dots[this.current].classList.add('active');
  }

  next() { this.goTo(this.current + 1); }
  prev() { this.goTo(this.current - 1); }

  startAutoSlide() {
    this.stopAutoSlide();
    this.interval = setInterval(() => this.next(), 6000);
  }

  stopAutoSlide() {
    if (this.interval) {
      clearInterval(this.interval);
      this.interval = null;
    }
  }

  showError(message) {
    this.container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">${message}</div>`;
  }
}

/* ========== LAZY INITIALIZATION ========== */
function initLazyWidgets(widgets) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const widget = widgets.find(w => w.container === entry.target);
        if (widget && !widget.loaded) {
          widget.load();
        }
      }
    });
  }, { rootMargin: '100px' });

  widgets.forEach(widget => {
    if (widget.container) {
      observer.observe(widget.container);
    }
  });
}

        </button>
      </div>
    </div>
  `;
}

function renderEpisodes(anime) {
  const grid = document.getElementById('episodesGrid');
  const episodes = anime.episodes || 0;

  if (episodes === 0) {
    grid.innerHTML = '<div class="error-fallback" style="grid-column:1/-1"><p>No episode data available</p></div>';
    return;
  }

  // Generate episode cards (Jikan doesn't always have individual episode data, so we generate based on count)
  const episodeCards = [];
  for (let i = 1; i <= Math.min(episodes, 50); i++) {
    episodeCards.push(`
      <div class="episode-card" onclick="window.location.href='watch.html?id=${anime.mal_id}&ep=${i}'">
        <div class="episode-num">${i}</div>
        <div class="episode-info">
          <div class="episode-title">Episode ${i}</div>
          <div class="episode-meta">${anime.duration || '24 min'}</div>
        </div>
        <div class="episode-play">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
    `);
  }

  grid.innerHTML = episodeCards.join('');
}

function renderCharacters(data) {
  const grid = document.getElementById('charactersGrid');
  const characters = safeArray(data).slice(0, 20);

  if (characters.length === 0) {
    grid.innerHTML = '<div class="error-fallback"><p>No character data available</p></div>';
    return;
  }

  grid.innerHTML = characters.map(item => {
    const char = item.character || item;
    const img = char.images?.jpg?.image_url || '';
    const name = char.name || 'Unknown';
    const role = item.role || 'Supporting';

    return `
      <div class="character-card">
        <div class="character-img">
          <img src="${img}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="character-name">${escapeHtml(name)}</div>
        <div class="character-role">${escapeHtml(role)}</div>
      </div>
    `;
  }).join('');
}

function renderRelations(data) {
  const grid = document.getElementById('relationsGrid');
  const relations = safeArray(data).slice(0, 12);

  if (relations.length === 0) {
    grid.innerHTML = '<div class="error-fallback"><p>No relations available</p></div>';
    return;
  }

  grid.innerHTML = relations.map(item => {
    const entry = item.entry || item;
    const img = entry.images?.jpg?.image_url || '';
    const title = entry.title || 'Unknown';
    const type = item.relation || 'Related';

    return `
      <div class="relation-card" onclick="window.location.href='anime.html?id=${entry.mal_id}'">
        <div class="relation-img">
          <img src="${img}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="relation-info">
          <div class="relation-type">${escapeHtml(type)}</div>
          <div class="relation-title">${escapeHtml(title)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderRecommendations(data) {
  const grid = document.getElementById('recommendationsGrid');
  const recs = safeArray(data).slice(0, 12);

  if (recs.length === 0) {
    grid.innerHTML = '<div class="error-fallback"><p>No recommendations available</p></div>';
    return;
  }

  grid.innerHTML = recs.map(item => {
    const entry = item.entry || item;
    const img = entry.images?.jpg?.image_url || '';
    const title = entry.title || 'Unknown';

    return `
      <div class="relation-card" onclick="window.location.href='anime.html?id=${entry.mal_id}'">
        <div class="relation-img">
          <img src="${img}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="relation-info">
          <div class="relation-type">Recommended</div>
          <div class="relation-title">${escapeHtml(title)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderDetails(anime) {
  const table = document.getElementById('detailsTable');
  const studios = safeArray(anime.studios).map(s => s.name).join(', ') || 'Unknown';
  const producers = safeArray(anime.producers).map(p => p.name).join(', ') || 'Unknown';
  const licensors = safeArray(anime.licensors).map(l => l.name).join(', ') || 'Unknown';
  const themes = safeArray(anime.themes).map(t => t.name).join(', ') || 'None';
  const demographics = safeArray(anime.demographics).map(d => d.name).join(', ') || 'None';

  table.innerHTML = `
    <div class="detail-item">
      <div class="detail-label">Type</div>
      <div class="detail-value">${escapeHtml(anime.type || 'Unknown')}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Episodes</div>
      <div class="detail-value">${anime.episodes || 'Unknown'}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Status</div>
      <div class="detail-value">${escapeHtml(anime.status || 'Unknown')}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Aired</div>
      <div class="detail-value">${escapeHtml(anime.aired?.string || 'Unknown')}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Season</div>
      <div class="detail-value">${escapeHtml(anime.season || 'Unknown')} ${anime.year || ''}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Duration</div>
      <div class="detail-value">${escapeHtml(anime.duration || 'Unknown')}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Rating</div>
      <div class="detail-value">${escapeHtml(anime.rating || 'Unknown')}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Score</div>
      <div class="detail-value">${anime.score || 'N/A'} (${anime.scored_by ? anime.scored_by.toLocaleString() + ' votes' : 'N/A'})</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Rank</div>
      <div class="detail-value">#${anime.rank || 'N/A'}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Popularity</div>
      <div class="detail-value">#${anime.popularity || 'N/A'}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Members</div>
      <div class="detail-value">${anime.members ? anime.members.toLocaleString() : 'N/A'}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Favorites</div>
      <div class="detail-value">${anime.favorites ? anime.favorites.toLocaleString() : 'N/A'}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Studios</div>
      <div class="detail-value">${escapeHtml(studios)}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Producers</div>
      <div class="detail-value">${escapeHtml(producers)}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Licensors</div>
      <div class="detail-value">${escapeHtml(licensors)}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Source</div>
      <div class="detail-value">${escapeHtml(anime.source || 'Unknown')}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Themes</div>
      <div class="detail-value">${escapeHtml(themes)}</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Demographics</div>
      <div class="detail-value">${escapeHtml(demographics)}</div>
    </div>
  `;
}

function renderTrailer(anime) {
  const container = document.getElementById('trailerContainer');
  const trailer = anime.trailer;

  if (!trailer || !trailer.embed_url) {
    container.innerHTML = '<div class="error-fallback"><p>No trailer available</p></div>';
    return;
  }

  container.innerHTML = `
    <div class="trailer-container">
      <iframe src="${trailer.embed_url}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>
  `;
}
