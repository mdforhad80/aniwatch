<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Anime details, episodes, characters, and more.">
<meta name="theme-color" content="#0a0a0a">
<title>Anime Details - AnimeStream</title>
<link rel="preconnect" href="https://api.jikan.moe">
<link rel="preconnect" href="https://cdn.myanimelist.net">
<style>
/* ========== CSS VARIABLES & RESET ========== */
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #111111;
  --bg-card: #161616;
  --bg-glass: rgba(22,22,22,0.85);
  --bg-overlay: rgba(0,0,0,0.7);
  --accent: #8b5cf6;
  --accent-light: #a78bfa;
  --accent-glow: rgba(139,92,246,0.4);
  --text-primary: #ffffff;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(139,92,246,0.3);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 30px var(--accent-glow);
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.5s ease;
  --header-height: 64px;
  --max-width: 1400px;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; overflow-x:hidden; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { max-width:100%; display:block; }
a { text-decoration:none; color:inherit; }
button { border:none; background:none; cursor:pointer; font-family:inherit; color:inherit; }
ul,ol { list-style:none; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

.skeleton {
  background: linear-gradient(90deg, var(--bg-card) 25%, #1f1f1f 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ========== HEADER ========== */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-height);
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 3vw, 40px);
  transition: var(--transition-normal);
}
.header.scrolled { background: rgba(10,10,10,0.98); box-shadow: var(--shadow-md); }

.header-left { display:flex; align-items:center; gap:16px; }
.menu-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.menu-btn:hover { background: var(--bg-card); }
.menu-btn svg { width:24px; height:24px; stroke:var(--text-primary); stroke-width:2; fill:none; }

.logo {
  font-size: clamp(1.2rem, 2vw, 1.5rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}
.logo span { -webkit-text-fill-color: var(--text-primary); background: none; }

.header-right { display:flex; align-items:center; gap:12px; }
.search-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition-fast);
}
.search-btn:hover { background: var(--bg-card); }
.search-btn svg { width:22px; height:22px; stroke:var(--text-primary); stroke-width:2; fill:none; }

/* ========== MOBILE SIDEBAR ========== */
.sidebar-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  z-index: 2000;
  opacity: 0; visibility: hidden;
  transition: var(--transition-normal);
}
.sidebar-overlay.active { opacity:1; visibility:visible; }
.sidebar {
  position: fixed; top:0; left:0; bottom:0;
  width: min(280px, 80vw);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  z-index: 2001;
  transform: translateX(-100%);
  transition: transform var(--transition-normal);
  overflow-y: auto;
  padding: 24px 0;
}
.sidebar.active { transform: translateX(0); }
.sidebar-close {
  position: absolute; top:16px; right:16px;
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm);
}
.sidebar-close svg { width:20px; height:20px; stroke:var(--text-secondary); stroke-width:2; fill:none; }
.sidebar-logo { padding: 0 24px 24px; font-size:1.3rem; font-weight:800; }
.sidebar-nav { padding: 0 16px; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 500;
  transition: var(--transition-fast);
  margin-bottom: 4px;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: rgba(139,92,246,0.15);
  color: var(--accent-light);
}
.sidebar-nav a svg { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; flex-shrink:0; }

/* ========== SEARCH OVERLAY ========== */
.search-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(10px);
  z-index: 1500;
  opacity: 0; visibility: hidden;
  transition: var(--transition-normal);
  display: flex; flex-direction: column; align-items: center;
  padding-top: clamp(80px, 15vh, 150px);
}
.search-overlay.active { opacity:1; visibility:visible; }
.search-container {
  width: min(600px, 90vw);
  position: relative;
}
.search-input {
  width: 100%;
  padding: 16px 24px 16px 52px;
  background: var(--bg-glass);
  border: 1px solid var(--border-hover);
  border-radius: var(--radius-xl);
  color: var(--text-primary);
  font-size: 1.1rem;
  outline: none;
  transition: var(--transition-fast);
}
.search-input:focus { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute; left:18px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; stroke:var(--text-muted); stroke-width:2; fill:none;
}
.search-close {
  position: absolute; top:-50px; right:0;
  width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
}
.search-close svg { width:20px; height:20px; stroke:var(--text-primary); stroke-width:2; fill:none; }
.search-suggestions {
  margin-top: 12px;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-height: 400px;
  overflow-y: auto;
  display: none;
}
.search-suggestions.active { display: block; }
.suggestion-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: var(--transition-fast);
  cursor: pointer;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: rgba(139,92,246,0.1); }
.suggestion-item img {
  width: 48px; height: 68px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.suggestion-info { flex: 1; min-width: 0; }
.suggestion-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestion-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

/* ========== ANIME BANNER ========== */
.anime-banner {
  position: relative;
  width: 100%;
  height: clamp(300px, 45vh, 500px);
  overflow: hidden;
  margin-top: var(--header-height);
}
.anime-banner-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center top;
  filter: blur(2px) brightness(0.4);
}
.anime-banner-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg-primary) 0%, rgba(10,10,10,0.8) 40%, rgba(10,10,10,0.5) 100%);
}
.anime-banner-content {
  position: relative;
  z-index: 2;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: clamp(24px, 4vw, 48px);
  display: flex;
  gap: clamp(20px, 3vw, 40px);
  align-items: flex-end;
  height: 100%;
}
.anime-poster {
  flex-shrink: 0;
  width: clamp(140px, 18vw, 220px);
  aspect-ratio: 2/3;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  border: 2px solid var(--border);
}
.anime-poster img {
  width: 100%; height: 100%; object-fit: cover;
}
.anime-banner-info {
  flex: 1;
  min-width: 0;
}
.anime-banner-title {
  font-size: clamp(1.5rem, 3vw, 2.5rem);
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 12px;
}
.anime-banner-meta {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.banner-score {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,193,7,0.15);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 700;
  color: #ffc107;
}
.banner-score svg { width:16px; height:16px; fill:#ffc107; }
.banner-badge {
  padding: 4px 12px;
  background: rgba(255,255,255,0.1);
  border-radius: 6px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}
.banner-genres {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.banner-genre {
  padding: 4px 12px;
  background: rgba(139,92,246,0.2);
  border: 1px solid var(--accent);
  border-radius: 20px;
  font-size: 0.75rem;
  color: var(--accent-light);
}
.banner-buttons {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  background: var(--accent);
  color: white;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  transition: var(--transition-fast);
  box-shadow: 0 4px 15px rgba(139,92,246,0.3);
}
.btn-primary:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
.btn-primary svg { width:18px; height:18px; fill:currentColor; }
.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-weight: 600;
  transition: var(--transition-fast);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: rgba(255,255,255,0.15); border-color: var(--border-hover); }

/* ========== ANIME DETAILS GRID ========== */
.anime-details {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: clamp(24px, 4vw, 48px) clamp(16px, 3vw, 40px);
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
}

/* ========== INFO SECTIONS ========== */
.section-title {
  font-size: clamp(1.1rem, 2vw, 1.4rem);
  font-weight: 700;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.section-title svg { width:22px; height:22px; stroke:var(--accent); stroke-width:2; fill:none; }
.section-title span { color: var(--accent-light); }

.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.info-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  transition: var(--transition-fast);
}
.info-item:hover { border-color: var(--border-hover); }
.info-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.info-value {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
}

/* ========== SYNOPSIS ========== */
.synopsis-text {
  font-size: clamp(0.9rem, 1.2vw, 1rem);
  color: var(--text-secondary);
  line-height: 1.8;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 20px;
}

/* ========== TRAILER ========== */
.trailer-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.trailer-container iframe {
  width: 100%; height: 100%; border: none;
}
.trailer-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  color: var(--text-muted);
  gap: 12px;
}
.trailer-placeholder svg { width:48px; height:48px; stroke:var(--text-muted); stroke-width:1.5; fill:none; }

/* ========== EPISODES ========== */
.episodes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 10px;
}
.episode-btn {
  display: flex; align-items: center; justify-content: center;
  padding: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
  transition: var(--transition-fast);
}
.episode-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}
.episode-btn.active {
  background: var(--accent);
  border-color: var(--accent);
}

/* ========== CHARACTERS ========== */
.characters-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 16px;
}
.character-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: var(--transition-fast);
}
.character-card:hover { border-color: var(--border-hover); transform: translateY(-4px); }
.character-card img {
  width: 100%; aspect-ratio: 1;
  object-fit: cover;
}
.character-name {
  padding: 10px;
  font-size: 0.8rem;
  font-weight: 600;
  text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.character-role {
  padding: 0 10px 10px;
  font-size: 0.7rem;
  color: var(--text-muted);
  text-align: center;
}

/* ========== RECOMMENDATIONS ========== */
.recommendations-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
}
.rec-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: var(--transition-fast);
  cursor: pointer;
}
.rec-card:hover { border-color: var(--border-hover); transform: translateY(-6px); box-shadow: var(--shadow-glow); }
.rec-card img {
  width: 100%; aspect-ratio: 2/3; object-fit: cover;
}
.rec-info { padding: 12px; }
.rec-title {
  font-size: 0.85rem;
  font-weight: 600;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ========== RELATIONS ========== */
.relations-list {
  display: flex; flex-direction: column; gap: 10px;
}
.relation-item {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: var(--transition-fast);
}
.relation-item:hover { border-color: var(--border-hover); }
.relation-item img {
  width: 60px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0;
}
.relation-info { flex: 1; min-width: 0; }
.relation-type {
  font-size: 0.7rem;
  color: var(--accent-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.relation-title {
  font-size: 0.9rem;
  font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ========== TABS ========== */
.tabs-nav {
  display: flex; gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 12px 20px;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  transition: var(--transition-fast);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent-light); border-bottom-color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

/* ========== FOOTER ========== */
.footer {
  border-top: 1px solid var(--border);
  padding: clamp(24px, 4vw, 40px) clamp(16px, 3vw, 40px);
  text-align: center;
  background: var(--bg-secondary);
}
.footer-content {
  max-width: var(--max-width);
  margin: 0 auto;
}
.footer-logo {
  font-size: 1.3rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.footer-text {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.footer-social {
  display: flex; justify-content: center; gap: 16px;
}
.footer-social a {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 50%;
  transition: var(--transition-fast);
}
.footer-social a:hover { background: var(--accent); border-color: var(--accent); }
.footer-social a svg { width:16px; height:16px; stroke:var(--text-secondary); stroke-width:2; fill:none; }
.footer-social a:hover svg { stroke: white; }

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .anime-banner-content { flex-direction: column; align-items: center; text-align: center; }
  .anime-poster { width: 160px; }
  .anime-banner-info { width: 100%; }
  .banner-buttons { justify-content: center; }
  .banner-genres { justify-content: center; }
  .characters-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
}

/* ========== LOADING ========== */
.page-loader {
  position: fixed; inset: 0;
  background: var(--bg-primary);
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
.page-loader.hidden { opacity: 0; visibility: hidden; }
.loader-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--bg-card);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 0.9rem; color: var(--text-muted); }

/* ========== ERROR STATE ========== */
.error-container {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60vh;
  text-align: center;
  padding: 40px;
}
.error-container svg { width:64px; height:64px; stroke:var(--text-muted); stroke-width:1.5; fill:none; margin-bottom:16px; }
.error-container h2 { font-size: 1.5rem; margin-bottom: 8px; }
.error-container p { color: var(--text-muted); margin-bottom: 20px; }
</style>
<base target="_blank">
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Loading anime details...</div>
</div>

<header class="header" id="header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <a href="index.html" class="logo">Anime<span>Stream</span></a>
  </div>
  <div class="header-right">
    <button class="search-btn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script>
const CONFIG = {
  API_BASE: 'https://api.jikan.moe/v4',
  CACHE_TTL: 30 * 60 * 1000,
  TIMEOUT: 8000,
  RETRIES: 2,
  RETRY_DELAY: 1500,
  DEBOUNCE_MS: 300
};

const Cache = {
  get(key) {
    try {
      const item = localStorage.getItem('cache_' + key);
      if (!item) return null;
      const { data, timestamp } = JSON.parse(item);
      if (Date.now() - timestamp > CONFIG.CACHE_TTL) { localStorage.removeItem('cache_' + key); return null; }
      return data;
    } catch (e) { return null; }
  },
  set(key, data) {
    try { localStorage.setItem('cache_' + key, JSON.stringify({ data, timestamp: Date.now() })); } catch (e) {}
  }
};

async function apiFetch(endpoint, retries = CONFIG.RETRIES) {
  const cacheKey = endpoint.replace(/[^a-zA-Z0-9]/g, '_');
  const cached = Cache.get(cacheKey);
  if (cached) return cached;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT);
  try {
    const response = await fetch(CONFIG.API_BASE + endpoint, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (data && data.data) { Cache.set(cacheKey, data); return data; }
    throw new Error('Invalid API response');
  } catch (error) {
    clearTimeout(timeoutId);
    if (retries > 0) { await new Promise(r => setTimeout(r, CONFIG.RETRY_DELAY)); return apiFetch(endpoint, retries - 1); }
    console.error('API Error:', endpoint, error.message);
    return null;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getUrlParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

// ========== SEARCH SYSTEM ==========
let searchDebounceTimer = null;
function setupSearch() {
  const searchBtn = document.getElementById('searchBtn');
  const searchOverlay = document.getElementById('searchOverlay');
  const searchClose = document.getElementById('searchClose');
  const searchInput = document.getElementById('searchInput');
  const suggestions = document.getElementById('searchSuggestions');

  searchBtn?.addEventListener('click', () => {
    searchOverlay.classList.add('active');
    setTimeout(() => searchInput?.focus(), 100);
    document.body.style.overflow = 'hidden';
  });

  const closeSearch = () => {
    searchOverlay.classList.remove('active');
    searchInput.value = '';
    suggestions.classList.remove('active');
    document.body.style.overflow = '';
  };

  searchClose?.addEventListener('click', closeSearch);
  searchOverlay?.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearch(); });

  searchInput?.addEventListener('input', (e) => {
    clearTimeout(searchDebounceTimer);
    const query = e.target.value.trim();
    if (!query) { suggestions.classList.remove('active'); return; }
    searchDebounceTimer = setTimeout(async () => {
      const data = await apiFetch(`/anime?q=${encodeURIComponent(query)}&limit=8&sfw`);
      if (!data?.data?.length) { suggestions.classList.remove('active'); return; }
      suggestions.innerHTML = data.data.map(anime => {
        const img = anime.images?.jpg?.image_url || '';
        const title = anime.title_english || anime.title || 'Unknown';
        const type = anime.type || 'TV';
        const score = anime.score ? anime.score.toFixed(1) : 'N/A';
        return `<div class="suggestion-item" onclick="window.location.href='anime.html?id=${anime.mal_id}'"><img src="${escapeHtml(img)}" alt="${escapeHtml(title)}"><div class="suggestion-info"><div class="suggestion-title">${escapeHtml(title)}</div><div class="suggestion-meta">${type} · Score: ${score}</div></div></div>`;
      }).join('');
      suggestions.classList.add('active');
    }, CONFIG.DEBOUNCE_MS);
  });

  searchInput?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const query = searchInput.value.trim(); if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`; }
    if (e.key === 'Escape') closeSearch();
  });
}

function setupSidebar() {
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const sidebarClose = document.getElementById('sidebarClose');
  const open = () => { sidebar.classList.add('active'); sidebarOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; };
  const close = () => { sidebar.classList.remove('active'); sidebarOverlay.classList.remove('active'); document.body.style.overflow = ''; };
  menuBtn?.addEventListener('click', open);
  sidebarClose?.addEventListener('click', close);
  sidebarOverlay?.addEventListener('click', close);
}

function setupHeader() {
  const header = document.getElementById('header');
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => { header?.classList.toggle('scrolled', window.scrollY > 50); ticking = false; });
      ticking = true;
    }
  }, { passive: true });
}

function setupTabs() {
  const tabsNav = document.getElementById('tabsNav');
  tabsNav?.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    const tabId = btn.dataset.tab;
    tabsNav.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tabId)?.classList.add('active');
  });
}

// ========== LOAD ANIME DATA ==========
async function loadAnimeDetails() {
  const animeId = getUrlParam('id');
  if (!animeId) {
    showError('No anime ID provided');
    return;
  }

  const [animeData, charactersData, relationsData, recommendationsData, episodesData] = await Promise.allSettled([
    apiFetch(`/anime/${animeId}/full`),
    apiFetch(`/anime/${animeId}/characters`),
    apiFetch(`/anime/${animeId}/relations`),
    apiFetch(`/anime/${animeId}/recommendations`),
    apiFetch(`/anime/${animeId}/episodes`)
  ]);

  const anime = animeData.status === 'fulfilled' ? animeData.value?.data : null;
  if (!anime) {
    showError('Failed to load anime details');
    return;
  }

  renderBanner(anime);
  renderInfo(anime);
  renderSynopsis(anime);
  renderTrailer(anime);
  renderEpisodes(anime, episodesData.status === 'fulfilled' ? episodesData.value : null);
  renderCharacters(charactersData.status === 'fulfilled' ? charactersData.value : null);
  renderRelations(relationsData.status === 'fulfilled' ? relationsData.value : null);
  renderRecommendations(recommendationsData.status === 'fulfilled' ? recommendationsData.value : null);

  document.title = `${anime.title_english || anime.title || 'Anime'} - AnimeStream`;

  const loader = document.getElementById('pageLoader');
  if (loader) loader.classList.add('hidden');
}

function renderBanner(anime) {
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const title = anime.title_english || anime.title || 'Unknown';
  const score = anime.score ? anime.score.toFixed(1) : 'N/A';
  const type = anime.type || 'TV';
  const status = anime.status || 'Unknown';
  const episodes = anime.episodes || '?';
  const year = anime.year || (anime.aired?.string?.match(/\d{4}/)?.[0]) || 'N/A';
  const genres = anime.genres || [];

  document.getElementById('bannerBg').style.backgroundImage = `url('${escapeHtml(img)}')`;
  document.getElementById('animePoster').innerHTML = `<img src="${escapeHtml(img)}" alt="${escapeHtml(title)}">`;
  document.getElementById('animeTitle').textContent = title;

  document.getElementById('animeMeta').innerHTML = `
    <span class="banner-score"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${score}</span>
    <span class="banner-badge">${type}</span>
    <span class="banner-badge">${episodes} EP</span>
    <span class="banner-badge">${status}</span>
    <span class="banner-badge">${year}</span>
  `;

  document.getElementById('bannerGenres').innerHTML = genres.map(g =>
    `<span class="banner-genre">${escapeHtml(g.name)}</span>`
  ).join('');

  document.getElementById('bannerButtons').innerHTML = `
    <a href="watch.html?id=${anime.mal_id}&ep=1" class="btn-primary">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Watch Now
    </a>
    <a href="watch.html?id=${anime.mal_id}&ep=1&sub=0" class="btn-secondary">Dub</a>
  `;
}

function renderInfo(anime) {
  const infoItems = [
    { label: 'Type', value: anime.type || 'N/A' },
    { label: 'Episodes', value: anime.episodes || 'N/A' },
    { label: 'Status', value: anime.status || 'N/A' },
    { label: 'Aired', value: anime.aired?.string || 'N/A' },
    { label: 'Season', value: anime.season ? (anime.season.charAt(0).toUpperCase() + anime.season.slice(1) + ' ' + anime.year) : 'N/A' },
    { label: 'Duration', value: anime.duration || 'N/A' },
    { label: 'Rating', value: anime.rating || 'N/A' },
    { label: 'Score', value: anime.score ? anime.score.toFixed(2) + ' (' + (anime.scored_by?.toLocaleString() || '0') + ' votes)' : 'N/A' },
    { label: 'Rank', value: anime.rank ? '#' + anime.rank : 'N/A' },
    { label: 'Popularity', value: anime.popularity ? '#' + anime.popularity : 'N/A' },
    { label: 'Members', value: anime.members?.toLocaleString() || 'N/A' },
    { label: 'Favorites', value: anime.favorites?.toLocaleString() || 'N/A' },
    { label: 'Source', value: anime.source || 'N/A' },
    { label: 'Studios', value: (anime.studios || []).map(s => s.name).join(', ') || 'N/A' },
    { label: 'Producers', value: (anime.producers || []).slice(0, 3).map(p => p.name).join(', ') || 'N/A' },
    { label: 'Licensors', value: (anime.licensors || []).map(l => l.name).join(', ') || 'N/A' }
  ];

  document.getElementById('infoGrid').innerHTML = infoItems.map(item => `
    <div class="info-item">
      <div class="info-label">${escapeHtml(item.label)}</div>
      <div class="info-value">${escapeHtml(item.value)}</div>
    </div>
  `).join('');
}

function renderSynopsis(anime) {
  const synopsis = anime.synopsis || 'No synopsis available.';
  document.getElementById('synopsisText').textContent = synopsis;
}

function renderTrailer(anime) {
  const container = document.getElementById('trailerContainer');
  const trailer = anime.trailer;
  if (trailer?.embed_url) {
    container.innerHTML = `<iframe src="${escapeHtml(trailer.embed_url)}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
  } else if (trailer?.url) {
    container.innerHTML = `<iframe src="${escapeHtml(trailer.url)}" allowfullscreen></iframe>`;
  }
}

function renderEpisodes(anime, episodesData) {
  const grid = document.getElementById('episodesGrid');
  const epCount = anime.episodes || 12;
  const episodes = episodesData?.data || [];

  if (episodes.length > 0) {
    grid.innerHTML = episodes.slice(0, 50).map((ep, i) => {
      const num = ep.mal_id || (i + 1);
      const title = ep.title || `Episode ${num}`;
      return `<a href="watch.html?id=${anime.mal_id}&ep=${num}" class="episode-btn" title="${escapeHtml(title)}">${num}</a>`;
    }).join('');
  } else {
    grid.innerHTML = Array.from({ length: Math.min(epCount, 50) }, (_, i) =>
      `<a href="watch.html?id=${anime.mal_id}&ep=${i + 1}" class="episode-btn">${i + 1}</a>`
    ).join('');
  }
}

function renderCharacters(data) {
  const grid = document.getElementById('charactersGrid');
  if (!data?.data?.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">No characters found</div>`;
    return;
  }
  grid.innerHTML = data.data.slice(0, 20).map(char => {
    const c = char.character || char;
    const img = c.images?.jpg?.image_url || '';
    const name = c.name || 'Unknown';
    const role = char.role || 'Supporting';
    return `
      <div class="character-card">
        <img src="${escapeHtml(img)}" alt="${escapeHtml(name)}" loading="lazy">
        <div class="character-name">${escapeHtml(name)}</div>
        <div class="character-role">${escapeHtml(role)}</div>
      </div>
    `;
  }).join('');
}

function renderRelations(data) {
  const list = document.getElementById('relationsList');
  if (!data?.data?.length) {
    list.innerHTML = `<div class="empty-state" style="text-align:center;padding:40px;color:var(--text-muted);">No relations found</div>`;
    return;
  }
  list.innerHTML = data.data.slice(0, 15).flatMap(rel =>
    (rel.entry || []).map(entry => {
      const img = entry.images?.jpg?.image_url || '';
      const title = entry.name || 'Unknown';
      const type = rel.relation || 'Related';
      return `
        <a href="anime.html?id=${entry.mal_id}" class="relation-item">
          <img src="${escapeHtml(img)}" alt="${escapeHtml(title)}" loading="lazy">
          <div class="relation-info">
            <div class="relation-type">${escapeHtml(type)}</div>
            <div class="relation-title">${escapeHtml(title)}</div>
          </div>
        </a>
      `;
    })
  ).join('');
}

function renderRecommendations(data) {
  const grid = document.getElementById('recommendationsGrid');
  if (!data?.data?.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">No recommendations found</div>`;
    return;
  }
  grid.innerHTML = data.data.slice(0, 12).map(rec => {
    const anime = rec.entry;
    const img = anime.images?.jpg?.image_url || '';
    const title = anime.title || 'Unknown';
    return `
      <a href="anime.html?id=${anime.mal_id}" class="rec-card">
        <img src="${escapeHtml(img)}" alt="${escapeHtml(title)}" loading="lazy">
        <div class="rec-info">
          <div class="rec-title">${escapeHtml(title)}</div>
        </div>
      </a>
    `;
  }).join('');
}

function showError(message) {
  const content = document.getElementById('animeContent');
  if (content) {
    content.innerHTML = `
      <div class="error-container">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h2>Oops!</h2>
        <p>${escapeHtml(message)}</p>
        <a href="index.html" class="btn-primary">Go Home</a>
      </div>
    `;
  }
  const loader = document.getElementById('pageLoader');
  if (loader) loader.classList.add('hidden');
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  setupSidebar();
  setupSearch();
  setupHeader();
  setupTabs();
  loadAnimeDetails();
});
</script>
