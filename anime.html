<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Details — AniVerse</title>
<meta name="description" content="Anime details, episodes, characters and more on AniVerse.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #080810; --bg-secondary: #0d0d1a; --bg-card: #111122;
  --bg-glass: rgba(255,255,255,0.04);
  --accent: #7c3aed; --accent-bright: #a855f7; --accent-glow: rgba(124,58,237,0.4);
  --neon: #c084fc; --text-primary: #f1f0ff; --text-secondary: #9ca3af;
  --text-muted: #4b5563; --border: rgba(124,58,237,0.2); --border-bright: rgba(124,58,237,0.5);
  --radius: 12px; --radius-lg: 20px; --shadow-glow: 0 0 30px rgba(124,58,237,0.3);
  --font-main: 'Outfit', sans-serif; --font-display: 'Orbitron', monospace;
  --header-h: 70px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-main); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
button { cursor: pointer; border: none; outline: none; font-family: var(--font-main); }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg-secondary); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* HEADER */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: var(--header-h);
  display: flex; align-items: center; padding: 0 24px;
  background: rgba(8,8,16,0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 900; background: linear-gradient(135deg, var(--neon), var(--accent-bright)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
.header-nav { display: flex; gap: 4px; margin-left: 24px; }
.header-nav a { padding: 8px 14px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); transition: all 0.2s; }
.header-nav a:hover { color: var(--text-primary); background: var(--bg-glass); }
.hamburger { width: 40px; height: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; background: var(--bg-glass); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.3s; }
.hamburger span { display: block; width: 20px; height: 2px; background: var(--text-primary); border-radius: 2px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.search-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--bg-glass); border: 1px solid var(--border); border-radius: 10px; color: var(--text-secondary); transition: all 0.3s; }
.search-btn:hover { border-color: var(--accent-bright); color: var(--neon); }

/* SIDEBAR */
.sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100vh; background: var(--bg-secondary); border-right: 1px solid var(--border); z-index: 1500; transition: left 0.35s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; padding: 24px 0; overflow-y: auto; }
.sidebar.open { left: 0; }
.sidebar-overlay { position: fixed; inset: 0; z-index: 1400; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.sidebar-overlay.open { opacity: 1; pointer-events: all; }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 24px 24px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.sidebar-close { background: none; color: var(--text-secondary); font-size: 1.5rem; }
.sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: var(--text-secondary); font-size: 0.95rem; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; }
.sidebar-nav a:hover { color: var(--text-primary); background: var(--bg-glass); border-left-color: var(--accent-bright); }

/* BANNER */
.anime-banner { position: relative; width: 100%; height: 420px; margin-top: var(--header-h); overflow: hidden; }
.anime-banner-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(8px) brightness(0.3) saturate(1.4); transform: scale(1.1); }
.anime-banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-primary) 0%, rgba(8,8,16,0.5) 60%, transparent 100%); }

/* DETAILS CONTAINER */
.anime-details-wrap { max-width: 1300px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; margin-top: -180px; }
.anime-details-grid { display: grid; grid-template-columns: 230px 1fr; gap: 32px; align-items: start; }
.anime-poster-col { position: sticky; top: calc(var(--header-h) + 20px); }
.anime-poster {
  width: 100%; border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), var(--shadow-glow);
  border: 2px solid var(--border-bright); background: var(--bg-card);
  aspect-ratio: 2/3; object-fit: cover;
}
.watch-btn-main {
  width: 100%; margin-top: 14px; padding: 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  color: #fff; font-weight: 700; font-size: 1rem; border-radius: var(--radius);
  transition: all 0.3s; box-shadow: 0 4px 20px var(--accent-glow);
  text-align: center; display: block;
}
.watch-btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow); }
.anime-info-quick { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.anime-info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--bg-glass); border-radius: 8px; border: 1px solid var(--border); font-size: 0.8rem; }
.anime-info-row span:first-child { color: var(--text-muted); }
.anime-info-row span:last-child { color: var(--text-primary); font-weight: 600; text-align: right; max-width: 60%; }

/* ANIME INFO RIGHT */
.anime-info-col { padding-top: 160px; }
.anime-status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.status-airing { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
.status-completed { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
.status-upcoming { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
.anime-title { font-size: clamp(1.6rem, 4vw, 2.5rem); font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
.anime-title-en { font-size: 1rem; color: var(--text-muted); margin-bottom: 16px; }
.anime-score-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.score-big { display: flex; align-items: center; gap: 8px; }
.score-num { font-size: 2rem; font-weight: 900; color: #fbbf24; font-family: var(--font-display); }
.score-label { font-size: 0.75rem; color: var(--text-muted); }
.score-stat { text-align: center; }
.score-stat-num { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
.score-stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.anime-genres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.genre-tag { padding: 5px 14px; border-radius: 20px; background: var(--bg-glass); border: 1px solid var(--border); font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
.genre-tag:hover { border-color: var(--accent-bright); color: var(--neon); }
.synopsis-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 10px; }
.synopsis-text { font-size: 0.95rem; line-height: 1.8; color: var(--text-secondary); max-height: 140px; overflow: hidden; position: relative; transition: max-height 0.4s ease; }
.synopsis-text.expanded { max-height: 1000px; }
.synopsis-more { color: var(--accent-bright); font-size: 0.85rem; cursor: pointer; margin-top: 8px; }
.synopsis-more:hover { color: var(--neon); }

/* TABS */
.tabs-row { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 40px 0 24px; overflow-x: auto; }
.tab-btn { padding: 12px 20px; font-size: 0.875rem; font-weight: 600; color: var(--text-muted); background: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--neon); border-bottom-color: var(--neon); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* EPISODE LIST */
.ep-search { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.ep-search input { flex: 1; min-width: 180px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-family: var(--font-main); font-size: 0.9rem; outline: none; }
.ep-search input:focus { border-color: var(--accent-bright); }
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; max-height: 480px; overflow-y: auto; }
.ep-btn {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s; color: var(--text-primary);
}
.ep-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.05); }
.ep-btn.current { background: var(--accent); border-color: var(--accent); }
.ep-btn span { font-size: 0.6rem; color: var(--text-muted); font-weight: 400; }
.ep-btn:hover span { color: rgba(255,255,255,0.7); }

/* CHARACTERS */
.chars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.char-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.3s; cursor: pointer; }
.char-card:hover { border-color: var(--accent-bright); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
.char-img { width: 100%; height: 190px; object-fit: cover; object-position: top; background: var(--bg-secondary); }
.char-info { padding: 10px; }
.char-name { font-size: 0.82rem; font-weight: 600; margin-bottom: 2px; }
.char-role { font-size: 0.72rem; color: var(--text-muted); }

/* RECOMMENDATIONS SLIDER */
.rec-grid { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
.rec-grid::-webkit-scrollbar { height: 4px; }
.rec-card { flex: 0 0 140px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: all 0.3s; }
.rec-card:hover { border-color: var(--accent-bright); transform: translateY(-4px); }
.rec-img { width: 100%; height: 200px; object-fit: cover; background: var(--bg-secondary); }
.rec-title { padding: 8px; font-size: 0.75rem; font-weight: 600; }

/* RELATIONS */
.relations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.relation-card { display: flex; gap: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: all 0.3s; }
.relation-card:hover { border-color: var(--accent-bright); }
.relation-img { width: 50px; height: 70px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--bg-secondary); }
.relation-info h4 { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
.relation-type { font-size: 0.72rem; color: var(--accent-bright); }
.relation-sub { font-size: 0.72rem; color: var(--text-muted); }

/* TRAILER */
.trailer-wrap { position: relative; width: 100%; max-width: 760px; border-radius: var(--radius-lg); overflow: hidden; background: #000; }
.trailer-wrap::before { content: ''; display: block; padding-top: 56.25%; }
.trailer-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

/* LOADING */
.loading-state { padding: 60px; text-align: center; color: var(--text-muted); }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent-bright); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, #1a1a2e 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* SECTION TITLE */
.content-section { margin-bottom: 48px; }
.content-section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.content-section-title::before { content: ''; display: block; width: 4px; height: 20px; background: linear-gradient(to bottom, var(--neon), var(--accent)); border-radius: 2px; }

/* FOOTER */
.footer { background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 30px 24px; text-align: center; margin-top: 60px; }
.footer-logo { font-family: var(--font-display); font-size: 1.3rem; font-weight: 900; background: linear-gradient(135deg, var(--neon), var(--accent-bright)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
.footer-copy { font-size: 0.78rem; color: var(--text-muted); }
.footer-copy span { color: var(--accent-bright); }

@media (max-width: 768px) {
  .anime-details-grid { grid-template-columns: 1fr; }
  .anime-poster-col { position: static; display: flex; gap: 20px; align-items: flex-start; }
  .anime-poster { width: 140px; flex-shrink: 0; }
  .anime-poster-col .anime-info-quick { flex: 1; }
  .watch-btn-main { display: none; }
  .anime-info-col { padding-top: 0; }
  .anime-banner { height: 280px; }
  .header-nav { display: none; }
}
</style>
</head>
<body>

  <div class="sidebar-header">

</nav>

<header class="header">
  <div style="display:flex;align-items:center;gap:16px">
    <button class="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
    <a href="index.html" class="logo">AniVerse</a>

<script>
const API = 'https://api.jikan.moe/v4';
const FETCH_TIMEOUT = 10000;
const RETRY = 3;

function esc(s) { if(!s) return ''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function trunc(s, n) { return s && s.length > n ? s.slice(0,n)+'…' : (s||''); }
function safeImg(u) { return u || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="230"><rect fill="%23111122" width="160" height="230"/></svg>'; }

async function fetchWithTimeout(url, timeout=FETCH_TIMEOUT) {
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeout);
  try {
    const r = await fetch(url, {signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) { clearTimeout(t); throw e; }
}
async function fetchRetry(url, n=RETRY) {
  for(let i=0;i<n;i++) {
    try { return await fetchWithTimeout(url); }
    catch(e) { if(i<n-1) await new Promise(r=>setTimeout(r,700*(i+1))); else throw e; }
  }
}

function getParam(k) { return new URLSearchParams(window.location.search).get(k); }

function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }

function statusBadge(s) {
  if (!s) return '';
  const map = { 'Currently Airing': ['status-airing','● Airing'], 'Finished Airing': ['status-completed','✓ Completed'], 'Not yet aired': ['status-upcoming','◆ Upcoming'] };
  const [cls, label] = map[s] || ['status-completed', esc(s)];
  return `<span class="anime-status-badge ${cls}">${label}</span>`;
}

function renderDetails(anime, chars, recs, rels) {
  const root = document.getElementById('detailsRoot');
  const bg = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  // Set banner
  document.getElementById('animeBannerBg').style.cssText = `background-image:url('${bg}');filter:blur(8px) brightness(0.3) saturate(1.4);transform:scale(1.1)`;
  document.getElementById('animeBannerBg').classList.remove('skeleton');
  document.title = `${anime.title} — AniVerse`;

  const genres = (anime.genres||[]).map(g=>`<a href="search.html?genre=${g.mal_id}" class="genre-tag">${esc(g.name)}</a>`).join('');
  const studios = (anime.studios||[]).map(s=>esc(s.name)).join(', ') || 'N/A';
  const epCount = anime.episodes || '?';
  const score = anime.score || 'N/A';
  const rank = anime.rank ? '#'+anime.rank : 'N/A';
  const pop = anime.popularity ? '#'+anime.popularity : 'N/A';
  const members = anime.members ? anime.members.toLocaleString() : 'N/A';
  const status = anime.status || '';
  const type = anime.type || 'N/A';
  const source = anime.source || 'N/A';
  const duration = anime.duration || 'N/A';
  const synopsis = esc(anime.synopsis || 'No synopsis available.');
  const trailerEmbed = anime.trailer?.embed_url;
  const year = anime.year || (anime.aired?.prop?.from?.year) || '';
  const season = anime.season ? anime.season.charAt(0).toUpperCase()+anime.season.slice(1) : '';

  // Characters HTML
  const charsHTML = chars.length ? chars.slice(0,20).map(c => {
    const ch = c.character;
    const img = safeImg(ch?.images?.jpg?.image_url);
    return `<div class="char-card" onclick="window.open('https://myanimelist.net/character/${ch?.mal_id}','_blank')">
      <img class="char-img" src="${img}" alt="${esc(ch?.name)}" loading="lazy" onerror="this.parentNode.style.display='none'">
      <div class="char-info"><div class="char-name">${esc(ch?.name)}</div><div class="char-role">${esc(c.role)}</div></div>
    </div>`;
  }).join('') : '<p style="color:var(--text-muted);padding:20px 0">No character data available.</p>';

  // Recs HTML
  const recsHTML = recs.length ? recs.slice(0,16).map(r => {
    const a = r.entry;
    const img = safeImg(a?.images?.jpg?.image_url);
    return `<div class="rec-card" onclick="window.location.href='anime.html?id=${a?.mal_id}'">
      <img class="rec-img" src="${img}" alt="${esc(a?.title)}" loading="lazy">
      <div class="rec-title">${esc(trunc(a?.title,30))}</div>
    </div>`;
  }).join('') : '<p style="color:var(--text-muted)">No recommendations.</p>';

  // Relations HTML
  const relsHTML = rels.length ? rels.flatMap(r => r.entry.filter(e=>e.type==='anime').map(e =>
    `<div class="relation-card" onclick="window.location.href='anime.html?id=${e.mal_id}'">
      <div style="background:var(--bg-secondary);width:50px;height:70px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem">🎬</div>
      <div class="relation-info"><h4>${esc(trunc(e.name,40))}</h4><div class="relation-type">${esc(r.relation)}</div><div class="relation-sub">${esc(e.type)}</div></div>
    </div>`)).join('') : '<p style="color:var(--text-muted)">No relations found.</p>';

  // Episode grid
  let epGridHTML = '';
  if (epCount && epCount !== '?') {
    const n = Math.min(Number(epCount), 500);
    epGridHTML = Array.from({length:n}, (_,i) => {
      const ep = i+1;
      return `<button class="ep-btn" onclick="goWatch(${anime.mal_id},${ep})">${ep}<span>EP</span></button>`;
    }).join('');
  } else {
    epGridHTML = `<p style="color:var(--text-muted);padding:20px 0">Episode list unavailable. Check back later.</p>`;
  }

  // Trailer HTML
  const trailerHTML = trailerEmbed
    ? `<div class="trailer-wrap"><iframe src="${trailerEmbed}" allowfullscreen allow="autoplay;encrypted-media"></iframe></div>`
    : `<p style="color:var(--text-muted);padding:20px 0">No trailer available.</p>`;

  root.innerHTML = `
    <div class="anime-details-grid">
      <div class="anime-poster-col">
        <img class="anime-poster" src="${bg}" alt="${esc(anime.title)}" onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'230\\' height=\\'340\\'><rect fill=\\'%23111122\\' width=\\'230\\' height=\\'340\\'/></svg>'">
        <a class="watch-btn-main" href="watch.html?id=${anime.mal_id}&ep=1">▶ Watch Now</a>
        <div class="anime-info-quick">
          <div class="anime-info-row"><span>Score</span><span>⭐ ${score}</span></div>
          <div class="anime-info-row"><span>Rank</span><span>${rank}</span></div>
          <div class="anime-info-row"><span>Episodes</span><span>${epCount}</span></div>
          <div class="anime-info-row"><span>Status</span><span>${esc(status)}</span></div>
          <div class="anime-info-row"><span>Type</span><span>${esc(type)}</span></div>
          <div class="anime-info-row"><span>Source</span><span>${esc(source)}</span></div>
          <div class="anime-info-row"><span>Duration</span><span>${esc(duration)}</span></div>
          <div class="anime-info-row"><span>Studio</span><span>${studios}</span></div>
          <div class="anime-info-row"><span>Season</span><span>${season} ${year}</span></div>
          <div class="anime-info-row"><span>Members</span><span>${members}</span></div>
        </div>
      </div>
      <div class="anime-info-col">
        ${statusBadge(status)}
        <h1 class="anime-title">${esc(anime.title)}</h1>
        ${anime.title_english && anime.title_english !== anime.title ? `<div class="anime-title-en">${esc(anime.title_english)}</div>` : ''}
        <div class="anime-score-row">
          <div class="score-big">
            <div class="score-num">${score}</div>
            <div class="score-label">Score<br>MAL</div>
          </div>
          <div class="score-stat"><div class="score-stat-num">${rank}</div><div class="score-stat-label">Ranked</div></div>
          <div class="score-stat"><div class="score-stat-num">${pop}</div><div class="score-stat-label">Popularity</div></div>
        </div>
        <div class="anime-genres">${genres}</div>
        <div class="synopsis-title">Synopsis</div>
        <div class="synopsis-text" id="synopsisText">${synopsis}</div>
        <button class="synopsis-more" id="synopsisMore" onclick="toggleSynopsis()">Read more ↓</button>

        <div class="tabs-row">
          <button class="tab-btn active" onclick="switchTab('episodes')">Episodes</button>
          <button class="tab-btn" onclick="switchTab('characters')">Characters</button>
          <button class="tab-btn" onclick="switchTab('relations')">Relations</button>
          <button class="tab-btn" onclick="switchTab('trailer')">Trailer</button>
          <button class="tab-btn" onclick="switchTab('recommendations')">Similar</button>
        </div>

        <div id="tab-episodes" class="tab-panel active">
          <div class="ep-search">
            <input type="number" id="epJump" placeholder="Jump to episode..." min="1" max="${epCount}">
            <button onclick="jumpToEp()" style="padding:10px 20px;background:var(--accent);color:#fff;border-radius:10px;font-weight:600;font-size:0.875rem">Go</button>
            <a href="watch.html?id=${anime.mal_id}&ep=1" class="btn-primary" style="padding:10px 20px;border-radius:10px;font-size:0.875rem">▶ Start Watching</a>
          </div>
          <div class="ep-grid" id="epGrid">${epGridHTML}</div>
        </div>

        <div id="tab-characters" class="tab-panel">
          <div class="chars-grid">${charsHTML}</div>
        </div>

        <div id="tab-relations" class="tab-panel">
          <div class="relations-grid">${relsHTML}</div>
        </div>

        <div id="tab-trailer" class="tab-panel">
          ${trailerHTML}
        </div>

        <div id="tab-recommendations" class="tab-panel">
          <div class="rec-grid">${recsHTML}</div>
        </div>
      </div>
    </div>`;
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${name}'`));
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'tab-'+name);
  });
}

function toggleSynopsis() {
  const txt = document.getElementById('synopsisText');
  const btn = document.getElementById('synopsisMore');
  if (!txt) return;
  const expanded = txt.classList.toggle('expanded');
  if (btn) btn.textContent = expanded ? 'Read less ↑' : 'Read more ↓';
}

function jumpToEp() {
  const n = parseInt(document.getElementById('epJump')?.value);
  if (!n || isNaN(n)) return;
  const id = getParam('id');
  if (id) window.location.href = `watch.html?id=${id}&ep=${n}`;
}

function goWatch(id, ep) { window.location.href = `watch.html?id=${id}&ep=${ep}`; }

async function init() {
  const id = getParam('id');
  if (!id) {
    document.getElementById('detailsRoot').innerHTML = '<div class="loading-state"><p>No anime ID specified. <a href="index.html" style="color:var(--accent-bright)">Go Home</a></p></div>';
    return;
  }

  try {
    const [animeRes, charsRes, recsRes] = await Promise.allSettled([
      fetchRetry(`${API}/anime/${id}/full`),
      fetchRetry(`${API}/anime/${id}/characters`),
      fetchRetry(`${API}/anime/${id}/recommendations`)
    ]);

    const anime = animeRes.status === 'fulfilled' ? animeRes.value?.data : null;
    if (!anime) {
      document.getElementById('detailsRoot').innerHTML = '<div class="loading-state"><p>Anime not found. <a href="index.html" style="color:var(--accent-bright)">Go Home</a></p></div>';
      return;
    }
    const chars = charsRes.status === 'fulfilled' ? (charsRes.value?.data || []) : [];
    const recs = recsRes.status === 'fulfilled' ? (recsRes.value?.data || []) : [];
    const rels = anime.relations || [];

    renderDetails(anime, chars, recs, rels);
  } catch(e) {
    document.getElementById('detailsRoot').innerHTML = `<div class="loading-state"><p>Failed to load anime. <a href="index.html" style="color:var(--accent-bright)">Go Home</a></p></div>`;
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
